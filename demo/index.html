/* #55 (prevencion) — registro de todas las graficas Chart.js activas en
   pantalla. Antes, al cambiar de pestaña, las graficas viejas nunca se
   destruian formalmente — quedaban "fantasma" en la memoria del navegador,
   y si el sistema intentaba tocarlas (como al ocultar tooltips en scroll)
   podian tronar y detener el resto del recorrido. Se destruyen todas antes
   de pintar cualquier pestaña nueva. */
let ACTIVE_CHARTS = [];
function nuevoChart(el, config){ const c = new Chart(el, config); ACTIVE_CHARTS.push(c); return c; }
function destruirGraficasActivas(){
  ACTIVE_CHARTS.forEach(c=>{ try{ c.destroy(); }catch(err){ /* ya destruida o su canvas ya no existe, no es fatal */ } });
  ACTIVE_CHARTS = [];
}
function render(){
  destruirGraficasActivas();
  actualizarBrandingConsultorio();
  const c = document.getElementById('content');
  if(LOAD_ERROR && ACTIVE_TAB !== 'configuracion'){ c.innerHTML = renderErrorHTML(); return; }
  if(ACTIVE_TAB === 'dashboard') c.innerHTML = renderDashboardHTML();
  else if(ACTIVE_TAB === 'pacientes') c.innerHTML = renderPacientesHTML();
  else if(ACTIVE_TAB === 'finanzas') c.innerHTML = renderFinanzasHTML();
  else if(ACTIVE_TAB === 'tratamientos') c.innerHTML = renderTratamientosHTML();
  else if(ACTIVE_TAB === 'agendar') c.innerHTML = renderAgendarHTML();
  else if(ACTIVE_TAB === 'configuracion') c.innerHTML = renderConfiguracionHTML();
  afterRenderHooks();
}

/* ============ SELECTOR/CATALOGO DE CATEGORIA (agregable) ============ */
// Ciclo 2 (Grupo 2) — generico para las 2 listas de categorias (usado
// por openCategoryPicker y openGastoCategoryPicker): renombrar una
// categoria via un mini-modal, y eliminarla solo si no tiene
// dependencias (el servidor valida esto de verdad; aqui solo se checa
// localmente para dar un aviso rapido antes de intentar la peticion).
// Ciclo 2 / Ronda 2 (#5 de Categorias) — bug real corregido: antes,
// renombrar/eliminar usaba openModal() (la MISMA ventana que ya estaba
// mostrando "Editar tratamiento" o "Registrar gasto" detras del
// selector), lo que SOBRESCRIBIA ese contenido por completo — al
// cancelar no habia adonde volver y todo se cerraba de golpe. Ahora
// renombrar/eliminar se dibujan DENTRO de la misma ventana del selector
// de categoria (pickerBody, una ventana distinta a la del modal
// principal) — el modal padre (Editar tratamiento/Registrar gasto)
// nunca se toca en todo el proceso, asi que jamas hay nada que
// restaurar ni por qué perderse.
function abrirRenombrarCategoria(nombreActual, esGasto, onVolver){
  document.getElementById('pickerBody').innerHTML = `
    <h3>Renombrar categoría</h3>
    <div class="field" style="margin-bottom:16px;"><label>Nombre</label><input id="rcNombre" value="${nombreActual}"></div>
    <div class="modal-actions"><div class="btn block" id="rcCancelar">Cancelar</div><div class="btn primary block" id="rcGuardar">Guardar</div></div>`;
  document.getElementById('rcCancelar').addEventListener('click', onVolver);
  document.getElementById('rcGuardar').addEventListener('click', async ()=>{
    const nuevoNombre = document.getElementById('rcNombre').value.trim();
    if(!nuevoNombre) return showToast('Completa: Nombre');
    if(nuevoNombre === nombreActual){ showToast('Sin cambios que guardar'); onVolver(); return; }
    const lista = esGasto ? DATA.categorias_gasto : DATA.categorias_tratamiento;
    if(lista.some(c=>normalize(c.Categoria)===normalize(nuevoNombre))) return showToast('Ya existe una categoría con ese nombre');
    const accion = esGasto ? 'edit_categoria_gasto' : 'edit_categoria';
    const syncKey = esGasto ? 'categorias_gasto' : 'categorias_tratamiento';
    if(CONFIG.API_URL){
      const res = await apiCall(accion, { nombreActual, nombreNuevo: nuevoNombre }, [syncKey]);
      if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo renombrar la categoría');
    } else { const c = lista.find(x=>x.Categoria===nombreActual); if(c) c.Categoria = nuevoNombre; }
    showToast('Categoría renombrada'); onVolver();
  });
}
// Mismo criterio que arriba: la confirmacion de eliminar se dibuja
// dentro de pickerBody en vez de usar el confirm() nativo del navegador
// (#5 de Pagos aplicado tambien aqui, para estandarizar) — nunca toca el
// modal padre.
function eliminarCategoria(nombre, esGasto, onVolver){
  const listaDependiente = esGasto ? DATA.gastos : DATA.tratamientos;
  const enUso = listaDependiente.some(x=>x.Categoria===nombre);
  if(enUso){ showToast(`Esta categoría tiene ${esGasto?'gastos':'tratamientos'} asignados y no se puede eliminar`); return; }
  document.getElementById('pickerBody').innerHTML = `
    <h3>¿Eliminar esta categoría?</h3>
    <p style="font-size:13px;margin-bottom:16px;">"${nombre}" — esta acción no se puede deshacer.</p>
    <div class="modal-actions"><div class="btn block" id="dcCancelar">Cancelar</div><div class="btn primary block" id="dcConfirmar" style="background:var(--red);">Eliminar</div></div>`;
  document.getElementById('dcCancelar').addEventListener('click', onVolver);
  document.getElementById('dcConfirmar').addEventListener('click', async ()=>{
    const lista = esGasto ? DATA.categorias_gasto : DATA.categorias_tratamiento;
    const accion = esGasto ? 'delete_categoria_gasto' : 'delete_categoria';
    const syncKey = esGasto ? 'categorias_gasto' : 'categorias_tratamiento';
    if(CONFIG.API_URL){
      const res = await apiCall(accion, { categoria: nombre }, [syncKey]);
      if(res && res.error){ showToast(res.error); onVolver(); return; }
    } else {
      const idx = lista.findIndex(c=>c.Categoria===nombre);
      if(idx !== -1) lista.splice(idx, 1);
    }
    showToast('Categoría eliminada'); onVolver();
  });
}

      closePicker(); onSelect(nuevaCategoria); showToast('Categoria agregada al catalogo');
    }
    else if(item.dataset.cat){ closePicker(); onSelect(item.dataset.cat); }
  });
  document.getElementById('pickerSearch').addEventListener('input', refrescar);
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
}

/* ============ CALCULOS PARA GRAFICAS COMPLEMENTARIAS (dashboard y finanzas) ============ */
/* #52 — cuando ya no quedan citas por hoy, se usan estas (cualquier fecha
   futura, empezando por la mas cercana) para no dejar la tarjeta vacia. */
function calcularProximasCitas(limite){
  const hoy = todayStr(); const ahora = nowHM();
  return [...DATA.citas].filter(c=>c.Estado!=='Cancelada' && (c.Fecha>hoy || (c.Fecha===hoy && c.Hora>=ahora)))
    .sort((a,b)=>(a.Fecha+a.Hora).localeCompare(b.Fecha+b.Hora)).slice(0, limite||4);
}
/* #42d — los 3 pacientes con mayor saldo pendiente, para que la tarjeta
   "Pendiente por cobrar" muestre algo util ademas del total. */
function calcularTopSaldos(limite){
  const porPaciente = {};
  DATA.pagos.forEach(p=>{ if(Number(p.Saldo)>0) porPaciente[p.Paciente_ID] = (porPaciente[p.Paciente_ID]||0) + Number(p.Saldo); });
  return Object.entries(porPaciente).map(([pacId,saldo])=>{ const pac=DATA.pacientes.find(p=>p.ID===pacId); return { nombre: pac?pac.Nombre:pacId, saldo }; }).sort((a,b)=>b.saldo-a.saldo).slice(0, limite||3);
}
/* #42e — pacientes activos cuya "ultima visita efectiva" ya rebasa el
   umbral configurado (CONFIG.DIAS_SIN_VISITA). Los que nunca han tenido
   visita ('—') se excluyen — no hay fecha de la cual medir. */
function calcularPacientesQueNoHanVuelto(){
  const hoyMs = new Date(todayStr()+'T00:00:00').getTime();
  const umbral = CONFIG.DIAS_SIN_VISITA || 60;
  return DATA.pacientes.filter(p=>p.Estado!=='Inactivo').map(p=>{
    const uv = ultimaVisitaEfectiva(p);
    if(uv==='—') return null;
    const dias = Math.round((hoyMs - new Date(uv+'T00:00:00').getTime()) / 86400000);
    return dias>=umbral ? { nombre:p.Nombre, dias } : null;
  }).filter(Boolean).sort((a,b)=>b.dias-a.dias).slice(0,5);
}
/* #31 — Tratamientos mas solicitados por CANTIDAD (no por dinero), a partir
   de las citas del mes en curso. Complementa la dona, que es por dinero. */
function calcularTratamientosSolicitados(){
  const now = new Date();
  const conteo = {};
  DATA.citas.filter(c=>c.Estado!=='Cancelada' && esMesActual(c.Fecha, now)).forEach(c=>{
    tratArr(c.Tratamientos||c.Tratamiento).forEach(t=>{ conteo[t] = (conteo[t]||0)+1; });
  });
  return Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
/* #31 — Pacientes nuevos vs. recurrentes por semana del mes en curso,
   contando PACIENTES UNICOS (no citas): cada paciente cuenta una sola vez
   por semana. "Nuevo" solo en la semana de su primera cita de siempre en
   el sistema (y solo si no marco "Ya era mi paciente antes" al darlo de
   alta) — cualquier otra semana en que tenga cita cuenta como recurrente. */
function calcularNuevosVsRecurrentes(){
  const now = new Date();
  const primeraFecha = {};
  DATA.citas.filter(c=>c.Estado!=='Cancelada').forEach(c=>{
    if(!primeraFecha[c.Paciente_ID] || c.Fecha < primeraFecha[c.Paciente_ID]) primeraFecha[c.Paciente_ID] = c.Fecha;
  });
  const semanasPorPaciente = {};
  DATA.citas.filter(c=>c.Estado!=='Cancelada' && esMesActual(c.Fecha, now)).forEach(c=>{
    const w = 'S'+Math.ceil(diaDelMes(c.Fecha)/7);
    if(!semanasPorPaciente[c.Paciente_ID]) semanasPorPaciente[c.Paciente_ID] = new Set();
    semanasPorPaciente[c.Paciente_ID].add(w);
  });
  const weeks = ['S1','S2','S3','S4','S5'];
  const nuevos = {S1:0,S2:0,S3:0,S4:0,S5:0}, recurrentes = {S1:0,S2:0,S3:0,S4:0,S5:0};
  Object.entries(semanasPorPaciente).forEach(([pacId, semanas])=>{
    const pac = DATA.pacientes.find(p=>p.ID===pacId);
    const tienePrevio = pac && pac.HistorialPrevio === 'Si';
    const esNuevoEsteMes = !tienePrevio && primeraFecha[pacId] && esMesActual(primeraFecha[pacId], now);
    const semanaDeSuPrimera = esNuevoEsteMes ? ('S'+Math.ceil(diaDelMes(primeraFecha[pacId])/7)) : null;
    semanas.forEach(w=>{ if(w===semanaDeSuPrimera) nuevos[w]++; else recurrentes[w]++; });
  });
  return { weeks, nuevos: weeks.map(w=>nuevos[w]), recurrentes: weeks.map(w=>recurrentes[w]) };
}
/* #32 — Ingresos vs Gastos de los ultimos 6 meses (incluye el actual). */
function calcularUltimos6Meses(){
  const now = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:d.getFullYear(), m:d.getMonth()+1, label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}); }
  const ingresos = meses.map(({y,m})=> DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m; }).reduce((s,p)=>s+Number(p.Monto_Pagado),0));
  const gastos = meses.map(({y,m})=> DATA.gastos.filter(g=>{ const f=ymd(g.Fecha); return f.y===y && f.m===m; }).reduce((s,g)=>s+Number(g.Monto),0));
  return { labels: meses.map(x=>x.label), ingresos, gastos };
}
/* #32/#42g — Gastos por categoria a traves de los ultimos 6 meses (top 4
   categorias por gasto acumulado, el resto no se grafica para no saturar).
   Devuelve tambien "meses" y "topCats" para poder mapear un clic en una
   barra (datasetIndex+index) de vuelta a categoria+mes exactos. */
function calcularGastosPorCategoriaMeses(){
  const now = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:d.getFullYear(), m:d.getMonth()+1, label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}); }
  // #59 — el top 3 se calcula SOLO con estos mismos 6 meses (antes usaba
  // todo el historial de siempre, lo que podia meter una categoria vieja
  // sin nada de actividad reciente).
  const totalPorCat = {};
  DATA.gastos.forEach(g=>{ const f=ymd(g.Fecha); if(!meses.some(mm=>mm.y===f.y && mm.m===f.m)) return; totalPorCat[g.Categoria] = (totalPorCat[g.Categoria]||0) + Number(g.Monto); });
  const topCats = Object.entries(totalPorCat).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  // #76 — paleta propia de Gastos (2 tonos de rojo + el mismo neutro que
  // ya usa Ingresos en su 3er lugar), antes compartia por error la misma
  // paleta de verdes que Ingresos — la gráfica de Gastos se veía verde
  // pese a que todo el resto del sistema usa rojo para gastos.
  const paleta = ['#E0555A','#8C3338','#3A4E60'];
  const datasets = topCats.map((cat,i)=>({
    label: cat,
    data: meses.map(({y,m})=> DATA.gastos.filter(g=>{ const f=ymd(g.Fecha); return f.y===y && f.m===m && g.Categoria===cat; }).reduce((s,g)=>s+Number(g.Monto),0)),
    backgroundColor: paleta[i%paleta.length],
  }));
  return { labels: meses.map(x=>x.label), datasets, meses, topCats };
}
/* #42f — Ingresos por categoria de tratamiento a traves de los ultimos 6
   meses (top 3 categorias por ingreso acumulado). Mismo patron que gastos
   por categoria, pero agrupando Pagos via la Categoria de su Tratamiento. */
function calcularIngresosPorCategoriaMeses(){
  const now = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:d.getFullYear(), m:d.getMonth()+1, label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}); }
  // Ciclo 2 (Grupo 2) — ya no se busca la categoria en vivo en el
  // catalogo: cada pago trae su propia categoria congelada desde que se
  // creo (Categoria), protegida de cambios posteriores en Tratamientos.
  // #59 — top 3 calculado solo con estos mismos 6 meses (ver nota arriba).
  const totalPorCat = {};
  DATA.pagos.forEach(p=>{ const f=ymd(p.Ultimo_Pago); if(!meses.some(mm=>mm.y===f.y && mm.m===f.m)) return; const cat = p.Categoria||'Otros'; totalPorCat[cat] = (totalPorCat[cat]||0) + Number(p.Monto_Pagado); });
  const topCats = Object.entries(totalPorCat).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  const paleta = ['#2FD8B0','#1B6E5C','#3A4E60'];
  const datasets = topCats.map((cat,i)=>({
    label: cat,
    data: meses.map(({y,m})=> DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m && (p.Categoria||'Otros')===cat; }).reduce((s,p)=>s+Number(p.Monto_Pagado),0)),
    backgroundColor: paleta[i%paleta.length],
  }));
  return { labels: meses.map(x=>x.label), datasets, meses, topCats };
}
/* #59 — top 3 real de UN mes especifico (para mostrarlo como contexto
   arriba del detalle, ya que el top 3 de la leyenda general es del
   periodo completo de 6 meses y puede no coincidir con el de ese mes). */
function calcularTop3DelMes(items, campoMonto, campoCategoria){
  return calcularTodasCategoriasDelMes(items, campoMonto, campoCategoria).slice(0,3);
}
/* #59b2 — todas las categorias que tuvieron actividad ese mes, no solo las
   3 principales — para poder mostrar "otras categorias" debajo del top 3
   en el detalle, y que el usuario nunca se quede sin ver algo que si paso
   ese mes solo porque no entro en el top 3. */
function calcularTodasCategoriasDelMes(items, campoMonto, campoCategoria){
  const totalPorCat = {};
  items.forEach(it=>{ const cat = campoCategoria(it); totalPorCat[cat] = (totalPorCat[cat]||0) + Number(it[campoMonto]); });
  const total = Object.values(totalPorCat).reduce((s,v)=>s+v,0) || 1;
  return Object.entries(totalPorCat).sort((a,b)=>b[1]-a[1]).map(([cat,monto])=>({ cat, monto, pct: Math.round(monto/total*100) }));
}
/* #59a — nombre completo del mes (ej. "Agosto"), separado del texto corto
   que usa el eje de la grafica (ej. "ago") — solo para titulos de ventana. */
function nombreMesCompleto(y, m){
  const nombre = new Date(y, m-1, 1).toLocaleDateString('es-MX', {month:'long'});
  return nombre.charAt(0).toUpperCase() + nombre.slice(1);
}
/* Chip reutilizable para el top 3 y para "otras categorias" — mismo look,
   mismo click, misma logica de resaltado (color solo si es la seleccionada,
   gris neutro las demas — nunca ambiguo entre si esta o no seleccionada). */
function chipCategoria(t, cat, colorFondo, colorBorde){
  const activo = t.cat===cat;
  const estilo = activo
    ? `background:${colorFondo};border:1px solid ${colorBorde};color:${colorBorde};font-weight:600;`
    : `background:#1B2733;border:1px solid transparent;color:#8CA0B3;`;
  return `<span class="chip chip-click" data-cat="${t.cat}" style="cursor:pointer;${estilo}">${t.cat}: ${fmtMoney(t.monto)} (${t.pct}%)</span>`;
}
/* #42f/#42g/#59 — modal con el detalle de una categoria y mes exactos.
   "cat" es opcional: si no se indica (por ejemplo, al tocar un mes que no
   tiene actividad en ninguna de las 3 categorias "fijas" de la grafica —
   #59c), se usa automaticamente la categoria mas fuerte de ESE mes en
   especifico. Los chips del "Top 3 del mes" son clickeables — sin importar
   si esa categoria tiene o no una barra visible ese mes en la grafica de 6
   meses (#59b) — y solo la categoria seleccionada se resalta con su color;
   el resto siempre en gris neutro (#59d, #59e). #59b2 — debajo del top 3
   se agrega "Otras categorias del mes" con el resto de lo que hubo ese mes
   (tambien clickeable) — asi, si la categoria que tocaste en la grafica
   general (top 3 de 6 meses) no es parte del top 3 de ESTE mes, igual se
   encuentra y se resalta ahi abajo, sin perder ningun dato. Ingresos se
   agrupa por TRATAMIENTO (el desglose natural de una categoria), Gastos
   como lista de movimientos individuales. */
function mostrarDetalleIngresosCategoria(cat, y, m, pagina){
  pagina = pagina || 1;
  // Ciclo 2 (Grupo 2) — misma categoria congelada por pago, ya no en vivo.
  const todasDelMes = DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m; });
  const todasCats = calcularTodasCategoriasDelMes(todasDelMes, 'Monto_Pagado', p=>p.Categoria||'Otros');
  const top3Mes = todasCats.slice(0,3);
  const otrasCats = todasCats.slice(3);
  if(!cat) cat = top3Mes.length ? top3Mes[0].cat : null;
  const mesLabelFull = nombreMesCompleto(y, m);
  // #67b — los renglones con $0 pagado son cuentas pendientes, no ingreso
  // todavia — no cuentan como "pago" en esta vista (ni aqui ni en el
  // desglose por pago individual que abre cada tratamiento).
  const items = cat ? todasDelMes.filter(p=>(p.Categoria||'Otros')===cat && Number(p.Monto_Pagado)>0) : [];
  const porTratamiento = {};
  items.forEach(p=>{ if(!porTratamiento[p.Tratamiento]) porTratamiento[p.Tratamiento] = { cantidad:0, total:0 }; porTratamiento[p.Tratamiento].cantidad++; porTratamiento[p.Tratamiento].total += Number(p.Monto_Pagado); });
  const filas = Object.entries(porTratamiento).sort((a,b)=>b[1].total-a[1].total);
  const total = items.reduce((s,p)=>s+Number(p.Monto_Pagado),0);
  // #62/#63 — bloques fijos de 5, sin selector de cantidad (es una ventana
  // secundaria, no necesita la flexibilidad de las tablas principales).
  const porPagina = 5;
  const totalPaginas = Math.max(1, Math.ceil(filas.length/porPagina));
  if(pagina>totalPaginas) pagina = totalPaginas;
  const filasPagina = filas.slice((pagina-1)*porPagina, pagina*porPagina);
  openModal(`<h3>${cat||'Sin movimientos'} — ${mesLabelFull}</h3>
    <p class="subtle" style="margin-bottom:6px;">Top 3 de ${mesLabelFull} (toca una para ver su detalle):</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${otrasCats.length?10:14}px;">
      ${top3Mes.map(t=>chipCategoria(t,cat,'#12291F','var(--teal)')).join('') || '<span class="subtle">Sin movimientos este mes</span>'}
    </div>
    ${otrasCats.length ? `<p class="subtle" style="margin-bottom:6px;">Otras categorías de ${mesLabelFull}:</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
      ${otrasCats.map(t=>chipCategoria(t,cat,'#12291F','var(--teal)')).join('')}
    </div>` : ''}

    <p class="subtle" style="margin-bottom:12px;">${filas.length} tratamiento${filas.length===1?'':'s'} de <b>${cat||'—'}</b> · Total: ${fmtMoney(total)}</p>
    <div class="detail-block-fixed">

    ${filas.length>porPagina ? `<div class="paginador" style="padding-top:8px;">

        <div class="icon-btn" id="detPrevIng" style="${pagina<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
        <span class="subtle">Página ${pagina} de ${totalPaginas}</span>
        <div class="icon-btn" id="detNextIng" style="${pagina>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>

    <div class="modal-actions" style="margin-top:14px;"><div class="btn block" onclick="closeModal()">Cerrar</div></div>`);
  document.querySelectorAll('.chip-click').forEach(chip=>{

/* #65/#67 — desglose de cada pago individual de UN tratamiento, dentro de
   una categoria y mes especificos: paciente, fecha, monto. Un solo boton
   para regresar al detalle de tratamientos del que vino (mismo patron que
   la cadena de Pendientes por cobrar), no cierra todo de un tiron.

   0): un renglon con $0 pagado es una cuenta pendiente, no un ingreso
   todavia, y esta vista es de ingresos. #67c — se puede alternar el orden
   entre fecha y monto con el boton de arriba (lista simple, no es una
   tabla con columnas — por eso no lleva encabezados clickeables como las
   demas pantallas). */
function mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, pagina, orden){
  pagina = pagina || 1;
  orden = orden || 'fecha_desc';
  let pagos = DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m && p.Tratamiento===tratamiento && Number(p.Monto_Pagado)>0; });
  // #67c — cada orden es espejo exacto de su opuesto: mismo criterio de
  // desempate, solo invertido, para que "antiguo" sea el espejo perfecto
  // de "reciente" (y "menor" de "mayor"), sin depender del orden en que
  // ya venian los datos antes de ordenar.
  const comparadores = {
    fecha_desc: (a,b)=> b.Ultimo_Pago.localeCompare(a.Ultimo_Pago) || Number(b.Monto_Pagado)-Number(a.Monto_Pagado) || String(b.ID).localeCompare(String(a.ID)),
    fecha_asc: (a,b)=> a.Ultimo_Pago.localeCompare(b.Ultimo_Pago) || Number(a.Monto_Pagado)-Number(b.Monto_Pagado) || String(a.ID).localeCompare(String(b.ID)),
    monto_desc: (a,b)=> Number(b.Monto_Pagado)-Number(a.Monto_Pagado) || b.Ultimo_Pago.localeCompare(a.Ultimo_Pago) || String(b.ID).localeCompare(String(a.ID)),
    monto_asc: (a,b)=> Number(a.Monto_Pagado)-Number(b.Monto_Pagado) || a.Ultimo_Pago.localeCompare(b.Ultimo_Pago) || String(a.ID).localeCompare(String(b.ID)),
  };
  const etiquetasOrden = { fecha_desc:'Más reciente primero', fecha_asc:'Más antiguo primero', monto_desc:'Monto mayor primero', monto_asc:'Monto menor primero' };
  const siguienteOrden = { fecha_desc:'fecha_asc', fecha_asc:'monto_desc', monto_desc:'monto_asc', monto_asc:'fecha_desc' };
  pagos = pagos.sort(comparadores[orden]);
  const total = pagos.reduce((s,p)=>s+Number(p.Monto_Pagado),0);
  const porPagina = 5;
  const totalPaginas = Math.max(1, Math.ceil(pagos.length/porPagina));
  if(pagina>totalPaginas) pagina = totalPaginas;
  const pagosPagina = pagos.slice((pagina-1)*porPagina, pagina*porPagina);
  openModal(`<h3>${tratamiento}</h3>

    ${pagosPagina.map(p=>`<div class="pend-row"><span>${p.Paciente} <span class="subtle">· ${formatearFecha(p.Ultimo_Pago)}</span></span><b style="color:var(--teal);">${fmtMoney(p.Monto_Pagado)}</b></div>`).join('') || '<div class="empty">Sin movimientos</div>'}
    </div>
    ${pagos.length>porPagina ? `<div class="paginador" style="padding-top:8px;">
      <span class="subtle">${pagos.length} registros</span>
      <div class="paginador-controles">
        <div class="icon-btn" id="detPrevPagoTrat" style="${pagina<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
        <span class="subtle">Página ${pagina} de ${totalPaginas}</span>
        <div class="icon-btn" id="detNextPagoTrat" style="${pagina>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>` : ''}
    <div class="modal-actions" style="margin-top:14px;"><div class="btn block" id="btnVolverPagoTrat">Regresar</div></div>`);
  document.getElementById('btnOrdenPagoTrat').addEventListener('click', ()=> mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, 1, siguienteOrden[orden]));
  document.getElementById('btnVolverPagoTrat').addEventListener('click', volverModal);
  if(pagos.length>porPagina){
    document.getElementById('detPrevPagoTrat').addEventListener('click', ()=>{ pagina--; mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, pagina, orden); });
    document.getElementById('detNextPagoTrat').addEventListener('click', ()=>{ pagina++; mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, pagina, orden); });
  }
}

/* Tooltip de Chart.js "externo": en vez de dejar que Chart.js lo posicione
   dentro del canvas (donde queda a merced de cualquier overflow:hidden en
   los contenedores de arriba), lo dibujamos nosotros en un div propio
   pegado a <body> con position:fixed, y le calculamos la posicion a mano
   para que nunca se salga de la pantalla. */
/* #55 — el tooltip de la dona vive pegado a <body>, no dentro de la
   pestaña ni de la tarjeta (necesario para que nunca se corte, ver #1).
   Por eso, a diferencia del tooltip nativo de Chart.js que usan las demas
   graficas, no se oculta solo al hacer scroll o cambiar de pestaña en
   movil (donde no hay "mouse que se aleja" para que Chart.js lo detecte
   solo) — hay que ocultarlo nosotros a mano en esos casos. */
function ocultarChartTooltip(){
  const t = document.getElementById('chartTooltipEl');
  if(t) t.style.opacity = 0;
  // #55 (seguimiento) — al hacer scroll, tambien se le pide a todas las
  // demas graficas (las que usan el tooltip nativo de Chart.js) que
  // quiten cualquier tooltip que tengan abierto — en movil, sin un mouse
  // que "se aleje" solo, se quedarian pegadas hasta que tocaras otra
  // parte de la pantalla.
  if(typeof Chart!=='undefined' && Chart.instances){
    Object.values(Chart.instances).forEach(c=>{
      try{ if(c && c.tooltip){ c.tooltip.setActiveElements([], {x:0,y:0}); c.update(); } }
      catch(err){ /* una grafica fantasma no debe frenar al resto */ }
    });
  }
}
window.addEventListener('scroll', ocultarChartTooltip, true);
function chartTooltipHandler(context){
  let tip = document.getElementById('chartTooltipEl');
  if(!tip){ tip = document.createElement('div'); tip.id='chartTooltipEl'; tip.className='chart-tooltip'; document.body.appendChild(tip); }
  const model = context.tooltip;
  if(!model || model.opacity===0){ tip.style.opacity = 0; return; }
  const dp = model.dataPoints && model.dataPoints[0];
  if(dp){
    const data = context.chart.data.datasets[0].data;
    const total = data.reduce((s,v)=>s+Number(v),0);
    const pct = total>0 ? Math.round(Number(dp.raw)/total*100) : 0;
    const bg = dp.dataset.backgroundColor;
    const color = Array.isArray(bg) ? bg[dp.dataIndex] : bg;
    tip.innerHTML = `<b><span class="dot" style="background:${color}"></span>${dp.label}</b><div>${fmtMoney(dp.raw)} (${pct}%)</div>`;
  }
  const rect = context.chart.canvas.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth || 160;
  const th = tip.offsetHeight || 40;
  let x = rect.left + model.caretX - tw/2;
  let y = rect.top + model.caretY - th - 12;
  x = Math.min(Math.max(x, 8), window.innerWidth - tw - 8);
  y = Math.max(y, 8);
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

/* ============ ORDEN GENERICO (clic en encabezado) — Pacientes, Pagos, Gastos, Tratamientos ============ */
const SORT_STATE = { pacientes:{key:null,dir:1}, pagos:{key:null,dir:1}, gastos:{key:null,dir:1}, tratamientos:{key:null,dir:1} };
// Ciclo 1 / Ronda 9 (duda de Sergio) — antes, cuando 2 o mas filas
// empataban exactamente en la columna elegida, el resultado dependia de
// una casualidad de implementacion: el sort de JS es estable, y conserva
// el orden relativo previo entre empatados — que resultaba ser el orden
// por defecto con el que se armo la tabla (por Ultimo_Pago/Fecha
// descendente), sin que nadie lo hubiera decidido a proposito. Ahora el
// desempate es explicito: entre filas empatadas, siempre gana la que se
// agrego mas reciente (ID mas alto) — asi un registro recien creado
// siempre aparece primero entre sus empates, sin importar que columna se
// este ordenando ni en que direccion.
function ordenar(tbl, items, getVal){
  const st = SORT_STATE[tbl];
  if(!st.key) return items;
  return [...items].sort((a,b)=>{
    const va = getVal(a, st.key), vb = getVal(b, st.key);
    let cmp;
    if(va==null && vb==null) cmp = 0;
    else if(va==null) cmp = 1;
    else if(vb==null) cmp = -1;
    else if(typeof va==='number' && typeof vb==='number') cmp = (va-vb)*st.dir;
    else cmp = String(va).localeCompare(String(vb), 'es', {numeric:true}) * st.dir;
    if(cmp !== 0) return cmp;
    return String(b.ID).localeCompare(String(a.ID), 'es', {numeric:true});
  });
}
function thSort(tbl, label, sortKey){
  return `<th class="sortable" data-sort-tbl="${tbl}" data-sort-key="${sortKey}">${label}<span class="sort-arrow"></span></th>`;
}
function refreshSortArrows(tbl){
  const st = SORT_STATE[tbl];
  document.querySelectorAll(`th[data-sort-tbl="${tbl}"]`).forEach(th=>{
    const arrowEl = th.querySelector('.sort-arrow'); if(!arrowEl) return;
    arrowEl.textContent = (st.key===th.dataset.sortKey) ? (st.dir===1?'▲':'▼') : '';
  });
}
function attachSortHeaders(tbl, refillFn){
  document.querySelectorAll(`th[data-sort-tbl="${tbl}"]`).forEach(th=>{
    th.onclick = ()=>{
      const sortKey = th.dataset.sortKey;
      const st = SORT_STATE[tbl];
      if(st.key===sortKey) st.dir = -st.dir; else { st.key = sortKey; st.dir = 1; }
      refillFn();
    };
  });
}
/* ============ PAGINADOR GENERICO (Pacientes, Pagos, Gastos, Tratamientos) ============ */
const PAGINATION = { pacientes:{page:1,size:15}, pagos:{page:1,size:15}, gastos:{page:1,size:15}, tratamientos:{page:1,size:15} };
function paginar(key, items){
  const st = PAGINATION[key];
  const total = items.length;
  const totalPaginas = Math.max(1, Math.ceil(total/st.size));
  if(st.page>totalPaginas) st.page = totalPaginas;
  const inicio = (st.page-1)*st.size;
  return { pageItems: items.slice(inicio, inicio+st.size), total, totalPaginas };
}
function renderPaginador(key, total, totalPaginas){
  const st = PAGINATION[key];
  if(total===0) return '';
  return `
  <div class="paginador">
    <span class="subtle">${total} registro${total===1?'':'s'}</span>
    <div class="paginador-controles">
      <select class="pag-size" data-pag-key="${key}">${[15,30,50,100].map(n=>`<option value="${n}" ${st.size===n?'selected':''}>${n} por página</option>`).join('')}</select>
      <div class="icon-btn pag-prev" data-pag-key="${key}" style="${st.page<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
      <span class="subtle">Página ${st.page} de ${totalPaginas}</span>
      <div class="icon-btn pag-next" data-pag-key="${key}" style="${st.page>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
  </div>`;
}
/* #64 — reserva la altura de la pagina "llena" (min(size,total) filas) en
   el bloque que envuelve tabla+paginador, para que la ultima pagina (con
   menos registros) no encoja el contenedor ni haga saltar el paginador. */
/* #66 (corregido de raiz, v22) — medido directo en el navegador: Pagos es
   la unica tabla cuyas celdas llevan un badge de saldo Y un boton Abonar,
   lo que hace que sus renglones midan 49-53px reales — no los 45px que
   esta formula asumia para las 4 tablas por igual (medido en Pacientes:
   42px reales, por eso ahi nunca fallaba). Con la constante generica, una
   pagina llena de Pagos (15 filas) media 883px reales contra apenas
   767px reservados — como min-height es un piso, no un techo, la tabla
   SI crecia de mas en paginas llenas y se desinflaba de vuelta al piso en
   paginas con menos registros: ese "inflar y desinflar" era el salto de
   tamaño y el paginador que no se quedaba en su lugar. Se agrega un
   parametro de alto por fila (con margen sobre el maximo real medido) que
   cada tabla puede pasar segun su propio contenido. */
function actualizarAlturaTabla(blockId, key, total, altoFila){
  const el = document.getElementById(blockId);
  if(!el) return;
  if(total===0){ el.style.minHeight = ''; return; }
  const filas = Math.min(PAGINATION[key].size, total);
  // Ciclo 2 / Ronda 6 — el paginador volvio a vivir DENTRO de este mismo
  // contenedor (Ronda 5, #11 — para unificarlo visualmente con la tabla),
  // asi que su altura real (52px, medida en navegador) tiene que volver
  // a contarse aqui. Sin esto, el contenedor no reservaba espacio
  // suficiente y el bug de "la pagina brinca al cambiar de pagina" (ya
  // resuelto en el Ciclo 1) volvio a aparecer.
  el.style.minHeight = (42 + filas*(altoFila||45) + 52) + 'px';
}
function attachPaginadorEvents(key, refillFn){
  document.querySelectorAll(`.pag-size[data-pag-key="${key}"]`).forEach(sel=>{
    sel.onchange = e=>{ PAGINATION[key].size = Number(e.target.value); PAGINATION[key].page = 1; refillFn(); };
  });
  document.querySelectorAll(`.pag-prev[data-pag-key="${key}"]`).forEach(btn=>{
    btn.onclick = ()=>{ if(PAGINATION[key].page>1){ PAGINATION[key].page--; refillFn(); } };
  });
  document.querySelectorAll(`.pag-next[data-pag-key="${key}"]`).forEach(btn=>{
    btn.onclick = ()=>{ PAGINATION[key].page++; refillFn(); };
  });
}
function saldoPaciente(pacId){ return DATA.pagos.filter(p=>p.Paciente_ID===pacId).reduce((s,p)=>s+Number(p.Saldo),0); }
/* "Ultima visita" real del paciente: la fecha mas reciente entre sus citas
   no canceladas con Fecha <= hoy. No se guarda en ningun lado — se calcula
   al vuelo con los datos ya cargados, para que nunca se desincronice. Si
   todavia no tiene ninguna cita asi (recien dado de alta, con historial de
   antes de usar el sistema), cae al respaldo manual capturado en el alta. */
function ultimaVisitaEfectiva(pac){
  const hoy = todayStr();
  const pasadas = DATA.citas.filter(c=>c.Paciente_ID===pac.ID && c.Estado!=='Cancelada' && c.Fecha<=hoy);
  if(pasadas.length>0) return pasadas.reduce((max,c)=> c.Fecha>max ? c.Fecha : max, pasadas[0].Fecha);
  return (pac.Ultima_Visita && pac.Ultima_Visita!=='—') ? pac.Ultima_Visita : '—';
}
function fillPacientesTable(filter){
  const tbody = document.getElementById('pacTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = DATA.pacientes.filter(p=> matches(p.Nombre,f) || matches(p.Tratamientos,f));
  filtrados = ordenar('pacientes', filtrados, (p,key)=>{
    if(key==='Ultima_Visita') return ultimaVisitaEfectiva(p);
    if(key==='Saldo') return saldoPaciente(p.ID);
    if(key==='Tratamientos') return tratArr(p.Tratamientos).length;
    return p[key];
  });
  const { pageItems: rows, total, totalPaginas } = paginar('pacientes', filtrados);
  tbody.innerHTML = rows.map(p=>{
    const saldo = saldoPaciente(p.ID);
    const trats = tratArr(p.Tratamientos);
    const tratLabel = trats.length===0 ? '—' : (trats.length===1 ? trats[0] : `${trats[0]} <span class="subtle">+${trats.length-1}</span>`);
    const estadoBadge = p.Estado==='Inactivo' ? `<span class="badge inactive">Inactivo</span>` : `<span class="badge ok">Activo</span>`;
    return `<tr class="clickable" data-pac="${p.ID}"><td>${p.Nombre}</td><td>${p.Telefono}</td><td>${formatearFecha(ultimaVisitaEfectiva(p))}</td><td>${tratLabel}</td><td>${estadoBadge}</td><td>${saldo>0?`<span class="badge pend">${fmtMoney(saldo)}</span>`:`<span class="badge ok">Al corriente</span>`}</td><td>${p.Usuario||'—'}</td><td>${formatearFechaActualizacion(p.Fecha_Actualizacion)}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('tr[data-pac]').forEach(tr=>{ tr.addEventListener('click', ()=> showPacienteDetalle(tr.dataset.pac)); });
  const pagBox = document.getElementById('pacPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('pacientes', total, totalPaginas); attachPaginadorEvents('pacientes', ()=>fillPacientesTable(filter)); }
  actualizarAlturaTabla('pacTableBlock', 'pacientes', total, 50); // Ciclo 3 — el margen de +3px (Ronda 8) no bastaba en movil: 6 columnas apretadas en 760px hacian que algun nombre/tratamiento largo ocasionalmente necesitara 2 renglones, reintroduciendo el achicamiento. Se sube el margen a +8px sobre el real (42px), ademas de mas ancho minimo en movil (760->820px) para que sea menos probable que el texto necesite partirse.
  refreshSortArrows('pacientes'); attachSortHeaders('pacientes', ()=>fillPacientesTable(filter));
}
function showPacienteDetalle(pacId){
  const p = DATA.pacientes.find(x=>x.ID===pacId); if(!p) return;
  const trats = tratArr(p.Tratamientos);
  const saldo = saldoPaciente(pacId);
  const esActivo = p.Estado!=='Inactivo';
  openModal(`
    <h3>${p.Nombre}</h3>
    <p class="subtle" style="margin-bottom:14px;">${p.Telefono} · Ultima visita: ${formatearFecha(ultimaVisitaEfectiva(p))} · ${esActivo?'<span style="color:var(--teal)">Activo</span>':'<span style="color:var(--text-mute)">Inactivo</span>'}</p>
    <div class="card-title" style="margin-bottom:8px;">Tratamientos asignados</div>
    <div class="chip-row" style="margin-bottom:16px;">${trats.map(t=>`<span class="chip">${t}</span>`).join('') || '<span class="subtle">Sin tratamientos asignados</span>'}</div>
    <div class="card-title" style="margin-bottom:8px;">Saldo</div>
    <div style="font-size:20px;font-weight:700;color:${saldo>0?'var(--amber)':'var(--teal)'}">${fmtMoney(saldo)}</div>
    <div class="modal-actions">
      <div class="btn block" id="btnEditarPaciente">Editar</div>
      <div class="btn block" id="btnToggleEstado">${esActivo?'Marcar como inactivo':'Reactivar paciente'}</div>
      <div class="btn primary block" onclick="closeModal()">Cerrar</div>
    </div>`);
  document.getElementById('btnEditarPaciente').addEventListener('click', ()=> abrirEdicionPaciente(p));
  document.getElementById('btnToggleEstado').addEventListener('click', async ()=>{
    if(esActivo && saldo>0){ if(!confirm(`${p.Nombre} tiene un saldo pendiente de ${fmtMoney(saldo)}. ¿Marcarlo como inactivo de todas formas?`)) return; }
    const nuevoEstado = esActivo ? 'Inactivo' : 'Activo';
    if(CONFIG.API_URL){
      const res = await apiCall('set_estado_paciente', { pacienteId: p.ID, estado: nuevoEstado }, ['pacientes']);
      if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo cambiar el estado del paciente');
    } else { p.Estado = nuevoEstado; }
    closeModal(); showToast(esActivo?'Paciente marcado como inactivo':'Paciente reactivado'); render();
  });
}
// Ciclo 2 (Grupo 2) — edicion de Paciente: Nombre, Telefono, Tratamientos.
// Nunca elimina (Pacientes solo usa Activo/Inactivo). Compara contra los
// valores originales al guardar y solo manda al servidor los campos que
// de verdad cambiaron — si no cambio nada, ni siquiera se manda peticion.
function abrirEdicionPaciente(p){
  let selectedTrats = tratArr(p.Tratamientos);
  const original = { Nombre: p.Nombre, Telefono: String(p.Telefono), Tratamientos: selectedTrats.join(', ') };
  pushModalState(()=> showPacienteDetalle(p.ID));
  openModal(`
    <h3>Editar paciente</h3>
    <div class="field" style="margin-bottom:12px;"><label>Nombre completo</label><input id="epNombre" value="${p.Nombre}"></div>
    <div class="field" style="margin-bottom:12px;"><label>Teléfono <span class="subtle">(sin prefijo, solo ${telefonoInfo().longitud} dígitos)</span></label><input id="epTelefono" type="tel" inputmode="numeric" maxlength="${telefonoInfo().longitud}" value="${p.Telefono}"></div>
    <div class="field" style="margin-bottom:16px;"><label>Tratamientos</label><div class="picker-btn" id="epTratBtn">${selectedTrats.length?selectedTrats.join(', '):'Selecciona uno o varios tratamientos'}</div></div>
    <div class="modal-actions"><div class="btn block" onclick="volverModal()">Cancelar</div><div class="btn primary block" id="epGuardar">Guardar</div></div>`);
  document.getElementById('epTelefono').addEventListener('input', e=> sanearInputMonto(e.target));
  document.getElementById('epTratBtn').addEventListener('click', ()=>{
    openTreatmentPicker(selectedTrats, (sel)=>{ selectedTrats = sel; document.getElementById('epTratBtn').textContent = selectedTrats.length?selectedTrats.join(', '):'Selecciona uno o varios tratamientos'; });
  });
  document.getElementById('epGuardar').addEventListener('click', async ()=>{
    const nombre = document.getElementById('epNombre').value.trim();
    const tel = document.getElementById('epTelefono').value.trim();
    const infoTel = telefonoInfo();
    const faltan = []; if(!nombre) faltan.push('Nombre completo'); if(!tel) faltan.push('Teléfono');
    if(faltan.length) return showToast('Completa: '+faltan.join(', '));
    if(!/^\d+$/.test(tel) || tel.length!==infoTel.longitud) return showToast(`El teléfono debe tener exactamente ${infoTel.longitud} dígitos (sin prefijo)`);
    const actual = { Nombre: nombre, Telefono: tel, Tratamientos: selectedTrats.join(', ') };
    const cambios = {};
    Object.keys(actual).forEach(k=>{ if(actual[k] !== original[k]) cambios[k] = actual[k]; });
    if(Object.keys(cambios).length === 0){ showToast('Sin cambios que guardar'); volverModal(); return; }
    if(CONFIG.API_URL){
      const res = await apiCall('edit_paciente', { pacienteId: p.ID, cambios }, ['pacientes']);
      if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo actualizar el paciente');
    } else { Object.assign(p, cambios); }
    showToast('Paciente actualizado'); closeModal(); render();
  });
}

}
function fillPagosTable(filter){
  const tbody = document.getElementById('pagosTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = [...DATA.pagos].sort((a,b)=>b.Ultimo_Pago.localeCompare(a.Ultimo_Pago)).filter(p=>{
    const blob = [p.Inicio_Tratamiento,p.Ultimo_Pago,p.Paciente,p.Tratamiento,p.Categoria,p.Monto_Total,p.Monto_Pagado,p.Saldo].join(' ');
    return matches(blob, f);
  });
  filtrados = ordenar('pagos', filtrados, (p,key)=> key==='Monto_Total'||key==='Monto_Pagado'||key==='Saldo' ? Number(p[key]) : p[key]);
  const { pageItems: rows, total, totalPaginas } = paginar('pagos', filtrados);
  // #66 (corregido de raiz, v21) — el parche de renglones invisibles de
  // v19/v20 se elimina por completo: causaba que los bordes de esos
  // renglones "hidden" se siguieran pintando (por el border-collapse:
  // collapse global de las tablas), dejando lineas fantasma vacias en la
  // ultima pagina. Pagos ya tenia el mismo mecanismo de min-height +
  // paginador con margin-top:auto que usan sin ningun problema las otras
  // 3 tablas (Pacientes, Tratamientos, Gastos) — bastaba con dejarlo
  // trabajar solo, sin el relleno redundante.
  // Ciclo 2 (Grupo 2) — boton "Eliminar" solo aparece si Monto_Pagado es
  // 0 (nunca se le ha abonado nada) — en cuanto tiene cualquier abono, el
  // registro se vuelve permanente y este boton deja de mostrarse.
  // Ciclo 2 / Ronda 2 (#4 de Pagos) — el boton "Eliminar" YA NO se agrega
  // condicionalmente (eso hacia que unas filas tuvieran 1 boton y otras 2,
  // con anchos/altos distintos — reintroducia el mismo bug de "la tabla
  // se achica/agranda" que ya se habia resuelto en el Ciclo 1). Ahora
  // los 2 botones SIEMPRE se renderizan, y el que no aplica queda oculto
  // con visibility:hidden (ocupa el mismo espacio, sin verse) — mismo
  // patron que ya usaba "Abonar" para el caso de saldo en $0.
  tbody.innerHTML = rows.map(p=>`<tr><td>${p.Paciente}</td><td>${p.Tratamiento}</td><td>${p.Categoria||'Otros'}</td><td>${formatearFecha(p.Inicio_Tratamiento)}</td><td>${formatearFecha(p.Ultimo_Pago)}</td><td>${fmtMoney(p.Monto_Total)}</td><td>${fmtMoney(p.Monto_Pagado)}</td><td>${Number(p.Saldo)>0?`<span class="badge pend">${fmtMoney(p.Saldo)}</span>`:`<span class="badge ok">$0</span>`}</td><td>${p.Usuario||'—'}</td><td>${formatearFechaActualizacion(p.Fecha_Actualizacion)}</td><td><div style="display:flex;gap:6px;align-items:center;"><div class="btn sm" data-abonar="${p.ID}" style="${Number(p.Saldo)>0?'':'visibility:hidden;'}">Abonar</div><div class="btn sm" data-eliminar-pago="${p.ID}" style="color:var(--red);border-color:var(--red);${Number(p.Monto_Pagado)===0?'':'visibility:hidden;'}">Eliminar</div></div></td></tr>`).join('') || '<tr><td colspan="11" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('[data-abonar]').forEach(btn=>{ btn.addEventListener('click', ()=> openAbonoModal(btn.dataset.abonar, ()=>{ fillPagosTable(document.getElementById('pagoSearch').value); })); });
  tbody.querySelectorAll('[data-eliminar-pago]').forEach(btn=>{ btn.addEventListener('click', ()=> confirmarEliminarPago(btn.dataset.eliminarPago)); });
  const pagBox = document.getElementById('pagPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('pagos', total, totalPaginas); attachPaginadorEvents('pagos', ()=>fillPagosTable(filter)); }
  actualizarAlturaTabla('pagTableBlock', 'pagos', total, 53); // Ciclo 2 / Ronda 8 — se reduce 1px (de 54 a 53) para acercar visualmente el espacio antes del paginador al de las otras 3 tablas. No se reduce mas que esto: 53px es el TOPE real medido (rango 49-53px) — bajar de ahi quitaria el margen que evita el propio bug de achicamiento que #66 ya resolvio en esta tabla. La convergencia real viene del lado de las otras 3 tablas, que subieron su margen (ver Ronda 8 en Pacientes/Gastos/Tratamientos).
  refreshSortArrows('pagos'); attachSortHeaders('pagos', ()=>fillPagosTable(filter));
}
function fillGastosTable(filter){

  let filtrados = [...DATA.gastos].sort((a,b)=>b.Fecha.localeCompare(a.Fecha)).filter(g=>{ const blob = [g.Fecha,g.Concepto,g.Categoria,g.Monto].join(' '); return matches(blob, f); });
  filtrados = ordenar('gastos', filtrados, (g,key)=> key==='Monto' ? Number(g[key]) : g[key]);
  const { pageItems: rows, total, totalPaginas } = paginar('gastos', filtrados);

// Ciclo 2 (Grupo 2) — edicion de Gasto: Concepto, Categoria, Monto. Nunca
// se elimina — mismo patron de "solo mandar lo que cambio" que Pacientes.
// Ciclo 2 (Grupo 2) — un pago solo se puede eliminar si nunca se le
// abono nada (Monto_Pagado === 0). El servidor tambien lo valida
// (defensa por si el dato local quedo desactualizado), pero se checa
// aqui primero para dar el aviso correcto sin ni siquiera intentar la
// peticion si ya no aplica.
// Ciclo 2 / Ronda 2 (#5 de Pagos) — ventana propia en vez del alert()
// nativo del navegador, para que se vea consistente con el resto del
// sistema (mismo patron que "Horario ocupado" al agendar).
function confirmarEliminarPago(pagoId){
  const p = DATA.pagos.find(x=>x.ID===pagoId); if(!p) return;
  if(Number(p.Monto_Pagado) > 0){ showToast('Este pago ya tiene abonos y no se puede eliminar'); return; }
  openModal(`
    <h3>¿Eliminar este pago?</h3>
    <p style="font-size:13px;margin-bottom:16px;">${p.Tratamiento} de <b>${p.Paciente}</b>. Esta acción no se puede deshacer.</p>
    <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="btnConfirmarEliminarPago" style="background:var(--red);">Eliminar</div></div>`);
  document.getElementById('btnConfirmarEliminarPago').addEventListener('click', ()=>{ closeModal(); eliminarPago(pagoId); });
}
async function eliminarPago(pagoId){
  if(CONFIG.API_URL){
    const res = await apiCall('delete_pago', { pagoId }, ['pagos']);
    if(res && res.error){ showToast(res.error); return; }
  } else {
    const idx = DATA.pagos.findIndex(x=>x.ID===pagoId);
    if(idx !== -1) DATA.pagos.splice(idx, 1);
  }
  showToast('Pago eliminado'); render();
}
function abrirEdicionGasto(gastoId){
  const g = DATA.gastos.find(x=>x.ID===gastoId); if(!g) return;
  let categoriaSel = g.Categoria;
  const original = { Concepto: g.Concepto, Categoria: g.Categoria, Monto: Number(g.Monto) };
  openModal(`
    <h3>Editar gasto</h3>
    <div class="field" style="margin-bottom:12px;"><label>Concepto</label><input id="egConcepto" value="${g.Concepto}"></div>
    <div class="field" style="margin-bottom:12px;"><label>Categoría</label>
      <div class="picker-btn" id="egCatBtn">${categoriaSel}</div></div>
    <div class="field" style="margin-bottom:16px;"><label>Monto</label><input id="egMonto" type="text" inputmode="decimal" value="${String(g.Monto).replace('.', separadorDecimal())}"></div>
    <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="egGuardar">Guardar</div></div>`);
  attachSaneoMonto('egMonto');
  document.getElementById('egCatBtn').addEventListener('click', ()=>{
    openGastoCategoryPicker(categoriaSel, (cat)=>{ categoriaSel = cat; document.getElementById('egCatBtn').textContent = cat; });
  });
  document.getElementById('egGuardar').addEventListener('click', async ()=>{
    const concepto = document.getElementById('egConcepto').value.trim();
    const monto = parsearMonto(document.getElementById('egMonto').value);
    const faltan = []; if(!concepto) faltan.push('Concepto'); if(monto<=0) faltan.push('Monto');
    if(faltan.length) return showToast('Completa: '+faltan.join(', '));
    const actual = { Concepto: concepto, Categoria: categoriaSel, Monto: monto };
    const cambios = {};
    Object.keys(actual).forEach(k=>{ if(actual[k] !== original[k]) cambios[k] = actual[k]; });
    if(Object.keys(cambios).length === 0){ showToast('Sin cambios que guardar'); closeModal(); return; }
    if(CONFIG.API_URL){
      const res = await apiCall('edit_gasto', { gastoId: g.ID, cambios }, ['gastos']);
      if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo actualizar el gasto');
    } else { Object.assign(g, cambios); }
    showToast('Gasto actualizado'); closeModal(); render();
  });
}
// Ciclo 1 / Ronda 5 (#9/#10/#11) — 2 fechas separadas: inicioTrat (editable,
// puede ser anterior a hoy) y ultimoPago (fecha del pago mas reciente, la
// que usan las graficas financieras). Al crear el registro, ultimoPago
// siempre es hoy (es cuando el dinero realmente entro); inicioTrat puede
// ser distinto si el doctor indica que el tratamiento empezo antes.
async function guardarPagoNuevo(selPac, selTrat, total, pagado, inicioTrat){
  let id = 'F' + String(DATA.pagos.length+1).padStart(3,'0');
  const hoy = todayStr();
  const inicio = inicioTrat || hoy;
  // Ciclo 1 / Ronda 7 (#17) — Ultimo_Pago solo se llena cuando de verdad
  // entro dinero (montoPagado>0). Un pago dado de alta en $0 (plan de
  // tratamiento sin cobro todavia, escenario valido) no debe mostrar una
  // fecha de "ultimo pago" — seria confuso, porque no hubo ningun pago
  // aun. Se queda vacio hasta el primer abono real.
  const ultimoPago = pagado>0 ? hoy : '';
  // Ciclo 2 (Grupo 2) — Categoria queda congelada con la que tiene el
  // tratamiento AHORA MISMO en el catalogo. De aqui en adelante, aunque
  // el tratamiento cambie de categoria despues, este pago conserva la
  // que le correspondia al momento de crearse.
  const tratCatalogo = DATA.tratamientos.find(t=>t.Nombre===selTrat.nombre);
  const categoria = tratCatalogo ? tratCatalogo.Categoria : 'Otros';
  if(CONFIG.API_URL){
    // #13 — 'pacientes' se agrega a syncKeys porque el servidor puede
    // asignarle el tratamiento al paciente si todavia no lo tenia (ver
    // addPago en Code.gs) — sin esto, el FE se quedaria con la lista de
    // tratamientos del paciente desactualizada hasta el proximo refresco.
    const res = await apiCall('add_pago', { inicioTratamiento:inicio, ultimoPago, pacienteId:selPac.ID, paciente:selPac.Nombre, tratamiento:selTrat.nombre, categoria, montoTotal:total, montoPagado:pagado }, ['pagos','pacientes']);
    if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo registrar el pago');
  } else {
    DATA.pagos.push({ID:id, Inicio_Tratamiento:inicio, Ultimo_Pago:ultimoPago, Paciente_ID:selPac.ID, Paciente:selPac.Nombre, Tratamiento:selTrat.nombre, Categoria:categoria, Monto_Total:total, Monto_Pagado:pagado, Saldo:total-pagado});
    // #13 (modo demo) — mismo criterio que agregarTratamientosAlPaciente
    // en Code.gs: solo se agrega si el paciente no lo tenia ya.
    const pacLocal = DATA.pacientes.find(x=>x.ID===selPac.ID);
    if(pacLocal){
      const actuales = tratArr(pacLocal.Tratamientos);
      if(!actuales.includes(selTrat.nombre)) pacLocal.Tratamientos = [...actuales, selTrat.nombre].join(', ');
    }
  }
  closeModal(); showToast('Pago registrado'); render();
}

function openAbonoModal(pagoId, onDone, volverInit){
  const pago = DATA.pagos.find(p=>p.ID===pagoId); if(!pago) return;
  if(volverInit) pushModalState(volverInit);
  // Ciclo 1 / Ronda 6 (#12) — 3 renglones: paciente+tratamiento, las 2
  // fechas juntas, y el saldo aparte al final (mas facil de leer que
  // todo mezclado en 2 renglones).
  openModal(`
    <h3>Registrar abono</h3>
    <p class="subtle" style="margin-bottom:2px;">${pago.Paciente} · ${pago.Tratamiento}</p>
    <p class="subtle" style="margin-bottom:2px;">Inicio tratamiento: ${formatearFecha(pago.Inicio_Tratamiento)}</p>
    <p class="subtle" style="margin-bottom:2px;">Último pago: ${formatearFecha(pago.Ultimo_Pago)}</p>
    <p class="subtle" style="margin-bottom:14px;">Saldo actual: ${fmtMoney(pago.Saldo)}</p>
    <div class="field" style="margin-bottom:16px;"><label>Monto del abono</label><input id="mAbono" type="text" inputmode="decimal" placeholder="0${separadorDecimal()}00"></div>
    <div class="modal-actions"><div class="btn block" onclick="${volverInit?'volverModal()':'closeModal()'}">Cancelar</div><div class="btn primary block" id="mGuardarAbono">Registrar</div></div>`);
  attachSaneoMonto('mAbono');
  document.getElementById('mGuardarAbono').addEventListener('click', async ()=>{
    const monto = parsearMonto(document.getElementById('mAbono').value);
    if(monto<=0) return showToast('Ingresa un monto valido');
    // Ciclo 1 / Ronda 6 (#16) — validar contra el saldo ANTES de intentar
    // la transaccion. Antes, un monto de mas (simple error de captura, sin
    // que hubiera ningun otro dispositivo de por medio) disparaba el mismo
    // mensaje de conflicto de concurrencia — confuso, porque nadie mas
    // habia tocado ese pago. Esto atrapa el caso comun (un solo
    // dispositivo, monto mal tecleado) con un aviso claro y sin ni
    // siquiera intentar la transaccion; el rechazo del servidor (#15)
    // se queda como red de seguridad real para cuando SI hay una carrera
    // entre 2 dispositivos.
    if(monto > Number(pago.Saldo)){
      return showToast(`El abono no puede ser mayor al saldo pendiente (${fmtMoney(pago.Saldo)})`);
    }
    if(CONFIG.API_URL){
      // Ciclo 1 / Ronda 5 — si otro dispositivo ya completo este pago sin
      // que este dispositivo sincronizara antes, el servidor rechaza el
      // abono en vez de dejar un saldo negativo (ver addAbono en Code.gs).
      const res = await apiCall('add_abono', { pagoId: pago.ID, monto, fecha: todayStr() }, ['pagos']);
      if(res && res.conflict){
        // Ciclo 1 / Ronda 7 (auditoria de historial de pagos, #5) — antes,
        // apiCall() ya apagaba su propia mascara en cuanto regresaba la
        // respuesta (correcto para el camino de exito), pero el trabajo
        // extra de este camino de conflicto (syncData + repintar) corria
        // SIN ninguna mascara — el modal de abono se cerraba y quedaban
        // unos segundos de pantalla "vacia" antes de que apareciera el
        // mensaje de error, prestandose a confusion. Ahora la mascara se
        // mantiene visible sin interrupcion desde "Registrar" hasta que
        // el mensaje final aparece en pantalla.
        showMask('Verificando...');
        await syncData(['pagos']);
        if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='finanzas') repintarGraficasConDatosActuales();
        if(volverInit){ volverModal(); } else { closeModal(); }
        hideMask();
        // Ciclo 1 / Ronda 6 (#15) — antes esto era un toast que
        // desaparecia solo en pocos segundos; ahora es una ventana que
        // se queda hasta que el usuario la cierra, mismo patron que ya
        // usa el conflicto de "Horario ocupado" al agendar.
        openModal(`
          <h3>No se pudo registrar el abono</h3>
          <p style="font-size:13px;margin-bottom:16px;">${res.mensaje || 'Revisa el saldo actual antes de intentar de nuevo.'}</p>
          <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Cerrar</div></div>`);
        if(onDone) onDone();
        return;
      }
    } else {
      pago.Monto_Pagado = Number(pago.Monto_Pagado) + monto; pago.Saldo = Number(pago.Monto_Total) - Number(pago.Monto_Pagado);
      pago.Ultimo_Pago = todayStr();
    }
    showToast('Abono registrado');
    if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='finanzas') render();
    if(volverInit){ volverModal(); if(onDone) onDone(); } else { closeModal(); if(onDone) onDone(); }
  });
}

/* Ciclo 1 / Ronda 4 — punto unico de repintado de graficas, llamado
   desde apiCall() despues de CUALQUIER guardado exitoso en cualquier
   pantalla del sistema. Usa solo los datos que ya estan en el FE (DATA),
   sin ninguna llamada nueva al backend. Es seguro llamarla sin importar
   en que pestaña este el usuario: tanto drawDashboardCharts() como
   drawFinanzasChart() ya revisan que cada canvas exista antes de
   dibujar, asi que si esa pantalla no esta activa simplemente no hacen
   nada. Nunca toca el DOM de las tablas de Pacientes/Tratamientos/Pagos/
   Gastos — esas ya quedan al dia solas porque apiCall() ya les
   actualizo su propia hoja en DATA antes de llegar aqui. */
function repintarGraficasConDatosActuales(){
  destruirGraficasActivas();
  drawDashboardCharts();
  drawFinanzasChart();
  const kpiEl = document.getElementById('finanzasKpiRow');
  if(kpiEl) kpiEl.innerHTML = renderFinanzasKpiRowInner();
}
// Ciclo 1 / Ronda 4, movida al menu principal en Ronda 7 (#18) — unica
// forma de traer todo de nuevo del servidor fuera de un guardado propio:
// para el escenario de otro dispositivo usando el sistema al mismo
// tiempo. Compartida entre el item "Sincronizar" del menu.
async function sincronizarTodo(){
  if(CONFIG.API_URL){
    showMask('Sincronizando...');
    const ok = await loadData();
    hideMask();
    // Ciclo 3 — antes mostraba un aviso generico ("No se pudo
    // sincronizar") sin ningun detalle, aunque loadData() SI guarda la
    // causa exacta en LOAD_ERROR (el mismo mecanismo de diagnostico que
    // ya usa la pantalla de error de la carga inicial). Se muestra ese
    // detalle en una ventana emergente (no un toast, que desaparece en
    // 2.6s y no da tiempo de leer un mensaje tecnico largo), para no
    // volver a perder la pista de que fue lo que realmente fallo.
    if(!ok){
      openModal(`
        <h3>No se pudo sincronizar</h3>
        <p style="font-size:13px;margin-bottom:6px;">Tu información local sigue intacta — nada se perdió.</p>
        <p style="font-size:12px;color:var(--text-mute);">${LOAD_ERROR || 'Motivo desconocido.'}</p>
        <div class="modal-actions" style="margin-top:16px;"><div class="btn primary block" onclick="closeModal()">Entendido</div></div>`);
      return;
    }
    // Ciclo 2 / Ronda 9 — bug encontrado: loadData() SI traia la
    // configuracion regional actualizada (guardada desde otro
    // dispositivo) dentro de DATA.config, pero nunca se volvia a aplicar
    // a CONFIG (que es lo que realmente usan formatearFecha(),
    // fmtMoney(), etc. para pintar la pantalla) — esa aplicacion solo
    // ocurria una vez, al cargar la pagina por primera vez. Por eso
    // "Sincronizar" traia el dato nuevo pero seguia mostrando el formato
    // viejo de ESE dispositivo. Se agrega la misma llamada que ya usa la
    // carga inicial.
    hidratarConfigDesdeSheet();
  }
  render();
  showToast('Sincronizado');
}

function renderTratamientosHTML(){
  return `
  <div class="toolbar">
    <input class="search" id="tratSearch" placeholder="Buscar por tratamiento, categoría o precio..." value="${SEARCH_STATE.tratamientos}">
    <div class="btn primary" id="btnAddTratamiento">+ Nuevo tratamiento</div>
  </div>
  <div class="table-card" id="tratTableBlock">
    <div class="table-scroll"><table><thead><tr>${thSort('tratamientos','Tratamiento','Nombre')}${thSort('tratamientos','Categoría','Categoria')}${thSort('tratamientos','Precio','Precio_MXN')}${thSort('tratamientos','Duración','Duracion_Min')}${thSort('tratamientos','Estado','Estado')}${thSort('tratamientos','Usuario','Usuario')}${thSort('tratamientos','Fecha actualización','Fecha_Actualizacion')}</tr></thead><tbody id="tratTbody"></tbody></table></div>
    <div id="tratPaginador"></div>
  </div>`;

function fillTratamientosTable(filter){
  const tbody = document.getElementById('tratTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = DATA.tratamientos.filter(t=>{ const blob = [t.Nombre,t.Categoria,t.Precio_MXN].join(' '); return matches(blob, f); });
  filtrados = ordenar('tratamientos', filtrados, (t,key)=> key==='Precio_MXN'||key==='Duracion_Min' ? Number(t[key]||0) : t[key]);
  const { pageItems: rows, total, totalPaginas } = paginar('tratamientos', filtrados);
  // Ciclo 2 (Grupo 2) — fila clickeable para editar; badge de estado
  // igual que Pacientes.
  tbody.innerHTML = rows.map(t=>`<tr class="clickable" data-trat="${t.ID}"><td>${t.Nombre}</td><td>${t.Categoria}</td><td>${fmtMoney(t.Precio_MXN)}</td><td>${t.Duracion_Min||30} min</td><td>${t.Estado==='Inactivo'?'<span class="badge inactive">Inactivo</span>':'<span class="badge ok">Activo</span>'}</td><td>${t.Usuario||'—'}</td><td>${formatearFechaActualizacion(t.Fecha_Actualizacion)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('[data-trat]').forEach(tr=>{ tr.addEventListener('click', ()=> abrirEdicionTratamiento(tr.dataset.trat)); });
  const pagBox = document.getElementById('tratPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('tratamientos', total, totalPaginas); attachPaginadorEvents('tratamientos', ()=>fillTratamientosTable(filter)); }
  actualizarAlturaTabla('tratTableBlock', 'tratamientos', total, 45); // Ciclo 2 / Ronda 8 — mismo ajuste que Pacientes/Gastos: se devuelve un margen de seguridad chico (+3px) sobre el alto real (42px) para evitar el bug de achicamiento, sin volver al hueco grande de antes de Ronda 7.
  refreshSortArrows('tratamientos'); attachSortHeaders('tratamientos', ()=>fillTratamientosTable(filter));
}
// Ciclo 2 (Grupo 2) — edicion de Tratamiento: Nombre, Categoria, Precio,
// Duracion, mas el toggle Activo/Inactivo. Nunca se elimina — los pagos
// y citas historicos ya quedaron protegidos con su propia fotografia
// congelada (Categoria en Pagos, Duracion_Min en Citas), asi que editar
// aqui es 100% seguro para los datos ya existentes.
function abrirEdicionTratamiento(tratId){
  const t = DATA.tratamientos.find(x=>x.ID===tratId); if(!t) return;
  let categoriaSel = t.Categoria;
  const esActivo = t.Estado!=='Inactivo';
  const original = { Nombre: t.Nombre, Categoria: t.Categoria, Precio_MXN: Number(t.Precio_MXN), Duracion_Min: Number(t.Duracion_Min||30) };
  openModal(`
    <h3>Editar tratamiento</h3>
    <div class="field" style="margin-bottom:12px;"><label>Nombre</label><input id="etNombre" value="${t.Nombre}"></div>
    <div class="field" style="margin-bottom:12px;"><label>Categoría</label><div class="picker-btn" id="etCatBtn">${categoriaSel}</div></div>
    <div class="form-grid" style="margin-bottom:16px;">
      <div class="field"><label>Precio</label><input id="etPrecio" type="text" inputmode="decimal" value="${String(t.Precio_MXN).replace('.', separadorDecimal())}"></div>
      <div class="field"><label>Duración (minutos)</label><input id="etDuracion" type="number" min="5" step="5" value="${t.Duracion_Min||30}"></div>
    </div>
    <p class="subtle" style="margin-bottom:16px;">Estado: ${esActivo?'<span style="color:var(--teal)">Activo</span>':'<span style="color:var(--text-mute)">Inactivo</span>'} <span class="subtle">— un tratamiento inactivo deja de poder elegirse para citas o pagos nuevos, pero no afecta lo que ya existe.</span></p>
    <div class="modal-actions">
      <div class="btn block" id="etToggleActivo">${esActivo?'Marcar como inactivo':'Reactivar tratamiento'}</div>
      <div class="btn primary block" id="etGuardar">Guardar</div>
    </div>
    <div class="modal-actions" style="margin-top:8px;"><div class="btn block" onclick="closeModal()">Cerrar sin guardar</div></div>`);
  attachSaneoMonto('etPrecio');
  document.getElementById('etCatBtn').addEventListener('click', ()=>{
    openCategoryPicker(categoriaSel, (cat)=>{ categoriaSel = cat; document.getElementById('etCatBtn').textContent = cat; });
  });
  document.getElementById('etToggleActivo').addEventListener('click', async ()=>{
    const nuevoEstado = esActivo ? 'Inactivo' : 'Activo';
    if(CONFIG.API_URL){
      const res = await apiCall('edit_tratamiento', { tratamientoId: t.ID, cambios: { Estado: nuevoEstado } }, ['tratamientos']);
      if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo cambiar el estado del tratamiento');
    } else { t.Estado = nuevoEstado; }
    closeModal(); showToast(esActivo?'Tratamiento marcado como inactivo':'Tratamiento reactivado'); render();
  });
  document.getElementById('etGuardar').addEventListener('click', async ()=>{
    const nombre = document.getElementById('etNombre').value.trim();
    const precio = parsearMonto(document.getElementById('etPrecio').value);
    const duracion = Number(document.getElementById('etDuracion').value)||30;
    const faltan = []; if(!nombre) faltan.push('Nombre'); if(precio<=0) faltan.push('Precio');
    if(faltan.length) return showToast('Completa: '+faltan.join(', '));
    const actual = { Nombre: nombre, Categoria: categoriaSel, Precio_MXN: precio, Duracion_Min: duracion };
    const cambios = {};
    Object.keys(actual).forEach(k=>{ if(actual[k] !== original[k]) cambios[k] = actual[k]; });
    if(Object.keys(cambios).length === 0){ showToast('Sin cambios que guardar'); closeModal(); return; }
    if(CONFIG.API_URL){
      const res = await apiCall('edit_tratamiento', { tratamientoId: t.ID, cambios }, ['tratamientos']);
      if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo actualizar el tratamiento');
    } else { Object.assign(t, cambios); }
    showToast('Tratamiento actualizado'); closeModal(); render();
  });
}
