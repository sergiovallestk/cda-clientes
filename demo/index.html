<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Dental App</title>
<style>
  :root{
    --bg:#0B1420; --panel:#101C2C; --panel-2:#0D1826; --border:#1E2E42;
    --teal:#2FD8B0; --teal-dim:#1B6E5C; --amber:#F2B84B; --red:#E86A5C;
    --text:#F1F5F4; --text-dim:#8FA1AE; --text-mute:#5B6D7A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;min-height:100vh;}
  .hamburger{display:none;position:fixed;top:16px;left:16px;z-index:120;width:38px;height:38px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);align-items:center;justify-content:center;cursor:pointer;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
  .sidebar-overlay.open{display:block;}
  .sidebar{width:220px;background:var(--panel-2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px 8px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .brand svg{color:var(--teal);}
  .brand span{font-weight:600;font-size:15px;letter-spacing:0.3px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:var(--text-dim);font-size:14px;cursor:pointer;transition:background .15s,color .15s;}
  .nav-item:hover{background:#152234;color:var(--text);}
  .nav-item.active{background:var(--teal);color:#04241C;font-weight:600;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .main{flex:1;padding:28px 32px;max-width:1550px;overflow-x:hidden;min-width:0;}
  .header{margin-bottom:22px;}
  .header h1{font-size:22px;font-weight:700;letter-spacing:0.2px;}
  .header h1 .accent{color:var(--teal);}
  .header p{color:var(--text-dim);font-size:13px;margin-top:4px;}
  .grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;}
  .row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px;}
  /* #57 — el bloque de ejemplo del CSV no tenia NINGUN estilo propio, asi
     que el navegador ignoraba los saltos de linea del texto y lo mostraba
     todo corrido en un solo parrafo. Con white-space:pre se respetan los
     saltos de linea tal cual estan escritos, y la fuente monoespaciada
     alinea las columnas como una tabla. */
  .csv-example{white-space:pre;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.7;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;margin-bottom:12px;color:var(--text-dim);}
  /* #56 — tarjetas de categoria (Ingresos/Gastos) en Finanzas: 2 columnas
     iguales por default; en movil VERTICAL se apilan a 1 columna. En
     movil horizontal se quedan igual que en escritorio (misma regla que
     usa .grid/.row2 normalmente, pero aqui por orientacion, no por ancho,
     porque un telefono en horizontal ya tiene ancho de sobra). */
  .row2-cat{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (orientation:portrait){
    .row2-cat{grid-template-columns:1fr;}
  }
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;min-width:0;overflow:hidden;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:14px;min-width:0;overflow-wrap:break-word;}
  .card-title svg{width:15px;height:15px;color:var(--teal);flex-shrink:0;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .card-head .card-title{margin-bottom:0;flex:1;min-width:120px;}
  .link-btn{font-size:11.5px;color:var(--teal);cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .link-btn:hover{text-decoration:underline;}
  .appt{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .appt:last-of-type{border-bottom:none;}
  .appt-time{width:50px;color:var(--text-mute);font-size:12px;flex-shrink:0;}
  .appt-info{flex:1;background:#132135;border-left:3px solid var(--teal);border-radius:6px;padding:8px 10px;min-width:0;overflow-wrap:break-word;}
  .appt-info b{display:block;font-size:13px;overflow-wrap:break-word;}
  .appt-info span{color:var(--text-dim);font-size:12px;}
  .appt-list{max-height:280px;overflow-y:auto;}
  .appt-actions{display:flex;gap:8px;margin-top:14px;}
  /* Ronda 2 (#16) — resalte breve al aterrizar en una cita especifica de
     la Lista desde "Ir a la lista para gestionar" del calendario. */
  .appt-resaltada .appt-info{outline:2px solid var(--teal);outline-offset:2px;transition:outline-color .3s;}
  /* Grupo 6 (Vista de calendario en Agenda) — CSS nueva y aislada, no
     reutiliza ni modifica ninguna clase de la Lista de arriba (.appt,
     .appt-info, etc). Si algo de esto se ve mal, la Lista sigue exacta. */
  .cal-switch{display:flex;gap:6px;margin-bottom:12px;background:var(--panel-2);border-radius:8px;padding:3px;width:fit-content;}
  .cal-switch-btn{padding:5px 12px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--text-dim);}
  .cal-switch-btn.active{background:var(--teal-dim);color:var(--text);}
  /* Ronda 2 (#19) — el header (flechas/fecha/Hoy + el aviso reservado de
     "sin citas", #8) se vuelve pegajoso dentro del scroll de #agendaCitasList,
     para no tener que subir hasta arriba para navegar de dia. Necesita
     fondo solido (mismo color que .card) para que la rejilla no se
     transparente por debajo al hacer scroll. */
  .cal-header-sticky{position:sticky;top:0;z-index:3;background:var(--panel);padding-bottom:6px;}
  .cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:0;padding:0 16px;}
  /* Ronda 3 (#20) — centrado entre las flechas ‹ › (flex:1 ya limitaba su
     espacio a esa zona; solo faltaba el text-align). */
  .cal-fecha-actual{font-weight:600;font-size:13px;flex:1;text-transform:capitalize;text-align:center;}
  /* Ronda 2 (#8) — espacio siempre reservado (por eso no usa display:none,
     sino visibility:hidden desde el JS) para que la rejilla no salte de
     tamaño segun haya o no citas ese dia. Ronda 3: centrado (#8). */
  .cal-sin-citas{height:18px;line-height:18px;font-size:12px;color:var(--text-mute);margin-top:6px;text-align:center;}
  .cal-dia-grid{position:relative;margin:12px 10px 0 0;border:1px solid var(--border);border-radius:10px;background:var(--panel);}
  .cal-hora-linea{position:absolute;left:0;right:8px;border-top:1px solid var(--border);}
  .cal-hora-label{position:absolute;left:8px;top:-8px;font-size:10.5px;color:var(--text-mute);background:var(--panel-2);padding:0 4px;}
  /* Ronda 2 (#13/#15) — antes .cal-cita tenia left:60px;right:8px directo.
     Ahora ese hueco (60px de la columna de horas, 8px de aire a la
     derecha) lo reserva este contenedor nuevo, y cada cita adentro usa
     0-100% de ESE espacio — así calcularLayoutCitas() puede repartir
     porcentajes limpios entre columnas cuando hay citas empalmadas, sin
     tener que lidiar con los 60px/8px fijos en cada calculo. */
  .cal-citas-area{position:absolute;top:0;left:60px;right:16px;bottom:0;}
  /* Ronda 3 (#13) — el borde sutil que antes solo tenian las citas
     empalmadas ahora lo tienen TODAS: el caso reportado (una cita termina
     justo cuando empieza la siguiente) no cuenta como "empalme" para
     calcularLayoutCitas, asi que sin este borde universal se seguian
     viendo pegadas como una sola tarjeta. */
  .cal-cita{position:absolute;left:0;right:0;background:#132135;border:1px solid rgba(255,255,255,.18);border-left:3px solid var(--teal);border-radius:6px;padding:3px 8px;font-size:11.5px;overflow:hidden;cursor:pointer;}
  .cal-cita b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-cita span{display:block;color:var(--text-dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Ronda 3 (#21) — las canceladas se siguen mostrando (mismo criterio ya
     usado en la Lista), pero se excluyen del calculo de columnas de
     calcularLayoutCitas para no robarle ancho a las citas activas; se
     dibujan como "fantasma" detras de ellas (mas transparentes, sin
     borde de color, ancho completo). */
  .cal-cita-cancelada{opacity:.4;z-index:0;}
  /* Ronda 2 (#18) — franja de "hora actual", solo se dibuja en la Vista
     Dia cuando la fecha mostrada es HOY. Se actualiza sola cada minuto
     desde JS (ver iniciarTimerHoraActual), sin ninguna peticion al
     backend — solo lee la hora del propio navegador. */
  .cal-hora-actual{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:2;}
  .cal-hora-actual-punto{position:absolute;left:-3px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--red);}
  /* Grupo 6 / Ciclo 2-mod — Vista Semana. Reutiliza .cal-cita, colores,
     bordes y demas reglas ya definidas para Vista Dia (ver
     renderBloquesCitasDeUnDia) — este bloque solo agrega el layout de
     7 columnas (una por dia) y su encabezado. */
  .cal-sem-header-row{display:flex;margin-top:8px;padding-right:18px;}
  .cal-sem-gutter{width:60px;flex-shrink:0;}
  .cal-sem-col-header{flex:1;text-align:center;font-size:11px;color:var(--text-dim);line-height:1.4;padding-bottom:4px;text-transform:uppercase;}
  .cal-sem-col-header-hoy{color:var(--amber);font-weight:700;}
  .cal-sem-columnas{position:absolute;top:0;left:60px;right:8px;bottom:0;display:flex;}
  /* Ronda 15 — se probaron 2 versiones de una linea delimitadora recta en
     este borde derecho (una directo en .cal-sem-columnas, otra aparte) y
     ambas fallaban: una linea PERFECTAMENTE RECTA no puede convivir bien
     con la esquina REDONDEADA del marco de la cuadricula (border-radius)
     — ahi es donde se formaba la "cuadricula fantasma" que Sergio
     reportaba (confirmado con zoom extremo sobre una captura real). Con
     las 7 columnas ya verificadas parejas y el espacio de aire chico
     (8px), el propio borde curveado del marco ya delimita bien donde
     termina — no hace falta ninguna linea recta extra. Se quita por
     completo (ver tambien el HTML de renderCalendarioSemanaHTML, que ya
     no incluye el div .cal-sem-borde-derecho). */
  .cal-sem-col{flex:1;position:relative;border-left:1px solid var(--border);}
  .cal-sem-col-hoy{background:rgba(242,184,75,0.05);}
  .cal-sem-citas{position:absolute;top:0;left:2px;right:2px;bottom:0;}
  /* Grupo 6 / Ciclo 3 — Vista Mes. A diferencia de Dia/Semana (rejilla de
     horas con posicionamiento absoluto), Mes es una cuadricula simple de
     CSS Grid — no necesita eje de horas. Reutiliza los mismos colores por
     estado ya establecidos (ver renderCalendarioMesHTML). */
  .cal-mes-header-row{display:grid;grid-template-columns:repeat(7,1fr);margin:8px 10px 0 0;text-align:center;font-size:11px;color:var(--text-dim);text-transform:uppercase;padding-bottom:4px;}
  .cal-mes-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border);border-radius:10px;overflow:hidden;margin:12px 10px 0 0;}
  .cal-mes-celda{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:96px;padding:6px;position:relative;cursor:pointer;background:var(--panel-2);min-width:0;overflow:hidden;}
  .cal-mes-celda:hover{background:rgba(255,255,255,.03);}
  .cal-mes-celda-fuera{opacity:.35;}
  .cal-mes-celda-hoy{background:rgba(242,184,75,0.06);}
  .cal-mes-num{font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .cal-mes-num-hoy{color:var(--amber);font-weight:700;}
  .cal-mes-evento-texto{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;}
  .cal-mes-evento-mas{font-size:10px;color:var(--text-mute);margin-top:2px;}
  .cal-mes-eventos-puntos{display:none;gap:3px;flex-wrap:wrap;margin-top:2px;align-items:center;}
  .cal-mes-punto{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .cal-mes-mas-puntos{font-size:9px;color:var(--text-mute);}
  /* En movil no cabe texto legible en 7 columnas — se cambia a puntos de
     color (tocar el dia sigue llevando a Vista Dia para ver el detalle
     completo, definido asi desde la planeacion original del Grupo 6). */
  @media (max-width:900px){
    .cal-mes-eventos-texto{display:none;}
    .cal-mes-eventos-puntos{display:flex;}
    .cal-mes-celda{min-height:56px;padding:4px;}
  }
  .btn{padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);white-space:nowrap;}
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--teal);color:#04241C;border:none;}
  .btn.primary:hover{background:#3EE8C0;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}
  .btn.block{flex:1;}
  .btn.danger{color:var(--red);border-color:#3a2220;}
  .metric-value{font-size:24px;font-weight:700;margin-bottom:2px;overflow-wrap:break-word;word-break:break-word;}
  .metric-delta{font-size:12px;color:var(--teal);margin-top:8px;}
  .mini-chart-wrap{position:relative;height:110px;margin-top:6px;}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .stat-chip{flex:1;min-width:100px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .stat-chip.act{background:#12291F;}
  .stat-chip.inact{background:#241a1a;}
  .stat-chip .num{font-size:20px;font-weight:700;}
  .stat-chip.act .num{color:var(--teal);}
  .stat-chip.inact .num{color:var(--text-mute);}
  .stat-chip .lbl{font-size:11px;color:var(--text-dim);}
  .stat-big{display:flex;align-items:center;gap:12px;}
  .stat-icon{width:42px;height:42px;border-radius:10px;background:#12291F;display:flex;align-items:center;justify-content:center;color:var(--teal);flex-shrink:0;}
  .stat-num{font-size:24px;font-weight:700;}
  .stat-label{font-size:12px;color:var(--text-dim);}
  .cash-chart-wrap{position:relative;height:180px;margin-top:6px;}
  .pending-value{font-size:24px;font-weight:700;color:var(--amber);overflow-wrap:break-word;}
  .clickable-card{cursor:pointer;}
  .clickable-card:hover{border-color:var(--teal);}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut-canvas-wrap{position:relative;width:130px;height:130px;flex-shrink:0;}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-width:0;}
  .legend-item{display:flex;align-items:center;gap:8px;overflow-wrap:break-word;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;}
  .kpi-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .kpi-value{font-size:18px;font-weight:700;word-break:break-word;overflow-wrap:break-word;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .search{flex:1;min-width:160px;max-width:320px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;}
  .search::placeholder{color:var(--text-mute);}
  /* Ciclo 2 / Ronda 3 (#4 de Pagos), corregido en Ronda 4 (#10) — cada
     tabla necesita su PROPIO ancho minimo segun su cantidad real de
     columnas, no un solo valor generico. Ademas, width:100% obligaba a
     CUALQUIER tabla a estirarse a rellenar todo el contenedor
     disponible incluso en pantallas anchas donde le sobraba espacio
     (la queja original de Gastos: columna Concepto con espacios
     exagerados) — width:auto deja que la tabla mida solo lo que su
     contenido necesita, con el minimo por tabla como piso para activar
     scroll horizontal (ya preparado en .table-wrap) unicamente cuando
     de verdad hace falta, sin forzar mas ancho del necesario. */
  /* Ciclo 2 / Ronda 6 (#10 de Pagos) — se revirtio el ancho minimo
     forzado en Pacientes/Gastos/Tratamientos (habia quedado peor que
     antes: una caja angosta flotando dentro de un panel ancho). Esas 3
     tablas vuelven a llenar el 100% del contenedor, como estaban
     originalmente. SOLO Pagos conserva su ancho minimo — es la unica
     con suficientes columnas (9) para de verdad necesitar scroll
     horizontal en pantallas normales. */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  #pagTableBlock table{width:100%;min-width:1250px;}
  /* Ciclo 2 / Ronda 8 — igual que Pagos, pero con min-width mucho mas
     moderado: la meta aqui no es imitar el ancho de Pagos (9 columnas,
     necesita scroll amplio) sino solo evitar que el texto se parta en
     2-3 renglones en movil (nombres largos, fechas con guion). Estos 3
     valores se calcularon sumando un ancho comodo por columna segun su
     contenido tipico, dejando en movil un scroll horizontal chico —
     visible pero no exagerado. Punto de partida para ajustar si Sergio
     ve que falta o sobra. */
  /* Ciclo 2 / Ronda 9 — corregido de "width:auto" a "width:100%": con
     auto, la tabla solo ocupaba lo que su contenido necesitaba y el
     min-width quedaba como piso unicamente para pantallas angostas — en
     PC, donde el contenedor es mas ancho que ese piso, la tabla se veia
     "incompleta" (hueco vacio a la derecha). Con width:100%, la tabla
     llena el contenedor en PC igual que antes de Ronda 8, y el
     min-width sigue actuando como piso en movil para evitar texto
     amontonado. Gastos ademas subio su min-width (550->620) para darle
     mas aire a la columna Concepto tras el ajuste de nowrap de abajo. */
  #pacTableBlock table{width:100%;min-width:820px;}
  #tratTableBlock table{width:100%;min-width:650px;}
  #gastoTableBlock table{width:100%;min-width:620px;}
  /* Ciclo 2 / Ronda 9 — en Gastos, las fechas (con guion, ej. "24-Ago-
     2026") se seguian partiendo en varios renglones en movil pese al
     min-width: el guion es un punto de corte valido para el navegador,
     y el layout automatico de la tabla le podia quitar espacio a esta
     columna para dárselo a Concepto. Se fuerza nowrap en las 3 columnas
     de dato corto (Fecha, Categoria, Monto) — solo Concepto, que es la
     unica con texto realmente largo, puede partirse si de plano no cabe. */
  #gastoTableBlock td:nth-child(1), #gastoTableBlock td:nth-child(3), #gastoTableBlock td:nth-child(4){white-space:nowrap;}
  thead th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  /* Ciclo 2 / Ronda 4 (#4 de Pagos) — altura MINIMA (no fija) por celda,
     para eliminar variaciones de contenido sin arriesgar que el texto se
     recorte si alguien usa un tamaño de letra mas grande (accesibilidad):
     si el contenido necesita mas espacio, la fila crece; nunca se fuerza
     a un valor exacto que pueda quedar corto. Se investigo forzar un
     valor fijo (incluso exagerado, 100px) para intentar eliminar un
     residuo de 1px entre filas — el residuo persistio igual, confirmando
     que es un detalle de redondeo de bordes del navegador entre filas
     consecutivas de una tabla HTML, no algo que el CSS pueda controlar.
     Se abandono ese camino (min-height sigue siendo lo correcto). */
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);min-height:53px;box-sizing:border-box;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr:hover{background:#132135;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.ok{background:#12291F;color:var(--teal);}
  .badge.pend{background:#2A2412;color:var(--amber);}
  .badge.cancel{background:#2A1614;color:var(--red);}
  .badge.inactive{background:#241a1a;color:var(--text-mute);}
  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px 8px;overflow-x:auto;}
  /* Ciclo 2 / Ronda 5 (#11 de Pagos) — la tabla y su paginador ahora
     viven dentro de un mismo contenedor visual (borde + fondo), para
     que se lean como una sola pieza en vez de 2 elementos sueltos. Solo
     la parte de adentro (.table-scroll, la tabla en si) tiene scroll
     horizontal — el paginador se queda siempre fijo, fuera de esa zona
     que se desplaza. */
  /* Ciclo 2 / Ronda 6 — display:flex + margin-top:auto en el paginador:
     sin esto, cuando una pagina tiene menos filas que otra (ej. la
     ultima pagina), el paginador quedaba pegado justo despues de la
     tabla, mas arriba dentro del espacio reservado, en vez de siempre
     en el fondo — eso hacia que su posicion en pantalla brincara al
     cambiar de pagina (mismo bug que ya se habia resuelto en el Ciclo 1
     con este mismo mecanismo, perdido sin querer al reestructurar para
     unificar tabla+paginador visualmente). */
  .table-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px 8px 8px;display:flex;flex-direction:column;}
  .table-card > div[id$="Paginador"]{margin-top:auto;}
  .table-scroll{overflow-x:auto;}
  /* Ciclo 2 / Ronda 6 — se quito el border-top de aqui: la ultima fila
     de la tabla ya trae su propio border-bottom, asi que con los 2
     bordes pegados se veian 2 rayas en vez de una sola division limpia.
     margin-top:auto ya quedo definido arriba, junto con el flex del
     contenedor padre — aqui solo el relleno interno que le da aire. */
  .table-card > div[id$="Paginador"]{padding-top:8px;}
  /* #64 (corregido de nuevo) — reservar altura minima en el contenedor NO
     ancla el paginador al fondo por si solo — el espacio de mas queda
     despues del paginador, no entre la tabla y el, asi que el paginador
     seguia "subiendo" en paginas con menos filas. Con flex-column +
     margin-top:auto en el paginador, este queda pegado al fondo siempre,
     sin importar cuantas filas haya arriba. */
  /* Ciclo 2 / Ronda 4 (#11 de Pagos) — el paginador ya NO vive dentro del
     contenedor con scroll horizontal (antes se desplazaba junto con la
     tabla, obligando a regresar hasta el principio solo para cambiar de
     pagina — muy incomodo en movil). Ahora es un hermano fuera de ese
     contenedor, siempre visible sin necesidad de scroll. */
  div[id$="Paginador"]{margin-top:8px;}

  .collapsible .coll-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px;margin-bottom:10px;}
  /* #69 — sin esto, una seccion colapsable pegaba directo con la siguiente (ej. "Gastos fijos" quedaba justo donde terminara la tabla de Pagos, sea cual fuera su alto, sin ninguna separacion visual entre ambas). Se agrega margen solo entre colapsables consecutivos (no antes del primero, que ya tiene su propio espacio con las graficas de arriba). */
  .collapsible + .collapsible{margin-top:20px;}
  .collapsible .coll-header b{font-size:13px;}
  .coll-chevron{transition:transform .15s;color:var(--teal);flex-shrink:0;}
  .collapsible.collapsed .coll-chevron{transform:rotate(-90deg);}
  .collapsible.collapsed .coll-body{display:none;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--text-dim);}
  .field input:not([type="checkbox"]),.field select{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;width:100%;}
  .field input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;accent-color:var(--teal);margin:0;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);}
  .field input[readonly]{color:var(--text-dim);background:#0a1420;cursor:not-allowed;}
  .picker-btn{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text-dim);font-size:13px;cursor:pointer;text-align:left;}
  .picker-btn:hover{border-color:var(--teal);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{background:#12291F;color:var(--teal);font-size:11.5px;padding:4px 9px;border-radius:20px;}

  /* #10 (correccion 2) — el fix anterior solo toco el max-height del
     .modal (la caja de adentro), pero el problema real estaba un nivel
     arriba: .modal-overlay usaba "inset:0" en un elemento position:fixed,
     que en moviles se mide contra la altura MAXIMA teorica de la
     pantalla (como si la barra de direcciones ya estuviera oculta). El
     modal se centra verticalmente DENTRO de este overlay
     (align-items:center) — si el overlay esta calculado mas alto de lo
     que en verdad se ve, el centrado empuja el modal hacia abajo, fuera
     de la pantalla, sin importar que tan corto sea el modal por dentro.
     Se reemplaza "inset:0" por bordes explicitos + height:100vh con
     height:100dvh de respaldo (mismo truco de cascada que ya se uso en
     .modal: los navegadores sin soporte para dvh ignoran esa linea y se
     quedan con vh; los que si soportan, usan dvh por ser la ultima
     declaracion valida). Verificado con Playwright: el overlay ya mide
     exactamente window.innerHeight en distintos tamanos de viewport, y
     el modal queda completamente visible en ambos casos probados. */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:150;padding:16px;}
  .modal-overlay.open{display:flex;}
  /* Fase 2 (usuarios/login) — por encima de cualquier modal normal
     (z-index:150 de .modal-overlay). loginScreen ademas por encima del
     aviso de sesion (si el aviso llegara a dispararse justo cuando ya se
     esta mostrando login, login gana). */
  /* #74b (reporte del 30/08) — fondo SOLIDO (no translucido como los
     modales normales) para que el placeholder "Cargando informacion..."
     de #content no se alcance a ver de fondo mientras no hay sesion
     iniciada. Los modales normales SI quieren mostrar el dashboard
     detrás, atenuado — estas 2 pantallas, a proposito, no. */
  #loginScreen{z-index:600;background:var(--bg);}
  #sessionWarningOverlay{z-index:500;}
  /* #74e (reporte del 30/08) — titulo, subtitulo y mensajes de error de
     estas 2 pantallas centrados; los campos del formulario (etiqueta +
     input) quedan a la izquierda por legibilidad, como cualquier
     formulario normal. */
  #loginBody{text-align:center;}
  #loginBody .field{text-align:left;}
  /* #10 (auditoria arquitectonica) — la unidad "vh" en moviles (Chrome/
     Safari) se calcula contra la altura MAXIMA posible de la pantalla,
     como si la barra de direcciones ya estuviera oculta — pero justo al
     abrir la pagina por primera vez esa barra todavia esta visible
     ocupando espacio real, asi que el modal se calculaba mas alto de lo
     que en verdad cabia, cortando el contenido de mas abajo (el boton
     "Cerrar") hasta que el usuario hacia scroll y el navegador ocultaba
     la barra. "dvh" (dynamic viewport height) se ajusta en tiempo real
     al espacio visible de verdad — se declara DESPUES de "vh" en la
     misma regla a proposito: los navegadores que no soportan "dvh"
     ignoran esa linea y se quedan con el valor "vh" de respaldo; los que
     si la soportan, usan "dvh" por ser la ultima declaracion valida. */
  .modal{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;width:460px;max-width:100%;max-height:95vh;overflow-y:auto;}
  /* #74g (reporte del 30/08) — X de cierre para el modal de "Mi cuenta":
     REEMPLAZA el boton inferior "Cerrar" (no coexisten) para no tener 2
     formas de "salir sin hacer nada" compitiendo visualmente con las
     acciones reales (Cambiar contraseña / Cerrar sesion). */
  .modal-close-x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-mute);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;}
  .modal-close-x:hover{color:var(--text);}
  .modal.wide{width:640px;}
  .modal h3{font-size:16px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  /* #74i (reporte del 30/08) — z-index subido de 160 a 800: mismo tipo de
     bug que .blocking-mask (#8, ronda anterior). El toast SI se disparaba
     (ej. "Completa usuario y contraseña" al dar clic en Entrar sin datos)
     pero quedaba tapado detras de #loginScreen (600) y #sessionWarningOverlay
     (500), dando la impresion de que no habia pasado nada. El toast debe
     verse SIEMPRE, sin importar que otra cosa este abierta. */
  .toast{position:fixed;bottom:24px;right:24px;left:24px;background:var(--teal);color:#04241C;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:800;text-align:center;}
  .toast.show{display:block;}
  .empty{color:var(--text-mute);font-size:13px;padding:24px;text-align:center;}
  .config-card{max-width:560px;}
  .picker-search{margin-bottom:10px;}
  .picker-list-wrap{position:relative;}
  .picker-list-wrap.scroll-more::after{content:'';position:absolute;left:0;right:6px;bottom:0;height:26px;background:linear-gradient(to bottom, rgba(16,28,44,0), var(--panel) 80%);pointer-events:none;border-radius:0 0 10px 10px;}
  .picker-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .picker-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  /* Ciclo 2 (Grupo 2) — renglon de categoria con iconos de editar/eliminar
     al lado, usado en los selectores de categoria de tratamiento y gasto. */
  .picker-item-row{display:flex;align-items:center;}
  .cat-icon{cursor:pointer;padding:6px 8px;font-size:13px;color:var(--text-dim);border-radius:6px;}
  .cat-icon:hover{background:var(--border);}
  .picker-item:hover{background:#132135;}
  /* #74b (reporte del 30/08) — z-index subido de 200 a 700: antes
     quedaba TAPADA por completo detras de #loginScreen (600), asi que
     showMask() durante el login (ej. "Verificando...") no se alcanzaba
     a ver nunca, dando la impresion de que no habia pasado nada al dar
     clic en "Entrar". Esta mascara debe ser SIEMPRE lo mas alto en
     pantalla, sin importar que otra cosa este abierta, porque su
     proposito es bloquear cualquier interaccion mientras algo carga. */
  .blocking-mask{position:fixed;inset:0;background:rgba(11,20,32,.72);z-index:700;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  .blocking-mask.show{display:flex;}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .blocking-mask span{font-size:13px;color:var(--text-dim);}
  .picker-item input{width:16px;height:16px;accent-color:var(--teal);flex-shrink:0;}
  .subtle{color:var(--text-mute);font-size:11.5px;}
  .divider{border-top:1px solid var(--border);margin:16px 0;}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .summary-row span:first-child{color:var(--text-dim);}
  .pend-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .pend-row.clickable{cursor:pointer;}
  .pend-row.clickable:hover{background:#12203099;}
  /* #62/#63 — alto minimo fijo (5 filas) para que la ventana de detalle no
     "brinque" de tamaño entre categorias con pocos y muchos registros. */
  .detail-block-fixed{min-height:220px;}
  /* #64 — envuelve tabla+paginador en un solo bloque con el mismo fondo
     de tarjeta que ya usa el resto del sistema, para que el espacio de
     mas que queda cuando la ultima pagina trae menos registros se sienta
     parte del mismo componente, no un hueco suelto. */
  /* #64 (corregido) — antes .table-block envolvia a .table-wrap, que YA
     tenia su propio fondo de tarjeta — quedaban 2 paneles anidados, y la
     altura minima en el de afuera dejaba un hueco muerto entre la tabla
     (adentro) y el paginador, en vez de estirar el panel visible completo.
     Ahora la altura minima se aplica directo sobre .table-wrap, que ya
     incluye tabla + paginador como un solo panel. */
  .pend-row .btn{flex-shrink:0;}

  .day-block{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .day-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .day-block-head b{font-size:13px;}
  .turno-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px;}
  .turno-row input{padding:7px 9px;font-size:12.5px;}
  .icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .add-turno{font-size:12px;color:var(--teal);cursor:pointer;font-weight:600;}

  .referral-teaser{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;margin-top:16px;}
  .referral-teaser:hover{border-color:var(--teal);color:var(--text);}
  .referral-teaser svg{color:var(--teal);flex-shrink:0;}
  .referral-code-box{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;}
  .referral-code-box b{font-size:16px;letter-spacing:0.5px;color:var(--teal);}
  .referral-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
  .referral-stat{background:var(--panel-2);border-radius:10px;padding:10px;text-align:center;}
  .referral-stat .num{font-size:18px;font-weight:700;}
  .referral-stat .lbl{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .referral-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
  .referral-row:last-child{border-bottom:none;}

  /* scrollbars visibles */
  .chart-tooltip{position:fixed;pointer-events:none;background:#0B1420;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--text);z-index:9999;opacity:0;transition:opacity .18s ease,left .12s ease,top .12s ease;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .chart-tooltip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .chart-tooltip b{display:block;margin-bottom:2px;}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--text);}
  .sort-arrow{margin-left:4px;opacity:.7;font-size:10px;}
  .paginador{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 4px 2px;}
  .paginador-controles{display:flex;align-items:center;gap:8px;}
  .paginador select.pag-size{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12.5px;}
  .modal, .picker-list, .appt-list, .table-wrap, .table-scroll, #horarioRows{ scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .modal::-webkit-scrollbar, .picker-list::-webkit-scrollbar, .appt-list::-webkit-scrollbar, .table-wrap::-webkit-scrollbar, .table-scroll::-webkit-scrollbar{ width:7px; height:7px; }
  .modal::-webkit-scrollbar-thumb, .picker-list::-webkit-scrollbar-thumb, .appt-list::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb, .table-scroll::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .modal::-webkit-scrollbar-track, .picker-list::-webkit-scrollbar-track, .appt-list::-webkit-scrollbar-track, .table-wrap::-webkit-scrollbar-track, .table-scroll::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:900px){
    .hamburger{display:flex;}
    /* #11 (auditoria arquitectonica) — el menu lateral usaba height:100vh
       sin scroll propio. En vertical nunca se notaba (100vh alcanza de
       sobra para todas las opciones), pero en horizontal 100vh es mucho
       mas bajo (el celular acostado tiene mucha menos altura), asi que
       el menu no alcanzaba a mostrar todas sus opciones — y como no
       tenia scroll propio, el gesto de deslizar sobre el se le pasaba de
       largo a la pagina de atras (el Dashboard), que si tiene su propio
       scroll. overflow-y:auto le da scroll propio cuando su contenido no
       cabe (solo pasa en horizontal); -webkit-overflow-scrolling:touch
       mejora el desplazamiento tactil en iOS. */
    /* #11 (correccion 2) — mismo problema de raiz que #10: height:100vh
       en un elemento position:fixed se mide contra la altura MAXIMA
       teorica en moviles, no la real, asi que el area scrolleable
       calculada tenia espacio de mas — de ahi que hiciera falta un
       primer gesto de scroll para que el navegador "se asentara" antes
       de que el verdadero limite fuera alcanzable. Se agrega
       height:100dvh de respaldo (mismo truco de cascada). Verificado con
       Playwright: forzando un desborde de 16px, un solo scrollTop directo
       llega exacto al fondo, sin necesitar un segundo gesto. */
    .sidebar{position:fixed;top:0;left:0;height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(-100%);transition:transform .2s ease;z-index:100;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:64px 14px 28px;max-width:100%;}
    .grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    .donut-wrap{flex-direction:column;align-items:center;text-align:center;}
    .turno-row{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:380px){
    .metric-value{font-size:20px;}
    .stat-num{font-size:20px;}
    .pending-value{font-size:20px;}
  }
  @media (min-width:901px) and (max-width:1180px){
    .grid{grid-template-columns:1fr 1fr;}
    .row2{grid-template-columns:1fr;}
  }
  /* Ciclo 3 — el salto de linea forzado en la leyenda de colores del
     calendario (Ronda 3, por legibilidad en pantallas angostas) ya no
     hace falta en PC ahora que el sistema usa casi todo el ancho de la
     pantalla — se oculta el <br> arriba de 900px (mismo punto de quiebre
     que ya usa el resto del sistema para distinguir movil de PC).
     Ronda 11 — tambien se oculta en movil en horizontal (orientation:
     landscape): ahi tambien sobra ancho de sobra para verlo en una sola
     linea, aunque el ancho total siga por debajo de 900px. Solo se
     mantiene forzado el salto de linea en movil VERTICAL, que es el
     unico caso realmente angosto. */
  @media (min-width:901px), (orientation:landscape) and (min-width:600px){
    .leyenda-salto{display:none;}
  }
</style>
</head>

  <!-- #74f (reporte del 30/08) — "Mi cuenta" al final del menu, separado
       de las pestañas de trabajo (Dashboard/Pacientes/etc), igual que

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
Chart.defaults.color = '#8FA1AE';
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbxxNt2px1OUFy_32kGPnba8h-dykcQw-84nLVTisOVbb6ZMvFcOX1VdNCfobrAovoArOA/exec", CLIENT_ID: "DEMO", CURRENCY: "MXN", DIAS_SIN_VISITA: 60, PHONE_COUNTRY: "MX", ZONA_HORARIA: "America/Mexico_City", FORMATO_HORA: "24h", FORMATO_FECHA: "iso", SEPARADOR: "es-MX", DECIMALES_PRECIO: false, PRIMER_DIA_SEMANA: "lunes" };
const CURRENCIES = {
  MXN:{symbol:'$',nombre:'Peso mexicano'}, USD:{symbol:'$',nombre:'Dólar estadounidense'},
  COP:{symbol:'$',nombre:'Peso colombiano'}, EUR:{symbol:'€',nombre:'Euro'},
  ARS:{symbol:'$',nombre:'Peso argentino'}, PEN:{symbol:'S/',nombre:'Sol peruano'},
  GTQ:{symbol:'Q',nombre:'Quetzal guatemalteco'},
};
/* #71 — catalogo pais -> prefijo y longitud de telefono, mismo patron
   que CURRENCIES: el usuario solo elige el pais (como ya hace con la
   moneda), y el sistema toma prefijo y longitud del catalogo — sin
   pedirle que capture la longitud a mano (esa parte no cambia seguido
   por pais, y un campo libre solo invita a errores de captura). */
const PHONE_COUNTRIES = {
  MX:{nombre:'México', prefijo:'52', longitud:10}, US:{nombre:'Estados Unidos', prefijo:'1', longitud:10},
  CO:{nombre:'Colombia', prefijo:'57', longitud:10}, ES:{nombre:'España', prefijo:'34', longitud:9},
  AR:{nombre:'Argentina', prefijo:'54', longitud:10}, PE:{nombre:'Perú', prefijo:'51', longitud:9},
  GT:{nombre:'Guatemala', prefijo:'502', longitud:8},
};
function telefonoInfo(){ return PHONE_COUNTRIES[CONFIG.PHONE_COUNTRY] || PHONE_COUNTRIES.MX; }
// Ronda 11 (01/09) — zonas horarias agrupadas por pais, para el campo
// "Zona horaria" de Configuracion. Varios paises de la lista de arriba
// (Mexico, Estados Unidos, España) tienen mas de una zona horaria real
// dentro de su propio territorio — por eso esto NO es un simple mapa
// pais->zona como PHONE_COUNTRIES, sino pais->lista de opciones. Los
// paises con una sola zona (Colombia, Argentina, Peru, Guatemala) solo
// traen 1 elemento en su lista. Usado para nowFechaActualizacion() del
// lado del servidor (Code.gs lee el mismo identificador IANA desde
// Config) — todas las claves "value" deben ser nombres de zona horaria
// IANA validos (los que entiende Utilities.formatDate en Apps Script).
const TIMEZONES = {
  MX:{nombre:'México', zonas:[
    {value:'America/Mexico_City', label:'Centro (CDMX, Michoacán, Jalisco y la mayoría del país)'},
    {value:'America/Mazatlan', label:'Pacífico (Sinaloa, Nayarit, Baja California Sur, Sonora)'},
    {value:'America/Tijuana', label:'Noroeste (Baja California)'},
    {value:'America/Cancun', label:'Sureste (Quintana Roo)'},
  ]},
  US:{nombre:'Estados Unidos', zonas:[
    {value:'America/New_York', label:'Este (Nueva York, Florida)'},
    {value:'America/Chicago', label:'Central (Texas, Illinois)'},
    {value:'America/Denver', label:'Montaña (Colorado, Utah)'},
    {value:'America/Phoenix', label:'Arizona (sin horario de verano)'},
    {value:'America/Los_Angeles', label:'Pacífico (California, Washington)'},
    {value:'America/Anchorage', label:'Alaska'},
    {value:'Pacific/Honolulu', label:'Hawái'},
  ]},
  CO:{nombre:'Colombia', zonas:[{value:'America/Bogota', label:'Colombia'}]},
  ES:{nombre:'España', zonas:[
    {value:'Europe/Madrid', label:'Peninsular y Baleares'},
    {value:'Atlantic/Canary', label:'Canarias'},
  ]},
  AR:{nombre:'Argentina', zonas:[{value:'America/Argentina/Buenos_Aires', label:'Argentina'}]},
  PE:{nombre:'Perú', zonas:[{value:'America/Lima', label:'Perú'}]},
  GT:{nombre:'Guatemala', zonas:[{value:'America/Guatemala', label:'Guatemala'}]},
};
const DIAS_ORDEN = ["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado","Domingo"];
const DEMO_DATA = {"pacientes": [], "tratamientos": [], "citas": [], "pagos": [], "gastos": [], "categorias_tratamiento": [], "categorias_gasto": [], "horario": [], "config": [], "referidos": [], "usuarios": [], "comisionMoneda": "MXN", "comisionMonto": 300};
let DATA = JSON.parse(JSON.stringify(DEMO_DATA));
let ACTIVE_TAB = 'dashboard';

let LOAD_ERROR = null;
function emptyShell(){
  return { pacientes:[], tratamientos:[], citas:[], pagos:[], gastos:[], categorias_tratamiento:[], categorias_gasto:[], horario:[], config:[], referidos:[], usuarios:[], comisionMoneda:'MXN', comisionMonto:300 };
}
/* ==================== Fase 2 (Grupo 3) — Sesion / Login ====================
 * Apps Script no tiene sesion nativa — el token que regresa login() se
 * guarda en localStorage del navegador y se manda en CADA peticion futura
 * (GET y POST). "renovadaEn" + "duracionSegundos" permiten calcular, al
 * recargar la pagina con una sesion ya guardada, cuanto tiempo le queda
 * de verdad sin tener que preguntarle al servidor (CacheService no
 * expone su tiempo restante) — es una estimacion conservadora del lado
 * del navegador, el servidor sigue siendo la autoridad final: si esta
 * estimacion se equivoca por poco, la siguiente peticion real
 * simplemente regresa "session_invalid" y se maneja igual que cualquier
 * expiracion real.
 * En modo DEMO (sin CONFIG.API_URL) todo este mecanismo se omite por
 * completo — decision explicita de Sergio, para no estorbarle a un
 * prospecto viendo la demo con datos falsos. */
const SESION_STORAGE_KEY = 'cda_sesion';
const SESION_AVISO_ANTES_SEGUNDOS = 120; // aviso "tu sesion esta por terminar" con este margen antes de expirar — #74j (30/08), ampliado de 60 a 120 a peticion de Sergio
let SESSION = { token:null, usuario:null, esAdmin:false, debeCambiarPassword:false, duracionSegundos:0, renovadaEn:0 };
let sessionWarningTimer = null;
let sessionExpireTimer = null;

function cargarSesionGuardada(){
  try{ const raw = localStorage.getItem(SESION_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(err){ return null; }
}
function guardarSesion(){ try{ localStorage.setItem(SESION_STORAGE_KEY, JSON.stringify(SESSION)); }catch(err){} }
function borrarSesionGuardada(){ try{ localStorage.removeItem(SESION_STORAGE_KEY); }catch(err){} }

// Se llama cada vez que el servidor confirma una sesion nueva o renovada
// (login o renovar_sesion) — reinicia el reloj de "cuanto le queda".
function fijarSesion(token, usuario, esAdmin, debeCambiarPassword, duracionSegundos){
  SESSION = { token, usuario, esAdmin, debeCambiarPassword, duracionSegundos, renovadaEn: Date.now() };
  guardarSesion();
  programarAvisoDesdeRestantes(duracionSegundos);
}

function programarAvisoDesdeRestantes(segundosRestantes){
  clearTimeout(sessionWarningTimer); clearTimeout(sessionExpireTimer);
  if(segundosRestantes <= 0){ manejarSesionInvalida(); return; }
  const avisoEnSeg = Math.max(segundosRestantes - SESION_AVISO_ANTES_SEGUNDOS, 2);
  sessionWarningTimer = setTimeout(mostrarAvisoExpiracion, avisoEnSeg*1000);
}

// Aviso tipo banco: "tu sesion esta por terminar, ¿deseas continuar?".
// Vive en su PROPIO overlay (sessionWarningOverlay), no en el modal
// normal del sistema, para no reemplazar algo que el usuario tuviera
// abierto en ese momento (ej. un formulario a medio llenar).
// #74j (30/08) — contador visible agregado: un setInterval de 1s
// actualiza el texto mientras el aviso esta abierto, puramente cosmetico
// (no cambia cuando expira de verdad — eso lo sigue controlando
// sessionExpireTimer, igual que antes). countdownInterval se limpia en
// los 3 casos en que este aviso puede terminar: "Si", "No", o que se
// agote el tiempo solo.
let sessionCountdownInterval = null;
function mostrarAvisoExpiracion(){
  let segundosRestantes = SESION_AVISO_ANTES_SEGUNDOS;
  document.getElementById('sessionWarningBody').innerHTML = `
    <h3>Tu sesión está por terminar</h3>
    <p style="font-size:13px;margin-bottom:16px;">¿Deseas continuar conectado? Se cerrará en <b id="sessionCountdownText">${segundosRestantes}</b> segundos.</p>
    <div class="modal-actions"><div class="btn block" id="btnNoExtenderSesion">No</div><div class="btn primary block" id="btnExtenderSesion">Sí, continuar</div></div>`;
  document.getElementById('sessionWarningOverlay').classList.add('open');
  clearInterval(sessionCountdownInterval);
  sessionCountdownInterval = setInterval(()=>{
    segundosRestantes--;
    const el = document.getElementById('sessionCountdownText');
    if(el) el.textContent = Math.max(segundosRestantes, 0);
    if(segundosRestantes <= 0) clearInterval(sessionCountdownInterval);
  }, 1000);
  sessionExpireTimer = setTimeout(()=>{
    clearInterval(sessionCountdownInterval);
    document.getElementById('sessionWarningOverlay').classList.remove('open');
    manejarSesionInvalida();
  }, SESION_AVISO_ANTES_SEGUNDOS*1000);
  document.getElementById('btnExtenderSesion').addEventListener('click', async ()=>{
    clearInterval(sessionCountdownInterval);
    document.getElementById('sessionWarningOverlay').classList.remove('open');
    clearTimeout(sessionExpireTimer);
    const json = await apiCall('renovar_sesion', {}, [], 'Extendiendo sesión...');
    if(json && json.ok){ fijarSesion(SESSION.token, SESSION.usuario, SESSION.esAdmin, SESSION.debeCambiarPassword, json.expiraEnSegundos); showToast('Sesión extendida'); }
    else { manejarSesionInvalida(); }
  });
  document.getElementById('btnNoExtenderSesion').addEventListener('click', ()=>{
    clearInterval(sessionCountdownInterval);
    document.getElementById('sessionWarningOverlay').classList.remove('open');
    clearTimeout(sessionExpireTimer);
    logoutUsuario();
  });
}

// Se llama en cuanto CUALQUIER peticion (GET o POST) regresa
// "session_invalid" — token vencido, borrado, o nunca existio.
// Ronda 7 (31/08) — se fuerza el Dashboard SOLO cuando la sesion termina
// de verdad (expiro sola o el usuario cerro sesion explicitamente), NUNCA
// cuando el usuario simplemente extiende su sesion desde el aviso "tipo
// banco" (fijarSesion() no llama a esto, y no debe hacerlo — si esta a
// medio registrar/editar algo, moverlo de pestaña seria contraproducente).
// Motivo: evita exponer de entrada informacion especifica (ej. el
// expediente de un paciente) a quien retome el dispositivo tras una
// sesion vencida, y evita la falsa sensacion de "seguir donde me quede"
// con datos que ya pueden estar desactualizados tras el tiempo muerto.
function forzarTabDashboardTrasLogin(){
  ACTIVE_TAB = 'dashboard';
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  const navDash = document.querySelector('.nav-item[data-tab="dashboard"]');
  if(navDash) navDash.classList.add('active');
  // Ronda 8 (31/08) — antes solo se cambiaba ACTIVE_TAB sin volver a
  // dibujar #content, asi que se seguia viendo la pestaña anterior (ej.
  // Tratamientos) por detras de la mascara de login hasta que el login
  // exitoso volvia a llamar render() por su cuenta. Se llama aqui de una
  // vez (con los datos que ya estan en memoria, aunque esten un poco
  // desactualizados) solo para que NUNCA se alcance a ver la pantalla
  // vieja — en cuanto el login real termine, el flujo normal ya trae los
  // datos frescos del servidor y vuelve a dibujar con eso.
  render();
  // Ronda 11 (01/09) — faltaba esto: render() cambia el CONTENIDO, pero
  // no reinicia la posicion del scroll. Si la pestaña anterior tenia
  // scroll recorrido (ej. Finanzas a la mitad), al volver a iniciar
  // sesion el Dashboard aparecia ya "recorrido" sin que el usuario
  // tocara nada — mismo scroll-to-top que ya usa setTab() en cambios de
  // pestaña normales, aplicado aqui tambien.
  window.scrollTo(0,0);
}

// Ronda 18 (02/09) — hideMask() centralizado aqui, en vez de depender de
// que cada quien llame a esta funcion se acuerde de ocultar la mascara
// antes. Bug real encontrado: al detectar sesion invalida DURANTE el
// arranque (loadData(), llamada desde init() al recargar la pagina con
// un token invalido/vencido), nadie llamaba hideMask() en ese camino —
// la mascara empieza visible por default en el HTML
// ("blocking-mask show") y con z-index mas alto que la pantalla de
// login, asi que se quedaba pegada tapando y bloqueando el formulario de
// login para siempre, obligando a recargar de nuevo para poder escribir.
// El camino de apiCall() (sesion invalida mientras la app ya estaba
// abierta) si llamaba hideMask() antes de esto — quedaba inconsistente
// entre los 2 caminos. Centralizarlo aqui cubre ambos y cualquier futuro
// llamador sin tener que acordarse cada vez.
function manejarSesionInvalida(mensaje){
  hideMask();
  clearTimeout(sessionWarningTimer); clearTimeout(sessionExpireTimer); clearInterval(sessionCountdownInterval);
  document.getElementById('sessionWarningOverlay').classList.remove('open');
  // Ronda 19 (02/09) — cerrar cualquier modal/selector que hubiera quedado
  // abierto a medio uso (ej. "Editar paciente" con cambios sin guardar) al
  // momento de invalidarse la sesion. Antes, forzarTabDashboardTrasLogin()
  // solo volvia a dibujar #content por detras — el modal (#modalOverlay) y
  // el selector de tratamientos (#pickerOverlay), al vivir en contenedores
  // aparte, nunca se cerraban: quedaban tapados momentaneamente por la
  // pantalla de login (z-index mas alto) y reaparecian tal cual al volver
  // a iniciar sesion, con datos potencialmente obsoletos o a medio guardar.
  // Decision de Sergio: solo se cierra esto (lo "inseguro"); los filtros de
  // vista de cada pestaña (ej. Pacientes) NO se resetean aqui a proposito,
  // se conservan como comodidad de navegacion.
  closeModal();
  closePicker();
  SESSION = { token:null, usuario:null, esAdmin:false, debeCambiarPassword:false, duracionSegundos:0, renovadaEn:0 };
  borrarSesionGuardada();
  forzarTabDashboardTrasLogin();
  mostrarPantallaLogin(mensaje || 'Tu sesión terminó. Vuelve a iniciar sesión.');
}

async function logoutUsuario(){
  clearTimeout(sessionWarningTimer); clearTimeout(sessionExpireTimer); clearInterval(sessionCountdownInterval);
  try{ await apiCall('logout', {}, [], 'Cerrando sesión...'); }catch(err){ /* si no hay conexion, se limpia igual del lado del navegador */ }
  SESSION = { token:null, usuario:null, esAdmin:false, debeCambiarPassword:false, duracionSegundos:0, renovadaEn:0 };
  borrarSesionGuardada();
  forzarTabDashboardTrasLogin();
  mostrarPantallaLogin();
}

function mostrarPantallaLogin(mensajeError){
  clearTimeout(sessionWarningTimer); clearTimeout(sessionExpireTimer);
  document.getElementById('sessionWarningOverlay').classList.remove('open');
  document.getElementById('loginScreen').classList.add('open');
  document.getElementById('loginBody').innerHTML = `
    <h3>Iniciar sesión</h3>
    <p class="subtle" style="margin-bottom:16px;">Control Dental App</p>
    ${mensajeError ? `<p style="color:var(--amber);font-size:13px;margin-bottom:12px;">${mensajeError}</p>` : ''}
    <div class="field" style="margin-bottom:12px;"><label>Usuario</label><input id="loginUsuario" autocomplete="username" maxlength="10" style="text-transform:uppercase;"></div>
    <div class="field" style="margin-bottom:18px;"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <div class="btn primary block" id="btnHacerLogin">Entrar</div>`;
  document.getElementById('loginUsuario').addEventListener('input', e=>{ e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10); });
  const intentarLogin = async ()=>{
    const usuario = document.getElementById('loginUsuario').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!usuario || !password) return showToast('Completa usuario y contraseña');
    showMask('Verificando...');
    let json;
    try{
      const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ token:null, action:'login', payload:{usuario, password} }), cache:'no-store' });
      json = await res.json();
    }catch(err){ hideMask(); mostrarPantallaLogin('No se pudo conectar. Intenta de nuevo.'); return; }
    hideMask();
    // #74c (reporte del 30/08) — "accion no reconocida" durante LOGIN es
    // un caso especial: significa que el backend contestando esa URL
    // todavia no tiene la accion "login" en su codigo — casi siempre por
    // apuntar a la URL de un deployment viejo/equivocado, o por no haber
    // publicado una Nueva version despues de pegar el Code.gs de esta
    // ronda. Se reemplaza por un mensaje que señala la causa real, en vez
    // del generico que no dice nada sobre qué hacer al respecto.
    if(json && json.error==='accion no reconocida'){
      mostrarPantallaLogin('Este backend no reconoce el inicio de sesión. Verifica que CONFIG.API_URL apunte al deployment más reciente de este cliente y que se haya publicado una Nueva versión después de actualizar Code.gs.');
      return;
    }
    if(!json || json.error){ mostrarPantallaLogin(json && json.error ? json.error : 'No se pudo iniciar sesión.'); return; }
    fijarSesion(json.token, json.usuario, json.esAdmin, json.debeCambiarPassword, json.expiraEnSegundos);
    document.getElementById('loginScreen').classList.remove('open');
    if(SESSION.debeCambiarPassword){ mostrarPantallaCambioForzado(); return; }
    showMask('Cargando información...');
    await loadData(); hidratarConfigDesdeSheet(); hideMask(); render();
  };
  document.getElementById('btnHacerLogin').addEventListener('click', intentarLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') intentarLogin(); });
}

// Pantalla de cambio OBLIGATORIO tras un reseteo de contraseña por el
// admin — sin opcion de saltarla ni de navegar a otra pestaña hasta
// completarla. No pide la contraseña "actual" (la temporal) porque el
// login que acaba de pasar ya probo esa identidad.
function mostrarPantallaCambioForzado(){
  document.getElementById('loginScreen').classList.add('open');
  document.getElementById('loginBody').innerHTML = `
    <h3>Cambia tu contraseña</h3>
    <p class="subtle" style="margin-bottom:16px;">Tu contraseña es temporal. Define una nueva antes de continuar.</p>
    <div class="field" style="margin-bottom:12px;"><label>Contraseña nueva</label><input id="cpfNueva" type="password"></div>
    <div class="field" style="margin-bottom:18px;"><label>Confirmar contraseña nueva</label><input id="cpfConfirmar" type="password"></div>
    <div class="btn primary block" id="btnGuardarCambioForzado">Guardar y continuar</div>`;
  document.getElementById('btnGuardarCambioForzado').addEventListener('click', async ()=>{
    const nueva = document.getElementById('cpfNueva').value;
    const confirmar = document.getElementById('cpfConfirmar').value;
    if(!nueva || nueva.length<4) return showToast('La contraseña debe tener al menos 4 caracteres');
    if(nueva!==confirmar) return showToast('Las contraseñas no coinciden');
    const json = await apiCall('cambiar_password', { passwordNueva: nueva }, [], 'Guardando...');
    if(!json || json.error) return showToast(json && json.error ? json.error : 'No se pudo cambiar la contraseña');
    SESSION.debeCambiarPassword = false; guardarSesion();
    document.getElementById('loginScreen').classList.remove('open');
    showMask('Cargando información...');
    await loadData(); hidratarConfigDesdeSheet(); hideMask(); render();
    showToast('Contraseña actualizada');
  });
}

/* Ciclo 1 / Ronda 3 (5c), vigente en Ronda 4 — bug real encontrado:
   antes, CUALQUIER falla al recargar (una respuesta lenta, un hipo de
   red, lo que sea) borraba TODA la informacion ya cargada y la
   reemplazaba con un cascaron vacio (emptyShell). Ahora solo se usa el
   cascaron vacio si esta es la carga INICIAL (todavia no hay nada
   cargado); si ya habia datos buenos y una recarga posterior falla (ej.
   el boton manual "Sincronizar" de Configuracion), se conservan los
   datos anteriores tal cual — el usuario sigue viendo la ultima
   informacion real conocida en vez de puros ceros. El valor de retorno
   (true/false) le permite a quien llamo avisar si hizo falta. */
async function loadData(){
  LOAD_ERROR = null;
  if(!CONFIG.API_URL){ DATA = JSON.parse(JSON.stringify(DEMO_DATA)); return; }
  const esCargaInicial = !DATA;
  try{
    // Ciclo 2 / Ronda 10 — se agrega "&_ts=" (marca de tiempo, siempre
    // distinta) y "cache:'no-store'" para que esta peticion nunca se
    // resuelva con una copia guardada por el navegador. Sin esto, una
    // URL identica a una ya pedida antes en la misma sesion (que es el
    // caso normal aqui, siempre es la misma) podia regresar una
    // respuesta vieja en vez de ir de verdad al servidor — eso hacia
    // que "Sincronizar" pareciera no traer los cambios hechos desde
    // otro dispositivo.
    const res = await fetch(CONFIG.API_URL + '?client=' + encodeURIComponent(CONFIG.CLIENT_ID) + '&token=' + encodeURIComponent(SESSION.token||'') + '&_ts=' + Date.now(), { cache:'no-store' });
    const json = await res.json();
    // Fase 2 — "session_invalid" es un valor reconocido especificamente
    // para mostrar la pantalla de login de nuevo, distinto de cualquier
    // otro error (ese SI se muestra como LOAD_ERROR normal en pantalla).
    if(json && json.error==='session_invalid'){ manejarSesionInvalida(); return false; }
    if(json && json.error){ LOAD_ERROR = json.error; if(esCargaInicial) DATA = emptyShell(); return false; }
    if(!json || !Array.isArray(json.pacientes)){ LOAD_ERROR = 'La API respondió con un formato inesperado.'; if(esCargaInicial) DATA = emptyShell(); return false; }
    DATA = json;
    if(json.sesionEsAdmin!==undefined) SESSION.esAdmin = json.sesionEsAdmin; // por si el rol cambio mientras la sesion seguia activa
    return true;
  }catch(err){
    console.error('Sin conexion a la API.', err);
    LOAD_ERROR = 'No se pudo conectar con el sistema. Puede ser un problema temporal de conexión a internet — tu información está segura, no se ha perdido nada.';
    if(esCargaInicial) DATA = emptyShell();
    return false;
  }
}

/* Toma Moneda y DiasSinVisita de la hoja Config y los aplica a CONFIG en
   memoria. Sin esto, CONFIG solo reflejaba el valor guardado en ESTA
   sesion del navegador — si guardabas Moneda hoy y recargabas la pagina
   mañana, se te olvidaba porque nunca se releia de vuelta del Sheet. */
function hidratarConfigDesdeSheet(){
  if(!Array.isArray(DATA.config)) return;
  const mapa = {}; DATA.config.forEach(c=>{ mapa[c.Clave] = c.Valor; });
  if(mapa.Moneda && CURRENCIES[mapa.Moneda]) CONFIG.CURRENCY = mapa.Moneda;
  if(mapa.DiasSinVisita) CONFIG.DIAS_SIN_VISITA = Number(mapa.DiasSinVisita) || 60;
  if(mapa.PaisTelefono && PHONE_COUNTRIES[mapa.PaisTelefono]) CONFIG.PHONE_COUNTRY = mapa.PaisTelefono; // #71
  // Ronda 11 (01/09) — Zona horaria del consultorio (para que
  // Fecha_Actualizacion se muestre en la hora del cliente, no siempre en
  // la de Mexico). Se valida contra la lista conocida de TIMEZONES antes
  // de aplicarla, por si el Sheet trajera un valor viejo/invalido.
  if(mapa.ZonaHoraria && Object.values(TIMEZONES).some(p=>p.zonas.some(z=>z.value===mapa.ZonaHoraria))) CONFIG.ZONA_HORARIA = mapa.ZonaHoraria;
  // Grupo 1 (#27/#28/#34/#35) — formato regional configurable
  if(mapa.FormatoHora==='12h' || mapa.FormatoHora==='24h') CONFIG.FORMATO_HORA = mapa.FormatoHora;
  if(['iso','iso-texto','dmy','dmy-texto'].includes(mapa.FormatoFecha)) CONFIG.FORMATO_FECHA = mapa.FormatoFecha;
  if(mapa.Separador==='es-MX' || mapa.Separador==='es-ES') CONFIG.SEPARADOR = mapa.Separador;
  if(mapa.DecimalesPrecio!==undefined) CONFIG.DECIMALES_PRECIO = (mapa.DecimalesPrecio==='true' || mapa.DecimalesPrecio===true);
  // Grupo 6 / Ciclo 2-mod (#14) — primer dia de la semana para la Vista
  // Semana del calendario. Guardado con el mismo mecanismo generico de
  // Config que ya usan los demas ajustes regionales (setConfig en
  // Code.gs crea la fila sola si no existe — no hizo falta tocar el
  // backend para este ajuste).
  if(mapa.PrimerDiaSemana==='domingo' || mapa.PrimerDiaSemana==='lunes') CONFIG.PRIMER_DIA_SEMANA = mapa.PrimerDiaSemana;
}

/* Mapa entre las claves del JSON del backend y los nombres de hoja que
   entiende doGet para la recarga parcial (?sheets=...). */
const MAPA_SYNC_KEYS = ['pacientes','tratamientos','citas','pagos','gastos','categorias_tratamiento','categorias_gasto','horario','config'];
/* Vuelve a consultar SOLO las hojas indicadas (ej. ['pacientes']) y
   reemplaza esa parte de DATA con lo que el Sheet reporta de verdad — para
   que, tras guardar, lo que se muestra sea lo que realmente quedo escrito y
   no una suposicion optimista del navegador. Es una recarga parcial (no las
   9 hojas completas) para que cada guardado no se sienta el doble de lento. */
async function syncData(keys){
  if(!CONFIG.API_URL || !keys || !keys.length) return;
  try{
    // Ciclo 2 / Ronda 10 — mismo fix que loadData(): esta es la peticion
    // que se repite CADA VEZ que se guarda algo (para confirmar lo que
    // realmente quedo escrito) y siempre con la misma URL por hoja — la
    // mas propensa a regresar una copia vieja cacheada por el
    // navegador (ej. el horario "desapareciendo" tras guardarlo).
    const res = await fetch(CONFIG.API_URL + '?client=' + encodeURIComponent(CONFIG.CLIENT_ID) + '&sheets=' + encodeURIComponent(keys.join(',')) + '&token=' + encodeURIComponent(SESSION.token||'') + '&_ts=' + Date.now(), { cache:'no-store' });
    const json = await res.json();
    if(json && json.error==='session_invalid'){ manejarSesionInvalida(); return; }
    if(json && !json.error){
      keys.forEach(k=>{ if(json[k]!==undefined) DATA[k] = json[k]; });
      if(json.referidos!==undefined) DATA.referidos = json.referidos;
      if(json.comisionMoneda!==undefined) DATA.comisionMoneda = json.comisionMoneda;
      if(json.comisionMonto!==undefined) DATA.comisionMonto = json.comisionMonto;
      if(json.usuarios!==undefined) DATA.usuarios = json.usuarios;
    }
  }catch(err){ console.error('Error al sincronizar '+keys.join(','), err); }
}

/* Escribe cualquier accion al Sheet real via Apps Script. Si se pasan
   syncKeys (ej. ['pacientes']), despues de guardar vuelve a consultar esas
   hojas y mantiene la mascara puesta hasta terminar — el flujo siempre es:
   guardar -> consultar lo real -> recien ahi mostrar y quitar mascara. En
   modo demo (sin API_URL) no hace nada y el llamador debe generar un ID
   local como respaldo. */
/* Ciclo 1 / Ronda 4 — rediseño del refresco de datos: ya no existe
   temporizador automatico en ninguna pantalla (se quito de tajo). En
   vez de eso, cada guardado ya sigue el flujo completo: mascara ->
   transaccion -> consulta SOLO la hoja tocada -> repintar TODAS las
   graficas del sistema (Dashboard + Finanzas) usando nada mas los datos
   que ya quedaron en el FE tras esa consulta puntual -> quitar mascara.
   Cero llamadas nuevas al backend solo para refrescar graficas — la
   unica forma de traer todo de nuevo es el boton manual de
   "Sincronizar con otros dispositivos" en Configuracion, para cuando de
   verdad hay alguien mas usando el sistema en otro dispositivo. */
async function apiCall(action, payload, syncKeys, maskText){
  if(!CONFIG.API_URL) return null;
  showMask(maskText || 'Guardando...');
  try{
    const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ token: SESSION.token, client:CONFIG.CLIENT_ID, action, payload }), cache:'no-store' });
    const json = await res.json();
    // Fase 2 — cualquier accion (salvo "login", que nunca llega por esta
    // funcion con token valido de todos modos) puede regresar
    // "session_invalid" si el token vencio entre que se cargo la pantalla
    // y que se dio clic en algo — se maneja igual en cualquier caso.
    if(json && json.error==='session_invalid'){ hideMask(); manejarSesionInvalida(); return json; }
    if(json && !json.error && !json.conflict && syncKeys && syncKeys.length){
      showMask('Actualizando...');
      await syncData(syncKeys);
      repintarGraficasConDatosActuales();
    }
    return json;
  }catch(err){
    // Ronda 7 (31/08) — el texto anterior ("el cambio quedo solo en este
    // dispositivo") era falso: en produccion, cuando esta funcion cae
    // aqui, NADA se guarda en ningun lado (ni Sheet ni el navegador) —
    // confundio a Sergio en pruebas reales. Se corrige a un mensaje que
    // no promete una persistencia que no existe.
    console.error('Error de API en '+action, err);
    showToast('No se pudo conectar con el servidor. Verifica tu conexión e inténtalo de nuevo — nada se guardó.');
    return null;
  }
  finally{ hideMask(); }
}

/* Grupo 1 (#34/#35) — separador de miles/decimales y decimales en
   precios, ambos configurables. El precio siempre se guarda completo en
   el Sheet (nunca se pierde el decimal); lo unico que cambia aqui es
   como se MUESTRA. toLocaleString ya sabe generar ambos formatos
   (1,234.56 vs 1.234,56) nativamente segun la region — no hay que
   programar el formato a mano. */
function fmtMoney(n){
  const c = CURRENCIES[CONFIG.CURRENCY]||CURRENCIES.MXN;
  const opciones = CONFIG.DECIMALES_PRECIO ? {minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true} : {maximumFractionDigits:0,useGrouping:true};
  return c.symbol + Number(n).toLocaleString(CONFIG.SEPARADOR||'es-MX', opciones) + ' ' + CONFIG.CURRENCY;
}
/* #57b/c — la comision de referidos se paga en una moneda propia
   (MXN/USD/EUR segun el cliente), independiente de la Moneda que ese
   mismo cliente tenga configurada para su propio sistema — por eso usa su
   propio formateador, nunca fmtMoney() (que usa CONFIG.CURRENCY). */
function fmtComision(n){ const moneda = DATA.comisionMoneda||'MXN'; const c = CURRENCIES[moneda]||CURRENCIES.MXN; return c.symbol + Math.round(n).toLocaleString(CONFIG.SEPARADOR||'es-MX') + ' ' + moneda; }
/* Grupo 1 (#27/#28) — formato de hora y fecha configurables, funciones
   centrales usadas en TODOS los lugares donde se muestra una fecha/hora
   al usuario. Las fechas siguen viajando y guardandose siempre en ISO
   (AAAA-MM-DD) por dentro del sistema — estas funciones son solo la capa
   de presentacion final. */
const MESES_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
// Ronda 3 (#20) — mes completo sin abreviar, solo para el encabezado de
// la Vista Dia del calendario (Grupo 6); el resto del sistema sigue
// usando MESES_CORTOS tal cual.
const MESES_LARGOS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function formatearFecha(fechaISO){
  // Ciclo 1 / Ronda 8 (#17) — estandarizado con el resto del sistema:
  // sin fecha se muestra '—' (mismo guion que ya usan Ultima_Visita y
  // Tratamientos), no una celda vacia. Antes esta funcion regresaba
  // cadena vacia, que fue lo que dejo a "Ultimo pago" en blanco cuando
  // deberia verse igual que los demas campos sin dato del sistema.
  if(!fechaISO || fechaISO==='—') return fechaISO||'—';
  const [y,m,d] = fechaISO.split('-');
  const mesTxt = MESES_CORTOS[Number(m)-1];
  switch(CONFIG.FORMATO_FECHA){
    case 'iso-texto': return `${y}-${mesTxt}-${d}`;
    case 'dmy': return `${d}-${m}-${y}`;
    case 'dmy-texto': return `${d}-${mesTxt}-${y}`;
    default: return `${y}-${m}-${d}`;
  }
}
/* Version compacta para tarjetas (ej. "próximas citas", Lista de
   Agenda). Ronda 16 (01/09) — antes SIEMPRE omitia el año, bajo la
   asuncion de que "ya se sabe que es el año en curso" — asuncion que
   dejo de ser cierta para la Lista de Agenda desde que existen "Ver
   historial completo" y el selector de meses de años anteriores
   (Rondas 13-15): una fecha como "27-Jun" ya es ambigua, puede ser de
   este año o de uno anterior. Ahora el año se agrega SOLO cuando la
   fecha NO es del año en curso, para no meterle ruido visual al caso
   comun (que sigue siendo la mayoria de las citas) y a la vez resolver
   la ambiguedad real cuando si hace falta. */
function formatearFechaCorta(fechaISO){
  if(!fechaISO) return '';
  const [y,m,d] = fechaISO.split('-');
  const mesTxt = MESES_CORTOS[Number(m)-1];
  const usaDMY = CONFIG.FORMATO_FECHA==='dmy' || CONFIG.FORMATO_FECHA==='dmy-texto';
  const usaTexto = CONFIG.FORMATO_FECHA==='iso-texto' || CONFIG.FORMATO_FECHA==='dmy-texto';
  const mesOut = usaTexto ? mesTxt : m;
  const base = usaDMY ? `${d}-${mesOut}` : `${mesOut}-${d}`;
  const esOtroAnio = y !== todayStr().slice(0,4);
  if(!esOtroAnio) return base;
  // Ronda 17 (01/09) — el año se agrega en la MISMA posicion que ya usa
  // formatearFecha() (version completa) segun el formato: PRIMERO para
  // ISO/ISO-texto (asi se ve un ISO real: "2025-Jun-27", no
  // "Jun-27-2025"), AL FINAL para DMY/DMY-texto ("27-Jun-2025"). Antes
  // siempre se pegaba al final sin importar el formato, lo cual rompia
  // el orden ISO cuando si se mostraba el año.
  return usaDMY ? `${base}-${y}` : `${y}-${base}`;
}
// Ronda 6 (30/08-31/08) — "Fecha_Actualizacion" es un timestamp
// combinado "YYYY-MM-DDTHH:mm" (sin segundos, decision explicita de
// Sergio). Se separa por la "T" y se reusan formatearFecha()/
// formatearHora() para respetar el formato de fecha/hora que el doctor
// ya tiene configurado, en vez de inventar un formato aparte solo para
// esta columna.
function formatearFechaActualizacion(timestamp){
  if(!timestamp) return '—';
  const [fechaParte, horaParte] = timestamp.split('T');
  return `${formatearFecha(fechaParte)} ${formatearHora(horaParte)}`;
}
function formatearHora(horaHHMM){
  if(!horaHHMM) return '';
  if(CONFIG.FORMATO_HORA==='24h') return horaHHMM;
  let [h,mi] = horaHHMM.split(':').map(Number);
  const ampm = h>=12 ? 'pm' : 'am';
  h = h%12; if(h===0) h=12;
  return `${h}:${String(mi).padStart(2,'0')} ${ampm}`;
}
/* Ciclo 1 / Ronda 1 (#2/#3) — los inputs <input type="number"> nativos
   NO dejan que JS controle que caracter usan como separador decimal: eso
   lo decide el navegador/sistema operativo del usuario, no CONFIG.SEPARADOR
   — por eso siempre forzaban punto sin importar el formato elegido en la
   app. Los 4 campos de dinero (Monto de gasto, Precio de tratamiento,
   Monto pagado, Monto del abono) pasan de type="number" a texto con
   teclado numerico (inputmode="decimal"), saneados en vivo para aceptar
   solo digitos y el separador decimal que corresponda. parsearMonto()
   convierte lo que haya escrito el usuario a un numero real de JS antes
   de usarlo o enviarlo al backend — asi Code.gs siempre recibe un numero
   de verdad, sin importar si el usuario tecleo coma o punto, y el Sheet
   (que guarda numeros puros, no texto con formato) queda bien sin
   importar el idioma/region que tenga configurado ese Sheet. */
function separadorDecimal(){ return CONFIG.SEPARADOR==='es-ES' ? ',' : '.'; }
function parsearMonto(str){
  if(str===undefined || str===null || str==='') return 0;
  const limpio = String(str).trim().replace(separadorDecimal(), '.');
  return Number(limpio) || 0;
}
function sanearInputMonto(el){
  const sep = separadorDecimal();
  let v = el.value.split('').filter(c => /\d/.test(c) || c===sep).join('');
  const idx = v.indexOf(sep);
  if(idx !== -1) v = v.slice(0, idx+1) + v.slice(idx+1).split(sep).join('');
  el.value = v;
}
/* Conecta el saneo en vivo a un input de dinero por su id; se llama una
   vez por cada campo, justo despues de insertar el modal/formulario en el
   DOM. */
function attachSaneoMonto(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=> sanearInputMonto(el));
}
function tratArr(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }
function duracionCitaMin(tratamientosStr){
  const nombres = tratArr(tratamientosStr);
  let total = 0;
  nombres.forEach(n=>{ const t = DATA.tratamientos.find(t=>t.Nombre===n); total += t && t.Duracion_Min ? Number(t.Duracion_Min) : 30; });
  return total>0 ? total : 30;
}
function normalize(s){ return (s===undefined||s===null?'':s.toString()).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function matches(text, query){ return normalize(text).includes(normalize(query)); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

let MODAL_STACK = [];
function closeModal(){ MODAL_STACK = []; document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(html, wide){ const m=document.getElementById('modalBody'); m.className = wide?'modal wide':'modal'; m.innerHTML = html; document.getElementById('modalOverlay').classList.add('open'); }
/* Guarda el contenido actual del modal para poder regresar a el mas
   adelante con volverModal() en vez de cerrar todo. onRestore (opcional)
   es una funcion que vuelve a conectar los eventos de esa vista — al
   restaurar el HTML guardado, los listeners que tenia antes ya no existen
   (se pierden al reemplazar innerHTML), asi que sin este callback los
   botones de la vista restaurada quedarian sin ninguna accion conectada. */
function pushModalState(onRestore){ const m=document.getElementById('modalBody'); MODAL_STACK.push({ html:m.innerHTML, wide:m.classList.contains('wide'), onRestore }); }
/* Regresa al modal anterior guardado con pushModalState(); si no hay
   ninguno guardado, simplemente cierra (mismo comportamiento de siempre). */
function volverModal(){
  if(!MODAL_STACK.length){ closeModal(); return; }
  const prev = MODAL_STACK.pop();
  const m = document.getElementById('modalBody');
  m.className = prev.wide?'modal wide':'modal';
  m.innerHTML = prev.html;
  if(prev.onRestore) prev.onRestore();
}

/* Señal visual (degradado) de que una lista dentro de un picker tiene mas
   contenido abajo del que cabe — el scrollbar delgado solo no siempre se
   nota, sobre todo cuando el desborde es chico. */
function refreshScrollHint(el){
  if(!el || !el.parentElement) return;
  const wrap = el.parentElement;
  const check = ()=>{ wrap.classList.toggle('scroll-more', el.scrollHeight - el.scrollTop - el.clientHeight > 4); };
  check();
  el.onscroll = check;
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Ronda 13 (01/09) — usada por el filtro por default de la Lista de
// Agenda (ver renderCitasListHTML): ventana rodante de N dias hacia
// atras desde hoy, en vez de un corte de "mes calendario" (evita que
// toda la info reciente desaparezca de golpe el dia 1 de cada mes).
function fechaHaceNDias(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* Lectura de fechas SIN pasar por conversion UTC/zona horaria — evita el bug
   clasico de que "2026-08-07" se recorra un dia segun donde este el navegador.
   Trabajamos siempre con los numeros del texto tal cual, nunca con new Date(str). */
function ymd(fechaStr){ const p = String(fechaStr||'').split('-').map(Number); return { y:p[0]||0, m:p[1]||0, d:p[2]||0 }; }
function diaDelMes(fechaStr){ return ymd(fechaStr).d; }
// Ciclo 2 / Ronda 2 (#6 de Citas) — rango exacto de dias del bloque S1-S5
// al que pertenece una fecha, para mostrarlo junto al numero de "Citas
// esta semana" y que quede claro que dias cubre exactamente (el ultimo
// bloque de cada mes se recorta al ultimo dia real del mes, no siempre
// llega a "29-31").
function rangoSemanaBloque(fechaStr){
  const f = ymd(fechaStr);
  const bloque = Math.ceil(f.d/7);
  const diaIni = (bloque-1)*7 + 1;
  const ultimoDiaMes = new Date(f.y, f.m, 0).getDate();
  const diaFin = Math.min(bloque*7, ultimoDiaMes);
  const mesTxt = MESES_CORTOS[f.m-1];
  return `${String(diaIni).padStart(2,'0')}-${mesTxt} al ${String(diaFin).padStart(2,'0')}-${mesTxt}`;
}
function esMesActual(fechaStr, ref){ const a=ymd(fechaStr); const r=ref||new Date(); return a.y===r.getFullYear() && a.m===(r.getMonth()+1); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
