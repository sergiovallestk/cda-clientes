<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dental Control Global</title>
<style>
  :root{
    --bg:#0B1420; --panel:#101C2C; --panel-2:#0D1826; --border:#1E2E42;
    --teal:#2FD8B0; --teal-dim:#1B6E5C; --amber:#F2B84B; --red:#E86A5C;
    --text:#F1F5F4; --text-dim:#8FA1AE; --text-mute:#5B6D7A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;min-height:100vh;}
  .hamburger{display:none;position:fixed;top:16px;left:16px;z-index:120;width:38px;height:38px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);align-items:center;justify-content:center;cursor:pointer;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
  .sidebar-overlay.open{display:block;}
  .sidebar{width:220px;background:var(--panel-2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px 8px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .brand svg{color:var(--teal);}
  .brand span{font-weight:600;font-size:15px;letter-spacing:0.3px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:var(--text-dim);font-size:14px;cursor:pointer;transition:background .15s,color .15s;}
  .nav-item:hover{background:#152234;color:var(--text);}
  .nav-item.active{background:var(--teal);color:#04241C;font-weight:600;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .main{flex:1;padding:28px 32px;max-width:1200px;overflow-x:hidden;min-width:0;}
  .header{margin-bottom:22px;}
  .header h1{font-size:22px;font-weight:700;letter-spacing:0.2px;}
  .header h1 .accent{color:var(--teal);}
  .header p{color:var(--text-dim);font-size:13px;margin-top:4px;}
  .grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;}
  .row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;min-width:0;overflow:hidden;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:14px;min-width:0;overflow-wrap:break-word;}
  .card-title svg{width:15px;height:15px;color:var(--teal);flex-shrink:0;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .card-head .card-title{margin-bottom:0;flex:1;min-width:120px;}
  .link-btn{font-size:11.5px;color:var(--teal);cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .link-btn:hover{text-decoration:underline;}
  .appt{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .appt:last-of-type{border-bottom:none;}
  .appt-time{width:50px;color:var(--text-mute);font-size:12px;flex-shrink:0;}
  .appt-info{flex:1;background:#132135;border-left:3px solid var(--teal);border-radius:6px;padding:8px 10px;min-width:0;overflow-wrap:break-word;}
  .appt-info b{display:block;font-size:13px;overflow-wrap:break-word;}
  .appt-info span{color:var(--text-dim);font-size:12px;}
  .appt-list{max-height:280px;overflow-y:auto;}
  .appt-actions{display:flex;gap:8px;margin-top:14px;}
  .btn{padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);white-space:nowrap;}
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--teal);color:#04241C;border:none;}
  .btn.primary:hover{background:#3EE8C0;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}
  .btn.block{flex:1;}
  .btn.danger{color:var(--red);border-color:#3a2220;}
  .metric-value{font-size:24px;font-weight:700;margin-bottom:2px;overflow-wrap:break-word;word-break:break-word;}
  .metric-delta{font-size:12px;color:var(--teal);margin-top:8px;}
  .mini-chart-wrap{position:relative;height:110px;margin-top:6px;pointer-events:none;}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .stat-chip{flex:1;min-width:100px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .stat-chip.act{background:#12291F;}
  .stat-chip.inact{background:#241a1a;}
  .stat-chip .num{font-size:20px;font-weight:700;}
  .stat-chip.act .num{color:var(--teal);}
  .stat-chip.inact .num{color:var(--text-mute);}
  .stat-chip .lbl{font-size:11px;color:var(--text-dim);}
  .stat-big{display:flex;align-items:center;gap:12px;}
  .stat-icon{width:42px;height:42px;border-radius:10px;background:#12291F;display:flex;align-items:center;justify-content:center;color:var(--teal);flex-shrink:0;}
  .stat-num{font-size:24px;font-weight:700;}
  .stat-label{font-size:12px;color:var(--text-dim);}
  .cash-chart-wrap{position:relative;height:180px;margin-top:6px;pointer-events:none;}
  .pending-value{font-size:24px;font-weight:700;color:var(--amber);overflow-wrap:break-word;}
  .clickable-card{cursor:pointer;}
  .clickable-card:hover{border-color:var(--teal);}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut-canvas-wrap{position:relative;width:110px;height:110px;flex-shrink:0;}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-width:0;}
  .legend-item{display:flex;align-items:center;gap:8px;overflow-wrap:break-word;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;}
  .kpi-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .kpi-value{font-size:18px;font-weight:700;word-break:break-word;overflow-wrap:break-word;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .search{flex:1;min-width:160px;max-width:320px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;}
  .search::placeholder{color:var(--text-mute);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);}
  tbody tr.clickable{cursor:pointer;}
  tbody tr:hover{background:#132135;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.ok{background:#12291F;color:var(--teal);}
  .badge.pend{background:#2A2412;color:var(--amber);}
  .badge.cancel{background:#2A1614;color:var(--red);}
  .badge.inactive{background:#241a1a;color:var(--text-mute);}
  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px 8px;overflow-x:auto;}

  .collapsible .coll-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px;margin-bottom:10px;}
  .collapsible .coll-header b{font-size:13px;}
  .coll-chevron{transition:transform .15s;color:var(--teal);flex-shrink:0;}
  .collapsible.collapsed .coll-chevron{transform:rotate(-90deg);}
  .collapsible.collapsed .coll-body{display:none;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--text-dim);}
  .field input,.field select{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;width:100%;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);}
  .field input[readonly]{color:var(--text-dim);background:#0a1420;cursor:not-allowed;}
  .picker-btn{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text-dim);font-size:13px;cursor:pointer;text-align:left;}
  .picker-btn:hover{border-color:var(--teal);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{background:#12291F;color:var(--teal);font-size:11.5px;padding:4px 9px;border-radius:20px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:150;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;width:460px;max-width:100%;max-height:88vh;overflow-y:auto;}
  .modal.wide{width:640px;}
  .modal h3{font-size:16px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .toast{position:fixed;bottom:24px;right:24px;left:24px;background:var(--teal);color:#04241C;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:160;text-align:center;}
  .toast.show{display:block;}
  .empty{color:var(--text-mute);font-size:13px;padding:24px;text-align:center;}
  .config-card{max-width:560px;}
  .picker-search{margin-bottom:10px;}
  .picker-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .picker-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  .picker-item:hover{background:#132135;}
  .picker-item input{width:16px;height:16px;accent-color:var(--teal);flex-shrink:0;}
  .subtle{color:var(--text-mute);font-size:11.5px;}
  .divider{border-top:1px solid var(--border);margin:16px 0;}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .summary-row span:first-child{color:var(--text-dim);}
  .pend-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .pend-row .btn{flex-shrink:0;}

  .day-block{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .day-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .day-block-head b{font-size:13px;}
  .turno-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px;}
  .turno-row input{padding:7px 9px;font-size:12.5px;}
  .icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .add-turno{font-size:12px;color:var(--teal);cursor:pointer;font-weight:600;}

  .referral-teaser{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;margin-top:16px;}
  .referral-teaser:hover{border-color:var(--teal);color:var(--text);}
  .referral-teaser svg{color:var(--teal);flex-shrink:0;}
  .referral-code-box{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;}
  .referral-code-box b{font-size:16px;letter-spacing:0.5px;color:var(--teal);}
  .referral-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .referral-stat{background:var(--panel-2);border-radius:10px;padding:10px;text-align:center;}
  .referral-stat .num{font-size:18px;font-weight:700;}
  .referral-stat .lbl{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .referral-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
  .referral-row:last-child{border-bottom:none;}

  /* scrollbars visibles */
  .modal, .picker-list, .appt-list, .table-wrap, #horarioRows{ scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .modal::-webkit-scrollbar, .picker-list::-webkit-scrollbar, .appt-list::-webkit-scrollbar, .table-wrap::-webkit-scrollbar{ width:7px; height:7px; }
  .modal::-webkit-scrollbar-thumb, .picker-list::-webkit-scrollbar-thumb, .appt-list::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .modal::-webkit-scrollbar-track, .picker-list::-webkit-scrollbar-track, .appt-list::-webkit-scrollbar-track, .table-wrap::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:900px){
    .hamburger{display:flex;}
    .sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);transition:transform .2s ease;z-index:100;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:64px 14px 28px;max-width:100%;}
    .grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    .donut-wrap{flex-direction:column;align-items:flex-start;}
    .turno-row{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:380px){
    .metric-value{font-size:20px;}
    .stat-num{font-size:20px;}
    .pending-value{font-size:20px;}
  }
  @media (min-width:901px) and (max-width:1180px){
    .grid{grid-template-columns:1fr 1fr;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="hamburger" id="hamburgerBtn">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c-3 0-5 2-5 5 0 4 1.5 6 1.5 9 0 1.5 1 2 1.5 2s1.2-.7 1.3-2c.2-1.8.5-3 1.7-3s1.5 1.2 1.7 3c.1 1.3.8 2 1.3 2s1.5-.5 1.5-2c0-3 1.5-5 1.5-9 0-3-2-5-5-5z"/></svg>
    <span>Control</span>
  </div>
  <div class="nav-item active" data-tab="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</div>
  <div class="nav-item" data-tab="pacientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/></svg>Pacientes</div>
  <div class="nav-item" data-tab="finanzas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Finanzas</div>
  <div class="nav-item" data-tab="tratamientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V9m8 12V3m8 18v-6"/></svg>Tratamientos</div>
  <div class="nav-item" data-tab="agendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</div>
  <div class="nav-item" data-tab="configuracion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.2.7.7 1.2 1.5 1.3H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Configuración</div>
</div>

<div class="main">
  <div class="header">
    <h1 id="clinicName">Dental Control <span class="accent">Global</span></h1>
    <p id="clinicSub">Dashboard gerencial · Odontología moderna · México</p>
  </div>
  <div id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="modal-overlay" id="pickerOverlay"><div class="modal" id="pickerBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
Chart.defaults.color = '#8FA1AE';
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycby2vc5fO1g4A08vLKsWTAhMBwO5HvVKqh1KkaigexC8JkGVgdTf-bl6rmMpPhSvNYRO/exec", CLIENT_ID: "YPPID", CURRENCY: "MXN", WHATSAPP_REFERIDOS: "5214431660960" };
const REFERRAL_COMMISSION = 300;
const CURRENCIES = {
  MXN:{symbol:'$',nombre:'Peso mexicano'}, USD:{symbol:'$',nombre:'Dólar estadounidense'},
  COP:{symbol:'$',nombre:'Peso colombiano'}, EUR:{symbol:'€',nombre:'Euro'},
  ARS:{symbol:'$',nombre:'Peso argentino'}, PEN:{symbol:'S/',nombre:'Sol peruano'},
  GTQ:{symbol:'Q',nombre:'Quetzal guatemalteco'},

async function loadData(){
  LOAD_ERROR = null;
  if(!CONFIG.API_URL){ DATA = JSON.parse(JSON.stringify(DEMO_DATA)); return; }
  try{
    const res = await fetch(CONFIG.API_URL + '?client=' + encodeURIComponent(CONFIG.CLIENT_ID));
    const json = await res.json();
    if(json && json.error){ LOAD_ERROR = json.error; DATA = emptyShell(); return; }

  }catch(err){
    console.error('Sin conexion a la API.', err);
    LOAD_ERROR = 'No se pudo conectar con el servidor. Revisa tu conexion a internet o la URL de la API en Configuracion.';
    DATA = emptyShell();
  }
}

/* Escribe cualquier accion al Sheet real via Apps Script. En modo demo (sin

async function apiCall(action, payload){
  if(!CONFIG.API_URL) return null;
  try{
    const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ client:CONFIG.CLIENT_ID, action, payload }) });
    return await res.json();
  }catch(err){ console.error('Error de API en '+action, err); showToast('Sin conexion — el cambio quedo solo en este dispositivo'); return null; }
}

function fmtMoney(n){ const c = CURRENCIES[CONFIG.CURRENCY]||CURRENCIES.MXN; return c.symbol + Math.round(n).toLocaleString('es-MX') + ' ' + CONFIG.CURRENCY; }
function tratArr(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }
function normalize(s){ return (s===undefined||s===null?'':s.toString()).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function matches(text, query){ return normalize(text).includes(normalize(query)); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(html, wide){ const m=document.getElementById('modalBody'); m.className = wide?'modal wide':'modal'; m.innerHTML = html; document.getElementById('modalOverlay').classList.add('open'); }
function closePicker(){ document.getElementById('pickerOverlay').classList.remove('open'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* ---------------- NAV ---------------- */
function setTab(tab){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  ACTIVE_TAB = tab; render();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
document.querySelectorAll('.nav-item').forEach(item=>{ item.addEventListener('click', ()=> setTab(item.dataset.tab)); });
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  const sb = document.getElementById('sidebar'); const ov = document.getElementById('sidebarOverlay');
  sb.classList.toggle('open'); ov.classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.getElementById('pickerOverlay').addEventListener('click', e=>{ if(e.target.id==='pickerOverlay') closePicker(); });

function renderErrorHTML(){
  return `
  <div class="card" style="max-width:540px;">
    <div class="card-title" style="color:var(--red);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>No se pudo cargar la informacion</div>
    <p style="font-size:13px;color:var(--text);margin-bottom:10px;">${LOAD_ERROR}</p>
    <p class="subtle" style="margin-bottom:16px;">Revisa la URL de la API y el ID de cliente en Configuracion — deben coincidir exactamente con lo que escribiste en la hoja "Clientes" de tu Sheet central.</p>
    <div class="btn primary" onclick="setTab('configuracion')">Ir a Configuracion</div>
  </div>`;
}
function render(){
  const c = document.getElementById('content');
  if(LOAD_ERROR && ACTIVE_TAB !== 'configuracion'){ c.innerHTML = renderErrorHTML(); return; }
  if(ACTIVE_TAB === 'dashboard') c.innerHTML = renderDashboardHTML();
  else if(ACTIVE_TAB === 'pacientes') c.innerHTML = renderPacientesHTML();
  else if(ACTIVE_TAB === 'finanzas') c.innerHTML = renderFinanzasHTML();
  else if(ACTIVE_TAB === 'tratamientos') c.innerHTML = renderTratamientosHTML();
  else if(ACTIVE_TAB === 'agendar') c.innerHTML = renderAgendarHTML();
  else if(ACTIVE_TAB === 'configuracion') c.innerHTML = renderConfiguracionHTML();
  afterRenderHooks();
}
/* Refresco automatico: cada 20s, si hay conexion a la API, vuelve a leer el
   Sheet real (para que un cambio hecho en otro dispositivo aparezca aqui) y
   siempre vuelve a pintar (para que "citas de hoy" se actualice con el reloj).
   Se salta el ciclo si hay una ventana flotante abierta, para no interrumpir
   al usuario a medio llenar un formulario. */
clearInterval(refreshTimer);
refreshTimer = setInterval(async ()=>{
  if(anyModalOpen()) return;
  if(CONFIG.API_URL) await loadData();
  render();
}, 20000);

/* ============ SELECTOR MULTIPLE DE TRATAMIENTOS ============ */
function openTreatmentPicker(preselected, onConfirm){
  const selected = new Set(preselected||[]);
  function draw(filter){
    const items = DATA.tratamientos.filter(t=>matches(t.Nombre, filter||''));
    return items.map(t=>`<label class="picker-item"><input type="checkbox" value="${t.Nombre}" ${selected.has(t.Nombre)?'checked':''}><span>${t.Nombre} <span class="subtle">· ${t.Categoria} · ${fmtMoney(t.Precio_MXN)}</span></span></label>`).join('') || '<div class="empty">Sin resultados</div>';
  }
  document.getElementById('pickerBody').innerHTML = `
    <h3>Seleccionar tratamientos</h3>
    <input class="search picker-search" style="max-width:100%;" id="pickerSearch" placeholder="Buscar tratamiento...">
    <div class="picker-list" id="pickerList">${draw('')}</div>
    <div class="modal-actions"><div class="btn block" id="pickerCancel">Cancelar</div><div class="btn primary block" id="pickerConfirm">Listo</div></div>`;
  document.getElementById('pickerOverlay').classList.add('open');
  const list = document.getElementById('pickerList');
  list.addEventListener('change', e=>{ if(e.target.matches('input[type=checkbox]')){ if(e.target.checked) selected.add(e.target.value); else selected.delete(e.target.value); } });
  document.getElementById('pickerSearch').addEventListener('input', e=>{ document.getElementById('pickerList').innerHTML = draw(e.target.value); });
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
  document.getElementById('pickerConfirm').addEventListener('click', ()=>{ closePicker(); onConfirm(Array.from(selected)); });
}

/* ============ SELECTOR UNICO DE PACIENTE ============ */
function openPatientPicker(onSelect, activeOnly){
  if(activeOnly === undefined) activeOnly = true;
  function draw(filter){
    const pool = activeOnly ? DATA.pacientes.filter(p=>p.Estado!=='Inactivo') : DATA.pacientes;
    const items = pool.filter(p=>matches(p.Nombre, filter||''));
    return items.map(p=>`<div class="picker-item" data-id="${p.ID}">${p.Nombre} <span class="subtle">· ${p.Telefono}${p.Estado==='Inactivo'?' · inactivo':''}</span></div>`).join('') || '<div class="empty">Sin resultados</div>';
  }
  document.getElementById('pickerBody').innerHTML = `
    <h3>Seleccionar paciente</h3>
    ${activeOnly ? '<p class="subtle" style="margin-bottom:10px;">Mostrando solo pacientes activos</p>' : ''}
    <input class="search picker-search" style="max-width:100%;" id="pickerSearch" placeholder="Buscar paciente...">
    <div class="picker-list" id="pickerList">${draw('')}</div>
    <div class="modal-actions"><div class="btn block" id="pickerCancel">Cancelar</div></div>`;
  document.getElementById('pickerOverlay').classList.add('open');
  const list = document.getElementById('pickerList');
  list.addEventListener('click', e=>{ const item = e.target.closest('.picker-item'); if(!item) return; const pac = DATA.pacientes.find(p=>p.ID===item.dataset.id); closePicker(); onSelect(pac); });
  document.getElementById('pickerSearch').addEventListener('input', e=>{ document.getElementById('pickerList').innerHTML = draw(e.target.value); });
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
}

/* ============ SELECTOR/CATALOGO DE CATEGORIA (agregable) ============ */
function openCategoryPicker(current, onSelect){
  function draw(filter){
    const items = DATA.categorias_tratamiento.filter(c=>matches(c.Categoria, filter||''));
    let html = items.map(c=>`<div class="picker-item" data-cat="${c.Categoria}">${c.Categoria}</div>`).join('');
    if(filter && !DATA.categorias_tratamiento.some(c=>normalize(c.Categoria)===normalize(filter))){
      html += `<div class="picker-item" style="color:var(--teal);" data-newcat="${filter}">+ Agregar "${filter}" como nueva categoria</div>`;
    }
    return html || '<div class="empty">Sin resultados</div>';
  }
  document.getElementById('pickerBody').innerHTML = `
    <h3>Categoria de tratamiento</h3>
    <input class="search picker-search" style="max-width:100%;" id="pickerSearch" placeholder="Buscar o crear categoria...">
    <div class="picker-list" id="pickerList">${draw('')}</div>
    <div class="modal-actions"><div class="btn block" id="pickerCancel">Cancelar</div></div>`;
  document.getElementById('pickerOverlay').classList.add('open');
  const list = document.getElementById('pickerList');
  list.addEventListener('click', e=>{
    const item = e.target.closest('.picker-item'); if(!item) return;
    if(item.dataset.newcat){
      DATA.categorias_tratamiento.push({Categoria:item.dataset.newcat});
      if(CONFIG.API_URL) apiCall('add_categoria', { categoria: item.dataset.newcat });
      closePicker(); onSelect(item.dataset.newcat); showToast('Categoria agregada al catalogo');
    }
    else if(item.dataset.cat){ closePicker(); onSelect(item.dataset.cat); }
  });
  document.getElementById('pickerSearch').addEventListener('input', e=>{ document.getElementById('pickerList').innerHTML = draw(e.target.value); });
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
}

/* ==================== PACIENTES ==================== */
function renderPacientesHTML(){
  return `
  <div class="toolbar">
    <input class="search" id="pacSearch" placeholder="Buscar por nombre o tratamiento...">
    <div class="btn primary" id="btnAddPaciente">+ Nuevo paciente</div>
  </div>
  <div class="table-wrap">
    <table><thead><tr><th>Paciente</th><th>Telefono</th><th>Ultima visita</th><th>Tratamientos</th><th>Estado</th><th>Saldo</th></tr></thead><tbody id="pacTbody"></tbody></table>
  </div>`;
}
function saldoPaciente(pacId){ return DATA.pagos.filter(p=>p.Paciente_ID===pacId).reduce((s,p)=>s+Number(p.Saldo),0); }
function fillPacientesTable(filter){
  const tbody = document.getElementById('pacTbody'); if(!tbody) return;
  const f = filter||'';
  const rows = DATA.pacientes.filter(p=> matches(p.Nombre,f) || matches(p.Tratamientos,f));
  tbody.innerHTML = rows.map(p=>{
    const saldo = saldoPaciente(p.ID);
    const trats = tratArr(p.Tratamientos);
    const tratLabel = trats.length===0 ? '—' : (trats.length===1 ? trats[0] : `${trats[0]} <span class="subtle">+${trats.length-1}</span>`);
    const estadoBadge = p.Estado==='Inactivo' ? `<span class="badge inactive">Inactivo</span>` : `<span class="badge ok">Activo</span>`;
    return `<tr class="clickable" data-pac="${p.ID}"><td>${p.Nombre}</td><td>${p.Telefono}</td><td>${p.Ultima_Visita}</td><td>${tratLabel}</td><td>${estadoBadge}</td><td>${saldo>0?`<span class="badge pend">${fmtMoney(saldo)}</span>`:`<span class="badge ok">Al corriente</span>`}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('tr[data-pac]').forEach(tr=>{ tr.addEventListener('click', ()=> showPacienteDetalle(tr.dataset.pac)); });
}
function showPacienteDetalle(pacId){
  const p = DATA.pacientes.find(x=>x.ID===pacId); if(!p) return;
  const trats = tratArr(p.Tratamientos);
  const saldo = saldoPaciente(pacId);
  const esActivo = p.Estado!=='Inactivo';
  openModal(`
    <h3>${p.Nombre}</h3>
    <p class="subtle" style="margin-bottom:14px;">${p.Telefono} · Ultima visita: ${p.Ultima_Visita} · ${esActivo?'<span style="color:var(--teal)">Activo</span>':'<span style="color:var(--text-mute)">Inactivo</span>'}</p>
    <div class="card-title" style="margin-bottom:8px;">Tratamientos asignados</div>
    <div class="chip-row" style="margin-bottom:16px;">${trats.map(t=>`<span class="chip">${t}</span>`).join('') || '<span class="subtle">Sin tratamientos asignados</span>'}</div>
    <div class="card-title" style="margin-bottom:8px;">Saldo</div>
    <div style="font-size:20px;font-weight:700;color:${saldo>0?'var(--amber)':'var(--teal)'}">${fmtMoney(saldo)}</div>
    <div class="modal-actions">
      <div class="btn block" id="btnToggleEstado">${esActivo?'Marcar como inactivo':'Reactivar paciente'}</div>
      <div class="btn primary block" onclick="closeModal()">Cerrar</div>
    </div>`);
  document.getElementById('btnToggleEstado').addEventListener('click', async ()=>{
    if(esActivo && saldo>0){ if(!confirm(`${p.Nombre} tiene un saldo pendiente de ${fmtMoney(saldo)}. ¿Marcarlo como inactivo de todas formas?`)) return; }
    const nuevoEstado = esActivo ? 'Inactivo' : 'Activo';
    if(CONFIG.API_URL) await apiCall('set_estado_paciente', { pacienteId: p.ID, estado: nuevoEstado });
    p.Estado = nuevoEstado;
    closeModal(); showToast(esActivo?'Paciente marcado como inactivo':'Paciente reactivado'); render();
  });
}

/* ==================== FINANZAS ==================== */
function renderFinanzasHTML(){
  const now = new Date(); const mesActual = now.getMonth(); const anioActual = now.getFullYear();
  const pagosMes = DATA.pagos.filter(p=>{ const d=new Date(p.Fecha); return d.getMonth()===mesActual && d.getFullYear()===anioActual; });
  const gastosMes = DATA.gastos.filter(g=>{ const d=new Date(g.Fecha); return d.getMonth()===mesActual && d.getFullYear()===anioActual; });
  const ingresosMes = pagosMes.reduce((s,p)=>s+Number(p.Monto_Pagado),0);
  const pendiente = DATA.pagos.reduce((s,p)=>s+Number(p.Saldo),0);
  const gastosTotal = gastosMes.reduce((s,g)=>s+Number(g.Monto),0);
  const utilidad = ingresosMes - gastosTotal;
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Ingresos del mes</div><div class="kpi-value">${fmtMoney(ingresosMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Gastos fijos del mes</div><div class="kpi-value" style="color:var(--red)">${fmtMoney(gastosTotal)}</div></div>
    <div class="kpi"><div class="kpi-label">Utilidad neta</div><div class="kpi-value" style="color:${utilidad>=0?'var(--teal)':'var(--red)'}">${fmtMoney(utilidad)}</div></div>
    <div class="kpi"><div class="kpi-label">Pendiente por cobrar</div><div class="kpi-value" style="color:var(--amber)">${fmtMoney(pendiente)}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Flujo de caja — ${meses[mesActual]} ${anioActual}</div>
    <p class="subtle" style="margin:-8px 0 10px;">S1-S5 = semanas del mes en curso (dias 1-7, 8-14, 15-21, 22-28, 29-31)</p>
    <div style="position:relative;height:200px;"><canvas id="finCashChart"></canvas></div>

function fillPagosTable(filter){
  const tbody = document.getElementById('pagosTbody'); if(!tbody) return;
  const f = filter||'';
  const rows = [...DATA.pagos].sort((a,b)=>b.Fecha.localeCompare(a.Fecha)).filter(p=>{
    const blob = [p.Fecha,p.Paciente,p.Tratamiento,p.Monto_Total,p.Monto_Pagado,p.Saldo].join(' ');
    return matches(blob, f);
  });
  tbody.innerHTML = rows.map(p=>`<tr><td>${p.Fecha}</td><td>${p.Paciente}</td><td>${p.Tratamiento}</td><td>${fmtMoney(p.Monto_Total)}</td><td>${fmtMoney(p.Monto_Pagado)}</td><td>${Number(p.Saldo)>0?`<span class="badge pend">${fmtMoney(p.Saldo)}</span>`:`<span class="badge ok">$0</span>`}</td><td>${Number(p.Saldo)>0?`<div class="btn sm" data-abonar="${p.ID}">Abonar</div>`:''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('[data-abonar]').forEach(btn=>{ btn.addEventListener('click', ()=> openAbonoModal(btn.dataset.abonar, ()=>{ fillPagosTable(document.getElementById('pagoSearch').value); })); });
}
function fillGastosTable(filter){
  const tbody = document.getElementById('gastosTbody'); if(!tbody) return;
  const f = filter||'';
  const rows = [...DATA.gastos].sort((a,b)=>b.Fecha.localeCompare(a.Fecha)).filter(g=>{ const blob = [g.Fecha,g.Concepto,g.Categoria,g.Monto].join(' '); return matches(blob, f); });
  tbody.innerHTML = rows.map(g=>`<tr><td>${g.Fecha}</td><td>${g.Concepto}</td><td>${g.Categoria}</td><td>${fmtMoney(g.Monto)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin resultados</td></tr>';
}
function openAbonoModal(pagoId, onDone){
  const pago = DATA.pagos.find(p=>p.ID===pagoId); if(!pago) return;
  openModal(`
    <h3>Registrar abono</h3>
    <p class="subtle" style="margin-bottom:14px;">${pago.Paciente} · Saldo actual: ${fmtMoney(pago.Saldo)}</p>
    <div class="field" style="margin-bottom:16px;"><label>Monto del abono</label><input id="mAbono" type="number" max="${pago.Saldo}"></div>
    <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="mGuardarAbono">Registrar</div></div>`);
  document.getElementById('mGuardarAbono').addEventListener('click', async ()=>{
    const monto = Number(document.getElementById('mAbono').value)||0;
    if(monto<=0) return showToast('Ingresa un monto valido');
    if(CONFIG.API_URL) await apiCall('add_abono', { pagoId: pago.ID, monto });
    pago.Monto_Pagado = Number(pago.Monto_Pagado) + monto;
    pago.Saldo = Number(pago.Monto_Total) - Number(pago.Monto_Pagado);
    closeModal(); showToast('Abono registrado');
    if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='finanzas') render();
    if(onDone) onDone();
  });
}
function drawFinanzasChart(){
  const el = document.getElementById('finCashChart'); if(!el) return;
  const now = new Date();
  const byWeek = {};
  DATA.pagos.forEach(p=>{ const d=new Date(p.Fecha); if(d.getMonth()!==now.getMonth()||d.getFullYear()!==now.getFullYear()) return; const w='S'+Math.ceil(d.getDate()/7); byWeek[w]=(byWeek[w]||0)+Number(p.Monto_Pagado); });
  const weeks=['S1','S2','S3','S4','S5'];
  new Chart(el,{type:'bar',data:{labels:weeks,datasets:[{data:weeks.map(w=>byWeek[w]||0),backgroundColor:'#2FD8B0',borderRadius:4,barThickness:28}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>fmtMoney(c.raw)}}},interaction:{mode:'index',intersect:false},scales:{x:{grid:{display:false},ticks:{color:'#5B6D7A'}},y:{grid:{color:'#1E2E42'},ticks:{color:'#5B6D7A',callback:v=>'$'+v}}}}});
}

        <div class="summary-row"><span>Paciente</span><span>${selectedPac.Nombre}</span></div>
        <div class="summary-row"><span>Tratamientos</span><span>${selectedTrats.join(', ')}</span></div>
        <div class="summary-row"><span>Fecha</span><span>${fecha}</span></div>
        <div class="summary-row"><span>Hora</span><span>${hora}</span></div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Corregir</div><div class="btn primary block" id="confirmCita">Confirmar y agendar</div></div>`);
      document.getElementById('confirmCita').addEventListener('click', async ()=>{
        closeModal();
        let id = 'C' + String(DATA.citas.length+1).padStart(3,'0');
        if(CONFIG.API_URL){
          const res = await apiCall('add_cita', { pacienteId:selectedPac.ID, paciente:selectedPac.Nombre, tratamientos:selectedTrats.join(', '), fecha, hora });
          if(res && res.id) id = res.id;
          showToast(res ? 'Cita creada y agregada a Google Calendar' : 'Cita guardada localmente (sin conexion)');
        } else { showToast('Cita agendada (modo demo)'); }
        DATA.citas.push({ID:id, Fecha:fecha, Hora:hora, Paciente_ID:selectedPac.ID, Paciente:selectedPac.Nombre, Tratamientos:selectedTrats.join(', '), Estado:'Confirmada'});
        render();
      });
    });

    document.getElementById('csvFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim().length>0);
        if(lines.length<2) return showToast('El archivo esta vacio');
        const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
        const iPac = headers.indexOf('paciente'), iTrat = headers.indexOf('tratamientos'), iFecha = headers.indexOf('fecha'), iHora = headers.indexOf('hora');
        if(iPac<0||iTrat<0||iFecha<0||iHora<0) return showToast('El CSV debe tener las columnas: Paciente, Tratamientos, Fecha, Hora');
        const preview = lines.slice(1).map(line=>{
          const cols = line.split(',');
          const nombre = (cols[iPac]||'').trim();
          const trats = (cols[iTrat]||'').trim().split(';').map(s=>s.trim()).filter(Boolean);
          const fecha = (cols[iFecha]||'').trim();
          const hora = (cols[iHora]||'').trim();
          const pac = DATA.pacientes.find(p=> normalize(p.Nombre)===normalize(nombre) && p.Estado!=='Inactivo');
          let error = '';
          if(!pac) error = 'Paciente no encontrado o inactivo';
          else if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) error = 'Fecha invalida (usar AAAA-MM-DD)';
          else if(!/^\d{2}:\d{2}$/.test(hora)) error = 'Hora invalida (usar HH:MM)';
          return { nombre, trats, fecha, hora, pac, error };
        });
        const validRows = preview.filter(r=>!r.error);
        openModal(`
          <h3>Vista previa de importacion (${preview.length} filas)</h3>
          <div class="table-wrap" style="max-height:320px;overflow-y:auto;margin-bottom:14px;">
            <table><thead><tr><th>Paciente</th><th>Tratamientos</th><th>Fecha</th><th>Hora</th><th>Estado</th></tr></thead>
            <tbody>${preview.map(r=>`<tr><td>${r.nombre}</td><td>${r.trats.join(', ')}</td><td>${r.fecha}</td><td>${r.hora}</td><td>${r.error?`<span class="badge cancel">${r.error}</span>`:`<span class="badge ok">OK</span>`}</td></tr>`).join('')}</tbody></table>
          </div>
          <p class="subtle" style="margin-bottom:10px;">${validRows.length} de ${preview.length} filas se importaran. Las filas con error se omiten.</p>
          <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="confirmCsv">Importar ${validRows.length} citas</div></div>`, true);
        document.getElementById('confirmCsv').addEventListener('click', async ()=>{
          for(const r of validRows){
            let id = 'C' + String(DATA.citas.length+1).padStart(3,'0');
            if(CONFIG.API_URL){
              const res = await apiCall('add_cita', { pacienteId:r.pac.ID, paciente:r.pac.Nombre, tratamientos:r.trats.join(', '), fecha:r.fecha, hora:r.hora });
              if(res && res.id) id = res.id;
            }
            DATA.citas.push({ID:id, Fecha:r.fecha, Hora:r.hora, Paciente_ID:r.pac.ID, Paciente:r.pac.Nombre, Tratamientos:r.trats.join(', '), Estado:'Confirmada'});
          }
          closeModal(); showToast(`${validRows.length} citas importadas`); render();
        });
      };
      reader.readAsText(file);
    });
  }

  if(ACTIVE_TAB === 'configuracion'){
    document.getElementById('btnGuardarConfig').addEventListener('click', async ()=>{
      CONFIG.API_URL = document.getElementById('cfgApiUrl').value.trim();
      CONFIG.CLIENT_ID = document.getElementById('cfgClientId').value.trim();
      CONFIG.CURRENCY = document.getElementById('cfgMoneda').value;
      document.getElementById('clinicName').innerHTML = document.getElementById('cfgNombre').value + ' <span class="accent"></span>';
      if(CONFIG.API_URL) await apiCall('set_config', { clave:'Moneda', valor: CONFIG.CURRENCY });
      showToast('Configuracion guardada');
      await loadData(); render();
    });
    document.getElementById('referralTeaser').addEventListener('click', showReferidosModal);
    document.querySelectorAll('.day-block').forEach(block=>{
      block.querySelector('[data-add-turno]').addEventListener('click', ()=>{
        const list = block.querySelector('.turnos-list');
        const row = document.createElement('div');
        row.className = 'turno-row';
        row.innerHTML = `<input type="time" class="hInicio" value=""><input type="time" class="hFin" value=""><div class="icon-btn" data-remove-turno><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>`;
        list.appendChild(row);
        row.querySelector('[data-remove-turno]').addEventListener('click', ()=> row.remove());
      });
      block.querySelectorAll('[data-remove-turno]').forEach(btn=>{ btn.addEventListener('click', (e)=> e.target.closest('.turno-row').remove()); });
    });
    document.getElementById('btnGuardarHorario').addEventListener('click', async ()=>{
      const nuevoHorario = [];
      document.querySelectorAll('.day-block').forEach(block=>{
        const dia = block.dataset.dia;
        const activo = block.querySelector('.hDiaActivo').checked;
        const turnos = block.querySelectorAll('.turno-row');
        if(turnos.length===0){ nuevoHorario.push({Dia:dia, Activo:false, HoraInicio:'', HoraFin:''}); }
        else{ turnos.forEach(row=>{ nuevoHorario.push({Dia:dia, Activo:activo, HoraInicio:row.querySelector('.hInicio').value, HoraFin:row.querySelector('.hFin').value}); }); }
      });
      if(CONFIG.API_URL) await apiCall('update_horario', { dias: nuevoHorario });
      DATA.horario = nuevoHorario;
      showToast('Horario guardado'); render();
    });
  }
}

function showReferidosModal(){
  const codigo = CONFIG.CLIENT_ID || 'DEMO';
  const referidos = DATA.referidos || [];
  const pendientes = referidos.filter(r=>r.Estado==='Pendiente de pago').length;
  const convertidos = referidos.filter(r=>r.Estado==='Convertido').length;
  const pagados = referidos.filter(r=>r.Estado==='Comisión pagada').length;
  const numero = CONFIG.WHATSAPP_REFERIDOS;
  const mensaje = encodeURIComponent(`Hola, uso Dental Control Global para gestionar mi consultorio y me ha funcionado muy bien. Si te interesa que te lo instalen, menciona mi código ${codigo} — código: ${codigo}`);
  const waLink = numero ? `https://wa.me/${numero}?text=${mensaje}` : null;

  const estadoColor = (e)=> e==='Comisión pagada' ? 'var(--teal)' : (e==='Convertido' ? 'var(--amber)' : 'var(--text-mute)');

  openModal(`
    <h3>Programa de referidos</h3>
    <p class="subtle" style="margin-bottom:12px;">Comparte el sistema con un colega. Cuando esa persona pague su instalación, ganas ${fmtMoney(REFERRAL_COMMISSION)}.</p>
    <div class="referral-code-box"><span class="subtle">Tu código</span><b>${codigo}</b></div>
    ${waLink ? `<a href="${waLink}" target="_blank" class="btn primary block" style="display:block;text-decoration:none;margin-bottom:14px;">Compartir por WhatsApp</a>` : `<p class="subtle" style="margin-bottom:14px;">Comparte tu código directamente con tus colegas.</p>`}
    <div class="divider"></div>
    <div class="card-title" style="margin-bottom:4px;">Tu historial</div>
    <div class="referral-stats">
      <div class="referral-stat"><div class="num" style="color:var(--text-mute);">${pendientes}</div><div class="lbl">Pendientes</div></div>
      <div class="referral-stat"><div class="num" style="color:var(--amber);">${convertidos}</div><div class="lbl">Convertidos</div></div>
      <div class="referral-stat"><div class="num" style="color:var(--teal);">${pagados}</div><div class="lbl">Comisión pagada</div></div>
    </div>
    <div style="max-height:220px;overflow-y:auto;">
      ${referidos.map(r=>`<div class="referral-row"><span>${r.NombreReferido}<br><span class="subtle">${r.Fecha}</span></span><b style="color:${estadoColor(r.Estado)};font-size:12px;">${r.Estado}</b></div>`).join('') || '<div class="empty">Aun no tienes referidos registrados</div>'}
    </div>
    <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Cerrar</div></div>`);
}

function showPendientesModal(){
  function draw(filter){
    const f = filter||'';
    const porPaciente = {};
    DATA.pagos.forEach(p=>{ if(Number(p.Saldo)>0){ if(!porPaciente[p.Paciente_ID]) porPaciente[p.Paciente_ID]=0; porPaciente[p.Paciente_ID]+=Number(p.Saldo); } });
    const rows = Object.entries(porPaciente).map(([pacId,saldo])=>{ const pac = DATA.pacientes.find(p=>p.ID===pacId); return { pacId, nombre: pac?pac.Nombre:pacId, saldo }; })
      .filter(r=> matches(r.nombre, f) || matches(String(r.saldo), f)).sort((a,b)=>b.saldo-a.saldo);
    return rows.map(r=>`<div class="pend-row"><span>${r.nombre}</span><span style="display:flex;align-items:center;gap:10px;"><b style="color:var(--amber);">${fmtMoney(r.saldo)}</b><div class="btn sm" data-abonar-pac="${r.pacId}">Abonar</div></span></div>`).join('') || '<div class="empty">Sin resultados</div>';
  }
  function attachHandlers(){
    document.querySelectorAll('[data-abonar-pac]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const pacId = btn.dataset.abonarPac;
        const pagosAbiertos = DATA.pagos.filter(p=>p.Paciente_ID===pacId && Number(p.Saldo)>0);
        const refreshPend = ()=>{ document.getElementById('pendList').innerHTML = draw(document.getElementById('pendSearch').value); attachHandlers(); };
        if(pagosAbiertos.length===1){ openAbonoModal(pagosAbiertos[0].ID, refreshPend); }
        else{
          openModal(`<h3>Elige el pago a abonar</h3>${pagosAbiertos.map(p=>`<div class="pend-row"><span>${p.Tratamiento} <span class="subtle">· ${p.Fecha}</span></span><span style="display:flex;align-items:center;gap:10px;"><b style="color:var(--amber);">${fmtMoney(p.Saldo)}</b><div class="btn sm" data-pick-pago="${p.ID}">Abonar</div></span></div>`).join('')}<div class="modal-actions"><div class="btn block" onclick="closeModal()">Cerrar</div></div>`);
          document.querySelectorAll('[data-pick-pago]').forEach(b2=>{ b2.addEventListener('click', ()=> openAbonoModal(b2.dataset.pickPago, refreshPend)); });
        }
      });
    });
  }
  openModal(`
    <h3>Pacientes con saldo pendiente</h3>
    <input class="search" style="max-width:100%;margin-bottom:12px;" id="pendSearch" placeholder="Buscar por nombre o monto...">
    <div id="pendList" style="max-height:340px;overflow-y:auto;">${draw('')}</div>
    <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Cerrar</div></div>`);
  attachHandlers();
  document.getElementById('pendSearch').addEventListener('input', e=>{ document.getElementById('pendList').innerHTML = draw(e.target.value); attachHandlers(); });
}

(async function init(){ await loadData(); render(); })();
</script>
</body>
</html>
