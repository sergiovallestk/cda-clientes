<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Dental App</title>
<style>
  :root{
    --bg:#0B1420; --panel:#101C2C; --panel-2:#0D1826; --border:#1E2E42;
    --teal:#2FD8B0; --teal-dim:#1B6E5C; --amber:#F2B84B; --red:#E86A5C;
    --text:#F1F5F4; --text-dim:#8FA1AE; --text-mute:#5B6D7A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;min-height:100vh;}
  .hamburger{display:none;position:fixed;top:16px;left:16px;z-index:120;width:38px;height:38px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);align-items:center;justify-content:center;cursor:pointer;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
  .sidebar-overlay.open{display:block;}
  .sidebar{width:220px;background:var(--panel-2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px 8px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .brand svg{color:var(--teal);}
  .brand span{font-weight:600;font-size:15px;letter-spacing:0.3px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:var(--text-dim);font-size:14px;cursor:pointer;transition:background .15s,color .15s;}
  .nav-item:hover{background:#152234;color:var(--text);}
  .nav-item.active{background:var(--teal);color:#04241C;font-weight:600;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .main{flex:1;padding:28px 32px;max-width:1200px;overflow-x:hidden;min-width:0;}
  .header{margin-bottom:22px;}
  .header h1{font-size:22px;font-weight:700;letter-spacing:0.2px;}
  .header h1 .accent{color:var(--teal);}
  .header p{color:var(--text-dim);font-size:13px;margin-top:4px;}
  .grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;}
  .row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px;}
  /* #57 — el bloque de ejemplo del CSV no tenia NINGUN estilo propio, asi
     que el navegador ignoraba los saltos de linea del texto y lo mostraba
     todo corrido en un solo parrafo. Con white-space:pre se respetan los
     saltos de linea tal cual estan escritos, y la fuente monoespaciada
     alinea las columnas como una tabla. */
  .csv-example{white-space:pre;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.7;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;margin-bottom:12px;color:var(--text-dim);}
  /* #56 — tarjetas de categoria (Ingresos/Gastos) en Finanzas: 2 columnas
     iguales por default; en movil VERTICAL se apilan a 1 columna. En
     movil horizontal se quedan igual que en escritorio (misma regla que
     usa .grid/.row2 normalmente, pero aqui por orientacion, no por ancho,
     porque un telefono en horizontal ya tiene ancho de sobra). */
  .row2-cat{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (orientation:portrait){
    .row2-cat{grid-template-columns:1fr;}
  }
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;min-width:0;overflow:hidden;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:14px;min-width:0;overflow-wrap:break-word;}
  .card-title svg{width:15px;height:15px;color:var(--teal);flex-shrink:0;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .card-head .card-title{margin-bottom:0;flex:1;min-width:120px;}
  .link-btn{font-size:11.5px;color:var(--teal);cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .link-btn:hover{text-decoration:underline;}
  .appt{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .appt:last-of-type{border-bottom:none;}
  .appt-time{width:50px;color:var(--text-mute);font-size:12px;flex-shrink:0;}
  .appt-info{flex:1;background:#132135;border-left:3px solid var(--teal);border-radius:6px;padding:8px 10px;min-width:0;overflow-wrap:break-word;}
  .appt-info b{display:block;font-size:13px;overflow-wrap:break-word;}
  .appt-info span{color:var(--text-dim);font-size:12px;}
  .appt-list{max-height:280px;overflow-y:auto;}
  .appt-actions{display:flex;gap:8px;margin-top:14px;}
  .btn{padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);white-space:nowrap;}
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--teal);color:#04241C;border:none;}
  .btn.primary:hover{background:#3EE8C0;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}
  .btn.block{flex:1;}
  .btn.danger{color:var(--red);border-color:#3a2220;}
  .metric-value{font-size:24px;font-weight:700;margin-bottom:2px;overflow-wrap:break-word;word-break:break-word;}
  .metric-delta{font-size:12px;color:var(--teal);margin-top:8px;}
  .mini-chart-wrap{position:relative;height:110px;margin-top:6px;}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .stat-chip{flex:1;min-width:100px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .stat-chip.act{background:#12291F;}
  .stat-chip.inact{background:#241a1a;}
  .stat-chip .num{font-size:20px;font-weight:700;}
  .stat-chip.act .num{color:var(--teal);}
  .stat-chip.inact .num{color:var(--text-mute);}
  .stat-chip .lbl{font-size:11px;color:var(--text-dim);}
  .stat-big{display:flex;align-items:center;gap:12px;}
  .stat-icon{width:42px;height:42px;border-radius:10px;background:#12291F;display:flex;align-items:center;justify-content:center;color:var(--teal);flex-shrink:0;}
  .stat-num{font-size:24px;font-weight:700;}
  .stat-label{font-size:12px;color:var(--text-dim);}
  .cash-chart-wrap{position:relative;height:180px;margin-top:6px;}
  .pending-value{font-size:24px;font-weight:700;color:var(--amber);overflow-wrap:break-word;}
  .clickable-card{cursor:pointer;}
  .clickable-card:hover{border-color:var(--teal);}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut-canvas-wrap{position:relative;width:130px;height:130px;flex-shrink:0;}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-width:0;}
  .legend-item{display:flex;align-items:center;gap:8px;overflow-wrap:break-word;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;}
  .kpi-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .kpi-value{font-size:18px;font-weight:700;word-break:break-word;overflow-wrap:break-word;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .search{flex:1;min-width:160px;max-width:320px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;}
  .search::placeholder{color:var(--text-mute);}
  /* Ciclo 2 / Ronda 3 (#4 de Pagos), corregido en Ronda 4 (#10) — cada
     tabla necesita su PROPIO ancho minimo segun su cantidad real de
     columnas, no un solo valor generico. Ademas, width:100% obligaba a
     CUALQUIER tabla a estirarse a rellenar todo el contenedor
     disponible incluso en pantallas anchas donde le sobraba espacio
     (la queja original de Gastos: columna Concepto con espacios
     exagerados) — width:auto deja que la tabla mida solo lo que su
     contenido necesita, con el minimo por tabla como piso para activar
     scroll horizontal (ya preparado en .table-wrap) unicamente cuando
     de verdad hace falta, sin forzar mas ancho del necesario. */
  /* Ciclo 2 / Ronda 6 (#10 de Pagos) — se revirtio el ancho minimo
     forzado en Pacientes/Gastos/Tratamientos (habia quedado peor que
     antes: una caja angosta flotando dentro de un panel ancho). Esas 3
     tablas vuelven a llenar el 100% del contenedor, como estaban
     originalmente. SOLO Pagos conserva su ancho minimo — es la unica
     con suficientes columnas (9) para de verdad necesitar scroll
     horizontal en pantallas normales. */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  #pagTableBlock table{width:auto;min-width:1250px;}
  /* Ciclo 2 / Ronda 8 — igual que Pagos, pero con min-width mucho mas
     moderado: la meta aqui no es imitar el ancho de Pagos (9 columnas,
     necesita scroll amplio) sino solo evitar que el texto se parta en
     2-3 renglones en movil (nombres largos, fechas con guion). Estos 3
     valores se calcularon sumando un ancho comodo por columna segun su
     contenido tipico, dejando en movil un scroll horizontal chico —
     visible pero no exagerado. Punto de partida para ajustar si Sergio
     ve que falta o sobra. */
  /* Ciclo 2 / Ronda 9 — corregido de "width:auto" a "width:100%": con
     auto, la tabla solo ocupaba lo que su contenido necesitaba y el
     min-width quedaba como piso unicamente para pantallas angostas — en
     PC, donde el contenedor es mas ancho que ese piso, la tabla se veia
     "incompleta" (hueco vacio a la derecha). Con width:100%, la tabla
     llena el contenedor en PC igual que antes de Ronda 8, y el
     min-width sigue actuando como piso en movil para evitar texto
     amontonado. Gastos ademas subio su min-width (550->620) para darle
     mas aire a la columna Concepto tras el ajuste de nowrap de abajo. */
  #pacTableBlock table{width:100%;min-width:760px;}
  #tratTableBlock table{width:100%;min-width:650px;}
  #gastoTableBlock table{width:100%;min-width:620px;}
  /* Ciclo 2 / Ronda 9 — en Gastos, las fechas (con guion, ej. "24-Ago-
     2026") se seguian partiendo en varios renglones en movil pese al
     min-width: el guion es un punto de corte valido para el navegador,
     y el layout automatico de la tabla le podia quitar espacio a esta
     columna para dárselo a Concepto. Se fuerza nowrap en las 3 columnas
     de dato corto (Fecha, Categoria, Monto) — solo Concepto, que es la
     unica con texto realmente largo, puede partirse si de plano no cabe. */
  #gastoTableBlock td:nth-child(1), #gastoTableBlock td:nth-child(3), #gastoTableBlock td:nth-child(4){white-space:nowrap;}
  thead th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  /* Ciclo 2 / Ronda 4 (#4 de Pagos) — altura MINIMA (no fija) por celda,
     para eliminar variaciones de contenido sin arriesgar que el texto se
     recorte si alguien usa un tamaño de letra mas grande (accesibilidad):
     si el contenido necesita mas espacio, la fila crece; nunca se fuerza
     a un valor exacto que pueda quedar corto. Se investigo forzar un
     valor fijo (incluso exagerado, 100px) para intentar eliminar un
     residuo de 1px entre filas — el residuo persistio igual, confirmando
     que es un detalle de redondeo de bordes del navegador entre filas
     consecutivas de una tabla HTML, no algo que el CSS pueda controlar.
     Se abandono ese camino (min-height sigue siendo lo correcto). */
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);min-height:53px;box-sizing:border-box;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr:hover{background:#132135;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.ok{background:#12291F;color:var(--teal);}
  .badge.pend{background:#2A2412;color:var(--amber);}
  .badge.cancel{background:#2A1614;color:var(--red);}
  .badge.inactive{background:#241a1a;color:var(--text-mute);}
  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px 8px;overflow-x:auto;}
  /* Ciclo 2 / Ronda 5 (#11 de Pagos) — la tabla y su paginador ahora
     viven dentro de un mismo contenedor visual (borde + fondo), para
     que se lean como una sola pieza en vez de 2 elementos sueltos. Solo
     la parte de adentro (.table-scroll, la tabla en si) tiene scroll
     horizontal — el paginador se queda siempre fijo, fuera de esa zona
     que se desplaza. */
  /* Ciclo 2 / Ronda 6 — display:flex + margin-top:auto en el paginador:
     sin esto, cuando una pagina tiene menos filas que otra (ej. la
     ultima pagina), el paginador quedaba pegado justo despues de la
     tabla, mas arriba dentro del espacio reservado, en vez de siempre
     en el fondo — eso hacia que su posicion en pantalla brincara al
     cambiar de pagina (mismo bug que ya se habia resuelto en el Ciclo 1
     con este mismo mecanismo, perdido sin querer al reestructurar para
     unificar tabla+paginador visualmente). */
  .table-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px 8px 8px;display:flex;flex-direction:column;}
  .table-card > div[id$="Paginador"]{margin-top:auto;}
  .table-scroll{overflow-x:auto;}
  /* Ciclo 2 / Ronda 6 — se quito el border-top de aqui: la ultima fila
     de la tabla ya trae su propio border-bottom, asi que con los 2
     bordes pegados se veian 2 rayas en vez de una sola division limpia.
     margin-top:auto ya quedo definido arriba, junto con el flex del
     contenedor padre — aqui solo el relleno interno que le da aire. */
  .table-card > div[id$="Paginador"]{padding-top:8px;}
  /* #64 (corregido de nuevo) — reservar altura minima en el contenedor NO
     ancla el paginador al fondo por si solo — el espacio de mas queda
     despues del paginador, no entre la tabla y el, asi que el paginador
     seguia "subiendo" en paginas con menos filas. Con flex-column +
     margin-top:auto en el paginador, este queda pegado al fondo siempre,
     sin importar cuantas filas haya arriba. */
  /* Ciclo 2 / Ronda 4 (#11 de Pagos) — el paginador ya NO vive dentro del
     contenedor con scroll horizontal (antes se desplazaba junto con la
     tabla, obligando a regresar hasta el principio solo para cambiar de
     pagina — muy incomodo en movil). Ahora es un hermano fuera de ese
     contenedor, siempre visible sin necesidad de scroll. */
  div[id$="Paginador"]{margin-top:8px;}

  .collapsible .coll-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px;margin-bottom:10px;}
  /* #69 — sin esto, una seccion colapsable pegaba directo con la siguiente (ej. "Gastos fijos" quedaba justo donde terminara la tabla de Pagos, sea cual fuera su alto, sin ninguna separacion visual entre ambas). Se agrega margen solo entre colapsables consecutivos (no antes del primero, que ya tiene su propio espacio con las graficas de arriba). */
  .collapsible + .collapsible{margin-top:20px;}
  .collapsible .coll-header b{font-size:13px;}
  .coll-chevron{transition:transform .15s;color:var(--teal);flex-shrink:0;}
  .collapsible.collapsed .coll-chevron{transform:rotate(-90deg);}
  .collapsible.collapsed .coll-body{display:none;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--text-dim);}
  .field input:not([type="checkbox"]),.field select{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;width:100%;}
  .field input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;accent-color:var(--teal);margin:0;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);}
  .field input[readonly]{color:var(--text-dim);background:#0a1420;cursor:not-allowed;}
  .picker-btn{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text-dim);font-size:13px;cursor:pointer;text-align:left;}
  .picker-btn:hover{border-color:var(--teal);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{background:#12291F;color:var(--teal);font-size:11.5px;padding:4px 9px;border-radius:20px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:150;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;width:460px;max-width:100%;max-height:88vh;overflow-y:auto;}
  .modal.wide{width:640px;}
  .modal h3{font-size:16px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .toast{position:fixed;bottom:24px;right:24px;left:24px;background:var(--teal);color:#04241C;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:160;text-align:center;}
  .toast.show{display:block;}
  .empty{color:var(--text-mute);font-size:13px;padding:24px;text-align:center;}
  .config-card{max-width:560px;}
  .picker-search{margin-bottom:10px;}
  .picker-list-wrap{position:relative;}
  .picker-list-wrap.scroll-more::after{content:'';position:absolute;left:0;right:6px;bottom:0;height:26px;background:linear-gradient(to bottom, rgba(16,28,44,0), var(--panel) 80%);pointer-events:none;border-radius:0 0 10px 10px;}
  .picker-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .picker-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  /* Ciclo 2 (Grupo 2) — renglon de categoria con iconos de editar/eliminar
     al lado, usado en los selectores de categoria de tratamiento y gasto. */
  .picker-item-row{display:flex;align-items:center;}
  .cat-icon{cursor:pointer;padding:6px 8px;font-size:13px;color:var(--text-dim);border-radius:6px;}
  .cat-icon:hover{background:var(--border);}
  .picker-item:hover{background:#132135;}
  .blocking-mask{position:fixed;inset:0;background:rgba(11,20,32,.72);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  .blocking-mask.show{display:flex;}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .blocking-mask span{font-size:13px;color:var(--text-dim);}
  .picker-item input{width:16px;height:16px;accent-color:var(--teal);flex-shrink:0;}
  .subtle{color:var(--text-mute);font-size:11.5px;}
  .divider{border-top:1px solid var(--border);margin:16px 0;}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .summary-row span:first-child{color:var(--text-dim);}
  .pend-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .pend-row.clickable{cursor:pointer;}
  .pend-row.clickable:hover{background:#12203099;}
  /* #62/#63 — alto minimo fijo (5 filas) para que la ventana de detalle no
     "brinque" de tamaño entre categorias con pocos y muchos registros. */
  .detail-block-fixed{min-height:220px;}
  /* #64 — envuelve tabla+paginador en un solo bloque con el mismo fondo
     de tarjeta que ya usa el resto del sistema, para que el espacio de
     mas que queda cuando la ultima pagina trae menos registros se sienta
     parte del mismo componente, no un hueco suelto. */
  /* #64 (corregido) — antes .table-block envolvia a .table-wrap, que YA
     tenia su propio fondo de tarjeta — quedaban 2 paneles anidados, y la
     altura minima en el de afuera dejaba un hueco muerto entre la tabla
     (adentro) y el paginador, en vez de estirar el panel visible completo.
     Ahora la altura minima se aplica directo sobre .table-wrap, que ya
     incluye tabla + paginador como un solo panel. */
  .pend-row .btn{flex-shrink:0;}

  .day-block{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .day-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .day-block-head b{font-size:13px;}
  .turno-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px;}
  .turno-row input{padding:7px 9px;font-size:12.5px;}
  .icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .add-turno{font-size:12px;color:var(--teal);cursor:pointer;font-weight:600;}

  .referral-teaser{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;margin-top:16px;}
  .referral-teaser:hover{border-color:var(--teal);color:var(--text);}
  .referral-teaser svg{color:var(--teal);flex-shrink:0;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
Chart.defaults.color = '#8FA1AE';
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycby2vc5fO1g4A08vLKsWTAhMBwO5HvVKqh1KkaigexC8JkGVgdTf-bl6rmMpPhSvNYRO/exec", CLIENT_ID: "DEMO", CURRENCY: "MXN", DIAS_SIN_VISITA: 60, PHONE_COUNTRY: "MX", FORMATO_HORA: "24h", FORMATO_FECHA: "iso", SEPARADOR: "es-MX", DECIMALES_PRECIO: false };
const CURRENCIES = {
  MXN:{symbol:'$',nombre:'Peso mexicano'}, USD:{symbol:'$',nombre:'Dólar estadounidense'},
  COP:{symbol:'$',nombre:'Peso colombiano'}, EUR:{symbol:'€',nombre:'Euro'},
  ARS:{symbol:'$',nombre:'Peso argentino'}, PEN:{symbol:'S/',nombre:'Sol peruano'},
  GTQ:{symbol:'Q',nombre:'Quetzal guatemalteco'},
};
/* #71 — catalogo pais -> prefijo y longitud de telefono, mismo patron
   que CURRENCIES: el usuario solo elige el pais (como ya hace con la
   moneda), y el sistema toma prefijo y longitud del catalogo — sin
   pedirle que capture la longitud a mano (esa parte no cambia seguido
   por pais, y un campo libre solo invita a errores de captura). */
const PHONE_COUNTRIES = {
  MX:{nombre:'México', prefijo:'52', longitud:10}, US:{nombre:'Estados Unidos', prefijo:'1', longitud:10},
  CO:{nombre:'Colombia', prefijo:'57', longitud:10}, ES:{nombre:'España', prefijo:'34', longitud:9},
  AR:{nombre:'Argentina', prefijo:'54', longitud:10}, PE:{nombre:'Perú', prefijo:'51', longitud:9},
  GT:{nombre:'Guatemala', prefijo:'502', longitud:8},
};
function telefonoInfo(){ return PHONE_COUNTRIES[CONFIG.PHONE_COUNTRY] || PHONE_COUNTRIES.MX; }
const DIAS_ORDEN = ["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado","Domingo"];
const DEMO_DATA = {"pacientes": [], "tratamientos": [], "citas": [], "pagos": [], "gastos": [], "categorias_tratamiento": [], "categorias_gasto": [], "horario": [], "config": [], "referidos": [], "comisionMoneda": "MXN", "comisionMonto": 300};
let DATA = JSON.parse(JSON.stringify(DEMO_DATA));
let ACTIVE_TAB = 'dashboard';

let LOAD_ERROR = null;
function emptyShell(){
  return { pacientes:[], tratamientos:[], citas:[], pagos:[], gastos:[], categorias_tratamiento:[], categorias_gasto:[], horario:[], config:[], referidos:[], comisionMoneda:'MXN', comisionMonto:300 };
}
/* Ciclo 1 / Ronda 3 (5c), vigente en Ronda 4 — bug real encontrado:
   antes, CUALQUIER falla al recargar (una respuesta lenta, un hipo de
   red, lo que sea) borraba TODA la informacion ya cargada y la
   reemplazaba con un cascaron vacio (emptyShell). Ahora solo se usa el
   cascaron vacio si esta es la carga INICIAL (todavia no hay nada
   cargado); si ya habia datos buenos y una recarga posterior falla (ej.
   el boton manual "Sincronizar" de Configuracion), se conservan los
   datos anteriores tal cual — el usuario sigue viendo la ultima
   informacion real conocida en vez de puros ceros. El valor de retorno
   (true/false) le permite a quien llamo avisar si hizo falta. */
async function loadData(){
  LOAD_ERROR = null;
  if(!CONFIG.API_URL){ DATA = JSON.parse(JSON.stringify(DEMO_DATA)); return; }
  const esCargaInicial = !DATA;
  try{
    // Ciclo 2 / Ronda 10 — se agrega "&_ts=" (marca de tiempo, siempre
    // distinta) y "cache:'no-store'" para que esta peticion nunca se
    // resuelva con una copia guardada por el navegador. Sin esto, una
    // URL identica a una ya pedida antes en la misma sesion (que es el
    // caso normal aqui, siempre es la misma) podia regresar una
    // respuesta vieja en vez de ir de verdad al servidor — eso hacia
    // que "Sincronizar" pareciera no traer los cambios hechos desde
    // otro dispositivo.
    const res = await fetch(CONFIG.API_URL + '?client=' + encodeURIComponent(CONFIG.CLIENT_ID) + '&_ts=' + Date.now(), { cache:'no-store' });
    const json = await res.json();
    if(json && json.error){ LOAD_ERROR = json.error; if(esCargaInicial) DATA = emptyShell(); return false; }
    if(!json || !Array.isArray(json.pacientes)){ LOAD_ERROR = 'La API respondió con un formato inesperado.'; if(esCargaInicial) DATA = emptyShell(); return false; }
    DATA = json;
    return true;
  }catch(err){
    console.error('Sin conexion a la API.', err);
    LOAD_ERROR = 'No se pudo conectar con el sistema. Puede ser un problema temporal de conexión a internet — tu información está segura, no se ha perdido nada.';
    if(esCargaInicial) DATA = emptyShell();
    return false;
  }
}
async function reintentarConexion(){ showMask('Conectando...'); await loadData(); hideMask(); render(); }
/* Toma Moneda y DiasSinVisita de la hoja Config y los aplica a CONFIG en
   memoria. Sin esto, CONFIG solo reflejaba el valor guardado en ESTA
   sesion del navegador — si guardabas Moneda hoy y recargabas la pagina
   mañana, se te olvidaba porque nunca se releia de vuelta del Sheet. */
function hidratarConfigDesdeSheet(){
  if(!Array.isArray(DATA.config)) return;
  const mapa = {}; DATA.config.forEach(c=>{ mapa[c.Clave] = c.Valor; });
  if(mapa.Moneda && CURRENCIES[mapa.Moneda]) CONFIG.CURRENCY = mapa.Moneda;
  if(mapa.DiasSinVisita) CONFIG.DIAS_SIN_VISITA = Number(mapa.DiasSinVisita) || 60;
  if(mapa.PaisTelefono && PHONE_COUNTRIES[mapa.PaisTelefono]) CONFIG.PHONE_COUNTRY = mapa.PaisTelefono; // #71
  // Grupo 1 (#27/#28/#34/#35) — formato regional configurable
  if(mapa.FormatoHora==='12h' || mapa.FormatoHora==='24h') CONFIG.FORMATO_HORA = mapa.FormatoHora;
  if(['iso','iso-texto','dmy','dmy-texto'].includes(mapa.FormatoFecha)) CONFIG.FORMATO_FECHA = mapa.FormatoFecha;
  if(mapa.Separador==='es-MX' || mapa.Separador==='es-ES') CONFIG.SEPARADOR = mapa.Separador;
  if(mapa.DecimalesPrecio!==undefined) CONFIG.DECIMALES_PRECIO = (mapa.DecimalesPrecio==='true' || mapa.DecimalesPrecio===true);
}

/* Mapa entre las claves del JSON del backend y los nombres de hoja que
   entiende doGet para la recarga parcial (?sheets=...). */
const MAPA_SYNC_KEYS = ['pacientes','tratamientos','citas','pagos','gastos','categorias_tratamiento','categorias_gasto','horario','config'];
/* Vuelve a consultar SOLO las hojas indicadas (ej. ['pacientes']) y
   reemplaza esa parte de DATA con lo que el Sheet reporta de verdad — para
   que, tras guardar, lo que se muestra sea lo que realmente quedo escrito y
   no una suposicion optimista del navegador. Es una recarga parcial (no las
   9 hojas completas) para que cada guardado no se sienta el doble de lento. */
async function syncData(keys){
  if(!CONFIG.API_URL || !keys || !keys.length) return;
  try{
    // Ciclo 2 / Ronda 10 — mismo fix que loadData(): esta es la peticion
    // que se repite CADA VEZ que se guarda algo (para confirmar lo que
    // realmente quedo escrito) y siempre con la misma URL por hoja — la
    // mas propensa a regresar una copia vieja cacheada por el
    // navegador (ej. el horario "desapareciendo" tras guardarlo).
    const res = await fetch(CONFIG.API_URL + '?client=' + encodeURIComponent(CONFIG.CLIENT_ID) + '&sheets=' + encodeURIComponent(keys.join(',')) + '&_ts=' + Date.now(), { cache:'no-store' });
    const json = await res.json();
    if(json && !json.error){
      keys.forEach(k=>{ if(json[k]!==undefined) DATA[k] = json[k]; });
      if(json.referidos!==undefined) DATA.referidos = json.referidos;
      if(json.comisionMoneda!==undefined) DATA.comisionMoneda = json.comisionMoneda;
      if(json.comisionMonto!==undefined) DATA.comisionMonto = json.comisionMonto;
    }
  }catch(err){ console.error('Error al sincronizar '+keys.join(','), err); }
}

/* Escribe cualquier accion al Sheet real via Apps Script. Si se pasan
   syncKeys (ej. ['pacientes']), despues de guardar vuelve a consultar esas
   hojas y mantiene la mascara puesta hasta terminar — el flujo siempre es:
   guardar -> consultar lo real -> recien ahi mostrar y quitar mascara. En
   modo demo (sin API_URL) no hace nada y el llamador debe generar un ID
   local como respaldo. */
/* Ciclo 1 / Ronda 4 — rediseño del refresco de datos: ya no existe
   temporizador automatico en ninguna pantalla (se quito de tajo). En
   vez de eso, cada guardado ya sigue el flujo completo: mascara ->
   transaccion -> consulta SOLO la hoja tocada -> repintar TODAS las
   graficas del sistema (Dashboard + Finanzas) usando nada mas los datos
   que ya quedaron en el FE tras esa consulta puntual -> quitar mascara.
   Cero llamadas nuevas al backend solo para refrescar graficas — la
   unica forma de traer todo de nuevo es el boton manual de
   "Sincronizar con otros dispositivos" en Configuracion, para cuando de
   verdad hay alguien mas usando el sistema en otro dispositivo. */
async function apiCall(action, payload, syncKeys){
  if(!CONFIG.API_URL) return null;
  showMask('Guardando...');
  try{
    const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ client:CONFIG.CLIENT_ID, action, payload }), cache:'no-store' });
    const json = await res.json();
    if(json && !json.error && !json.conflict && syncKeys && syncKeys.length){
      showMask('Actualizando...');
      await syncData(syncKeys);
      repintarGraficasConDatosActuales();
    }
    return json;
  }catch(err){ console.error('Error de API en '+action, err); showToast('Sin conexion — el cambio quedo solo en este dispositivo'); return null; }
  finally{ hideMask(); }
}

function anyModalOpen(){
  return document.getElementById('modalOverlay').classList.contains('open') || document.getElementById('pickerOverlay').classList.contains('open');
}

/* Grupo 1 (#34/#35) — separador de miles/decimales y decimales en
   precios, ambos configurables. El precio siempre se guarda completo en
   el Sheet (nunca se pierde el decimal); lo unico que cambia aqui es
   como se MUESTRA. toLocaleString ya sabe generar ambos formatos
   (1,234.56 vs 1.234,56) nativamente segun la region — no hay que
   programar el formato a mano. */
function fmtMoney(n){
  const c = CURRENCIES[CONFIG.CURRENCY]||CURRENCIES.MXN;
  const opciones = CONFIG.DECIMALES_PRECIO ? {minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true} : {maximumFractionDigits:0,useGrouping:true};
  return c.symbol + Number(n).toLocaleString(CONFIG.SEPARADOR||'es-MX', opciones) + ' ' + CONFIG.CURRENCY;
}
/* #57b/c — la comision de referidos se paga en una moneda propia
   (MXN/USD/EUR segun el cliente), independiente de la Moneda que ese
   mismo cliente tenga configurada para su propio sistema — por eso usa su
   propio formateador, nunca fmtMoney() (que usa CONFIG.CURRENCY). */
function fmtComision(n){ const moneda = DATA.comisionMoneda||'MXN'; const c = CURRENCIES[moneda]||CURRENCIES.MXN; return c.symbol + Math.round(n).toLocaleString(CONFIG.SEPARADOR||'es-MX') + ' ' + moneda; }
/* Grupo 1 (#27/#28) — formato de hora y fecha configurables, funciones
   centrales usadas en TODOS los lugares donde se muestra una fecha/hora
   al usuario. Las fechas siguen viajando y guardandose siempre en ISO
   (AAAA-MM-DD) por dentro del sistema — estas funciones son solo la capa
   de presentacion final. */
const MESES_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function formatearFecha(fechaISO){
  // Ciclo 1 / Ronda 8 (#17) — estandarizado con el resto del sistema:
  // sin fecha se muestra '—' (mismo guion que ya usan Ultima_Visita y
  // Tratamientos), no una celda vacia. Antes esta funcion regresaba
  // cadena vacia, que fue lo que dejo a "Ultimo pago" en blanco cuando
  // deberia verse igual que los demas campos sin dato del sistema.
  if(!fechaISO || fechaISO==='—') return fechaISO||'—';
  const [y,m,d] = fechaISO.split('-');
  const mesTxt = MESES_CORTOS[Number(m)-1];
  switch(CONFIG.FORMATO_FECHA){
    case 'iso-texto': return `${y}-${mesTxt}-${d}`;
    case 'dmy': return `${d}-${m}-${y}`;
    case 'dmy-texto': return `${d}-${mesTxt}-${y}`;
    default: return `${y}-${m}-${d}`;
  }
}
/* Version sin año, para tarjetas compactas (ej. "próximas citas") que ya
   dan por hecho que es el año en curso. */
function formatearFechaCorta(fechaISO){
  if(!fechaISO) return '';
  const [y,m,d] = fechaISO.split('-');
  const mesTxt = MESES_CORTOS[Number(m)-1];
  const usaDMY = CONFIG.FORMATO_FECHA==='dmy' || CONFIG.FORMATO_FECHA==='dmy-texto';
  const usaTexto = CONFIG.FORMATO_FECHA==='iso-texto' || CONFIG.FORMATO_FECHA==='dmy-texto';
  const mesOut = usaTexto ? mesTxt : m;
  return usaDMY ? `${d}-${mesOut}` : `${mesOut}-${d}`;
}
function formatearHora(horaHHMM){
  if(!horaHHMM) return '';
  if(CONFIG.FORMATO_HORA==='24h') return horaHHMM;
  let [h,mi] = horaHHMM.split(':').map(Number);
  const ampm = h>=12 ? 'pm' : 'am';
  h = h%12; if(h===0) h=12;
  return `${h}:${String(mi).padStart(2,'0')} ${ampm}`;
}
/* Ciclo 1 / Ronda 1 (#2/#3) — los inputs <input type="number"> nativos
   NO dejan que JS controle que caracter usan como separador decimal: eso
   lo decide el navegador/sistema operativo del usuario, no CONFIG.SEPARADOR
   — por eso siempre forzaban punto sin importar el formato elegido en la
   app. Los 4 campos de dinero (Monto de gasto, Precio de tratamiento,
   Monto pagado, Monto del abono) pasan de type="number" a texto con
   teclado numerico (inputmode="decimal"), saneados en vivo para aceptar
   solo digitos y el separador decimal que corresponda. parsearMonto()
   convierte lo que haya escrito el usuario a un numero real de JS antes
   de usarlo o enviarlo al backend — asi Code.gs siempre recibe un numero
   de verdad, sin importar si el usuario tecleo coma o punto, y el Sheet
   (que guarda numeros puros, no texto con formato) queda bien sin
   importar el idioma/region que tenga configurado ese Sheet. */
function separadorDecimal(){ return CONFIG.SEPARADOR==='es-ES' ? ',' : '.'; }
function parsearMonto(str){
  if(str===undefined || str===null || str==='') return 0;
  const limpio = String(str).trim().replace(separadorDecimal(), '.');
  return Number(limpio) || 0;
}
function sanearInputMonto(el){
  const sep = separadorDecimal();
  let v = el.value.split('').filter(c => /\d/.test(c) || c===sep).join('');
  const idx = v.indexOf(sep);
  if(idx !== -1) v = v.slice(0, idx+1) + v.slice(idx+1).split(sep).join('');
  el.value = v;
}
/* Conecta el saneo en vivo a un input de dinero por su id; se llama una
   vez por cada campo, justo despues de insertar el modal/formulario en el
   DOM. */
function attachSaneoMonto(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=> sanearInputMonto(el));
}
function tratArr(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }
function duracionCitaMin(tratamientosStr){
  const nombres = tratArr(tratamientosStr);
  let total = 0;
  nombres.forEach(n=>{ const t = DATA.tratamientos.find(t=>t.Nombre===n); total += t && t.Duracion_Min ? Number(t.Duracion_Min) : 30; });
  return total>0 ? total : 30;
}
function normalize(s){ return (s===undefined||s===null?'':s.toString()).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function matches(text, query){ return normalize(text).includes(normalize(query)); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function showMask(text){ document.getElementById('maskText').textContent = text||'Cargando información...'; document.getElementById('blockingMask').classList.add('show'); }
function hideMask(){ document.getElementById('blockingMask').classList.remove('show'); }
let MODAL_STACK = [];
function closeModal(){ MODAL_STACK = []; document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(html, wide){ const m=document.getElementById('modalBody'); m.className = wide?'modal wide':'modal'; m.innerHTML = html; document.getElementById('modalOverlay').classList.add('open'); }
/* Guarda el contenido actual del modal para poder regresar a el mas
   adelante con volverModal() en vez de cerrar todo. onRestore (opcional)
   es una funcion que vuelve a conectar los eventos de esa vista — al
   restaurar el HTML guardado, los listeners que tenia antes ya no existen
   (se pierden al reemplazar innerHTML), asi que sin este callback los
   botones de la vista restaurada quedarian sin ninguna accion conectada. */
function pushModalState(onRestore){ const m=document.getElementById('modalBody'); MODAL_STACK.push({ html:m.innerHTML, wide:m.classList.contains('wide'), onRestore }); }
/* Regresa al modal anterior guardado con pushModalState(); si no hay
   ninguno guardado, simplemente cierra (mismo comportamiento de siempre). */
function volverModal(){
  if(!MODAL_STACK.length){ closeModal(); return; }
  const prev = MODAL_STACK.pop();
  const m = document.getElementById('modalBody');
  m.className = prev.wide?'modal wide':'modal';
  m.innerHTML = prev.html;
  if(prev.onRestore) prev.onRestore();
}
function closePicker(){ document.getElementById('pickerOverlay').classList.remove('open'); }
/* Señal visual (degradado) de que una lista dentro de un picker tiene mas
   contenido abajo del que cabe — el scrollbar delgado solo no siempre se
   nota, sobre todo cuando el desborde es chico. */
function refreshScrollHint(el){
  if(!el || !el.parentElement) return;
  const wrap = el.parentElement;
  const check = ()=>{ wrap.classList.toggle('scroll-more', el.scrollHeight - el.scrollTop - el.clientHeight > 4); };
  check();
  el.onscroll = check;
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* Lectura de fechas SIN pasar por conversion UTC/zona horaria — evita el bug
   clasico de que "2026-08-07" se recorra un dia segun donde este el navegador.
   Trabajamos siempre con los numeros del texto tal cual, nunca con new Date(str). */
function ymd(fechaStr){ const p = String(fechaStr||'').split('-').map(Number); return { y:p[0]||0, m:p[1]||0, d:p[2]||0 }; }
function diaDelMes(fechaStr){ return ymd(fechaStr).d; }
// Ciclo 2 / Ronda 2 (#6 de Citas) — rango exacto de dias del bloque S1-S5
// al que pertenece una fecha, para mostrarlo junto al numero de "Citas
// esta semana" y que quede claro que dias cubre exactamente (el ultimo
// bloque de cada mes se recorta al ultimo dia real del mes, no siempre
// llega a "29-31").
function rangoSemanaBloque(fechaStr){
  const f = ymd(fechaStr);
  const bloque = Math.ceil(f.d/7);
  const diaIni = (bloque-1)*7 + 1;
  const ultimoDiaMes = new Date(f.y, f.m, 0).getDate();
  const diaFin = Math.min(bloque*7, ultimoDiaMes);
  const mesTxt = MESES_CORTOS[f.m-1];
  return `${String(diaIni).padStart(2,'0')}-${mesTxt} al ${String(diaFin).padStart(2,'0')}-${mesTxt}`;
}
function esMesActual(fechaStr, ref){ const a=ymd(fechaStr); const r=ref||new Date(); return a.y===r.getFullYear() && a.m===(r.getMonth()+1); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* #55 (prevencion) — registro de todas las graficas Chart.js activas en
   pantalla. Antes, al cambiar de pestaña, las graficas viejas nunca se
   destruian formalmente — quedaban "fantasma" en la memoria del navegador,
   y si el sistema intentaba tocarlas (como al ocultar tooltips en scroll)
   podian tronar y detener el resto del recorrido. Se destruyen todas antes
   de pintar cualquier pestaña nueva. */
let ACTIVE_CHARTS = [];
function nuevoChart(el, config){ const c = new Chart(el, config); ACTIVE_CHARTS.push(c); return c; }
function destruirGraficasActivas(){
  ACTIVE_CHARTS.forEach(c=>{ try{ c.destroy(); }catch(err){ /* ya destruida o su canvas ya no existe, no es fatal */ } });
  ACTIVE_CHARTS = [];
}
function render(){
  destruirGraficasActivas();
  actualizarBrandingConsultorio();
  const c = document.getElementById('content');
  if(LOAD_ERROR && ACTIVE_TAB !== 'configuracion'){ c.innerHTML = renderErrorHTML(); return; }
  if(ACTIVE_TAB === 'dashboard') c.innerHTML = renderDashboardHTML();
  else if(ACTIVE_TAB === 'pacientes') c.innerHTML = renderPacientesHTML();
  else if(ACTIVE_TAB === 'finanzas') c.innerHTML = renderFinanzasHTML();
  else if(ACTIVE_TAB === 'tratamientos') c.innerHTML = renderTratamientosHTML();
  else if(ACTIVE_TAB === 'agendar') c.innerHTML = renderAgendarHTML();
  else if(ACTIVE_TAB === 'configuracion') c.innerHTML = renderConfiguracionHTML();
  afterRenderHooks();
}

/* ============ SELECTOR MULTIPLE DE TRATAMIENTOS ============ */
// Ciclo 2 (Grupo 2) — este selector muestra el CATALOGO COMPLETO para
// elegir algo nuevo, asi que excluye tratamientos Inactivos (ya no
// deben poder elegirse para citas/pagos nuevos). El selector "acotado"
// (solo lo que el paciente ya tiene asignado) no filtra por esto — ver
// openTreatmentPickerScoped/openTreatmentPickerSingleScoped mas abajo.
function openTreatmentPicker(preselected, onConfirm){
  const selected = new Set(preselected||[]);
  function draw(filter){
    const items = DATA.tratamientos.filter(t=>t.Estado!=='Inactivo' && matches(t.Nombre, filter||''));
    return items.map(t=>`<label class="picker-item"><input type="checkbox" value="${t.Nombre}" ${selected.has(t.Nombre)?'checked':''}><span>${t.Nombre} <span class="subtle">· ${t.Categoria} · ${fmtMoney(t.Precio_MXN)}</span></span></label>`).join('') || '<div class="empty">Sin resultados</div>';
  }
  document.getElementById('pickerBody').innerHTML = `
    <h3>Seleccionar tratamientos</h3>
    <input class="search picker-search" style="max-width:100%;" id="pickerSearch" placeholder="Buscar tratamiento...">
    <div class="picker-list-wrap"><div class="picker-list" id="pickerList">${draw('')}</div></div>
    <div class="modal-actions"><div class="btn block" id="pickerCancel">Cancelar</div><div class="btn primary block" id="pickerConfirm">Listo</div></div>`;
  document.getElementById('pickerOverlay').classList.add('open');
  const list = document.getElementById('pickerList');
  refreshScrollHint(list);
  list.addEventListener('change', e=>{ if(e.target.matches('input[type=checkbox]')){ if(e.target.checked) selected.add(e.target.value); else selected.delete(e.target.value); } });
  document.getElementById('pickerSearch').addEventListener('input', e=>{ document.getElementById('pickerList').innerHTML = draw(e.target.value); refreshScrollHint(document.getElementById('pickerList')); });
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
  document.getElementById('pickerConfirm').addEventListener('click', ()=>{ closePicker(); onConfirm(Array.from(selected)); });
}

/* ============ SELECTOR/CATALOGO DE CATEGORIA (agregable) ============ */
// Ciclo 2 (Grupo 2) — generico para las 2 listas de categorias (usado
// por openCategoryPicker y openGastoCategoryPicker): renombrar una
// categoria via un mini-modal, y eliminarla solo si no tiene
// dependencias (el servidor valida esto de verdad; aqui solo se checa
// localmente para dar un aviso rapido antes de intentar la peticion).
// Ciclo 2 / Ronda 2 (#5 de Categorias) — bug real corregido: antes,
// renombrar/eliminar usaba openModal() (la MISMA ventana que ya estaba
// mostrando "Editar tratamiento" o "Registrar gasto" detras del
// selector), lo que SOBRESCRIBIA ese contenido por completo — al
// cancelar no habia adonde volver y todo se cerraba de golpe. Ahora
// renombrar/eliminar se dibujan DENTRO de la misma ventana del selector
// de categoria (pickerBody, una ventana distinta a la del modal
// principal) — el modal padre (Editar tratamiento/Registrar gasto)
// nunca se toca en todo el proceso, asi que jamas hay nada que
// restaurar ni por qué perderse.
function abrirRenombrarCategoria(nombreActual, esGasto, onVolver){
  document.getElementById('pickerBody').innerHTML = `
    <h3>Renombrar categoría</h3>
    <div class="field" style="margin-bottom:16px;"><label>Nombre</label><input id="rcNombre" value="${nombreActual}"></div>
    <div class="modal-actions"><div class="btn block" id="rcCancelar">Cancelar</div><div class="btn primary block" id="rcGuardar">Guardar</div></div>`;
  document.getElementById('rcCancelar').addEventListener('click', onVolver);
  document.getElementById('rcGuardar').addEventListener('click', async ()=>{
    const nuevoNombre = document.getElementById('rcNombre').value.trim();
    if(!nuevoNombre) return showToast('Completa: Nombre');
    if(nuevoNombre === nombreActual){ showToast('Sin cambios que guardar'); onVolver(); return; }
    const lista = esGasto ? DATA.categorias_gasto : DATA.categorias_tratamiento;
    if(lista.some(c=>normalize(c.Categoria)===normalize(nuevoNombre))) return showToast('Ya existe una categoría con ese nombre');
    const accion = esGasto ? 'edit_categoria_gasto' : 'edit_categoria';
    const syncKey = esGasto ? 'categorias_gasto' : 'categorias_tratamiento';
    if(CONFIG.API_URL){ await apiCall(accion, { nombreActual, nombreNuevo: nuevoNombre }, [syncKey]); }
    else { const c = lista.find(x=>x.Categoria===nombreActual); if(c) c.Categoria = nuevoNombre; }
    showToast('Categoría renombrada'); onVolver();
  });
}
// Mismo criterio que arriba: la confirmacion de eliminar se dibuja
// dentro de pickerBody en vez de usar el confirm() nativo del navegador
// (#5 de Pagos aplicado tambien aqui, para estandarizar) — nunca toca el
// modal padre.
function eliminarCategoria(nombre, esGasto, onVolver){
  const listaDependiente = esGasto ? DATA.gastos : DATA.tratamientos;
  const enUso = listaDependiente.some(x=>x.Categoria===nombre);
  if(enUso){ showToast(`Esta categoría tiene ${esGasto?'gastos':'tratamientos'} asignados y no se puede eliminar`); return; }
  document.getElementById('pickerBody').innerHTML = `
    <h3>¿Eliminar esta categoría?</h3>
    <p style="font-size:13px;margin-bottom:16px;">"${nombre}" — esta acción no se puede deshacer.</p>
    <div class="modal-actions"><div class="btn block" id="dcCancelar">Cancelar</div><div class="btn primary block" id="dcConfirmar" style="background:var(--red);">Eliminar</div></div>`;
  document.getElementById('dcCancelar').addEventListener('click', onVolver);
  document.getElementById('dcConfirmar').addEventListener('click', async ()=>{
    const lista = esGasto ? DATA.categorias_gasto : DATA.categorias_tratamiento;
    const accion = esGasto ? 'delete_categoria_gasto' : 'delete_categoria';
    const syncKey = esGasto ? 'categorias_gasto' : 'categorias_tratamiento';
    if(CONFIG.API_URL){
      const res = await apiCall(accion, { categoria: nombre }, [syncKey]);
      if(res && res.error){ showToast(res.error); onVolver(); return; }
    } else {
      const idx = lista.findIndex(c=>c.Categoria===nombre);
      if(idx !== -1) lista.splice(idx, 1);
    }
    showToast('Categoría eliminada'); onVolver();
  });
}
function openCategoryPicker(current, onSelect){
  function draw(filter){
    const items = DATA.categorias_tratamiento.filter(c=>matches(c.Categoria, filter||''));
    let html = items.map(c=>`<div class="picker-item-row"><div class="picker-item" data-cat="${c.Categoria}" style="flex:1;">${c.Categoria}</div><span class="cat-icon" data-editcat="${c.Categoria}" title="Renombrar">✎</span><span class="cat-icon" data-delcat="${c.Categoria}" title="Eliminar" style="color:var(--red);">✕</span></div>`).join('');
    if(filter && !DATA.categorias_tratamiento.some(c=>normalize(c.Categoria)===normalize(filter))){

/* ============ CALCULOS PARA GRAFICAS COMPLEMENTARIAS (dashboard y finanzas) ============ */
/* #52 — cuando ya no quedan citas por hoy, se usan estas (cualquier fecha
   futura, empezando por la mas cercana) para no dejar la tarjeta vacia. */
function calcularProximasCitas(limite){
  const hoy = todayStr(); const ahora = nowHM();
  return [...DATA.citas].filter(c=>c.Estado!=='Cancelada' && (c.Fecha>hoy || (c.Fecha===hoy && c.Hora>=ahora)))
    .sort((a,b)=>(a.Fecha+a.Hora).localeCompare(b.Fecha+b.Hora)).slice(0, limite||4);
}
/* #42d — los 3 pacientes con mayor saldo pendiente, para que la tarjeta
   "Pendiente por cobrar" muestre algo util ademas del total. */
function calcularTopSaldos(limite){
  const porPaciente = {};
  DATA.pagos.forEach(p=>{ if(Number(p.Saldo)>0) porPaciente[p.Paciente_ID] = (porPaciente[p.Paciente_ID]||0) + Number(p.Saldo); });
  return Object.entries(porPaciente).map(([pacId,saldo])=>{ const pac=DATA.pacientes.find(p=>p.ID===pacId); return { nombre: pac?pac.Nombre:pacId, saldo }; }).sort((a,b)=>b.saldo-a.saldo).slice(0, limite||3);
}
/* #42e — pacientes activos cuya "ultima visita efectiva" ya rebasa el
   umbral configurado (CONFIG.DIAS_SIN_VISITA). Los que nunca han tenido
   visita ('—') se excluyen — no hay fecha de la cual medir. */
function calcularPacientesQueNoHanVuelto(){
  const hoyMs = new Date(todayStr()+'T00:00:00').getTime();
  const umbral = CONFIG.DIAS_SIN_VISITA || 60;
  return DATA.pacientes.filter(p=>p.Estado!=='Inactivo').map(p=>{
    const uv = ultimaVisitaEfectiva(p);
    if(uv==='—') return null;
    const dias = Math.round((hoyMs - new Date(uv+'T00:00:00').getTime()) / 86400000);
    return dias>=umbral ? { nombre:p.Nombre, dias } : null;
  }).filter(Boolean).sort((a,b)=>b.dias-a.dias).slice(0,5);
}
/* #31 — Tratamientos mas solicitados por CANTIDAD (no por dinero), a partir
   de las citas del mes en curso. Complementa la dona, que es por dinero. */
function calcularTratamientosSolicitados(){
  const now = new Date();
  const conteo = {};
  DATA.citas.filter(c=>c.Estado!=='Cancelada' && esMesActual(c.Fecha, now)).forEach(c=>{
    tratArr(c.Tratamientos||c.Tratamiento).forEach(t=>{ conteo[t] = (conteo[t]||0)+1; });
  });
  return Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
/* #31 — Pacientes nuevos vs. recurrentes por semana del mes en curso,
   contando PACIENTES UNICOS (no citas): cada paciente cuenta una sola vez
   por semana. "Nuevo" solo en la semana de su primera cita de siempre en
   el sistema (y solo si no marco "Ya era mi paciente antes" al darlo de
   alta) — cualquier otra semana en que tenga cita cuenta como recurrente. */
function calcularNuevosVsRecurrentes(){
  const now = new Date();
  const primeraFecha = {};
  DATA.citas.filter(c=>c.Estado!=='Cancelada').forEach(c=>{
    if(!primeraFecha[c.Paciente_ID] || c.Fecha < primeraFecha[c.Paciente_ID]) primeraFecha[c.Paciente_ID] = c.Fecha;
  });
  const semanasPorPaciente = {};
  DATA.citas.filter(c=>c.Estado!=='Cancelada' && esMesActual(c.Fecha, now)).forEach(c=>{
    const w = 'S'+Math.ceil(diaDelMes(c.Fecha)/7);
    if(!semanasPorPaciente[c.Paciente_ID]) semanasPorPaciente[c.Paciente_ID] = new Set();
    semanasPorPaciente[c.Paciente_ID].add(w);
  });
  const weeks = ['S1','S2','S3','S4','S5'];
  const nuevos = {S1:0,S2:0,S3:0,S4:0,S5:0}, recurrentes = {S1:0,S2:0,S3:0,S4:0,S5:0};
  Object.entries(semanasPorPaciente).forEach(([pacId, semanas])=>{
    const pac = DATA.pacientes.find(p=>p.ID===pacId);
    const tienePrevio = pac && pac.HistorialPrevio === 'Si';
    const esNuevoEsteMes = !tienePrevio && primeraFecha[pacId] && esMesActual(primeraFecha[pacId], now);
    const semanaDeSuPrimera = esNuevoEsteMes ? ('S'+Math.ceil(diaDelMes(primeraFecha[pacId])/7)) : null;
    semanas.forEach(w=>{ if(w===semanaDeSuPrimera) nuevos[w]++; else recurrentes[w]++; });
  });
  return { weeks, nuevos: weeks.map(w=>nuevos[w]), recurrentes: weeks.map(w=>recurrentes[w]) };
}
/* #32 — Ingresos vs Gastos de los ultimos 6 meses (incluye el actual). */
function calcularUltimos6Meses(){
  const now = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:d.getFullYear(), m:d.getMonth()+1, label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}); }
  const ingresos = meses.map(({y,m})=> DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m; }).reduce((s,p)=>s+Number(p.Monto_Pagado),0));
  const gastos = meses.map(({y,m})=> DATA.gastos.filter(g=>{ const f=ymd(g.Fecha); return f.y===y && f.m===m; }).reduce((s,g)=>s+Number(g.Monto),0));
  return { labels: meses.map(x=>x.label), ingresos, gastos };
}
/* #32/#42g — Gastos por categoria a traves de los ultimos 6 meses (top 4
   categorias por gasto acumulado, el resto no se grafica para no saturar).
   Devuelve tambien "meses" y "topCats" para poder mapear un clic en una
   barra (datasetIndex+index) de vuelta a categoria+mes exactos. */
function calcularGastosPorCategoriaMeses(){
  const now = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:d.getFullYear(), m:d.getMonth()+1, label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}); }
  // #59 — el top 3 se calcula SOLO con estos mismos 6 meses (antes usaba
  // todo el historial de siempre, lo que podia meter una categoria vieja
  // sin nada de actividad reciente).
  const totalPorCat = {};
  DATA.gastos.forEach(g=>{ const f=ymd(g.Fecha); if(!meses.some(mm=>mm.y===f.y && mm.m===f.m)) return; totalPorCat[g.Categoria] = (totalPorCat[g.Categoria]||0) + Number(g.Monto); });
  const topCats = Object.entries(totalPorCat).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  // #76 — paleta propia de Gastos (2 tonos de rojo + el mismo neutro que
  // ya usa Ingresos en su 3er lugar), antes compartia por error la misma
  // paleta de verdes que Ingresos — la gráfica de Gastos se veía verde
  // pese a que todo el resto del sistema usa rojo para gastos.
  const paleta = ['#E0555A','#8C3338','#3A4E60'];
  const datasets = topCats.map((cat,i)=>({
    label: cat,
    data: meses.map(({y,m})=> DATA.gastos.filter(g=>{ const f=ymd(g.Fecha); return f.y===y && f.m===m && g.Categoria===cat; }).reduce((s,g)=>s+Number(g.Monto),0)),
    backgroundColor: paleta[i%paleta.length],
  }));
  return { labels: meses.map(x=>x.label), datasets, meses, topCats };
}
/* #42f — Ingresos por categoria de tratamiento a traves de los ultimos 6
   meses (top 3 categorias por ingreso acumulado). Mismo patron que gastos
   por categoria, pero agrupando Pagos via la Categoria de su Tratamiento. */
function calcularIngresosPorCategoriaMeses(){
  const now = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:d.getFullYear(), m:d.getMonth()+1, label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}); }
  // Ciclo 2 (Grupo 2) — ya no se busca la categoria en vivo en el
  // catalogo: cada pago trae su propia categoria congelada desde que se
  // creo (Categoria), protegida de cambios posteriores en Tratamientos.
  // #59 — top 3 calculado solo con estos mismos 6 meses (ver nota arriba).
  const totalPorCat = {};
  DATA.pagos.forEach(p=>{ const f=ymd(p.Ultimo_Pago); if(!meses.some(mm=>mm.y===f.y && mm.m===f.m)) return; const cat = p.Categoria||'Otros'; totalPorCat[cat] = (totalPorCat[cat]||0) + Number(p.Monto_Pagado); });
  const topCats = Object.entries(totalPorCat).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  const paleta = ['#2FD8B0','#1B6E5C','#3A4E60'];
  const datasets = topCats.map((cat,i)=>({
    label: cat,
    data: meses.map(({y,m})=> DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m && (p.Categoria||'Otros')===cat; }).reduce((s,p)=>s+Number(p.Monto_Pagado),0)),
    backgroundColor: paleta[i%paleta.length],
  }));
  return { labels: meses.map(x=>x.label), datasets, meses, topCats };
}
/* #59 — top 3 real de UN mes especifico (para mostrarlo como contexto
   arriba del detalle, ya que el top 3 de la leyenda general es del
   periodo completo de 6 meses y puede no coincidir con el de ese mes). */
function calcularTop3DelMes(items, campoMonto, campoCategoria){
  return calcularTodasCategoriasDelMes(items, campoMonto, campoCategoria).slice(0,3);
}
/* #59b2 — todas las categorias que tuvieron actividad ese mes, no solo las
   3 principales — para poder mostrar "otras categorias" debajo del top 3
   en el detalle, y que el usuario nunca se quede sin ver algo que si paso
   ese mes solo porque no entro en el top 3. */
function calcularTodasCategoriasDelMes(items, campoMonto, campoCategoria){
  const totalPorCat = {};
  items.forEach(it=>{ const cat = campoCategoria(it); totalPorCat[cat] = (totalPorCat[cat]||0) + Number(it[campoMonto]); });
  const total = Object.values(totalPorCat).reduce((s,v)=>s+v,0) || 1;
  return Object.entries(totalPorCat).sort((a,b)=>b[1]-a[1]).map(([cat,monto])=>({ cat, monto, pct: Math.round(monto/total*100) }));
}
/* #59a — nombre completo del mes (ej. "Agosto"), separado del texto corto
   que usa el eje de la grafica (ej. "ago") — solo para titulos de ventana. */
function nombreMesCompleto(y, m){
  const nombre = new Date(y, m-1, 1).toLocaleDateString('es-MX', {month:'long'});
  return nombre.charAt(0).toUpperCase() + nombre.slice(1);
}
/* Chip reutilizable para el top 3 y para "otras categorias" — mismo look,
   mismo click, misma logica de resaltado (color solo si es la seleccionada,
   gris neutro las demas — nunca ambiguo entre si esta o no seleccionada). */
function chipCategoria(t, cat, colorFondo, colorBorde){
  const activo = t.cat===cat;
  const estilo = activo
    ? `background:${colorFondo};border:1px solid ${colorBorde};color:${colorBorde};font-weight:600;`
    : `background:#1B2733;border:1px solid transparent;color:#8CA0B3;`;
  return `<span class="chip chip-click" data-cat="${t.cat}" style="cursor:pointer;${estilo}">${t.cat}: ${fmtMoney(t.monto)} (${t.pct}%)</span>`;
}
/* #42f/#42g/#59 — modal con el detalle de una categoria y mes exactos.
   "cat" es opcional: si no se indica (por ejemplo, al tocar un mes que no
   tiene actividad en ninguna de las 3 categorias "fijas" de la grafica —
   #59c), se usa automaticamente la categoria mas fuerte de ESE mes en
   especifico. Los chips del "Top 3 del mes" son clickeables — sin importar
   si esa categoria tiene o no una barra visible ese mes en la grafica de 6
   meses (#59b) — y solo la categoria seleccionada se resalta con su color;
   el resto siempre en gris neutro (#59d, #59e). #59b2 — debajo del top 3
   se agrega "Otras categorias del mes" con el resto de lo que hubo ese mes
   (tambien clickeable) — asi, si la categoria que tocaste en la grafica
   general (top 3 de 6 meses) no es parte del top 3 de ESTE mes, igual se
   encuentra y se resalta ahi abajo, sin perder ningun dato. Ingresos se
   agrupa por TRATAMIENTO (el desglose natural de una categoria), Gastos
   como lista de movimientos individuales. */
function mostrarDetalleIngresosCategoria(cat, y, m, pagina){
  pagina = pagina || 1;
  // Ciclo 2 (Grupo 2) — misma categoria congelada por pago, ya no en vivo.
  const todasDelMes = DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m; });
  const todasCats = calcularTodasCategoriasDelMes(todasDelMes, 'Monto_Pagado', p=>p.Categoria||'Otros');
  const top3Mes = todasCats.slice(0,3);
  const otrasCats = todasCats.slice(3);
  if(!cat) cat = top3Mes.length ? top3Mes[0].cat : null;
  const mesLabelFull = nombreMesCompleto(y, m);
  // #67b — los renglones con $0 pagado son cuentas pendientes, no ingreso
  // todavia — no cuentan como "pago" en esta vista (ni aqui ni en el
  // desglose por pago individual que abre cada tratamiento).
  const items = cat ? todasDelMes.filter(p=>(p.Categoria||'Otros')===cat && Number(p.Monto_Pagado)>0) : [];
  const porTratamiento = {};
  items.forEach(p=>{ if(!porTratamiento[p.Tratamiento]) porTratamiento[p.Tratamiento] = { cantidad:0, total:0 }; porTratamiento[p.Tratamiento].cantidad++; porTratamiento[p.Tratamiento].total += Number(p.Monto_Pagado); });
  const filas = Object.entries(porTratamiento).sort((a,b)=>b[1].total-a[1].total);
  const total = items.reduce((s,p)=>s+Number(p.Monto_Pagado),0);
  // #62/#63 — bloques fijos de 5, sin selector de cantidad (es una ventana
  // secundaria, no necesita la flexibilidad de las tablas principales).
  const porPagina = 5;
  const totalPaginas = Math.max(1, Math.ceil(filas.length/porPagina));
  if(pagina>totalPaginas) pagina = totalPaginas;
  const filasPagina = filas.slice((pagina-1)*porPagina, pagina*porPagina);
  openModal(`<h3>${cat||'Sin movimientos'} — ${mesLabelFull}</h3>
    <p class="subtle" style="margin-bottom:6px;">Top 3 de ${mesLabelFull} (toca una para ver su detalle):</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${otrasCats.length?10:14}px;">
      ${top3Mes.map(t=>chipCategoria(t,cat,'#12291F','var(--teal)')).join('') || '<span class="subtle">Sin movimientos este mes</span>'}
    </div>
    ${otrasCats.length ? `<p class="subtle" style="margin-bottom:6px;">Otras categorías de ${mesLabelFull}:</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
      ${otrasCats.map(t=>chipCategoria(t,cat,'#12291F','var(--teal)')).join('')}
    </div>` : ''}
    <div class="divider"></div>
    <p class="subtle" style="margin-bottom:12px;">${filas.length} tratamiento${filas.length===1?'':'s'} de <b>${cat||'—'}</b> · Total: ${fmtMoney(total)}</p>
    <div class="detail-block-fixed">
    ${filasPagina.map(([nombre,d])=>`<div class="pend-row clickable" data-trat="${nombre}"><span>${nombre} <span class="subtle">· ${d.cantidad} pago${d.cantidad===1?'':'s'}</span></span><b style="color:var(--teal);">${fmtMoney(d.total)}</b></div>`).join('') || '<div class="empty">Sin movimientos</div>'}
    </div>
    ${filas.length>porPagina ? `<div class="paginador" style="padding-top:8px;">
      <span class="subtle">${filas.length} registros</span>
      <div class="paginador-controles">
        <div class="icon-btn" id="detPrevIng" style="${pagina<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
        <span class="subtle">Página ${pagina} de ${totalPaginas}</span>
        <div class="icon-btn" id="detNextIng" style="${pagina>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>` : ''}
    <div class="modal-actions" style="margin-top:14px;"><div class="btn block" onclick="closeModal()">Cerrar</div></div>`);
  document.querySelectorAll('.chip-click').forEach(chip=>{
    chip.addEventListener('click', ()=> mostrarDetalleIngresosCategoria(chip.dataset.cat, y, m));
  });
  // #65 — cada renglon de tratamiento abre el desglose de sus pagos
  // individuales (paciente, fecha, monto), regresando a esta misma vista
  // (no cerrando todo) al terminar — mismo patron que ya usa Pendientes.
  document.querySelectorAll('#modalBody [data-trat]').forEach(row=>{
    row.addEventListener('click', ()=>{
      pushModalState(()=> mostrarDetalleIngresosCategoria(cat, y, m, pagina));
      mostrarDetallePagosTratamiento(row.dataset.trat, cat, y, m, mesLabelFull);
    });
  });
  if(filas.length>porPagina){
    document.getElementById('detPrevIng').addEventListener('click', ()=> mostrarDetalleIngresosCategoria(cat, y, m, pagina-1));
    document.getElementById('detNextIng').addEventListener('click', ()=> mostrarDetalleIngresosCategoria(cat, y, m, pagina+1));
  }
}
/* #65/#67 — desglose de cada pago individual de UN tratamiento, dentro de
   una categoria y mes especificos: paciente, fecha, monto. Un solo boton
   para regresar al detalle de tratamientos del que vino (mismo patron que
   la cadena de Pendientes por cobrar), no cierra todo de un tiron.
   #67b — solo se listan pagos con algo realmente abonado (Monto_Pagado >
   0): un renglon con $0 pagado es una cuenta pendiente, no un ingreso
   todavia, y esta vista es de ingresos. #67c — se puede alternar el orden
   entre fecha y monto con el boton de arriba (lista simple, no es una
   tabla con columnas — por eso no lleva encabezados clickeables como las
   demas pantallas). */
function mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, pagina, orden){
  pagina = pagina || 1;
  orden = orden || 'fecha_desc';
  let pagos = DATA.pagos.filter(p=>{ const f=ymd(p.Ultimo_Pago); return f.y===y && f.m===m && p.Tratamiento===tratamiento && Number(p.Monto_Pagado)>0; });
  // #67c — cada orden es espejo exacto de su opuesto: mismo criterio de
  // desempate, solo invertido, para que "antiguo" sea el espejo perfecto
  // de "reciente" (y "menor" de "mayor"), sin depender del orden en que
  // ya venian los datos antes de ordenar.
  const comparadores = {
    fecha_desc: (a,b)=> b.Ultimo_Pago.localeCompare(a.Ultimo_Pago) || Number(b.Monto_Pagado)-Number(a.Monto_Pagado) || String(b.ID).localeCompare(String(a.ID)),
    fecha_asc: (a,b)=> a.Ultimo_Pago.localeCompare(b.Ultimo_Pago) || Number(a.Monto_Pagado)-Number(b.Monto_Pagado) || String(a.ID).localeCompare(String(b.ID)),
    monto_desc: (a,b)=> Number(b.Monto_Pagado)-Number(a.Monto_Pagado) || b.Ultimo_Pago.localeCompare(a.Ultimo_Pago) || String(b.ID).localeCompare(String(a.ID)),
    monto_asc: (a,b)=> Number(a.Monto_Pagado)-Number(b.Monto_Pagado) || a.Ultimo_Pago.localeCompare(b.Ultimo_Pago) || String(a.ID).localeCompare(String(b.ID)),
  };
  const etiquetasOrden = { fecha_desc:'Más reciente primero', fecha_asc:'Más antiguo primero', monto_desc:'Monto mayor primero', monto_asc:'Monto menor primero' };
  const siguienteOrden = { fecha_desc:'fecha_asc', fecha_asc:'monto_desc', monto_desc:'monto_asc', monto_asc:'fecha_desc' };
  pagos = pagos.sort(comparadores[orden]);
  const total = pagos.reduce((s,p)=>s+Number(p.Monto_Pagado),0);
  const porPagina = 5;
  const totalPaginas = Math.max(1, Math.ceil(pagos.length/porPagina));
  if(pagina>totalPaginas) pagina = totalPaginas;
  const pagosPagina = pagos.slice((pagina-1)*porPagina, pagina*porPagina);
  openModal(`<h3>${tratamiento}</h3>
    <p class="subtle" style="margin-bottom:2px;"><b style="color:var(--text);">Categoría:</b> ${cat} &nbsp;·&nbsp; <b style="color:var(--text);">Mes:</b> ${mesLabelFull}</p>
    <p class="subtle" style="margin-bottom:12px;"><b style="color:var(--text);">Pagos registrados:</b> ${pagos.length} &nbsp;·&nbsp; <b style="color:var(--text);">Total cobrado:</b> ${fmtMoney(total)}</p>
    <div class="link-btn" id="btnOrdenPagoTrat" style="display:inline-block;margin-bottom:10px;cursor:pointer;">↕ Ordenar: ${etiquetasOrden[orden]}</div>
    <div class="detail-block-fixed">
    ${pagosPagina.map(p=>`<div class="pend-row"><span>${p.Paciente} <span class="subtle">· ${formatearFecha(p.Ultimo_Pago)}</span></span><b style="color:var(--teal);">${fmtMoney(p.Monto_Pagado)}</b></div>`).join('') || '<div class="empty">Sin movimientos</div>'}
    </div>
    ${pagos.length>porPagina ? `<div class="paginador" style="padding-top:8px;">
      <span class="subtle">${pagos.length} registros</span>
      <div class="paginador-controles">
        <div class="icon-btn" id="detPrevPagoTrat" style="${pagina<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
        <span class="subtle">Página ${pagina} de ${totalPaginas}</span>
        <div class="icon-btn" id="detNextPagoTrat" style="${pagina>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>` : ''}
    <div class="modal-actions" style="margin-top:14px;"><div class="btn block" id="btnVolverPagoTrat">Regresar</div></div>`);
  document.getElementById('btnOrdenPagoTrat').addEventListener('click', ()=> mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, 1, siguienteOrden[orden]));
  document.getElementById('btnVolverPagoTrat').addEventListener('click', volverModal);
  if(pagos.length>porPagina){
    document.getElementById('detPrevPagoTrat').addEventListener('click', ()=>{ pagina--; mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, pagina, orden); });
    document.getElementById('detNextPagoTrat').addEventListener('click', ()=>{ pagina++; mostrarDetallePagosTratamiento(tratamiento, cat, y, m, mesLabelFull, pagina, orden); });
  }
}
/* #68 — mismo mecanismo de orden de 4 vias que #67c (fecha/monto,

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${otrasCats.length?10:14}px;">

    </div>

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
      ${otrasCats.map(t=>chipCategoria(t,cat,'#2A1417','#E0555A')).join('')}

    <div class="divider"></div>
    <p class="subtle" style="margin-bottom:12px;">${items.length} gasto${items.length===1?'':'s'} de <b>${cat||'—'}</b> · Total: ${fmtMoney(total)}</p>

    </div>
    ${items.length>porPagina ? `<div class="paginador" style="padding-top:8px;">

/* Tooltip de Chart.js "externo": en vez de dejar que Chart.js lo posicione
   dentro del canvas (donde queda a merced de cualquier overflow:hidden en
   los contenedores de arriba), lo dibujamos nosotros en un div propio
   pegado a <body> con position:fixed, y le calculamos la posicion a mano
   para que nunca se salga de la pantalla. */
/* #55 — el tooltip de la dona vive pegado a <body>, no dentro de la
   pestaña ni de la tarjeta (necesario para que nunca se corte, ver #1).
   Por eso, a diferencia del tooltip nativo de Chart.js que usan las demas
   graficas, no se oculta solo al hacer scroll o cambiar de pestaña en
   movil (donde no hay "mouse que se aleja" para que Chart.js lo detecte
   solo) — hay que ocultarlo nosotros a mano en esos casos. */
function ocultarChartTooltip(){
  const t = document.getElementById('chartTooltipEl');
  if(t) t.style.opacity = 0;
  // #55 (seguimiento) — al hacer scroll, tambien se le pide a todas las
  // demas graficas (las que usan el tooltip nativo de Chart.js) que
  // quiten cualquier tooltip que tengan abierto — en movil, sin un mouse
  // que "se aleje" solo, se quedarian pegadas hasta que tocaras otra
  // parte de la pantalla.
  if(typeof Chart!=='undefined' && Chart.instances){
    Object.values(Chart.instances).forEach(c=>{
      try{ if(c && c.tooltip){ c.tooltip.setActiveElements([], {x:0,y:0}); c.update(); } }
      catch(err){ /* una grafica fantasma no debe frenar al resto */ }
    });
  }
}
window.addEventListener('scroll', ocultarChartTooltip, true);
function chartTooltipHandler(context){
  let tip = document.getElementById('chartTooltipEl');
  if(!tip){ tip = document.createElement('div'); tip.id='chartTooltipEl'; tip.className='chart-tooltip'; document.body.appendChild(tip); }
  const model = context.tooltip;
  if(!model || model.opacity===0){ tip.style.opacity = 0; return; }
  const dp = model.dataPoints && model.dataPoints[0];
  if(dp){
    const data = context.chart.data.datasets[0].data;
    const total = data.reduce((s,v)=>s+Number(v),0);
    const pct = total>0 ? Math.round(Number(dp.raw)/total*100) : 0;
    const bg = dp.dataset.backgroundColor;
    const color = Array.isArray(bg) ? bg[dp.dataIndex] : bg;
    tip.innerHTML = `<b><span class="dot" style="background:${color}"></span>${dp.label}</b><div>${fmtMoney(dp.raw)} (${pct}%)</div>`;
  }
  const rect = context.chart.canvas.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth || 160;
  const th = tip.offsetHeight || 40;
  let x = rect.left + model.caretX - tw/2;
  let y = rect.top + model.caretY - th - 12;
  x = Math.min(Math.max(x, 8), window.innerWidth - tw - 8);
  y = Math.max(y, 8);
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function drawDashboardCharts(){
  const now = new Date();
  const byWeek = {};
  // #60 — antes sumaba TODOS los pagos de siempre, sin filtrar por mes.
  // Con S1-S5 siendo "dia 1-7", "dia 8-14"... de CUALQUIER mes, un pago de
  // julio en S1 se sumaba junto con uno de agosto en S1 — por eso el
  // dashboard mostraba mas dinero que la grafica de Finanzas (que si
  // filtra al mes en curso). Ahora ambas usan la misma regla.
  DATA.pagos.forEach(p=>{ if(!esMesActual(p.Ultimo_Pago, now)) return; const w='S'+Math.ceil(diaDelMes(p.Ultimo_Pago)/7); byWeek[w]=(byWeek[w]||0)+Number(p.Monto_Pagado); });
  const weeks=['S1','S2','S3','S4','S5'];
  const cashEl = document.getElementById('cashChart');
  if(cashEl){ let running=0; const cum=weeks.map(w=>{running+=byWeek[w]||0;return running;});
