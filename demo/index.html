            <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" class="hDiaActivo" ${activo?'checked':''}><b>${dia}</b></label>
            <span class="subtle">${activo?'Abierto':'Cerrado'}</span>
          </div>
          <div class="turnos-list">
            ${turnos.filter(t=>t.HoraInicio||t.HoraFin).map((t,i)=>`
            <div class="turno-row" data-idx="${i}">
              <input type="time" class="hInicio" value="${t.HoraInicio||''}">
              <input type="time" class="hFin" value="${t.HoraFin||''}">
              <div class="icon-btn" data-remove-turno><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
            </div>`).join('')}
          </div>
          <div class="add-turno" data-add-turno>+ Agregar turno</div>
        </div>`;
      }).join('')}
    </div>
    <div class="btn primary" id="btnGuardarHorario" style="margin-top:12px;">Guardar horario</div>
  </div>
  <div class="referral-teaser" id="referralTeaser">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    ¿Sabías que puedes ganar ${fmtComision(DATA.comisionMonto)} por cada colega que refieras? Toca para ver más.
  </div>`;
}

/* ==================== EVENTOS POST-RENDER ==================== */
function afterRenderHooks(){
  document.querySelectorAll('[data-goto]').forEach(el=>{ el.addEventListener('click', ()=> setTab(el.dataset.goto)); });

  if(ACTIVE_TAB === 'dashboard'){
    drawDashboardCharts();
    document.getElementById('pendienteCard').addEventListener('click', showPendientesModal);
  }

  if(ACTIVE_TAB === 'pacientes'){
    fillPacientesTable(SEARCH_STATE.pacientes);
    document.getElementById('pacSearch').addEventListener('input', e=>{ SEARCH_STATE.pacientes = e.target.value; PAGINATION.pacientes.page = 1; fillPacientesTable(e.target.value); });
    document.getElementById('btnAddPaciente').addEventListener('click', ()=>{
      let selectedTrats = [];
      openModal(`
        <h3>Nuevo paciente</h3>
        <div class="field" style="margin-bottom:12px;"><label>Nombre completo</label><input id="mNombre"></div>
        <div class="field" style="margin-bottom:12px;"><label>Teléfono <span class="subtle">(sin prefijo, solo ${telefonoInfo().longitud} dígitos)</span></label><input id="mTelefono" type="tel" inputmode="numeric" maxlength="${telefonoInfo().longitud}"></div>
        <div class="field" style="margin-bottom:6px;"><label>Última visita (opcional)</label><input id="mUltimaVisitaAnterior" type="date" max="${todayStr()}"></div>
        <p class="subtle" style="margin-bottom:18px;">Solo si el paciente ya tenía historial antes de usar el sistema. En cuanto le agendes su primera cita aquí, el sistema calcula su última visita solo.</p>
        <div class="field" style="margin:0 0 20px;padding:2px 0;"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;"><input type="checkbox" id="mHistorialPrevio"> Ya era mi paciente antes de usar el sistema</label>
          <p class="subtle" style="margin:8px 0 0;">Márcalo aunque no sepas la fecha exacta de su última visita — evita que este paciente cuente como "nuevo" en las gráficas del dashboard.</p>
        </div>
        <div class="field" style="margin-bottom:12px;"><label>Tratamientos</label>
          <div class="picker-btn" id="mTratBtn">Selecciona uno o varios tratamientos</div>
          <div class="chip-row" id="mTratChips"></div>
        </div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="mGuardarPaciente">Guardar</div></div>`);
      document.getElementById('mTratBtn').addEventListener('click', ()=>{
        openTreatmentPicker(selectedTrats, (sel)=>{ selectedTrats = sel; document.getElementById('mTratChips').innerHTML = selectedTrats.map(t=>`<span class="chip">${t}</span>`).join(''); });
      });
      // #74 — filtra en vivo cualquier caracter que no sea digito (letras,
      // espacios, simbolos) mientras el usuario escribe. maxlength por si
      // solo no bastaba: limitaba la CANTIDAD de caracteres, no el TIPO.
      document.getElementById('mTelefono').addEventListener('input', e=>{
        e.target.value = e.target.value.replace(/\D/g,'').slice(0, telefonoInfo().longitud);
      });
      document.getElementById('mGuardarPaciente').addEventListener('click', async ()=>{
        const nombre = document.getElementById('mNombre').value.trim();
        const tel = document.getElementById('mTelefono').value.trim();
        const ultimaVisitaAnterior = document.getElementById('mUltimaVisitaAnterior').value || '';
        const historialPrevio = document.getElementById('mHistorialPrevio').checked;
        // #71 — telefono ahora obligatorio: exactamente N digitos (N segun el
        // pais configurado), sin prefijo — evita capturas basura ahora que
        // todavia no hay forma de editar el registro despues de creado.
        // #73 — mismo patron que Tratamiento y Citas: junta TODOS los campos
        // faltantes en un solo mensaje, en vez de mostrarlos uno por uno en
        // envios separados.
        const infoTel = telefonoInfo();
        const faltanPac = []; if(!nombre) faltanPac.push('Nombre completo'); if(!tel) faltanPac.push('Teléfono');
        if(faltanPac.length) return showToast('Completa: '+faltanPac.join(', '));
        if(!/^\d+$/.test(tel) || tel.length!==infoTel.longitud) return showToast(`El teléfono debe tener exactamente ${infoTel.longitud} dígitos (sin prefijo)`);
        let id = 'P' + String(DATA.pacientes.length+1).padStart(3,'0');
        if(CONFIG.API_URL){
          await apiCall('add_paciente', { nombre, telefono:tel, tratamientos: selectedTrats.join(', '), ultimaVisitaAnterior, historialPrevio }, ['pacientes']);
        } else {
          DATA.pacientes.push({ID:id, Nombre:nombre, Telefono:tel, Ultima_Visita: ultimaVisitaAnterior || '—', Tratamientos: selectedTrats.join(', '), Estado:'Activo', HistorialPrevio: historialPrevio?'Si':''});
        }
        closeModal(); showToast('Paciente agregado'); render();
      });
    });
  }

  if(ACTIVE_TAB === 'finanzas'){
    drawFinanzasChart();
    fillPagosTable(SEARCH_STATE.pagos); fillGastosTable(SEARCH_STATE.gastos);
    document.getElementById('pagoSearch').addEventListener('input', e=>{ SEARCH_STATE.pagos = e.target.value; PAGINATION.pagos.page = 1; fillPagosTable(e.target.value); });
    document.getElementById('gastoSearch').addEventListener('input', e=>{ SEARCH_STATE.gastos = e.target.value; PAGINATION.gastos.page = 1; fillGastosTable(e.target.value); });
    // Ciclo 2 (Grupo 2) — misma reestructuracion que Gastos: funcion
    // reutilizable con prefill, para poder reabrir el formulario ya
    // lleno desde el boton "Modificar" de la confirmacion.
    function abrirModalRegistrarPago(prefill){
      let selPac = (prefill && prefill.selPac) || null;
      let selTrat = (prefill && prefill.selTrat) || null;
      openModal(`
        <h3>Registrar pago</h3>
        <div class="field" style="margin-bottom:12px;"><label>Paciente</label><div class="picker-btn" id="pgPacBtn">${selPac?selPac.Nombre:'Selecciona un paciente'}</div></div>
        <div class="field" style="margin-bottom:12px;"><label>Tratamiento</label><div class="picker-btn" id="pgTratBtn">${selTrat?selTrat.nombre:'Selecciona un tratamiento'}</div></div>
        <div class="field" style="margin-bottom:12px;"><label>Inicio del tratamiento <span class="subtle">(si empezó antes de hoy, indícalo aquí)</span></label><input id="pgInicioTrat" type="date" value="${(prefill&&prefill.inicioTrat)||todayStr()}" max="${todayStr()}"></div>
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="field"><label>Monto total</label><input id="pgTotal" type="text" readonly placeholder="Se llena al elegir tratamiento" value="${selTrat?fmtMoney(selTrat.precio):''}"></div>
          <div class="field"><label>Monto pagado</label><input id="pgPagado" type="text" inputmode="decimal" placeholder="0" value="${prefill&&prefill.pagado?prefill.pagado:''}"></div>
        </div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="mGuardarPago">Guardar</div></div>`);
      if(selTrat) document.getElementById('pgTotal').dataset.raw = selTrat.precio;
      attachSaneoMonto('pgPagado');
      document.getElementById('pgPacBtn').addEventListener('click', ()=>{
        openPatientPicker((pac)=>{ selPac = pac; document.getElementById('pgPacBtn').textContent = pac.Nombre; }, false);
      });
      document.getElementById('pgTratBtn').addEventListener('click', ()=>{
        openTreatmentPickerSingleScoped(selPac, (t)=>{ selTrat = t; document.getElementById('pgTratBtn').textContent = t.nombre; document.getElementById('pgTotal').value = fmtMoney(t.precio); document.getElementById('pgTotal').dataset.raw = t.precio; });
      });
      document.getElementById('mGuardarPago').addEventListener('click', ()=>{
        const faltanPago = []; if(!selPac) faltanPago.push('Paciente'); if(!selTrat) faltanPago.push('Tratamiento');
        if(faltanPago.length) return showToast('Completa: '+faltanPago.join(', '));
        const total = Number(document.getElementById('pgTotal').dataset.raw)||0;
        const pagado = parsearMonto(document.getElementById('pgPagado').value);
        const inicioTrat = document.getElementById('pgInicioTrat').value || todayStr();
        // Ciclo 2 / Ronda 2 (#9 de Pagos) — antes se usaba .find() (se
        // quedaba con el PRIMER pago abierto que encontrara para ese
        // tratamiento, ignorando si habia mas de uno). Ahora se buscan
        // TODOS los abiertos y, si hay mas de uno, se deja elegir a cual
        // abonar en vez de asumir cual es.
        const existentes = DATA.pagos.filter(p=>p.Paciente_ID===selPac.ID && p.Tratamiento===selTrat.nombre && Number(p.Saldo)>0);
        if(existentes.length){
          // Ciclo 2 / Ronda 3 (#9 de Pagos) — mismo bug de fondo que ya se
          // corrigio en Categorias: "Cancelar" dentro del modal de abono
          // hacia closeModal() sin que hubiera ningun estado guardado al
          // que volver (aqui se cerraba esta misma lista con closeModal()
          // ANTES de abrir el abono, perdiendola por completo). Se corrige
          // con el mismo patron que ya usa "Elige el pago a abonar":
          // pushModalState() guarda esta lista antes de abrir el abono, y
          // se le pasa un volverInit que la reconstruye completa (con sus
          // eventos ya reconectados) si el usuario cancela el abono.
          // Ciclo 2 / Ronda 4 (#12 de Pagos) — mismo patron de 5 por
          // pagina + paginador que ya usa el detalle de "Ingresos por
          // categoria", para que esta lista no crezca sin limite si algun
          // dia hay muchos pagos abiertos del mismo tratamiento.
          function mostrarListaExistentes(pagina){
            pagina = pagina || 1;
            const porPagina = 5;
            const totalPaginas = Math.max(1, Math.ceil(existentes.length/porPagina));
            if(pagina>totalPaginas) pagina = totalPaginas;
            const existentesPagina = existentes.slice((pagina-1)*porPagina, pagina*porPagina);
            const listaHtml = existentesPagina.map(p=>`<div class="pend-row"><span>Inicio: ${formatearFecha(p.Inicio_Tratamiento)} <span class="subtle">· Saldo: ${fmtMoney(p.Saldo)}</span></span><div class="btn sm" data-abonar-existente="${p.ID}">Abonar</div></div>`).join('');
            // Ciclo 2 / Ronda 6 (#12 de Pagos) — 2 correcciones: (1) la
            // ventana regresa a su tamaño normal (el ancho no era el
            // problema real). (2) el contenedor de la lista reserva
            // espacio fijo para "porPagina" renglones (5), sin importar
            // cuantos haya de verdad en la pagina actual — asi pasar de
            // una pagina con 5 a una con 1 ya no hace que toda la ventana
            // cambie de tamaño de golpe. Mismo principio que ya usan las
            // tablas principales (actualizarAlturaTabla).
            openModal(`
              <h3>${existentes.length>1?'Ya existen pagos pendientes':'Ya existe un pago pendiente'}</h3>
              <p style="font-size:13px;margin-bottom:14px;">${selPac.Nombre} ya tiene ${existentes.length>1?`${existentes.length} registros de`:'un registro de'} <b>${selTrat.nombre}</b> con saldo pendiente. ¿Quieres abonar a ${existentes.length>1?'alguno de los existentes':'ese registro'} en vez de crear uno nuevo?</p>
              <div style="margin-bottom:16px;min-height:${porPagina*45}px;">${listaHtml}</div>
              ${existentes.length>porPagina ? `<div class="paginador" style="padding-top:8px;margin-bottom:16px;">
                <span class="subtle">${existentes.length} registros</span>
                <div class="paginador-controles">
                  <div class="icon-btn" id="pendExistPrev" style="${pagina<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
                  <span class="subtle">Página ${pagina} de ${totalPaginas}</span>
                  <div class="icon-btn" id="pendExistNext" style="${pagina>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
                </div>
              </div>` : ''}
              <div class="modal-actions">
                <div class="btn block" id="btnCrearNuevo">Crear registro nuevo de todas formas</div>
              </div>`);
            // openAbonoModal ya hace su propio pushModalState(volverInit)
            // internamente — no hace falta (y seria un duplicado en la
            // pila) llamarlo tambien aqui.
            document.querySelectorAll('[data-abonar-existente]').forEach(btn=>{
              btn.addEventListener('click', ()=>{
                openAbonoModal(btn.dataset.abonarExistente, ()=>{ fillPagosTable(SEARCH_STATE.pagos); }, ()=>mostrarListaExistentes(pagina));
              });
            });
            if(existentes.length>porPagina){
              document.getElementById('pendExistPrev').addEventListener('click', ()=> mostrarListaExistentes(pagina-1));
              document.getElementById('pendExistNext').addEventListener('click', ()=> mostrarListaExistentes(pagina+1));
            }
            document.getElementById('btnCrearNuevo').addEventListener('click', ()=>{
              confirmarYGuardarPago(selPac, selTrat, total, pagado, inicioTrat);
            });
          }
          closeModal();
          mostrarListaExistentes();
          return;
        }
        confirmarYGuardarPago(selPac, selTrat, total, pagado, inicioTrat);
      });
    }
    // Ciclo 2 (Grupo 2) — confirmacion antes de guardar: un pago solo se
    // puede eliminar despues si nadie le ha abonado nada, asi que se
    // avisa antes de que sea (casi siempre) permanente. "Modificar"
    // reabre el formulario ya lleno con lo mismo que se habia
    // seleccionado/escrito.
    function confirmarYGuardarPago(selPac, selTrat, total, pagado, inicioTrat){
      closeModal();
      openModal(`
        <h3>¿Confirmas este pago?</h3>
        <p style="font-size:13px;margin-bottom:6px;">Paciente: <b>${selPac.Nombre}</b></p>
        <p style="font-size:13px;margin-bottom:6px;">Tratamiento: <b>${selTrat.nombre}</b></p>
        <p style="font-size:13px;margin-bottom:6px;">Total: <b>${fmtMoney(total)}</b> · Pagado: <b>${fmtMoney(pagado)}</b></p>
        <p style="font-size:13px;margin-bottom:16px;">Una vez guardado, este registro no podrá eliminarse del sistema — solo podrás corregirlo mediante abonos adicionales. Revisa bien los datos antes de continuar.</p>
        <div class="modal-actions"><div class="btn block" id="pgModificar">Modificar</div><div class="btn primary block" id="pgConfirmar">Confirmar y guardar</div></div>`);
      document.getElementById('pgModificar').addEventListener('click', ()=> abrirModalRegistrarPago({selPac, selTrat, inicioTrat, pagado}));
      document.getElementById('pgConfirmar').addEventListener('click', async ()=>{
        await guardarPagoNuevo(selPac, selTrat, total, pagado, inicioTrat);
      });
    }
    document.getElementById('btnAddPago').addEventListener('click', ()=> abrirModalRegistrarPago(null));
    // Ciclo 2 (Grupo 2) — el formulario se armo como funcion reutilizable
    // (en vez de un listener inline de un solo uso) para poder reabrirlo
    // pre-llenado desde el boton "Modificar" de la confirmacion, sin
    // depender de restaurar HTML crudo con listeners muertos.
    function abrirModalRegistrarGasto(prefill){
      let categoriaSelGasto = (prefill && prefill.categoria) || (DATA.categorias_gasto[0] ? DATA.categorias_gasto[0].Categoria : '');
      openModal(`
        <h3>Registrar gasto</h3>
        <div class="field" style="margin-bottom:12px;"><label>Concepto</label><input id="gConcepto" value="${prefill?prefill.concepto:''}"></div>
        <div class="field" style="margin-bottom:12px;"><label>Categoría</label>
          <div class="picker-btn" id="gCatBtn">${categoriaSelGasto}</div></div>
        <div class="field" style="margin-bottom:16px;"><label>Monto</label><input id="gMonto" type="text" inputmode="decimal" placeholder="0${separadorDecimal()}00" value="${prefill?String(prefill.monto).replace('.', separadorDecimal()):''}"></div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="mGuardarGasto">Guardar</div></div>`);
      attachSaneoMonto('gMonto');
      document.getElementById('gCatBtn').addEventListener('click', ()=>{
        openGastoCategoryPicker(categoriaSelGasto, (cat)=>{ categoriaSelGasto = cat; document.getElementById('gCatBtn').textContent = cat; });
      });
      document.getElementById('mGuardarGasto').addEventListener('click', ()=>{
        const concepto = document.getElementById('gConcepto').value.trim();
        const categoria = categoriaSelGasto;
        const monto = parsearMonto(document.getElementById('gMonto').value);
        const faltanGasto = []; if(!concepto) faltanGasto.push('Concepto'); if(monto<=0) faltanGasto.push('Monto');
        if(faltanGasto.length) return showToast('Completa: '+faltanGasto.join(', '));
        // Ciclo 2 (Grupo 2) — confirmacion antes de guardar: Gastos nunca
        // se puede eliminar despues, asi que se avisa claro antes de que
        // sea permanente. "Modificar" reabre el formulario ya lleno con
        // lo mismo que se habia escrito (no restaura HTML crudo, vuelve a
        // armar el modal desde cero con los valores como prefill — asi
        // los botones quedan con sus eventos funcionando de verdad).
        openModal(`
          <h3>¿Confirmas este gasto?</h3>
          <p style="font-size:13px;margin-bottom:6px;">Concepto: <b>${concepto}</b></p>
          <p style="font-size:13px;margin-bottom:6px;">Categoría: <b>${categoria}</b></p>
          <p style="font-size:13px;margin-bottom:16px;">Monto: <b>${fmtMoney(monto)}</b></p>
          <p style="font-size:13px;margin-bottom:16px;">Una vez guardado, este registro no podrá eliminarse del sistema — solo podrás corregirlo editando sus datos. Revisa bien antes de continuar.</p>
          <div class="modal-actions"><div class="btn block" id="gModificar">Modificar</div><div class="btn primary block" id="gConfirmar">Confirmar y guardar</div></div>`);
        document.getElementById('gModificar').addEventListener('click', ()=> abrirModalRegistrarGasto({concepto, categoria, monto}));
        document.getElementById('gConfirmar').addEventListener('click', async ()=>{
          let id = 'G' + String(DATA.gastos.length+1).padStart(3,'0');
          if(CONFIG.API_URL){
            await apiCall('add_gasto', { fecha:todayStr(), concepto, categoria, monto }, ['gastos']);
          } else {
            DATA.gastos.push({ID:id, Fecha:todayStr(), Concepto:concepto, Categoria:categoria, Monto:monto});
          }
          closeModal(); showToast('Gasto registrado'); render();
        });
      });
    }
    document.getElementById('btnAddGasto').addEventListener('click', ()=> abrirModalRegistrarGasto(null));
  }

  if(ACTIVE_TAB === 'tratamientos'){
    fillTratamientosTable(SEARCH_STATE.tratamientos);
    document.getElementById('tratSearch').addEventListener('input', e=>{ SEARCH_STATE.tratamientos = e.target.value; PAGINATION.tratamientos.page = 1; fillTratamientosTable(e.target.value); });
    document.getElementById('btnAddTratamiento').addEventListener('click', ()=>{
      let categoriaSel = DATA.categorias_tratamiento[0] ? DATA.categorias_tratamiento[0].Categoria : '';
      openModal(`
        <h3>Nuevo tratamiento</h3>
        <div class="field" style="margin-bottom:12px;"><label>Nombre</label><input id="mtNombre"></div>
        <div class="field" style="margin-bottom:12px;"><label>Categoría</label><div class="picker-btn" id="mtCatBtn">${categoriaSel}</div></div>
        <div class="field" style="margin-bottom:12px;"><label>Precio</label><input id="mtPrecio" type="text" inputmode="decimal" placeholder="0${separadorDecimal()}00"></div>
        <div class="field" style="margin-bottom:12px;"><label>Duración aproximada (minutos)</label><input id="mtDuracion" type="number" value="30" min="5" step="5"></div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="mGuardarTratamiento">Guardar</div></div>`);
      attachSaneoMonto('mtPrecio');
      document.getElementById('mtCatBtn').addEventListener('click', ()=>{
        openCategoryPicker(categoriaSel, (cat)=>{ categoriaSel = cat; document.getElementById('mtCatBtn').textContent = cat; });
      });
      document.getElementById('mGuardarTratamiento').addEventListener('click', async ()=>{
        const nombre = document.getElementById('mtNombre').value.trim();
        const precio = parsearMonto(document.getElementById('mtPrecio').value);
        const duracionMin = Number(document.getElementById('mtDuracion').value)||30;
        const faltanTrat = []; if(!nombre) faltanTrat.push('Nombre'); if(precio<=0) faltanTrat.push('Precio');
        if(faltanTrat.length) return showToast('Completa: '+faltanTrat.join(', '));
        let id = 'T' + String(DATA.tratamientos.length+1).padStart(2,'0');
        if(CONFIG.API_URL){
          await apiCall('add_tratamiento', { nombre, categoria:categoriaSel, precio, duracionMin }, ['tratamientos']);
        } else {
          DATA.tratamientos.push({ID:id, Nombre:nombre, Categoria:categoriaSel, Precio_MXN:precio, Duracion_Min:duracionMin});
        }
        closeModal(); showToast('Tratamiento agregado'); render();
      });
    });
  }

  if(ACTIVE_TAB === 'agendar'){
    let selectedTrats = []; let selectedPac = null;
    document.getElementById('btnActualizarAgenda').addEventListener('click', actualizarAgenda);
    document.getElementById('citaTratBtn').addEventListener('click', ()=>{
      openTreatmentPickerScoped(selectedPac, selectedTrats, (sel)=>{ selectedTrats = sel; document.getElementById('citaTratChips').innerHTML = selectedTrats.map(t=>`<span class="chip">${t}</span>`).join(''); });
    });
    document.getElementById('citaPacBtn').addEventListener('click', ()=>{
      openPatientPicker((pac)=>{
        selectedPac = pac;
        document.getElementById('citaPacBtn').textContent = pac.Nombre;
        document.getElementById('citaPacienteId').value = pac.ID;
        // Los tratamientos ya elegidos eran (posiblemente) de otro paciente — se limpian al cambiar de paciente.
        selectedTrats = [];
        document.getElementById('citaTratChips').innerHTML = '';
        document.getElementById('citaTratBtn').textContent = 'Selecciona uno o varios tratamientos';
      }, true);
    });
    document.getElementById('btnGuardarCita').addEventListener('click', ()=>{
      const fecha = document.getElementById('citaFecha').value;
      const hora = document.getElementById('citaHora').value;
      const faltanCita = []; if(!selectedPac) faltanCita.push('Paciente'); if(selectedTrats.length===0) faltanCita.push('Tratamientos'); if(!fecha) faltanCita.push('Fecha'); if(!hora) faltanCita.push('Hora');
      if(faltanCita.length) return showToast('Completa: '+faltanCita.join(', '));
      openModal(`
        <h3>Confirmar cita</h3>
        <div class="summary-row"><span>Paciente</span><span>${selectedPac.Nombre}</span></div>
        <div class="summary-row"><span>Tratamientos</span><span>${selectedTrats.join(', ')}</span></div>
        <div class="summary-row"><span>Fecha</span><span>${formatearFecha(fecha)}</span></div>
        <div class="summary-row"><span>Hora</span><span>${formatearHora(hora)}</span></div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Corregir</div><div class="btn primary block" id="confirmCita">Confirmar y agendar</div></div>`);
      document.getElementById('confirmCita').addEventListener('click', ()=>{
        closeModal();
        guardarCitaNueva(selectedPac, selectedTrats, fecha, hora, false);
      });
    });

    document.getElementById('csvFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim().length>0);
        if(lines.length<2) return showToast('El archivo esta vacio');
        const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
        const iPac = headers.indexOf('paciente'), iTrat = headers.indexOf('tratamientos'), iFecha = headers.indexOf('fecha'), iHora = headers.indexOf('hora');
        if(iPac<0||iTrat<0||iFecha<0||iHora<0) return showToast('El CSV debe tener las columnas: Paciente, Tratamientos, Fecha, Hora');
        const preview = lines.slice(1).map(line=>{
          const cols = line.split(',');
          const nombre = (cols[iPac]||'').trim();
          const trats = (cols[iTrat]||'').trim().split(';').map(s=>s.trim()).filter(Boolean);
          const fecha = (cols[iFecha]||'').trim();
          const hora = (cols[iHora]||'').trim();
          const pac = DATA.pacientes.find(p=> normalize(p.Nombre)===normalize(nombre) && p.Estado!=='Inactivo');
          // #72 — un tratamiento requiere datos relacionados (precio, categoria,
          // duracion) que solo existen si esta dado de alta en el sistema. Sin
          // esta validacion, una fila con un tratamiento inexistente pasaba la
          // vista previa como valida, se agregaba a DATA.citas en memoria (por
          // eso aparecia en la tarjeta), pero el backend no podia guardarla en
          // el Sheet ni en Calendar — se perdia en silencio. Mismo patron que
          // ya usa la validacion de paciente.
          const tratInexistente = trats.find(t=> !DATA.tratamientos.some(dt=> normalize(dt.Nombre)===normalize(t)));
          let error = '';
          if(!pac) error = 'Paciente no encontrado o inactivo';
          else if(tratInexistente) error = `Tratamiento "${tratInexistente}" no registrado`;
          else if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) error = 'Fecha invalida (usar AAAA-MM-DD)';
          else if(!/^\d{2}:\d{2}$/.test(hora)) error = 'Hora invalida (usar HH:MM)';
          return { nombre, trats, fecha, hora, pac, error };
        });
        const validRows = preview.filter(r=>!r.error);
        openModal(`
          <h3>Vista previa de importacion (${preview.length} filas)</h3>
          <div class="table-wrap" style="max-height:320px;overflow-y:auto;margin-bottom:14px;">
            <table><thead><tr><th>Paciente</th><th>Tratamientos</th><th>Fecha</th><th>Hora</th><th>Estado</th></tr></thead>
            <tbody>${preview.map(r=>`<tr><td>${r.nombre}</td><td>${r.trats.join(', ')}</td><td>${formatearFecha(r.fecha)}</td><td>${formatearHora(r.hora)}</td><td>${r.error?`<span class="badge cancel">${r.error}</span>`:`<span class="badge ok">OK</span>`}</td></tr>`).join('')}</tbody></table>
          </div>
          <p class="subtle" style="margin-bottom:10px;">${validRows.length} de ${preview.length} filas se importaran. Las filas con error se omiten.</p>
          <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="confirmCsv">Importar ${validRows.length} citas</div></div>`, true);
        document.getElementById('confirmCsv').addEventListener('click', async ()=>{
          for(const r of validRows){
            let id = 'C' + String(DATA.citas.length+1).padStart(3,'0');
            if(CONFIG.API_URL){
              const res = await apiCall('add_cita', { pacienteId:r.pac.ID, paciente:r.pac.Nombre, tratamientos:r.trats.join(', '), fecha:r.fecha, hora:r.hora });
              if(res && res.id) id = res.id;
            }
            DATA.citas.push({ID:id, Fecha:r.fecha, Hora:r.hora, Paciente_ID:r.pac.ID, Paciente:r.pac.Nombre, Tratamientos:r.trats.join(', '), Estado:'Confirmada'});
          }
          closeModal(); showToast(`${validRows.length} citas importadas`); render();
        });
      };
      reader.readAsText(file);
    });

    attachCitasListHandlers();
  }

  if(ACTIVE_TAB === 'configuracion'){
    document.getElementById('btnGuardarConfig').addEventListener('click', async ()=>{
      CONFIG.CURRENCY = document.getElementById('cfgMoneda').value;
      CONFIG.PHONE_COUNTRY = document.getElementById('cfgPaisTelefono').value;
      CONFIG.DIAS_SIN_VISITA = Number(document.getElementById('cfgDiasSinVisita').value) || 60;
      // Grupo 1 (#27/#28/#34/#35)
      CONFIG.FORMATO_HORA = document.getElementById('cfgFormatoHora').value;
      CONFIG.FORMATO_FECHA = document.getElementById('cfgFormatoFecha').value;
      CONFIG.SEPARADOR = document.getElementById('cfgSeparador').value;
      CONFIG.DECIMALES_PRECIO = document.getElementById('cfgDecimalesPrecio').value === 'true';
      if(CONFIG.API_URL){
        // Ciclo 1 / Ronda 3 (#7/#5f) — causa real de "tardo minutos": esto
        // eran 7 peticiones SEPARADAS al servidor, una por una, cada una
        // esperando a que la anterior terminara. Cada peticion a Apps
        // Script tiene un costo real solo por arrancar (1-3s tipico) —
        // 7 en fila facilmente se vuelven "minutos". Ahora es 1 sola
        // peticion con las 7 claves juntas.
        await apiCall('set_config', [
          { clave:'Moneda', valor: CONFIG.CURRENCY },
          { clave:'PaisTelefono', valor: CONFIG.PHONE_COUNTRY },
          { clave:'DiasSinVisita', valor: CONFIG.DIAS_SIN_VISITA },
          { clave:'FormatoHora', valor: CONFIG.FORMATO_HORA },
          { clave:'FormatoFecha', valor: CONFIG.FORMATO_FECHA },
          { clave:'Separador', valor: CONFIG.SEPARADOR },
          { clave:'DecimalesPrecio', valor: CONFIG.DECIMALES_PRECIO },
        ], ['config']);
      }
      showToast('Configuración guardada');
      render();
    });
    document.getElementById('referralTeaser').addEventListener('click', showReferidosModal);
    document.querySelectorAll('.day-block').forEach(block=>{
      block.querySelector('[data-add-turno]').addEventListener('click', ()=>{
        const list = block.querySelector('.turnos-list');
        const row = document.createElement('div');
        row.className = 'turno-row';
        row.innerHTML = `<input type="time" class="hInicio" value=""><input type="time" class="hFin" value=""><div class="icon-btn" data-remove-turno><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>`;
        list.appendChild(row);
        row.querySelector('[data-remove-turno]').addEventListener('click', ()=> row.remove());
      });
      block.querySelectorAll('[data-remove-turno]').forEach(btn=>{ btn.addEventListener('click', (e)=> e.target.closest('.turno-row').remove()); });
    });
    document.getElementById('btnGuardarHorario').addEventListener('click', async ()=>{
      const nuevoHorario = [];
      document.querySelectorAll('.day-block').forEach(block=>{
        const dia = block.dataset.dia;
        const activo = block.querySelector('.hDiaActivo').checked;
        const turnos = block.querySelectorAll('.turno-row');
        if(turnos.length===0){ nuevoHorario.push({Dia:dia, Activo:false, HoraInicio:'', HoraFin:''}); }
        else{ turnos.forEach(row=>{ nuevoHorario.push({Dia:dia, Activo:activo, HoraInicio:row.querySelector('.hInicio').value, HoraFin:row.querySelector('.hFin').value}); }); }
      });
      if(CONFIG.API_URL){ await apiCall('update_horario', { dias: nuevoHorario }, ['horario']); }
      else { DATA.horario = nuevoHorario; }
      showToast('Horario guardado'); render();
    });
  }
}

function showReferidosModal(){
  const codigo = CONFIG.CLIENT_ID || 'DEMO';
  const referidos = DATA.referidos || [];
  const pendientes = referidos.filter(r=>r.Estado==='Pendiente de pago').length;
  const convertidosLista = referidos.filter(r=>r.Estado==='Convertido');
  const pagadosLista = referidos.filter(r=>r.Estado==='Comisión pagada');
  const montoConvertidos = convertidosLista.length * (DATA.comisionMonto||0);
  const montoPagados = pagadosLista.length * (DATA.comisionMonto||0);
  const mensajeCompartir = `Hola, uso Control Dental App para gestionar mi consultorio y me ha funcionado muy bien. Si te interesa que te lo instalen, menciona mi código ${codigo}.`;

  const estadoColor = (e)=> e==='Comisión pagada' ? 'var(--teal)' : (e==='Convertido' ? 'var(--amber)' : 'var(--text-mute)');

  openModal(`
    <h3>Programa de referidos</h3>
    <p class="subtle" style="margin-bottom:12px;">Comparte el sistema con un colega. Cuando esa persona pague su instalación, ganas ${fmtComision(DATA.comisionMonto)}.</p>
    <div class="referral-code-box"><span class="subtle">Tu código</span><b>${codigo}</b></div>
    <div class="btn primary block" id="btnCompartirReferido" style="margin-bottom:14px;">Compartir</div>
    <div class="divider"></div>
    <div class="card-head" style="margin-bottom:4px;">
      <div class="card-title">Tu historial</div>
      <span class="link-btn" id="btnActualizarReferidos">↻ Recargar</span>
    </div>
    <div class="referral-stats">
      <div class="referral-stat"><div class="num" style="color:var(--text-mute);">${pendientes}</div><div class="lbl">Pendientes</div></div>
      <div class="referral-stat"><div class="num" style="color:var(--amber);">${convertidosLista.length}</div><div class="lbl">Convertidos</div><div class="subtle" style="font-size:11px;margin-top:2px;">${fmtComision(montoConvertidos)}</div></div>
      <div class="referral-stat"><div class="num" style="color:var(--teal);">${pagadosLista.length}</div><div class="lbl">Comisión pagada</div><div class="subtle" style="font-size:11px;margin-top:2px;">${fmtComision(montoPagados)}</div></div>
    </div>
    <div style="max-height:220px;overflow-y:auto;">
      ${referidos.map(r=>`<div class="referral-row"><span>${r.NombreReferido}<br><span class="subtle">${formatearFecha(r.Fecha)}</span></span><b style="color:${estadoColor(r.Estado)};font-size:12px;">${r.Estado}</b></div>`).join('') || '<div class="empty">Aun no tienes referidos registrados</div>'}
    </div>
    <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Cerrar</div></div>`);

  // #57e — antes esto era un link wa.me con un numero fijo (siempre abria
  // chat con ESE numero, nunca dejaba elegir a quien enviar). El boton
  // "compartir" nativo del navegador/telefono si deja escoger el
  // contacto o grupo — en escritorio, donde no siempre existe, se cae a
  // "copiar mensaje" para que lo peguen ellos mismos donde quieran.
  document.getElementById('btnCompartirReferido').addEventListener('click', async ()=>{
    if(navigator.share){
      try{ await navigator.share({ text: mensajeCompartir }); }
      catch(err){ /* el usuario cancelo el share, no es un error real */ }
    } else {
      try{ await navigator.clipboard.writeText(mensajeCompartir); showToast('Mensaje copiado — pégalo donde quieras'); }
      catch(err){ showToast('No se pudo copiar. Copia el código a mano: '+codigo); }
    }
  });
  // #57d — refresca solo esta ventana (referidos + los montos de
  // comision), sin cerrar y volver a abrir todo el modal.
  // Ciclo 1 / Ronda 2 (5e) — antes pedia 'config' y obtenia referidos de
  // rebote, porque esos datos venian pegados a CUALQUIER respuesta sin
  // filtro real en Code.gs. Ahora Code.gs solo incluye referidos/comision
  // en una carga completa o cuando se pide 'referidos' explicitamente —
  // asi que este boton ahora lo pide por su nombre real.
  document.getElementById('btnActualizarReferidos').addEventListener('click', async ()=>{
    if(CONFIG.API_URL){ showMask('Recargando...'); await syncData(['referidos']); hideMask(); }
    showReferidosModal();
  });
}

async function guardarCitaNueva(pac, trats, fecha, hora, forzar){
  let id = 'C' + String(DATA.citas.length+1).padStart(3,'0');
  if(CONFIG.API_URL){
    const res = await apiCall('add_cita', { pacienteId:pac.ID, paciente:pac.Nombre, tratamientos:trats.join(', '), fecha, hora, forzar: !!forzar }, ['citas','pacientes']);
    if(res && res.conflict){
      openModal(`
        <h3>Horario ocupado</h3>
        <p style="font-size:13px;margin-bottom:16px;">${res.mensaje} ¿Deseas agendar de todos modos?</p>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="btnForzarCita">Agendar de todos modos</div></div>`);
      document.getElementById('btnForzarCita').addEventListener('click', ()=>{ closeModal(); guardarCitaNueva(pac, trats, fecha, hora, true); });
      return;
    }
    showToast(res ? 'Cita creada y agregada a Google Calendar' : 'Cita guardada localmente (sin conexion)');
  } else {
    // Ciclo 2 (Grupo 2) — Duracion_Min queda congelada con lo que dura
    // el tratamiento AHORA MISMO en el catalogo, igual que hace el
    // servidor. Si el tratamiento cambia de duracion despues, esta cita
    // ya agendada no se ve afectada.
    DATA.citas.push({ID:id, Fecha:fecha, Hora:hora, Paciente_ID:pac.ID, Paciente:pac.Nombre, Tratamientos:trats.join(', '), Duracion_Min:duracionCitaMin(trats.join(', ')), Estado:'Confirmada'});
    showToast('Cita agendada (modo demo)');
  }
  render();
}

async function intentarReagendar(citaId, nuevaFecha, nuevaHora, forzar){
  if(!nuevaFecha || !nuevaHora) return showToast('Completa fecha y hora');
  if(!CONFIG.API_URL){
    // modo demo: sin backend, aplica local directo
    const cita = DATA.citas.find(c=>c.ID===citaId);
    cita.Fecha = nuevaFecha; cita.Hora = nuevaHora;
    closeModal(); showToast('Cita reagendada (modo demo)'); render();
    return;
  }
  const res = await apiCall('reagendar_cita', { citaId, nuevaFecha, nuevaHora, forzar: !!forzar }, ['citas']);
  if(res && res.conflict){
    openModal(`
      <h3>Horario ocupado</h3>
      <p style="font-size:13px;margin-bottom:16px;">${res.mensaje} ¿Deseas reagendar de todos modos?</p>
      <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="btnForzarReagendar">Reagendar de todos modos</div></div>`);
    document.getElementById('btnForzarReagendar').addEventListener('click', async ()=>{
      await intentarReagendar(citaId, nuevaFecha, nuevaHora, true);
    });
    return;
  }
  if(res && res.ok){
    closeModal(); showToast('Cita reagendada y actualizada en Google Calendar'); render();
  } else {
    showToast('No se pudo reagendar. Intenta de nuevo.');
  }
}

function showPendientesModal(){
  function draw(filter){
    const f = filter||'';
    const porPaciente = {};
    DATA.pagos.forEach(p=>{ if(Number(p.Saldo)>0){ if(!porPaciente[p.Paciente_ID]) porPaciente[p.Paciente_ID]=0; porPaciente[p.Paciente_ID]+=Number(p.Saldo); } });
    const rows = Object.entries(porPaciente).map(([pacId,saldo])=>{ const pac = DATA.pacientes.find(p=>p.ID===pacId); return { pacId, nombre: pac?pac.Nombre:pacId, saldo }; })
      .filter(r=> matches(r.nombre, f) || matches(String(r.saldo), f)).sort((a,b)=>b.saldo-a.saldo);
    return rows.map(r=>`<div class="pend-row"><span>${r.nombre}</span><span style="display:flex;align-items:center;gap:10px;"><b style="color:var(--amber);">${fmtMoney(r.saldo)}</b><div class="btn sm" data-abonar-pac="${r.pacId}">Abonar</div></span></div>`).join('') || '<div class="empty">Sin resultados</div>';
  }
  /* Reconecta los botones y el buscador de la lista de Pendientes. Se
     vuelve a llamar cada vez que este nivel se restaura con volverModal(),
     porque el HTML restaurado llega sin ningun evento conectado. */
  function initListaPendientes(){
    document.querySelectorAll('[data-abonar-pac]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const pacId = btn.dataset.abonarPac;
        const pagosAbiertos = DATA.pagos.filter(p=>p.Paciente_ID===pacId && Number(p.Saldo)>0);
        const refreshPend = ()=>{ const list=document.getElementById('pendList'); if(list){ list.innerHTML = draw(document.getElementById('pendSearch').value); initListaPendientes(); } };
        if(pagosAbiertos.length===1){
          openAbonoModal(pagosAbiertos[0].ID, refreshPend, initListaPendientes);
        } else {
          pushModalState(initListaPendientes);
          openModal(`<h3>Elige el pago a abonar</h3>${pagosAbiertos.map(p=>`<div class="pend-row"><span>${p.Tratamiento} <span class="subtle">· Inicio: ${formatearFecha(p.Inicio_Tratamiento)}</span></span><span style="display:flex;align-items:center;gap:10px;"><b style="color:var(--amber);">${fmtMoney(p.Saldo)}</b><div class="btn sm" data-pick-pago="${p.ID}">Abonar</div></span></div>`).join('')}<div class="modal-actions"><div class="btn block" onclick="volverModal()">Cerrar</div></div>`);
          initElegirPago(pagosAbiertos, refreshPend);
        }
      });
    });
    const searchEl = document.getElementById('pendSearch');
    if(searchEl){ searchEl.addEventListener('input', e=>{ document.getElementById('pendList').innerHTML = draw(e.target.value); initListaPendientes(); }); }
  }
  /* Reconecta los botones de "Elige el pago a abonar". */
  function initElegirPago(pagosAbiertos, refreshPend){
    document.querySelectorAll('[data-pick-pago]').forEach(b2=>{
      b2.addEventListener('click', ()=>{
        openAbonoModal(b2.dataset.pickPago, refreshPend, ()=>initElegirPago(pagosAbiertos, refreshPend));
      });
    });
  }
  openModal(`
    <h3>Pacientes con saldo pendiente</h3>
    <input class="search" style="max-width:100%;margin-bottom:12px;" id="pendSearch" placeholder="Buscar por nombre o monto...">
    <div id="pendList" style="max-height:340px;overflow-y:auto;">${draw('')}</div>
    <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Cerrar</div></div>`);
  initListaPendientes();
}

(async function init(){ await loadData(); hidratarConfigDesdeSheet(); hideMask(); render(); })();
</script>
