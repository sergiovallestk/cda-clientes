/* ============ ORDEN GENERICO (clic en encabezado) — Pacientes, Pagos, Gastos, Tratamientos ============ */
const SORT_STATE = { pacientes:{key:null,dir:1}, pagos:{key:null,dir:1}, gastos:{key:null,dir:1}, tratamientos:{key:null,dir:1} };
// Ciclo 1 / Ronda 9 (duda de Sergio) — antes, cuando 2 o mas filas
// empataban exactamente en la columna elegida, el resultado dependia de
// una casualidad de implementacion: el sort de JS es estable, y conserva
// el orden relativo previo entre empatados — que resultaba ser el orden
// por defecto con el que se armo la tabla (por Ultimo_Pago/Fecha
// descendente), sin que nadie lo hubiera decidido a proposito. Ahora el
// desempate es explicito: entre filas empatadas, siempre gana la que se
// agrego mas reciente (ID mas alto) — asi un registro recien creado
// siempre aparece primero entre sus empates, sin importar que columna se
// este ordenando ni en que direccion.
function ordenar(tbl, items, getVal){
  const st = SORT_STATE[tbl];
  if(!st.key) return items;
  return [...items].sort((a,b)=>{
    const va = getVal(a, st.key), vb = getVal(b, st.key);
    let cmp;
    if(va==null && vb==null) cmp = 0;
    else if(va==null) cmp = 1;
    else if(vb==null) cmp = -1;
    else if(typeof va==='number' && typeof vb==='number') cmp = (va-vb)*st.dir;
    else cmp = String(va).localeCompare(String(vb), 'es', {numeric:true}) * st.dir;
    if(cmp !== 0) return cmp;
    return String(b.ID).localeCompare(String(a.ID), 'es', {numeric:true});
  });
}
function thSort(tbl, label, sortKey){
  return `<th class="sortable" data-sort-tbl="${tbl}" data-sort-key="${sortKey}">${label}<span class="sort-arrow"></span></th>`;
}
function refreshSortArrows(tbl){
  const st = SORT_STATE[tbl];
  document.querySelectorAll(`th[data-sort-tbl="${tbl}"]`).forEach(th=>{
    const arrowEl = th.querySelector('.sort-arrow'); if(!arrowEl) return;
    arrowEl.textContent = (st.key===th.dataset.sortKey) ? (st.dir===1?'▲':'▼') : '';
  });
}
function attachSortHeaders(tbl, refillFn){
  document.querySelectorAll(`th[data-sort-tbl="${tbl}"]`).forEach(th=>{
    th.onclick = ()=>{
      const sortKey = th.dataset.sortKey;
      const st = SORT_STATE[tbl];
      if(st.key===sortKey) st.dir = -st.dir; else { st.key = sortKey; st.dir = 1; }
      refillFn();
    };
  });
}
/* ============ PAGINADOR GENERICO (Pacientes, Pagos, Gastos, Tratamientos) ============ */
const PAGINATION = { pacientes:{page:1,size:15}, pagos:{page:1,size:15}, gastos:{page:1,size:15}, tratamientos:{page:1,size:15} };
function paginar(key, items){
  const st = PAGINATION[key];
  const total = items.length;
  const totalPaginas = Math.max(1, Math.ceil(total/st.size));
  if(st.page>totalPaginas) st.page = totalPaginas;
  const inicio = (st.page-1)*st.size;
  return { pageItems: items.slice(inicio, inicio+st.size), total, totalPaginas };
}
function renderPaginador(key, total, totalPaginas){
  const st = PAGINATION[key];
  if(total===0) return '';
  return `
  <div class="paginador">
    <span class="subtle">${total} registro${total===1?'':'s'}</span>
    <div class="paginador-controles">
      <select class="pag-size" data-pag-key="${key}">${[15,30,50,100].map(n=>`<option value="${n}" ${st.size===n?'selected':''}>${n} por página</option>`).join('')}</select>
      <div class="icon-btn pag-prev" data-pag-key="${key}" style="${st.page<=1?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
      <span class="subtle">Página ${st.page} de ${totalPaginas}</span>
      <div class="icon-btn pag-next" data-pag-key="${key}" style="${st.page>=totalPaginas?'opacity:.35;pointer-events:none;':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
  </div>`;
}
/* #64 — reserva la altura de la pagina "llena" (min(size,total) filas) en
   el bloque que envuelve tabla+paginador, para que la ultima pagina (con
   menos registros) no encoja el contenedor ni haga saltar el paginador. */
/* #66 (corregido de raiz, v22) — medido directo en el navegador: Pagos es
   la unica tabla cuyas celdas llevan un badge de saldo Y un boton Abonar,
   lo que hace que sus renglones midan 49-53px reales — no los 45px que
   esta formula asumia para las 4 tablas por igual (medido en Pacientes:
   42px reales, por eso ahi nunca fallaba). Con la constante generica, una
   pagina llena de Pagos (15 filas) media 883px reales contra apenas
   767px reservados — como min-height es un piso, no un techo, la tabla
   SI crecia de mas en paginas llenas y se desinflaba de vuelta al piso en
   paginas con menos registros: ese "inflar y desinflar" era el salto de
   tamaño y el paginador que no se quedaba en su lugar. Se agrega un
   parametro de alto por fila (con margen sobre el maximo real medido) que
   cada tabla puede pasar segun su propio contenido. */
function actualizarAlturaTabla(blockId, key, total, altoFila){
  const el = document.getElementById(blockId);
  if(!el) return;
  if(total===0){ el.style.minHeight = ''; return; }
  const filas = Math.min(PAGINATION[key].size, total);
  // Ciclo 2 / Ronda 6 — el paginador volvio a vivir DENTRO de este mismo
  // contenedor (Ronda 5, #11 — para unificarlo visualmente con la tabla),
  // asi que su altura real (52px, medida en navegador) tiene que volver
  // a contarse aqui. Sin esto, el contenedor no reservaba espacio
  // suficiente y el bug de "la pagina brinca al cambiar de pagina" (ya
  // resuelto en el Ciclo 1) volvio a aparecer.
  el.style.minHeight = (42 + filas*(altoFila||45) + 52) + 'px';
}
function attachPaginadorEvents(key, refillFn){
  document.querySelectorAll(`.pag-size[data-pag-key="${key}"]`).forEach(sel=>{
    sel.onchange = e=>{ PAGINATION[key].size = Number(e.target.value); PAGINATION[key].page = 1; refillFn(); };
  });
  document.querySelectorAll(`.pag-prev[data-pag-key="${key}"]`).forEach(btn=>{
    btn.onclick = ()=>{ if(PAGINATION[key].page>1){ PAGINATION[key].page--; refillFn(); } };
  });
  document.querySelectorAll(`.pag-next[data-pag-key="${key}"]`).forEach(btn=>{
    btn.onclick = ()=>{ PAGINATION[key].page++; refillFn(); };
  });
}
function saldoPaciente(pacId){ return DATA.pagos.filter(p=>p.Paciente_ID===pacId).reduce((s,p)=>s+Number(p.Saldo),0); }
/* "Ultima visita" real del paciente: la fecha mas reciente entre sus citas
   no canceladas con Fecha <= hoy. No se guarda en ningun lado — se calcula
   al vuelo con los datos ya cargados, para que nunca se desincronice. Si
   todavia no tiene ninguna cita asi (recien dado de alta, con historial de
   antes de usar el sistema), cae al respaldo manual capturado en el alta. */
function ultimaVisitaEfectiva(pac){
  const hoy = todayStr();
  const pasadas = DATA.citas.filter(c=>c.Paciente_ID===pac.ID && c.Estado!=='Cancelada' && c.Fecha<=hoy);
  if(pasadas.length>0) return pasadas.reduce((max,c)=> c.Fecha>max ? c.Fecha : max, pasadas[0].Fecha);
  return (pac.Ultima_Visita && pac.Ultima_Visita!=='—') ? pac.Ultima_Visita : '—';
}
function fillPacientesTable(filter){
  const tbody = document.getElementById('pacTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = DATA.pacientes.filter(p=> matches(p.Nombre,f) || matches(p.Tratamientos,f));
  filtrados = ordenar('pacientes', filtrados, (p,key)=>{
    if(key==='Ultima_Visita') return ultimaVisitaEfectiva(p);
    if(key==='Saldo') return saldoPaciente(p.ID);
    if(key==='Tratamientos') return tratArr(p.Tratamientos).length;
    return p[key];
  });
  const { pageItems: rows, total, totalPaginas } = paginar('pacientes', filtrados);
  tbody.innerHTML = rows.map(p=>{
    const saldo = saldoPaciente(p.ID);
    const trats = tratArr(p.Tratamientos);
    const tratLabel = trats.length===0 ? '—' : (trats.length===1 ? trats[0] : `${trats[0]} <span class="subtle">+${trats.length-1}</span>`);
    const estadoBadge = p.Estado==='Inactivo' ? `<span class="badge inactive">Inactivo</span>` : `<span class="badge ok">Activo</span>`;
    return `<tr class="clickable" data-pac="${p.ID}"><td>${p.Nombre}</td><td>${p.Telefono}</td><td>${formatearFecha(ultimaVisitaEfectiva(p))}</td><td>${tratLabel}</td><td>${estadoBadge}</td><td>${saldo>0?`<span class="badge pend">${fmtMoney(saldo)}</span>`:`<span class="badge ok">Al corriente</span>`}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('tr[data-pac]').forEach(tr=>{ tr.addEventListener('click', ()=> showPacienteDetalle(tr.dataset.pac)); });
  const pagBox = document.getElementById('pacPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('pacientes', total, totalPaginas); attachPaginadorEvents('pacientes', ()=>fillPacientesTable(filter)); }
  actualizarAlturaTabla('pacTableBlock', 'pacientes', total, 45); // Ciclo 2 / Ronda 8 — Ronda 7 dejo esto en el alto real exacto (42px, sin margen), lo que reintrodujo el bug de "la tabla se achica/agranda al cambiar de pagina" (mismo mecanismo que #66 en Pagos). Se le devuelve un margen de seguridad chico (+3px) — evita el bug sin regresar al hueco grande que Ronda 7 corrigio.
  refreshSortArrows('pacientes'); attachSortHeaders('pacientes', ()=>fillPacientesTable(filter));
}
function showPacienteDetalle(pacId){
  const p = DATA.pacientes.find(x=>x.ID===pacId); if(!p) return;
  const trats = tratArr(p.Tratamientos);
  const saldo = saldoPaciente(pacId);
  const esActivo = p.Estado!=='Inactivo';
  openModal(`
    <h3>${p.Nombre}</h3>
    <p class="subtle" style="margin-bottom:14px;">${p.Telefono} · Ultima visita: ${formatearFecha(ultimaVisitaEfectiva(p))} · ${esActivo?'<span style="color:var(--teal)">Activo</span>':'<span style="color:var(--text-mute)">Inactivo</span>'}</p>
    <div class="card-title" style="margin-bottom:8px;">Tratamientos asignados</div>
    <div class="chip-row" style="margin-bottom:16px;">${trats.map(t=>`<span class="chip">${t}</span>`).join('') || '<span class="subtle">Sin tratamientos asignados</span>'}</div>

    <div class="modal-actions">
      <div class="btn block" id="btnEditarPaciente">Editar</div>
      <div class="btn block" id="btnToggleEstado">${esActivo?'Marcar como inactivo':'Reactivar paciente'}</div>
      <div class="btn primary block" onclick="closeModal()">Cerrar</div>
    </div>`);
  document.getElementById('btnEditarPaciente').addEventListener('click', ()=> abrirEdicionPaciente(p));
  document.getElementById('btnToggleEstado').addEventListener('click', async ()=>{
    if(esActivo && saldo>0){ if(!confirm(`${p.Nombre} tiene un saldo pendiente de ${fmtMoney(saldo)}. ¿Marcarlo como inactivo de todas formas?`)) return; }
    const nuevoEstado = esActivo ? 'Inactivo' : 'Activo';
    if(CONFIG.API_URL){ await apiCall('set_estado_paciente', { pacienteId: p.ID, estado: nuevoEstado }, ['pacientes']); }
    else { p.Estado = nuevoEstado; }
    closeModal(); showToast(esActivo?'Paciente marcado como inactivo':'Paciente reactivado'); render();
  });
}
// Ciclo 2 (Grupo 2) — edicion de Paciente: Nombre, Telefono, Tratamientos.
// Nunca elimina (Pacientes solo usa Activo/Inactivo). Compara contra los
// valores originales al guardar y solo manda al servidor los campos que
// de verdad cambiaron — si no cambio nada, ni siquiera se manda peticion.
function abrirEdicionPaciente(p){
  let selectedTrats = tratArr(p.Tratamientos);
  const original = { Nombre: p.Nombre, Telefono: String(p.Telefono), Tratamientos: selectedTrats.join(', ') };
  pushModalState(()=> showPacienteDetalle(p.ID));
  openModal(`
    <h3>Editar paciente</h3>
    <div class="field" style="margin-bottom:12px;"><label>Nombre completo</label><input id="epNombre" value="${p.Nombre}"></div>
    <div class="field" style="margin-bottom:12px;"><label>Teléfono <span class="subtle">(sin prefijo, solo ${telefonoInfo().longitud} dígitos)</span></label><input id="epTelefono" type="tel" inputmode="numeric" maxlength="${telefonoInfo().longitud}" value="${p.Telefono}"></div>
    <div class="field" style="margin-bottom:16px;"><label>Tratamientos</label><div class="picker-btn" id="epTratBtn">${selectedTrats.length?selectedTrats.join(', '):'Selecciona uno o varios tratamientos'}</div></div>
    <div class="modal-actions"><div class="btn block" onclick="volverModal()">Cancelar</div><div class="btn primary block" id="epGuardar">Guardar</div></div>`);
  document.getElementById('epTelefono').addEventListener('input', e=> sanearInputMonto(e.target));
  document.getElementById('epTratBtn').addEventListener('click', ()=>{
    openTreatmentPicker(selectedTrats, (sel)=>{ selectedTrats = sel; document.getElementById('epTratBtn').textContent = selectedTrats.length?selectedTrats.join(', '):'Selecciona uno o varios tratamientos'; });
  });
  document.getElementById('epGuardar').addEventListener('click', async ()=>{
    const nombre = document.getElementById('epNombre').value.trim();
    const tel = document.getElementById('epTelefono').value.trim();
    const infoTel = telefonoInfo();
    const faltan = []; if(!nombre) faltan.push('Nombre completo'); if(!tel) faltan.push('Teléfono');
    if(faltan.length) return showToast('Completa: '+faltan.join(', '));
    if(!/^\d+$/.test(tel) || tel.length!==infoTel.longitud) return showToast(`El teléfono debe tener exactamente ${infoTel.longitud} dígitos (sin prefijo)`);
    const actual = { Nombre: nombre, Telefono: tel, Tratamientos: selectedTrats.join(', ') };
    const cambios = {};
    Object.keys(actual).forEach(k=>{ if(actual[k] !== original[k]) cambios[k] = actual[k]; });
    if(Object.keys(cambios).length === 0){ showToast('Sin cambios que guardar'); volverModal(); return; }
    if(CONFIG.API_URL){ await apiCall('edit_paciente', { pacienteId: p.ID, cambios }, ['pacientes']); }
    else { Object.assign(p, cambios); }
    showToast('Paciente actualizado'); closeModal(); render();
  });
}

function fillPagosTable(filter){
  const tbody = document.getElementById('pagosTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = [...DATA.pagos].sort((a,b)=>b.Ultimo_Pago.localeCompare(a.Ultimo_Pago)).filter(p=>{
    const blob = [p.Inicio_Tratamiento,p.Ultimo_Pago,p.Paciente,p.Tratamiento,p.Categoria,p.Monto_Total,p.Monto_Pagado,p.Saldo].join(' ');
    return matches(blob, f);
  });
  filtrados = ordenar('pagos', filtrados, (p,key)=> key==='Monto_Total'||key==='Monto_Pagado'||key==='Saldo' ? Number(p[key]) : p[key]);
  const { pageItems: rows, total, totalPaginas } = paginar('pagos', filtrados);
  // #66 (corregido de raiz, v21) — el parche de renglones invisibles de
  // v19/v20 se elimina por completo: causaba que los bordes de esos
  // renglones "hidden" se siguieran pintando (por el border-collapse:
  // collapse global de las tablas), dejando lineas fantasma vacias en la
  // ultima pagina. Pagos ya tenia el mismo mecanismo de min-height +
  // paginador con margin-top:auto que usan sin ningun problema las otras
  // 3 tablas (Pacientes, Tratamientos, Gastos) — bastaba con dejarlo
  // trabajar solo, sin el relleno redundante.
  // Ciclo 2 (Grupo 2) — boton "Eliminar" solo aparece si Monto_Pagado es
  // 0 (nunca se le ha abonado nada) — en cuanto tiene cualquier abono, el
  // registro se vuelve permanente y este boton deja de mostrarse.
  // Ciclo 2 / Ronda 2 (#4 de Pagos) — el boton "Eliminar" YA NO se agrega
  // condicionalmente (eso hacia que unas filas tuvieran 1 boton y otras 2,
  // con anchos/altos distintos — reintroducia el mismo bug de "la tabla
  // se achica/agranda" que ya se habia resuelto en el Ciclo 1). Ahora
  // los 2 botones SIEMPRE se renderizan, y el que no aplica queda oculto
  // con visibility:hidden (ocupa el mismo espacio, sin verse) — mismo
  // patron que ya usaba "Abonar" para el caso de saldo en $0.
  tbody.innerHTML = rows.map(p=>`<tr><td>${p.Paciente}</td><td>${p.Tratamiento}</td><td>${p.Categoria||'Otros'}</td><td>${formatearFecha(p.Inicio_Tratamiento)}</td><td>${formatearFecha(p.Ultimo_Pago)}</td><td>${fmtMoney(p.Monto_Total)}</td><td>${fmtMoney(p.Monto_Pagado)}</td><td>${Number(p.Saldo)>0?`<span class="badge pend">${fmtMoney(p.Saldo)}</span>`:`<span class="badge ok">$0</span>`}</td><td><div style="display:flex;gap:6px;align-items:center;"><div class="btn sm" data-abonar="${p.ID}" style="${Number(p.Saldo)>0?'':'visibility:hidden;'}">Abonar</div><div class="btn sm" data-eliminar-pago="${p.ID}" style="color:var(--red);border-color:var(--red);${Number(p.Monto_Pagado)===0?'':'visibility:hidden;'}">Eliminar</div></div></td></tr>`).join('') || '<tr><td colspan="9" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('[data-abonar]').forEach(btn=>{ btn.addEventListener('click', ()=> openAbonoModal(btn.dataset.abonar, ()=>{ fillPagosTable(document.getElementById('pagoSearch').value); })); });
  tbody.querySelectorAll('[data-eliminar-pago]').forEach(btn=>{ btn.addEventListener('click', ()=> confirmarEliminarPago(btn.dataset.eliminarPago)); });
  const pagBox = document.getElementById('pagPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('pagos', total, totalPaginas); attachPaginadorEvents('pagos', ()=>fillPagosTable(filter)); }
  actualizarAlturaTabla('pagTableBlock', 'pagos', total, 53); // Ciclo 2 / Ronda 8 — se reduce 1px (de 54 a 53) para acercar visualmente el espacio antes del paginador al de las otras 3 tablas. No se reduce mas que esto: 53px es el TOPE real medido (rango 49-53px) — bajar de ahi quitaria el margen que evita el propio bug de achicamiento que #66 ya resolvio en esta tabla. La convergencia real viene del lado de las otras 3 tablas, que subieron su margen (ver Ronda 8 en Pacientes/Gastos/Tratamientos).
  refreshSortArrows('pagos'); attachSortHeaders('pagos', ()=>fillPagosTable(filter));
}
function fillGastosTable(filter){
  const tbody = document.getElementById('gastosTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = [...DATA.gastos].sort((a,b)=>b.Fecha.localeCompare(a.Fecha)).filter(g=>{ const blob = [g.Fecha,g.Concepto,g.Categoria,g.Monto].join(' '); return matches(blob, f); });
  filtrados = ordenar('gastos', filtrados, (g,key)=> key==='Monto' ? Number(g[key]) : g[key]);
  const { pageItems: rows, total, totalPaginas } = paginar('gastos', filtrados);
  // Ciclo 2 (Grupo 2) — cada fila es clickeable, igual que Pacientes,
  // para abrir el detalle/edicion de ese gasto.
  tbody.innerHTML = rows.map(g=>`<tr class="clickable" data-gasto="${g.ID}"><td>${formatearFecha(g.Fecha)}</td><td>${g.Concepto}</td><td>${g.Categoria}</td><td>${fmtMoney(g.Monto)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('[data-gasto]').forEach(tr=>{ tr.addEventListener('click', ()=> abrirEdicionGasto(tr.dataset.gasto)); });
  const pagBox = document.getElementById('gastoPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('gastos', total, totalPaginas); attachPaginadorEvents('gastos', ()=>fillGastosTable(filter)); }
  actualizarAlturaTabla('gastoTableBlock', 'gastos', total, 41); // Ciclo 2 / Ronda 8 — mismo ajuste que Pacientes/Tratamientos: se devuelve un margen de seguridad chico (+3px) sobre el alto real (38px) para evitar el bug de achicamiento, sin volver al hueco grande de antes de Ronda 7.
  refreshSortArrows('gastos'); attachSortHeaders('gastos', ()=>fillGastosTable(filter));
}
// Ciclo 2 (Grupo 2) — edicion de Gasto: Concepto, Categoria, Monto. Nunca
// se elimina — mismo patron de "solo mandar lo que cambio" que Pacientes.
// Ciclo 2 (Grupo 2) — un pago solo se puede eliminar si nunca se le
// abono nada (Monto_Pagado === 0). El servidor tambien lo valida
// (defensa por si el dato local quedo desactualizado), pero se checa
// aqui primero para dar el aviso correcto sin ni siquiera intentar la
// peticion si ya no aplica.
// Ciclo 2 / Ronda 2 (#5 de Pagos) — ventana propia en vez del alert()
// nativo del navegador, para que se vea consistente con el resto del
// sistema (mismo patron que "Horario ocupado" al agendar).
function confirmarEliminarPago(pagoId){
  const p = DATA.pagos.find(x=>x.ID===pagoId); if(!p) return;
  if(Number(p.Monto_Pagado) > 0){ showToast('Este pago ya tiene abonos y no se puede eliminar'); return; }
  openModal(`
    <h3>¿Eliminar este pago?</h3>
    <p style="font-size:13px;margin-bottom:16px;">${p.Tratamiento} de <b>${p.Paciente}</b>. Esta acción no se puede deshacer.</p>
    <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="btnConfirmarEliminarPago" style="background:var(--red);">Eliminar</div></div>`);
  document.getElementById('btnConfirmarEliminarPago').addEventListener('click', ()=>{ closeModal(); eliminarPago(pagoId); });
}
async function eliminarPago(pagoId){
  if(CONFIG.API_URL){
    const res = await apiCall('delete_pago', { pagoId }, ['pagos']);
    if(res && res.error){ showToast(res.error); return; }
  } else {
    const idx = DATA.pagos.findIndex(x=>x.ID===pagoId);
    if(idx !== -1) DATA.pagos.splice(idx, 1);
  }
  showToast('Pago eliminado'); render();
}
function abrirEdicionGasto(gastoId){
  const g = DATA.gastos.find(x=>x.ID===gastoId); if(!g) return;
  let categoriaSel = g.Categoria;
  const original = { Concepto: g.Concepto, Categoria: g.Categoria, Monto: Number(g.Monto) };
  openModal(`
    <h3>Editar gasto</h3>
    <div class="field" style="margin-bottom:12px;"><label>Concepto</label><input id="egConcepto" value="${g.Concepto}"></div>
    <div class="field" style="margin-bottom:12px;"><label>Categoría</label>
      <div class="picker-btn" id="egCatBtn">${categoriaSel}</div></div>
    <div class="field" style="margin-bottom:16px;"><label>Monto</label><input id="egMonto" type="text" inputmode="decimal" value="${String(g.Monto).replace('.', separadorDecimal())}"></div>
    <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="egGuardar">Guardar</div></div>`);
  attachSaneoMonto('egMonto');
  document.getElementById('egCatBtn').addEventListener('click', ()=>{
    openGastoCategoryPicker(categoriaSel, (cat)=>{ categoriaSel = cat; document.getElementById('egCatBtn').textContent = cat; });
  });
  document.getElementById('egGuardar').addEventListener('click', async ()=>{
    const concepto = document.getElementById('egConcepto').value.trim();
    const monto = parsearMonto(document.getElementById('egMonto').value);
    const faltan = []; if(!concepto) faltan.push('Concepto'); if(monto<=0) faltan.push('Monto');
    if(faltan.length) return showToast('Completa: '+faltan.join(', '));
    const actual = { Concepto: concepto, Categoria: categoriaSel, Monto: monto };
    const cambios = {};
    Object.keys(actual).forEach(k=>{ if(actual[k] !== original[k]) cambios[k] = actual[k]; });
    if(Object.keys(cambios).length === 0){ showToast('Sin cambios que guardar'); closeModal(); return; }
    if(CONFIG.API_URL){ await apiCall('edit_gasto', { gastoId: g.ID, cambios }, ['gastos']); }
    else { Object.assign(g, cambios); }
    showToast('Gasto actualizado'); closeModal(); render();
  });
}
// Ciclo 1 / Ronda 5 (#9/#10/#11) — 2 fechas separadas: inicioTrat (editable,
// puede ser anterior a hoy) y ultimoPago (fecha del pago mas reciente, la
// que usan las graficas financieras). Al crear el registro, ultimoPago
// siempre es hoy (es cuando el dinero realmente entro); inicioTrat puede
// ser distinto si el doctor indica que el tratamiento empezo antes.
async function guardarPagoNuevo(selPac, selTrat, total, pagado, inicioTrat){
  let id = 'F' + String(DATA.pagos.length+1).padStart(3,'0');
  const hoy = todayStr();
  const inicio = inicioTrat || hoy;
  // Ciclo 1 / Ronda 7 (#17) — Ultimo_Pago solo se llena cuando de verdad
  // entro dinero (montoPagado>0). Un pago dado de alta en $0 (plan de
  // tratamiento sin cobro todavia, escenario valido) no debe mostrar una
  // fecha de "ultimo pago" — seria confuso, porque no hubo ningun pago
  // aun. Se queda vacio hasta el primer abono real.
  const ultimoPago = pagado>0 ? hoy : '';
  // Ciclo 2 (Grupo 2) — Categoria queda congelada con la que tiene el
  // tratamiento AHORA MISMO en el catalogo. De aqui en adelante, aunque
  // el tratamiento cambie de categoria despues, este pago conserva la
  // que le correspondia al momento de crearse.
  const tratCatalogo = DATA.tratamientos.find(t=>t.Nombre===selTrat.nombre);
  const categoria = tratCatalogo ? tratCatalogo.Categoria : 'Otros';
  if(CONFIG.API_URL){
    // #13 — 'pacientes' se agrega a syncKeys porque el servidor puede
    // asignarle el tratamiento al paciente si todavia no lo tenia (ver
    // addPago en Code.gs) — sin esto, el FE se quedaria con la lista de
    // tratamientos del paciente desactualizada hasta el proximo refresco.
    await apiCall('add_pago', { inicioTratamiento:inicio, ultimoPago, pacienteId:selPac.ID, paciente:selPac.Nombre, tratamiento:selTrat.nombre, categoria, montoTotal:total, montoPagado:pagado }, ['pagos','pacientes']);
  } else {
    DATA.pagos.push({ID:id, Inicio_Tratamiento:inicio, Ultimo_Pago:ultimoPago, Paciente_ID:selPac.ID, Paciente:selPac.Nombre, Tratamiento:selTrat.nombre, Categoria:categoria, Monto_Total:total, Monto_Pagado:pagado, Saldo:total-pagado});
    // #13 (modo demo) — mismo criterio que agregarTratamientosAlPaciente
    // en Code.gs: solo se agrega si el paciente no lo tenia ya.
    const pacLocal = DATA.pacientes.find(x=>x.ID===selPac.ID);
    if(pacLocal){
      const actuales = tratArr(pacLocal.Tratamientos);
      if(!actuales.includes(selTrat.nombre)) pacLocal.Tratamientos = [...actuales, selTrat.nombre].join(', ');
    }
  }
  closeModal(); showToast('Pago registrado'); render();
}

function openAbonoModal(pagoId, onDone, volverInit){
  const pago = DATA.pagos.find(p=>p.ID===pagoId); if(!pago) return;
  if(volverInit) pushModalState(volverInit);
  // Ciclo 1 / Ronda 6 (#12) — 3 renglones: paciente+tratamiento, las 2
  // fechas juntas, y el saldo aparte al final (mas facil de leer que
  // todo mezclado en 2 renglones).
  openModal(`
    <h3>Registrar abono</h3>
    <p class="subtle" style="margin-bottom:2px;">${pago.Paciente} · ${pago.Tratamiento}</p>
    <p class="subtle" style="margin-bottom:2px;">Inicio tratamiento: ${formatearFecha(pago.Inicio_Tratamiento)}</p>
    <p class="subtle" style="margin-bottom:2px;">Último pago: ${formatearFecha(pago.Ultimo_Pago)}</p>
    <p class="subtle" style="margin-bottom:14px;">Saldo actual: ${fmtMoney(pago.Saldo)}</p>
    <div class="field" style="margin-bottom:16px;"><label>Monto del abono</label><input id="mAbono" type="text" inputmode="decimal" placeholder="0${separadorDecimal()}00"></div>
    <div class="modal-actions"><div class="btn block" onclick="${volverInit?'volverModal()':'closeModal()'}">Cancelar</div><div class="btn primary block" id="mGuardarAbono">Registrar</div></div>`);
  attachSaneoMonto('mAbono');
  document.getElementById('mGuardarAbono').addEventListener('click', async ()=>{
    const monto = parsearMonto(document.getElementById('mAbono').value);
    if(monto<=0) return showToast('Ingresa un monto valido');
    // Ciclo 1 / Ronda 6 (#16) — validar contra el saldo ANTES de intentar
    // la transaccion. Antes, un monto de mas (simple error de captura, sin
    // que hubiera ningun otro dispositivo de por medio) disparaba el mismo
    // mensaje de conflicto de concurrencia — confuso, porque nadie mas
    // habia tocado ese pago. Esto atrapa el caso comun (un solo
    // dispositivo, monto mal tecleado) con un aviso claro y sin ni
    // siquiera intentar la transaccion; el rechazo del servidor (#15)
    // se queda como red de seguridad real para cuando SI hay una carrera
    // entre 2 dispositivos.
    if(monto > Number(pago.Saldo)){
      return showToast(`El abono no puede ser mayor al saldo pendiente (${fmtMoney(pago.Saldo)})`);
    }
    if(CONFIG.API_URL){
      // Ciclo 1 / Ronda 5 — si otro dispositivo ya completo este pago sin
      // que este dispositivo sincronizara antes, el servidor rechaza el
      // abono en vez de dejar un saldo negativo (ver addAbono en Code.gs).
      const res = await apiCall('add_abono', { pagoId: pago.ID, monto, fecha: todayStr() }, ['pagos']);
      if(res && res.conflict){
        await syncData(['pagos']);
        if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='finanzas') repintarGraficasConDatosActuales();
        if(volverInit){ volverModal(); } else { closeModal(); }
        // Ciclo 1 / Ronda 6 (#15) — antes esto era un toast que
        // desaparecia solo en pocos segundos; ahora es una ventana que
        // se queda hasta que el usuario la cierra, mismo patron que ya
        // usa el conflicto de "Horario ocupado" al agendar.
        openModal(`
          <h3>No se pudo registrar el abono</h3>
          <p style="font-size:13px;margin-bottom:16px;">${res.mensaje || 'Revisa el saldo actual antes de intentar de nuevo.'}</p>
          <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Cerrar</div></div>`);
        if(onDone) onDone();
        return;
      }
    } else {
      pago.Monto_Pagado = Number(pago.Monto_Pagado) + monto; pago.Saldo = Number(pago.Monto_Total) - Number(pago.Monto_Pagado);
      pago.Ultimo_Pago = todayStr();
    }
    showToast('Abono registrado');
    if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='finanzas') render();
    if(volverInit){ volverModal(); if(onDone) onDone(); } else { closeModal(); if(onDone) onDone(); }
  });
}

        let y,m,cat;
        if(exactas.length){ const el2=exactas[0]; cat=topCats[el2.datasetIndex]; ({y,m}=meses[el2.index]); }
        else{ const cercanas=chart.getElementsAtEventForMode(evt,'index',{intersect:false},true); if(!cercanas.length) return; ({y,m}=meses[cercanas[0].index]); }
        mostrarDetalleGastosCategoria(cat,y,m);
      },
      onHover:(evt,elements)=>{ evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
      plugins:{legend:{display:true,position:'top',align:'end',labels:{color:'#8CA0B3',boxWidth:12,font:{size:11}}},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.dataset.label+': '+fmtMoney(c.raw)}}},
      interaction:{mode:'index',intersect:false},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#5B6D7A'}},y:{stacked:true,grid:{color:'#1E2E42'},ticks:{color:'#5B6D7A',callback:v=>'$'+Number(v).toLocaleString('es-MX')}}}}}); }
}
/* Ciclo 1 / Ronda 4 — punto unico de repintado de graficas, llamado
   desde apiCall() despues de CUALQUIER guardado exitoso en cualquier
   pantalla del sistema. Usa solo los datos que ya estan en el FE (DATA),
   sin ninguna llamada nueva al backend. Es seguro llamarla sin importar
   en que pestaña este el usuario: tanto drawDashboardCharts() como
   drawFinanzasChart() ya revisan que cada canvas exista antes de
   dibujar, asi que si esa pantalla no esta activa simplemente no hacen
   nada. Nunca toca el DOM de las tablas de Pacientes/Tratamientos/Pagos/
   Gastos — esas ya quedan al dia solas porque apiCall() ya les
   actualizo su propia hoja en DATA antes de llegar aqui. */
function repintarGraficasConDatosActuales(){
  destruirGraficasActivas();
  drawDashboardCharts();
  drawFinanzasChart();
  const kpiEl = document.getElementById('finanzasKpiRow');
  if(kpiEl) kpiEl.innerHTML = renderFinanzasKpiRowInner();
}
// Ciclo 1 / Ronda 4, movida al menu principal en Ronda 7 (#18) — unica
// forma de traer todo de nuevo del servidor fuera de un guardado propio:
// para el escenario de otro dispositivo usando el sistema al mismo
// tiempo. Compartida entre el item "Sincronizar" del menu.
async function sincronizarTodo(){
  if(CONFIG.API_URL){
    showMask('Sincronizando...');
    const ok = await loadData();
    hideMask();
    if(!ok){ showToast('No se pudo sincronizar — tu información local sigue intacta'); return; }
    // Ciclo 2 / Ronda 9 — bug encontrado: loadData() SI traia la
    // configuracion regional actualizada (guardada desde otro
    // dispositivo) dentro de DATA.config, pero nunca se volvia a aplicar
    // a CONFIG (que es lo que realmente usan formatearFecha(),
    // fmtMoney(), etc. para pintar la pantalla) — esa aplicacion solo
    // ocurria una vez, al cargar la pagina por primera vez. Por eso
    // "Sincronizar" traia el dato nuevo pero seguia mostrando el formato
    // viejo de ESE dispositivo. Se agrega la misma llamada que ya usa la
    // carga inicial.
    hidratarConfigDesdeSheet();
  }
  render();
  showToast('Sincronizado');
}

function fillTratamientosTable(filter){
  const tbody = document.getElementById('tratTbody'); if(!tbody) return;
  const f = filter||'';
  let filtrados = DATA.tratamientos.filter(t=>{ const blob = [t.Nombre,t.Categoria,t.Precio_MXN].join(' '); return matches(blob, f); });
  filtrados = ordenar('tratamientos', filtrados, (t,key)=> key==='Precio_MXN'||key==='Duracion_Min' ? Number(t[key]||0) : t[key]);
  const { pageItems: rows, total, totalPaginas } = paginar('tratamientos', filtrados);
  // Ciclo 2 (Grupo 2) — fila clickeable para editar; badge de estado
  // igual que Pacientes.
  tbody.innerHTML = rows.map(t=>`<tr class="clickable" data-trat="${t.ID}"><td>${t.Nombre}</td><td>${t.Categoria}</td><td>${fmtMoney(t.Precio_MXN)}</td><td>${t.Duracion_Min||30} min</td><td>${t.Estado==='Inactivo'?'<span class="badge inactive">Inactivo</span>':'<span class="badge ok">Activo</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Sin resultados</td></tr>';
  tbody.querySelectorAll('[data-trat]').forEach(tr=>{ tr.addEventListener('click', ()=> abrirEdicionTratamiento(tr.dataset.trat)); });
  const pagBox = document.getElementById('tratPaginador');
  if(pagBox){ pagBox.innerHTML = renderPaginador('tratamientos', total, totalPaginas); attachPaginadorEvents('tratamientos', ()=>fillTratamientosTable(filter)); }
  actualizarAlturaTabla('tratTableBlock', 'tratamientos', total, 45); // Ciclo 2 / Ronda 8 — mismo ajuste que Pacientes/Gastos: se devuelve un margen de seguridad chico (+3px) sobre el alto real (42px) para evitar el bug de achicamiento, sin volver al hueco grande de antes de Ronda 7.
  refreshSortArrows('tratamientos'); attachSortHeaders('tratamientos', ()=>fillTratamientosTable(filter));
}
// Ciclo 2 (Grupo 2) — edicion de Tratamiento: Nombre, Categoria, Precio,
// Duracion, mas el toggle Activo/Inactivo. Nunca se elimina — los pagos
// y citas historicos ya quedaron protegidos con su propia fotografia
// congelada (Categoria en Pagos, Duracion_Min en Citas), asi que editar
// aqui es 100% seguro para los datos ya existentes.
function abrirEdicionTratamiento(tratId){
  const t = DATA.tratamientos.find(x=>x.ID===tratId); if(!t) return;
  let categoriaSel = t.Categoria;
  const esActivo = t.Estado!=='Inactivo';
  const original = { Nombre: t.Nombre, Categoria: t.Categoria, Precio_MXN: Number(t.Precio_MXN), Duracion_Min: Number(t.Duracion_Min||30) };
  openModal(`
    <h3>Editar tratamiento</h3>
    <div class="field" style="margin-bottom:12px;"><label>Nombre</label><input id="etNombre" value="${t.Nombre}"></div>
    <div class="field" style="margin-bottom:12px;"><label>Categoría</label><div class="picker-btn" id="etCatBtn">${categoriaSel}</div></div>
    <div class="form-grid" style="margin-bottom:16px;">
      <div class="field"><label>Precio</label><input id="etPrecio" type="text" inputmode="decimal" value="${String(t.Precio_MXN).replace('.', separadorDecimal())}"></div>
      <div class="field"><label>Duración (minutos)</label><input id="etDuracion" type="number" min="5" step="5" value="${t.Duracion_Min||30}"></div>
    </div>
    <p class="subtle" style="margin-bottom:16px;">Estado: ${esActivo?'<span style="color:var(--teal)">Activo</span>':'<span style="color:var(--text-mute)">Inactivo</span>'} <span class="subtle">— un tratamiento inactivo deja de poder elegirse para citas o pagos nuevos, pero no afecta lo que ya existe.</span></p>
    <div class="modal-actions">
      <div class="btn block" id="etToggleActivo">${esActivo?'Marcar como inactivo':'Reactivar tratamiento'}</div>
      <div class="btn primary block" id="etGuardar">Guardar</div>
    </div>
    <div class="modal-actions" style="margin-top:8px;"><div class="btn block" onclick="closeModal()">Cerrar sin guardar</div></div>`);
  attachSaneoMonto('etPrecio');
  document.getElementById('etCatBtn').addEventListener('click', ()=>{
    openCategoryPicker(categoriaSel, (cat)=>{ categoriaSel = cat; document.getElementById('etCatBtn').textContent = cat; });
  });
  document.getElementById('etToggleActivo').addEventListener('click', async ()=>{
    const nuevoEstado = esActivo ? 'Inactivo' : 'Activo';
    if(CONFIG.API_URL){ await apiCall('edit_tratamiento', { tratamientoId: t.ID, cambios: { Estado: nuevoEstado } }, ['tratamientos']); }
    else { t.Estado = nuevoEstado; }
    closeModal(); showToast(esActivo?'Tratamiento marcado como inactivo':'Tratamiento reactivado'); render();
  });
  document.getElementById('etGuardar').addEventListener('click', async ()=>{
    const nombre = document.getElementById('etNombre').value.trim();
    const precio = parsearMonto(document.getElementById('etPrecio').value);
    const duracion = Number(document.getElementById('etDuracion').value)||30;
    const faltan = []; if(!nombre) faltan.push('Nombre'); if(precio<=0) faltan.push('Precio');
    if(faltan.length) return showToast('Completa: '+faltan.join(', '));
    const actual = { Nombre: nombre, Categoria: categoriaSel, Precio_MXN: precio, Duracion_Min: duracion };
    const cambios = {};
    Object.keys(actual).forEach(k=>{ if(actual[k] !== original[k]) cambios[k] = actual[k]; });
    if(Object.keys(cambios).length === 0){ showToast('Sin cambios que guardar'); closeModal(); return; }
    if(CONFIG.API_URL){ await apiCall('edit_tratamiento', { tratamientoId: t.ID, cambios }, ['tratamientos']); }
    else { Object.assign(t, cambios); }
    showToast('Tratamiento actualizado'); closeModal(); render();
  });
}

/* #51 — construye el HTML de la lista de Citas del tab Agendar. Se separa
   en su propia funcion para poder refrescarla sola (boton "Actualizar
   agenda") sin repintar todo el tab, que borraria el formulario de "Nueva
   cita" a medio llenar. */
// Ciclo 2 (Grupo 2) — antes esta lista excluia las citas Canceladas por
// completo (desaparecian sin dejar rastro, como si nunca hubieran
// existido). Ahora se muestran con su propio badge, para que el doctor
// pueda ver el detalle completo de su dia. Los demas widgets/conteos del
// sistema (citas de hoy, citas esta semana, tratamientos mas solicitados,
// etc.) siguen excluyendolas — ahi si no deben contar como carga de
// trabajo real; solo esta lista cambio.
function renderCitasListHTML(){
  const hoy = todayStr();
  const citasOrdenadas = [...DATA.citas].sort((a,b)=>(a.Fecha+a.Hora).localeCompare(b.Fecha+b.Hora));
  return citasOrdenadas.map(c=>{
    // Duracion_Min congelada al agendar (Ciclo 2); si una cita vieja no
    // la tiene todavia (antes de que existiera esta columna), se calcula
    // en vivo como respaldo — nunca deberia pasar tras el relleno inicial.
    const dur = c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento);
    const finCita = new Date(c.Fecha+'T'+c.Hora+':00').getTime() + dur*60000;
    const esHoy = c.Fecha===hoy;
    const yaConcluida = finCita <= Date.now();
    const esCancelada = c.Estado==='Cancelada';
    const esPasada = !esCancelada && ((c.Fecha < hoy) || (esHoy && yaConcluida));
    const etiqueta = esCancelada ? '<br><span class="subtle" style="color:var(--red);">· Cancelada</span><br>' : ((esHoy && yaConcluida) ? '<br><span class="subtle">· Concluida hoy</span><br>' : '');
    const color = esCancelada ? 'var(--red)' : (esPasada ? 'var(--text-mute)' : (esHoy ? 'var(--amber)' : 'var(--teal)'));
    const acciones = esCancelada ? ''
      : esPasada
      ? `<div style="display:flex;gap:6px;margin-top:6px;"><div class="btn sm" data-reagendar="${c.ID}">Reagendar</div></div>`
      : `<div style="display:flex;gap:6px;margin-top:6px;"><div class="btn sm" data-reagendar="${c.ID}">Reagendar</div><div class="btn sm danger" data-cancelar="${c.ID}">Cancelar</div></div>`;
    return `<div class="appt" style="${esCancelada?'opacity:.6;':''}"><div class="appt-time">${formatearFechaCorta(c.Fecha)}<br>${formatearHora(c.Hora)}</div><div class="appt-info" style="border-left-color:${color}"><b>${c.Paciente}</b>${etiqueta}<span>${tratArr(c.Tratamientos||c.Tratamiento).join(' + ')} · ${dur} min</span>${acciones}</div></div>`;
  }).join('') || '<div class="empty">Sin citas</div>';
}
/* Vuelve a conectar los botones Reagendar/Cancelar de la lista de Citas —
   hay que llamarla de nuevo cada vez que se repinta esa lista sola. */
function attachCitasListHandlers(){
  document.querySelectorAll('[data-reagendar]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const citaId = btn.dataset.reagendar;
      const cita = DATA.citas.find(c=>c.ID===citaId); if(!cita) return;
      const hoy = todayStr();
      openModal(`
        <h3>Reagendar cita</h3>
        <p class="subtle" style="margin-bottom:14px;">${cita.Paciente} · ${tratArr(cita.Tratamientos||cita.Tratamiento).join(' + ')}</p>
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="field"><label>Nueva fecha</label><input type="date" id="reagFecha" value="${cita.Fecha < hoy ? hoy : cita.Fecha}" min="${hoy}"></div>
          <div class="field"><label>Nueva hora</label><input type="time" id="reagHora" value="${cita.Hora}"></div>
        </div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="btnConfirmarReagendar">Reagendar</div></div>`);
      document.getElementById('btnConfirmarReagendar').addEventListener('click', async ()=>{
        await intentarReagendar(citaId, document.getElementById('reagFecha').value, document.getElementById('reagHora').value, false);
      });
    });
  });
  document.querySelectorAll('[data-cancelar]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const citaId = btn.dataset.cancelar;
      const cita = DATA.citas.find(c=>c.ID===citaId); if(!cita) return;
      if(!confirm(`¿Cancelar la cita de ${cita.Paciente} el ${formatearFecha(cita.Fecha)} a las ${formatearHora(cita.Hora)}?`)) return;
      if(CONFIG.API_URL){ await apiCall('cancelar_cita', { citaId }, ['citas']); }
      else { cita.Estado = 'Cancelada'; }
      showToast('Cita cancelada'); render();
    });
  });
}
