/* ==================== GRUPO 6 — CALENDARIO DE AGENDA ====================
   Bloque nuevo y aislado (Ronda 1 = Vista Dia; Semana y Mes se agregan en
   rondas futuras). Ninguna funcion existente de Agenda (renderCitasListHTML,
   attachCitasListHandlers, la logica interna de actualizarAgenda) se
   modifico — solo se les agrego, en su punto de entrada, una llamada minima
   a las funciones nuevas de aqui abajo cuando la vista activa es
   "calendario" en vez de "lista". Si algo de este bloque fallara, la Lista
   de siempre sigue funcionando exactamente igual, sin depender de nada de
   este codigo. Alcance de esta ronda: la Vista Dia es de solo lectura (ver
   detalle de una cita) — Reagendar/Cancelar de momento solo viven en la
   Lista, a proposito, para no duplicar esa logica; se agrega un atajo
   directo a la Lista desde el detalle de cada cita. */
let AGENDA_VISTA = 'lista';        // 'lista' | 'calendario'
let AGENDA_MODO = 'dia';           // 'dia' | 'semana' | 'mes'
// Ronda 13 (01/09) — filtro de la Lista de Agenda: 'reciente' (default,
// ultimos 30 dias + todas las futuras), 'todo' (historial completo, sin
// filtro — comportamiento identico al de antes de esta ronda), o un mes
// especifico en formato "AAAA-MM" elegido en el selector. NO afecta lo
// que trae el servidor (Code.gs sigue mandando el historial completo de
// Citas) — es un filtro solo de presentacion en esta vista, igual que ya
// hace el Calendario (Dia/Semana/Mes) filtrando DATA.citas client-side.
let AGENDA_LISTA_RANGO = 'reciente';
let AGENDA_FECHA_REF = todayStr(); // fecha que esta viendo el calendario

const NOMBRES_DIA_SEMANA = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
// Rango de horas mostrado en la rejilla del dia. Version simple para esta
// primera ronda (franja fija que cubre un horario tipico de consultorio);
// se puede afinar despues para leer el horario real configurado por dia si
// hace falta mas precision.
const CAL_HORA_INICIO = 7, CAL_HORA_FIN = 21, CAL_PX_POR_HORA = 60;
// Ronda 4 (#23) — rango EFECTIVO que se esta mostrando ahora mismo. Casi
// siempre es igual a CAL_HORA_INICIO/CAL_HORA_FIN, pero renderCalendarioDiaHTML
// lo expande cuando el dia tiene una cita que empieza antes o termina
// despues de ese rango base, para que nunca quede una cita "huerfana"
// fuera de la rejilla. El timer de la hora actual (iniciarTimerHoraActual)
// tambien lo usa, para no desincronizarse del rango realmente dibujado.
let CAL_RANGO_HORAS = { inicio: CAL_HORA_INICIO, fin: CAL_HORA_FIN };

function sumarDiasFecha(fechaStr, n){
  const p = ymd(fechaStr);
  const d = new Date(p.y, p.m-1, p.d);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatearFechaLargaCalendario(fechaStr){
  const p = ymd(fechaStr);
  const d = new Date(p.y, p.m-1, p.d);
  return `${NOMBRES_DIA_SEMANA[d.getDay()]}, ${p.d} ${MESES_LARGOS[p.m-1]} ${p.y}`;
}
// Grupo 6 / Ciclo 2-mod — Vista Semana. Por default la semana empieza en
// Lunes (mismo criterio que ya usa Horario/DIAS_ORDEN en el resto del
// sistema) pero ahora es configurable (#14, Configuración > Primer día
// de la semana) — CONFIG.PRIMER_DIA_SEMANA puede ser 'lunes' o 'domingo'.
function obtenerInicioDeSemana(fechaStr){
  const p = ymd(fechaStr);
  const d = new Date(p.y, p.m-1, p.d);
  const diaJs = d.getDay(); // 0=domingo...6=sabado
  const offset = CONFIG.PRIMER_DIA_SEMANA==='domingo' ? -diaJs : (diaJs === 0 ? -6 : 1 - diaJs);
  d.setDate(d.getDate() + offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Etiqueta del encabezado de semana: "18 - 24 Agosto 2026", o
// "28 Ago - 3 Sep 2026" si la semana cruza de mes (con mes abreviado en
// ese caso especifico, para que quepa comodo).
function formatearRangoSemana(inicioSemanaStr){
  const finSemanaStr = sumarDiasFecha(inicioSemanaStr, 6);
  const pL = ymd(inicioSemanaStr), pD = ymd(finSemanaStr);
  if(pL.m === pD.m && pL.y === pD.y){
    return `${pL.d} - ${pD.d} ${MESES_LARGOS[pL.m-1]} ${pL.y}`;
  }
  if(pL.y === pD.y){
    return `${pL.d} ${MESES_CORTOS[pL.m-1]} - ${pD.d} ${MESES_CORTOS[pD.m-1]} ${pL.y}`;
  }
  return `${pL.d} ${MESES_CORTOS[pL.m-1]} ${pL.y} - ${pD.d} ${MESES_CORTOS[pD.m-1]} ${pD.y}`;
}

// Grupo 6 / Ciclo 3 — Vista Mes. Navega de mes en mes, siempre aterriza
// en el dia 1 del mes destino (evita el problema clasico de "31 de enero
// + 1 mes" cayendo en marzo en vez de febrero — para Mes no importa en
// que dia del mes estemos parados, solo que mes se debe mostrar).
function sumarMesesFecha(fechaStr, n){
  const p = ymd(fechaStr);
  const d = new Date(p.y, p.m-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}
// Arma las celdas de la cuadricula del mes (incluyendo los dias del mes
// anterior/siguiente que hacen falta para completar semanas enteras),
// respetando CONFIG.PRIMER_DIA_SEMANA (#14) — igual que Semana, para que
// las columnas de Mes y Semana siempre esten alineadas con el mismo
// criterio de que dia empieza la semana.
function obtenerCeldasMes(fechaRefStr){
  const p = ymd(fechaRefStr);
  const primerDiaStr = p.y+'-'+String(p.m).padStart(2,'0')+'-01';
  const primerDiaDate = new Date(p.y, p.m-1, 1);
  const diasEnMes = new Date(p.y, p.m, 0).getDate();
  const inicioSemana = CONFIG.PRIMER_DIA_SEMANA==='domingo' ? 0 : 1; // 0=domingo,1=lunes
  const offsetInicial = (primerDiaDate.getDay() - inicioSemana + 7) % 7;
  const celdas = [];
  for(let i=offsetInicial; i>0; i--) celdas.push({ fecha: sumarDiasFecha(primerDiaStr, -i), delMes:false });
  for(let d=1; d<=diasEnMes; d++) celdas.push({ fecha: p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(d).padStart(2,'0'), delMes:true });
  while(celdas.length % 7 !== 0) celdas.push({ fecha: sumarDiasFecha(celdas[celdas.length-1].fecha, 1), delMes:false });
  return celdas;
}

// Ronda 2 (#13/#15) — detecta grupos de citas que se traslapan entre si
// (transitivamente: si A se traslapa con B y B con C, las 3 comparten
// grupo aunque A y C no se toquen directamente) y les asigna una columna
// a cada una, para dibujarlas lado a lado en vez de apiladas ilegibles —
// mismo criterio que usa Google Calendar. No modifica los datos de las
// citas, solo calcula donde dibujar cada bloque. Recibe la lista ya
// ordenada por Hora ascendente.
function calcularLayoutCitas(citas){
  const conRango = citas.map(c=>{
    const dur = c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento);
    const [h,mi] = c.Hora.split(':').map(Number);
    const inicioMin = h*60+mi;
    return { cita:c, inicioMin, finMin: inicioMin+dur, columna:0, totalColumnas:1 };
  });
  let grupoActual = [], finMaxGrupo = -1;
  const grupos = [];
  conRango.forEach(item=>{
    if(grupoActual.length && item.inicioMin < finMaxGrupo){ grupoActual.push(item); }
    else { if(grupoActual.length) grupos.push(grupoActual); grupoActual = [item]; }
    finMaxGrupo = Math.max(finMaxGrupo, item.finMin);
  });
  if(grupoActual.length) grupos.push(grupoActual);

  grupos.forEach(grupo=>{
    const finPorColumna = []; // fin de la ultima cita puesta en cada columna
    grupo.forEach(item=>{
      let col = finPorColumna.findIndex(fin => item.inicioMin >= fin);
      if(col === -1){ col = finPorColumna.length; finPorColumna.push(item.finMin); }
      else finPorColumna[col] = item.finMin;
      item.columna = col;
    });
    grupo.forEach(item => item.totalColumnas = finPorColumna.length);
  });
  return conRango;
}

let CAL_TIMER_HORA_ACTUAL = null;
// Ronda 2 (#18) — se llama al mostrar la Vista Dia; recalcula la posicion
// de la franja de "hora actual" cada minuto usando SOLO la hora del
// navegador (sin ninguna peticion al backend). Se detiene sola al salir
// de Calendario (ver attachContenidoAgenda) para no dejar un timer vivo
// de mas.
function iniciarTimerHoraActual(){
  detenerTimerHoraActual();
  CAL_TIMER_HORA_ACTUAL = setInterval(()=>{
    const linea = document.getElementById('calLineaHoraActual');
    if(!linea) return;
    const ahora = new Date();
    const minutosDesdeInicio = (ahora.getHours()*60+ahora.getMinutes()) - (CAL_RANGO_HORAS.inicio*60);
    const dentroDeRango = minutosDesdeInicio>=0 && minutosDesdeInicio<=(CAL_RANGO_HORAS.fin-CAL_RANGO_HORAS.inicio)*60;
    linea.style.display = dentroDeRango ? '' : 'none';
    if(dentroDeRango) linea.style.top = (minutosDesdeInicio*(CAL_PX_POR_HORA/60))+'px';
  }, 60000);
}
function detenerTimerHoraActual(){
  if(CAL_TIMER_HORA_ACTUAL){ clearInterval(CAL_TIMER_HORA_ACTUAL); CAL_TIMER_HORA_ACTUAL = null; }
}

function renderCalendarioHTML(){
  if(AGENDA_MODO === 'semana') return renderCalendarioSemanaHTML();
  if(AGENDA_MODO === 'mes') return renderCalendarioMesHTML();
  return renderCalendarioDiaHTML();
}

// Grupo 6 / Ciclo 2-mod — extraido de la version original de
// renderCalendarioDiaHTML para poder reutilizarse tambien en la Vista
// Semana: dado un array de citas de UN dia (ya filtradas a esa fecha) y
// el inicio de la rejilla compartida, regresa el HTML de sus tarjetas —
// misma logica y mismas reglas ya definidas y pulidas para Vista Dia:
// canceladas se muestran pero NO compiten por ancho con las activas
// (Ronda 3 #21, se dibujan detras, mas transparentes), citas empalmadas
// se reparten en columnas lado a lado (Ronda 2 #13/#15), y TODAS las
// tarjetas llevan borde para distinguirse aunque esten pegadas (Ronda 3
// #13). Al vivir en un solo lugar, cualquier ajuste futuro a estas
// reglas aplica automaticamente a Dia y Semana por igual.
function renderBloquesCitasDeUnDia(citasDelDia, horaInicio, fechaDelDia){
  const hoy = todayStr();
  const esHoyEsteDia = fechaDelDia === hoy;
  const citasActivas = citasDelDia.filter(c=>c.Estado!=='Cancelada');
  const citasCanceladas = citasDelDia.filter(c=>c.Estado==='Cancelada');

  function calcularTopAlto(c){
    const dur = c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento);
    const [h,mi] = c.Hora.split(':').map(Number);
    const minutosDesdeInicio = Math.max(0, (h*60+mi) - (horaInicio*60));
    return { top: minutosDesdeInicio * (CAL_PX_POR_HORA/60), alto: Math.max(dur * (CAL_PX_POR_HORA/60), 22) };
  }

  const bloquesCanceladas = citasCanceladas.map(c=>{
    const {top, alto} = calcularTopAlto(c);
    return `<div class="cal-cita cal-cita-cancelada" style="top:${top}px;height:${alto}px;border-left-color:var(--red);" data-cal-cita="${c.ID}">
      <b>${formatearHora(c.Hora)} · ${c.Paciente}</b>
      <span>${tratArr(c.Tratamientos||c.Tratamiento).join(' + ')}</span>
    </div>`;
  }).join('');

  const layout = calcularLayoutCitas(citasActivas);
  const bloquesActivas = layout.map(item=>{
    const c = item.cita;
    const {top, alto} = calcularTopAlto(c);
    const finCita = new Date(c.Fecha+'T'+c.Hora+':00').getTime() + (c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento))*60000;
    const yaConcluida = finCita <= Date.now();
    const esPasada = (fechaDelDia < hoy) || (esHoyEsteDia && yaConcluida);
    const color = esPasada ? 'var(--text-mute)' : (esHoyEsteDia ? 'var(--amber)' : 'var(--teal)');
    const anchoPct = 100/item.totalColumnas;
    const leftPct = item.columna*anchoPct;
    const estiloColumnas = item.totalColumnas>1 ? `left:${leftPct}%;right:auto;width:calc(${anchoPct}% - 4px);` : '';
    return `<div class="cal-cita" style="top:${top}px;height:${alto}px;border-left-color:${color};${estiloColumnas}" data-cal-cita="${c.ID}">
      <b>${formatearHora(c.Hora)} · ${c.Paciente}</b>
      <span>${tratArr(c.Tratamientos||c.Tratamiento).join(' + ')}</span>
    </div>`;
  }).join('');

  return bloquesCanceladas + bloquesActivas;
}

function renderCalendarioDiaHTML(){
  const fecha = AGENDA_FECHA_REF;
  const hoy = todayStr();
  const esHoy = fecha === hoy;
  const citasDelDia = DATA.citas.filter(c=>c.Fecha===fecha).sort((a,b)=>a.Hora.localeCompare(b.Hora));

  // Ronda 4 (#23) — el rango base (7:00-21:00) se expande si el dia tiene
  // una cita que empieza antes o termina despues de ese rango, para que
  // nunca quede una cita fuera de la rejilla (antes se veian "flotando"
  // sin ninguna hora de referencia alrededor). En un dia normal, sin
  // citas fuera de rango, se ve exactamente igual que antes.
  let horaInicio = CAL_HORA_INICIO, horaFin = CAL_HORA_FIN;
  citasDelDia.forEach(c=>{
    const dur = c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento);
    const [h,mi] = c.Hora.split(':').map(Number);
    if(h < horaInicio) horaInicio = h;
    const finH = Math.ceil((h*60+mi+dur)/60);
    if(finH > horaFin) horaFin = finH;
  });
  CAL_RANGO_HORAS = { inicio: horaInicio, fin: horaFin };

  const horas = []; for(let h=horaInicio; h<=horaFin; h++) horas.push(h);
  const alturaTotal = (horaFin - horaInicio) * CAL_PX_POR_HORA;
  const bloques = renderBloquesCitasDeUnDia(citasDelDia, horaInicio, fecha);

  // #18 — franja de hora actual, solo si se esta viendo el dia de HOY.
  let lineaHoraActual = '';
  if(esHoy){
    const ahora = new Date();
    const minDesdeInicio = (ahora.getHours()*60+ahora.getMinutes()) - (horaInicio*60);
    const dentroDeRango = minDesdeInicio>=0 && minDesdeInicio<=(horaFin-horaInicio)*60;
    const topActual = minDesdeInicio*(CAL_PX_POR_HORA/60);
    lineaHoraActual = `<div class="cal-hora-actual" id="calLineaHoraActual" style="top:${topActual}px;${dentroDeRango?'':'display:none;'}"><span class="cal-hora-actual-punto"></span></div>`;
  }

  return `
  <div class="cal-header-sticky">
    <div class="cal-toolbar">
      <div class="icon-btn" id="calDiaAnterior">‹</div>
      <div class="cal-fecha-actual">${formatearFechaLargaCalendario(fecha)}${esHoy?' <span class="subtle">· Hoy</span>':''}</div>
      <div class="icon-btn" id="calDiaSiguiente">›</div>
      <div class="btn sm" id="calIrHoy">Hoy</div>
    </div>
    <div class="cal-sin-citas" style="${citasDelDia.length?'visibility:hidden;':''}">Sin citas este día</div>
  </div>
  <div class="cal-dia-grid" style="height:${alturaTotal}px;">
    ${horas.map(h=>`<div class="cal-hora-linea" style="top:${(h-horaInicio)*CAL_PX_POR_HORA}px;"><span class="cal-hora-label">${String(h).padStart(2,'0')}:00</span></div>`).join('')}
    <div class="cal-citas-area">${bloques}</div>
    ${lineaHoraActual}
  </div>`;
}

// Grupo 6 / Ciclo 2-mod — Vista Semana. Reutiliza exactamente los mismos
// estandares ya pulidos en Vista Dia (ver renderBloquesCitasDeUnDia):
// bordes en todas las tarjetas, canceladas sin competir por ancho,
// columnas de empalme, colores por estado, rango de horas dinamico,
// franja de hora actual, y header pegajoso con controles centrados.
function renderCalendarioSemanaHTML(){
  const inicioSemana = obtenerInicioDeSemana(AGENDA_FECHA_REF);
  const hoy = todayStr();
  const dias = []; for(let i=0;i<7;i++) dias.push(sumarDiasFecha(inicioSemana, i));
  const citasPorDia = dias.map(f => DATA.citas.filter(c=>c.Fecha===f).sort((a,b)=>a.Hora.localeCompare(b.Hora)));
  const todasLasCitas = citasPorDia.flat();

  // Rango de horas: igual que en Dia (#23), pero compartido entre los 7
  // dias — todas las columnas necesitan el mismo eje vertical de horas
  // para alinearse correctamente entre si.
  let horaInicio = CAL_HORA_INICIO, horaFin = CAL_HORA_FIN;
  todasLasCitas.forEach(c=>{
    const dur = c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento);
    const [h,mi] = c.Hora.split(':').map(Number);
    if(h < horaInicio) horaInicio = h;
    const finH = Math.ceil((h*60+mi+dur)/60);
    if(finH > horaFin) horaFin = finH;
  });
  CAL_RANGO_HORAS = { inicio: horaInicio, fin: horaFin };

  const horas = []; for(let h=horaInicio; h<=horaFin; h++) horas.push(h);
  const alturaTotal = (horaFin - horaInicio) * CAL_PX_POR_HORA;

  const encabezadosDias = dias.map(f=>{
    const p = ymd(f);
    const d = new Date(p.y, p.m-1, p.d);
    const esHoyCol = f === hoy;
    return `<div class="cal-sem-col-header${esHoyCol?' cal-sem-col-header-hoy':''}">${NOMBRES_DIA_SEMANA[d.getDay()].slice(0,3)}<br>${p.d}</div>`;
  }).join('');

  const columnas = dias.map((f, i)=>{
    const esHoyCol = f === hoy;
    const bloques = renderBloquesCitasDeUnDia(citasPorDia[i], horaInicio, f);
    let lineaHoraActual = '';
    if(esHoyCol){
      const ahora = new Date();
      const minDesdeInicio = (ahora.getHours()*60+ahora.getMinutes()) - (horaInicio*60);
      const dentroDeRango = minDesdeInicio>=0 && minDesdeInicio<=(horaFin-horaInicio)*60;
      const topActual = minDesdeInicio*(CAL_PX_POR_HORA/60);
      lineaHoraActual = `<div class="cal-hora-actual" id="calLineaHoraActual" style="top:${topActual}px;${dentroDeRango?'':'display:none;'}"><span class="cal-hora-actual-punto"></span></div>`;
    }
    return `<div class="cal-sem-col${esHoyCol?' cal-sem-col-hoy':''}">
      <div class="cal-sem-citas">${bloques}</div>
      ${lineaHoraActual}
    </div>`;
  }).join('');

  const huboCitasEnLaSemana = todasLasCitas.length > 0;
  const finSemana = sumarDiasFecha(inicioSemana, 6);
  const incluyeHoy = hoy >= inicioSemana && hoy <= finSemana;

  return `
  <div class="cal-header-sticky">
    <div class="cal-toolbar">
      <div class="icon-btn" id="calSemanaAnterior">‹</div>
      <div class="cal-fecha-actual">${formatearRangoSemana(inicioSemana)}${incluyeHoy?' <span class="subtle">· semana actual</span>':''}</div>
      <div class="icon-btn" id="calSemanaSiguiente">›</div>
      <div class="btn sm" id="calIrHoy">Hoy</div>
    </div>
    <div class="cal-sin-citas" style="${huboCitasEnLaSemana?'visibility:hidden;':''}">Sin citas esta semana</div>
    <div class="cal-sem-header-row">
      <div class="cal-sem-gutter"></div>
      ${encabezadosDias}
    </div>
  </div>
  <div class="cal-dia-grid cal-sem-grid" style="height:${alturaTotal}px;">
    ${horas.map(h=>`<div class="cal-hora-linea" style="top:${(h-horaInicio)*CAL_PX_POR_HORA}px;"><span class="cal-hora-label">${String(h).padStart(2,'0')}:00</span></div>`).join('')}
    <div class="cal-sem-columnas">${columnas}</div>
  </div>`;
}

// Grupo 6 / Ciclo 3 — Vista Mes. Reutiliza el mismo criterio de colores
// por estado (gris/ambar/verde/rojo) ya establecido en Dia/Semana, y el
// mismo principio de canceladas visibles pero sin competir por espacio
// (aqui: no le quitan lugar a las 3 citas activas que se alcanzan a
// mostrar por celda, se cuentan aparte en el "+N mas"). A diferencia de
// Dia/Semana (rejilla de horas con posicionamiento absoluto), Mes es una
// cuadricula simple de CSS Grid — no necesita eje de horas.
// Al tocar cualquier dia, se cambia a Vista Dia en esa fecha (igual que
// Google Calendar/Outlook) — funciona igual en PC y en movil, cubriendo
// de una vez el "toca un dia para ver su detalle" que se definio para
// movil desde la planeacion original.
function renderCalendarioMesHTML(){
  const p = ymd(AGENDA_FECHA_REF);
  const hoy = todayStr();
  const celdas = obtenerCeldasMes(AGENDA_FECHA_REF);
  const ordenEncabezados = CONFIG.PRIMER_DIA_SEMANA==='domingo'
    ? ['Dom','Lun','Mar','Mie','Jue','Vie','Sab']
    : ['Lun','Mar','Mie','Jue','Vie','Sab','Dom'];
  const encabezadosDias = ordenEncabezados.map(n=>`<div class="cal-mes-col-header">${n}</div>`).join('');

  const MAX_TEXTO = 3, MAX_PUNTOS = 4;
  const celdasHtml = celdas.map(c=>{
    const esHoyCelda = c.fecha === hoy;
    const citasDelDia = DATA.citas.filter(x=>x.Fecha===c.fecha).sort((a,b)=>a.Hora.localeCompare(b.Hora));

    function colorDeCita(cita){
      if(cita.Estado==='Cancelada') return 'var(--red)';
      const dur = cita.Duracion_Min || duracionCitaMin(cita.Tratamientos||cita.Tratamiento);
      const finCita = new Date(cita.Fecha+'T'+cita.Hora+':00').getTime() + dur*60000;
      const esPasada = (cita.Fecha < hoy) || (cita.Fecha===hoy && finCita<=Date.now());
      return esPasada ? 'var(--text-mute)' : (cita.Fecha===hoy ? 'var(--amber)' : 'var(--teal)');
    }

    // #6/#9 (exclusivo de Vista Mes) — las canceladas se siguen
    // mostrando, pero NUNCA le quitan un lugar a una cita activa dentro
    // del cupo visible: primero se llenan los espacios con activas, y
    // solo se usan los que sobren para canceladas. El orden final agrupa
    // primero TODAS las activas (por hora) y despues TODAS las
    // canceladas que hayan alcanzado a mostrarse (tambien por hora) —
    // a proposito NO es un orden cronologico puro, para que una
    // cancelada de la manana no aparezca antes que una activa de la
    // tarde. Este criterio es exclusivo de Mes; Dia y Semana siguen
    // usando orden cronologico normal, sin agrupar por estado.
    const activasDelDia = citasDelDia.filter(x=>x.Estado!=='Cancelada');
    const canceladasDelDia = citasDelDia.filter(x=>x.Estado==='Cancelada');

    const visibleTexto = activasDelDia.slice(0, MAX_TEXTO);
    if(visibleTexto.length < MAX_TEXTO) visibleTexto.push(...canceladasDelDia.slice(0, MAX_TEXTO - visibleTexto.length));
    visibleTexto.sort((a,b)=> (a.Estado==='Cancelada')-(b.Estado==='Cancelada') || a.Hora.localeCompare(b.Hora));
    const restoTexto = citasDelDia.length - visibleTexto.length;
    const textoHtml = visibleTexto.map(cita=>`<div class="cal-mes-evento-texto" style="color:${colorDeCita(cita)};${cita.Estado==='Cancelada'?'opacity:.6;':''}">${formatearHora(cita.Hora)} ${cita.Paciente}</div>`).join('')
      + (restoTexto>0 ? `<div class="cal-mes-evento-mas">+${restoTexto} más</div>` : '');

    const visiblePuntos = activasDelDia.slice(0, MAX_PUNTOS);
    if(visiblePuntos.length < MAX_PUNTOS) visiblePuntos.push(...canceladasDelDia.slice(0, MAX_PUNTOS - visiblePuntos.length));
    visiblePuntos.sort((a,b)=> (a.Estado==='Cancelada')-(b.Estado==='Cancelada') || a.Hora.localeCompare(b.Hora));
    const restoPuntos = citasDelDia.length - visiblePuntos.length;
    const puntosHtml = visiblePuntos.map(cita=>`<span class="cal-mes-punto" style="background:${colorDeCita(cita)};${cita.Estado==='Cancelada'?'opacity:.6;':''}"></span>`).join('')
      + (restoPuntos>0 ? `<span class="cal-mes-mas-puntos">+${restoPuntos}</span>` : '');

    return `<div class="cal-mes-celda${c.delMes?'':' cal-mes-celda-fuera'}${esHoyCelda?' cal-mes-celda-hoy':''}" data-cal-dia="${c.fecha}">
      <div class="cal-mes-num${esHoyCelda?' cal-mes-num-hoy':''}">${ymd(c.fecha).d}</div>
      <div class="cal-mes-eventos-texto">${textoHtml}</div>
      <div class="cal-mes-eventos-puntos">${puntosHtml}</div>
    </div>`;
  }).join('');

  return `
  <div class="cal-header-sticky">
    <div class="cal-toolbar">
      <div class="icon-btn" id="calMesAnterior">‹</div>
      <div class="cal-fecha-actual">${MESES_LARGOS[p.m-1]} ${p.y}</div>
      <div class="icon-btn" id="calMesSiguiente">›</div>
      <div class="btn sm" id="calIrHoy">Hoy</div>
    </div>
    <div class="cal-mes-header-row">${encabezadosDias}</div>
  </div>
  <div class="cal-mes-grid">${celdasHtml}</div>`;
}

// Detalle de solo lectura al tocar una cita en el calendario. El boton
// "Ir a la lista" cambia la vista y deja que Reagendar/Cancelar los haga
// la Lista, con su logica de siempre — sin duplicarla aqui.
function abrirDetalleCitaCalendario(citaId){
  const cita = DATA.citas.find(c=>c.ID===citaId); if(!cita) return;
  const esCancelada = cita.Estado==='Cancelada';
  const dur = cita.Duracion_Min || duracionCitaMin(cita.Tratamientos||cita.Tratamiento);
  // #14 — fecha+hora+duracion en un renglon, tratamiento en el siguiente.
  openModal(`
    <h3>${cita.Paciente}</h3>
    <p class="subtle" style="margin-bottom:2px;">${formatearFecha(cita.Fecha)} · ${formatearHora(cita.Hora)} (${dur} min)${esCancelada?' · <span style="color:var(--red);">Cancelada</span>':''}</p>
    <p class="subtle" style="margin-bottom:14px;">${tratArr(cita.Tratamientos||cita.Tratamiento).join(' + ')}</p>
    <div class="modal-actions">
      <div class="btn block" onclick="closeModal()">Cerrar</div>
      <div class="btn primary block" id="btnCalIrLista">Ir a la lista para gestionar</div>
    </div>`);
  document.getElementById('btnCalIrLista').addEventListener('click', ()=>{
    closeModal();
    AGENDA_VISTA = 'lista';
    // #16 — ademas de cambiar a Lista, se pide que aterrice justo en esta
    // cita en vez de dejar al usuario hasta arriba de toda la lista.
    repintarPanelAgenda(citaId);
  });
}

function attachCalendarioHandlers(){
  iniciarTimerHoraActual();
  const btnAnt = document.getElementById('calDiaAnterior');
  const btnSig = document.getElementById('calDiaSiguiente');
  const btnSemAnt = document.getElementById('calSemanaAnterior');
  const btnSemSig = document.getElementById('calSemanaSiguiente');
  const btnMesAnt = document.getElementById('calMesAnterior');
  const btnMesSig = document.getElementById('calMesSiguiente');
  const btnHoy = document.getElementById('calIrHoy');
  if(btnAnt) btnAnt.addEventListener('click', ()=>{ AGENDA_FECHA_REF = sumarDiasFecha(AGENDA_FECHA_REF,-1); repintarPanelAgenda(); });
  if(btnSig) btnSig.addEventListener('click', ()=>{ AGENDA_FECHA_REF = sumarDiasFecha(AGENDA_FECHA_REF,1); repintarPanelAgenda(); });
  if(btnSemAnt) btnSemAnt.addEventListener('click', ()=>{ AGENDA_FECHA_REF = sumarDiasFecha(AGENDA_FECHA_REF,-7); repintarPanelAgenda(); });
  if(btnSemSig) btnSemSig.addEventListener('click', ()=>{ AGENDA_FECHA_REF = sumarDiasFecha(AGENDA_FECHA_REF,7); repintarPanelAgenda(); });
  if(btnMesAnt) btnMesAnt.addEventListener('click', ()=>{ AGENDA_FECHA_REF = sumarMesesFecha(AGENDA_FECHA_REF,-1); repintarPanelAgenda(); });
  if(btnMesSig) btnMesSig.addEventListener('click', ()=>{ AGENDA_FECHA_REF = sumarMesesFecha(AGENDA_FECHA_REF,1); repintarPanelAgenda(); });
  if(btnHoy) btnHoy.addEventListener('click', ()=>{ AGENDA_FECHA_REF = todayStr(); repintarPanelAgenda(); });
  document.querySelectorAll('[data-cal-cita]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalleCitaCalendario(el.dataset.calCita));
  });
  // Vista Mes — tocar cualquier dia cambia a Vista Dia en esa fecha,
  // igual que Google Calendar/Outlook. Cubre tanto PC como movil con la
  // misma logica (definido asi desde la planeacion original del Grupo 6).
  document.querySelectorAll('[data-cal-dia]').forEach(el=>{
    el.addEventListener('click', ()=>{
      AGENDA_FECHA_REF = el.dataset.calDia;
      AGENDA_MODO = 'dia';
      repintarPanelAgenda();
    });
  });
}

// Dispatcher: decide que handlers de CONTENIDO conectar (Lista o
// Calendario) segun la vista activa — el switch Lista/Calendario en si
// se conecta aparte, una sola vez, en attachSwitchAgendaVista().
function attachContenidoAgenda(){
  const list = document.getElementById('agendaCitasList');
  if(list){
    // Ronda 5 (#25) — restaura el scroll de la vista activa cada vez que
    // se pinta contenido aqui (cubre TODOS los casos: cambio de vista,
    // vuelta desde otro menu, navegacion de dia en Calendario), y
    // registra en vivo el scroll mientras el usuario se mueve, sin
    // depender de capturar un evento especifico de "salida".
    list.scrollTop = AGENDA_VISTA==='lista' ? CAL_SCROLL_LISTA : CAL_SCROLL_CALENDARIO;
    list.addEventListener('scroll', ()=>{
      if(AGENDA_VISTA==='lista') CAL_SCROLL_LISTA = list.scrollTop;
      else CAL_SCROLL_CALENDARIO = list.scrollTop;
    });
  }
  if(AGENDA_VISTA === 'calendario') attachCalendarioHandlers();
  else { detenerTimerHoraActual(); attachCitasListHandlers(); }
}
// Ronda 4/5 (#25) — recuerda en donde se quedo el scroll de cada vista
// por separado, para no regresar siempre hasta arriba al cambiar entre
// Lista y Calendario. La Ronda 4 solo lo capturaba en el clic del switch
// mismo — pero si sales de Agenda por otro camino (cambiar de menu
// principal, sin tocar el switch primero) esa captura nunca ocurria y la
// Lista se quedaba sin recordar nada. Ronda 5: se registra EN VIVO con un
// listener de scroll (sin importar por donde salgas, siempre queda
// guardado el ultimo punto real), y se restaura de forma centralizada en
// attachContenidoAgenda() — que se ejecuta cada vez que se pinta
// contenido en el panel (cambio de vista, vuelta desde otro menu,
// navegacion de dia en Calendario).
let CAL_SCROLL_LISTA = 0, CAL_SCROLL_CALENDARIO = 0;
function attachSwitchAgendaVista(){
  document.querySelectorAll('[data-agenda-vista]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      AGENDA_VISTA = btn.dataset.agendaVista;
      repintarPanelAgenda();
    });
  });
}
// Grupo 6 / Ciclo 2-mod — switch Día/Semana dentro de Calendario. Igual
// que attachSwitchAgendaVista, solo cambia el estado y deja que
// repintarPanelAgenda() vuelva a dibujar segun AGENDA_MODO.
function attachSwitchModoCalendario(){
  document.querySelectorAll('[data-agenda-modo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      AGENDA_MODO = btn.dataset.agendaModo;
      repintarPanelAgenda();
    });
  });
}
// Ronda 3 (#22) — extraido de repintarPanelAgenda para poder reutilizarlo
// tambien despues de Agendar/Reagendar/Cancelar una cita (antes solo lo
// usaba el boton "Ir a la lista para gestionar" del calendario, #16).
// A proposito NO cambia de vista por si mismo: si en ese momento se esta
// viendo el Calendario, no hace nada — solo actua cuando la Lista ya
// esta a la vista, para no forzar un cambio de pantalla que nadie pidio.
function ubicarCitaEnListaSiAplica(citaId){
  if(!citaId || AGENDA_VISTA !== 'lista') return;
  const fila = document.querySelector(`[data-appt-id="${citaId}"]`);
  if(fila){
    fila.scrollIntoView({block:'center'});
    fila.classList.add('appt-resaltada');
    setTimeout(()=> fila.classList.remove('appt-resaltada'), 2200);
  }
}
// Repinta SOLO el contenido de la caja de Citas (lista o calendario) y el
// estado visual del switch — igual de quirurgico que ya hacia
// actualizarAgenda() con la Lista, para no perder el formulario de "Nueva
// cita" a medio llenar en la tarjeta de al lado.
// #16 — el parametro opcional citaIdParaUbicar, cuando viene desde "Ir a
// la lista para gestionar", hace scroll hasta esa tarjeta especifica
// dentro de la Lista y la resalta un momento para ubicarla de inmediato.
function repintarPanelAgenda(citaIdParaUbicar){
  // Ronda 15 (01/09) — reemplaza el fix de la Ronda 14 (que solo cubria
  // el caso 'reciente') por una logica de 3 pasos que decide el filtro
  // correcto SIEMPRE que se aterriza en una cita puntual (ej. boton "Ir a
  // la lista para gestionar" del detalle del Calendario), sin importar
  // que filtro estuviera activo antes: (1) si la cita cae dentro de
  // "Recientes", se usa 'reciente'; (2) si no, pero su mes SI esta entre
  // los que el selector ofrece como opcion individual (ver
  // MESES_SELECTOR_AGENDA_MAX arriba), se selecciona ese mes exacto —
  // mas preciso que mandar siempre a "Todo"; (3) solo si la cita es mas
  // vieja que el tope de meses que ofrece el selector, se usa 'todo'
  // (historial completo) como ultimo recurso. Sin esto, el mecanismo de
  // ubicar+resaltar (ubicarCitaEnListaSiAplica) no encuentra la fila y no
  // truena, pero tampoco resalta nada — mismo sintoma silencioso que la
  // Ronda 14 corrigio parcialmente.
  if(citaIdParaUbicar){
    const citaObjetivo = DATA.citas.find(c=>c.ID===citaIdParaUbicar);
    if(citaObjetivo){
      const cutoff = fechaHaceNDias(30);
      if(citaObjetivo.Fecha >= cutoff){
        AGENDA_LISTA_RANGO = 'reciente';
      } else {
        const mesCita = citaObjetivo.Fecha.slice(0,7);
        AGENDA_LISTA_RANGO = mesesDisponiblesSelectorAgenda().includes(mesCita) ? mesCita : 'todo';
      }
    }
  }
  document.querySelectorAll('[data-agenda-vista]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.agendaVista === AGENDA_VISTA);
  });
  // Grupo 6 / Ciclo 2-mod — el switch Día/Semana vive FUERA de
  // #agendaCitasList (para quedarse visible sin depender del scroll), asi
  // que su innerHTML nunca se reconstruye solo — hay que sincronizar su
  // visibilidad (solo tiene sentido en Calendario) y su estado activo
  // aqui, cada vez que se repinta el panel.
  const switchModo = document.getElementById('calSwitchModo');
  if(switchModo) switchModo.style.display = AGENDA_VISTA==='calendario' ? '' : 'none';
  document.querySelectorAll('[data-agenda-modo]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.agendaModo === AGENDA_MODO);
  });
  // Ronda 13 (01/09) — mismo patron que switchModo arriba: el selector
  // "Mostrando" vive fuera de #agendaCitasList (para no perderse al hacer
  // scroll dentro de la lista), asi que su visibilidad Y su contenido
  // (las opciones de mes pueden cambiar si entraron citas nuevas) se
  // refrescan aqui cada vez que se repinta el panel, no solo al cambiar
  // de vista.
  const rangoWrap = document.getElementById('listaRangoSelectorWrap');
  if(rangoWrap){
    rangoWrap.style.display = AGENDA_VISTA==='lista' ? '' : 'none';
    if(AGENDA_VISTA==='lista') rangoWrap.innerHTML = renderSelectorRangoAgendaHTML();
  }
  const list = document.getElementById('agendaCitasList');
  if(list){ list.innerHTML = AGENDA_VISTA==='calendario' ? renderCalendarioHTML() : renderCitasListHTML(); }
  attachContenidoAgenda();
  ubicarCitaEnListaSiAplica(citaIdParaUbicar);
}

// #13 (Opción C) — abre el modal de Nueva Cita y conecta todos sus
// controles. selectedPac/selectedTrats viven en el closure de esta
// funcion (antes vivian en el closure del bloque de attach de la pestaña
// Agendar) para que sobrevivan mientras el modal este abierto, incluso
// si se abre y se regresa del modal de "Confirmar cita" (ver
// pushModalState/volverModal mas abajo — sin esto, el boton "Corregir"
// perderia la seleccion de paciente/tratamientos ya hecha, cosa que NO
// pasaba antes porque el formulario vivia en la pagina, no en un modal).
function abrirModalNuevaCita(){
  let selectedTrats = []; let selectedPac = null;
  openModal(renderNuevaCitaModalHTML(), true);

  function conectarFormulario(){
    document.getElementById('citaTratBtn').addEventListener('click', ()=>{
      openTreatmentPickerScoped(selectedPac, selectedTrats, (sel)=>{ selectedTrats = sel; document.getElementById('citaTratChips').innerHTML = selectedTrats.map(t=>`<span class="chip">${t}</span>`).join(''); });
    });
    document.getElementById('citaPacBtn').addEventListener('click', ()=>{
      openPatientPicker((pac)=>{
        selectedPac = pac;
        document.getElementById('citaPacBtn').textContent = pac.Nombre;
        document.getElementById('citaPacienteId').value = pac.ID;
        // Los tratamientos ya elegidos eran (posiblemente) de otro paciente — se limpian al cambiar de paciente.
        selectedTrats = [];
        document.getElementById('citaTratChips').innerHTML = '';
        document.getElementById('citaTratBtn').textContent = 'Selecciona uno o varios tratamientos';
      }, true);
    });
    document.getElementById('btnGuardarCita').addEventListener('click', ()=>{
      const fecha = document.getElementById('citaFecha').value;
      const hora = document.getElementById('citaHora').value;
      const faltanCita = []; if(!selectedPac) faltanCita.push('Paciente'); if(selectedTrats.length===0) faltanCita.push('Tratamientos'); if(!fecha) faltanCita.push('Fecha'); if(!hora) faltanCita.push('Hora');
      if(faltanCita.length) return showToast('Completa: '+faltanCita.join(', '));
      // Se guarda el estado actual del formulario antes de tapar su
      // contenido con la confirmacion — "Corregir" regresa a el con
      // conectarFormulario() en vez de cerrar todo y perder la seleccion.
      pushModalState(conectarFormulario);
      openModal(`
        <h3>Confirmar cita</h3>
        <div class="summary-row"><span>Paciente</span><span>${selectedPac.Nombre}</span></div>
        <div class="summary-row"><span>Tratamientos</span><span>${selectedTrats.join(', ')}</span></div>
        <div class="summary-row"><span>Fecha</span><span>${formatearFecha(fecha)}</span></div>
        <div class="summary-row"><span>Hora</span><span>${formatearHora(hora)}</span></div>
        <div class="modal-actions"><div class="btn block" id="corregirCita">Corregir</div><div class="btn primary block" id="confirmCita">Confirmar y agendar</div></div>`);
      document.getElementById('corregirCita').addEventListener('click', volverModal);
      document.getElementById('confirmCita').addEventListener('click', ()=>{
        closeModal();
        guardarCitaNueva(selectedPac, selectedTrats, fecha, hora, false);
      });
    });
    document.getElementById('csvFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim().length>0);
        if(lines.length<2) return showToast('El archivo esta vacio');
        const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
        const iPac = headers.indexOf('paciente'), iTrat = headers.indexOf('tratamientos'), iFecha = headers.indexOf('fecha'), iHora = headers.indexOf('hora');
        if(iPac<0||iTrat<0||iFecha<0||iHora<0) return showToast('El CSV debe tener las columnas: Paciente, Tratamientos, Fecha, Hora');
        const preview = lines.slice(1).map(line=>{
          const cols = line.split(',');
          const nombre = (cols[iPac]||'').trim();
          const trats = (cols[iTrat]||'').trim().split(';').map(s=>s.trim()).filter(Boolean);
          const fecha = (cols[iFecha]||'').trim();
          const hora = (cols[iHora]||'').trim();
          const pac = DATA.pacientes.find(p=> normalize(p.Nombre)===normalize(nombre) && p.Estado!=='Inactivo');
          const tratInexistente = trats.find(t=> !DATA.tratamientos.some(dt=> normalize(dt.Nombre)===normalize(t)));
          let error = '';
          if(!pac) error = 'Paciente no encontrado o inactivo';
          else if(tratInexistente) error = `Tratamiento "${tratInexistente}" no registrado`;
          else if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) error = 'Fecha invalida (usar AAAA-MM-DD)';
          else if(!/^\d{2}:\d{2}$/.test(hora)) error = 'Hora invalida (usar HH:MM)';
          return { nombre, trats, fecha, hora, pac, error };
        });
        const validRows = preview.filter(r=>!r.error);
        // #18 — antes "Cancelar" aqui cerraba TODO el modal (perdiendo la
        // seleccion de paciente/tratamientos si se habia llenado algo del
        // formulario manual antes de intentar el CSV). Se guarda el estado
        // del formulario antes de tapar su contenido con la vista previa,
        // igual que ya se hace en el paso de "Confirmar cita".
        pushModalState(conectarFormulario);
        openModal(`
          <h3>Vista previa de importacion (${preview.length} filas)</h3>
          <div class="table-wrap" style="max-height:320px;overflow-y:auto;margin-bottom:14px;">
            <table><thead><tr><th>Paciente</th><th>Tratamientos</th><th>Fecha</th><th>Hora</th><th>Estado</th></tr></thead>
            <tbody>${preview.map(r=>`<tr><td>${r.nombre}</td><td>${r.trats.join(', ')}</td><td>${formatearFecha(r.fecha)}</td><td>${formatearHora(r.hora)}</td><td>${r.error?`<span class="badge cancel">${r.error}</span>`:`<span class="badge ok">OK</span>`}</td></tr>`).join('')}</tbody></table>
          </div>
          <p class="subtle" style="margin-bottom:10px;">${validRows.length} de ${preview.length} filas se importaran. Las filas con error se omiten.</p>
          <div class="modal-actions"><div class="btn block" onclick="volverModal()">Cancelar</div><div class="btn primary block" id="confirmCsv">Importar ${validRows.length} citas</div></div>`, true);
        document.getElementById('confirmCsv').addEventListener('click', async ()=>{
          // #10 — 2 bugs reales corregidos aqui:
          // 1) antes nunca se revisaba si el servidor rechazo la cita por
          //    empalme de horario (respuesta {conflict:true}) — se contaba
          //    como "importada" de todos modos, sin haberse creado nada ni
          //    en el Sheet ni en Calendar. Ahora se detecta, NO se crea (no
          //    se fuerza a ciegas, mismo criterio que el agendado manual), y
          //    se reporta al final cuales filas se saltaron y por que.
          // 2) faltaba el 3er argumento de apiCall (['citas','pacientes'])
          //    que ya usa el agendado manual — sin el, aunque la cita SI se
          //    creara bien en el servidor, no se reflejaba en pantalla hasta
          //    una recarga o sincronizacion manual.
          let importadas = 0;
          const conflictos = [];
          for(const r of validRows){
            let id = 'C' + String(DATA.citas.length+1).padStart(3,'0');
            if(CONFIG.API_URL){
              const res = await apiCall('add_cita', { pacienteId:r.pac.ID, paciente:r.pac.Nombre, tratamientos:r.trats.join(', '), fecha:r.fecha, hora:r.hora }, ['citas','pacientes']);
              if(res && res.conflict){ conflictos.push(`${r.pac.Nombre} — ${formatearFecha(r.fecha)} ${formatearHora(r.hora)}`); continue; }
              if(res && res.id) id = res.id;
              importadas++;
            } else {
              DATA.citas.push({ID:id, Fecha:r.fecha, Hora:r.hora, Paciente_ID:r.pac.ID, Paciente:r.pac.Nombre, Tratamientos:r.trats.join(', '), Estado:'Confirmada'});
              importadas++;
            }
          }
          closeModal(); render();
          if(conflictos.length){
            openModal(`
              <h3>Importación con conflictos de horario</h3>
              <p class="subtle" style="margin-bottom:10px;">${importadas} cita(s) se importaron correctamente. ${conflictos.length} NO se importaron porque su horario ya estaba ocupado:</p>
              <ul style="font-size:12.5px;color:var(--text-dim);padding-left:18px;margin-bottom:16px;">${conflictos.map(c=>`<li>${c}</li>`).join('')}</ul>
              <div class="modal-actions"><div class="btn primary block" onclick="closeModal()">Entendido</div></div>`);
          } else {
            showToast(`${importadas} citas importadas`);
          }
        });
      };
      reader.readAsText(file);
    });
  }
  conectarFormulario();
}
/* #51 — construye el HTML de la lista de Citas del tab Agendar. Se separa
   en su propia funcion para poder refrescarla sola (boton "Actualizar
   agenda") sin repintar todo el tab, que borraria el formulario de "Nueva
   cita" a medio llenar. */
// Ciclo 2 (Grupo 2) — antes esta lista excluia las citas Canceladas por
// completo (desaparecian sin dejar rastro, como si nunca hubieran
// existido). Ahora se muestran con su propio badge, para que el doctor
// pueda ver el detalle completo de su dia. Los demas widgets/conteos del
// sistema (citas de hoy, citas esta semana, tratamientos mas solicitados,
// etc.) siguen excluyendolas — ahi si no deben contar como carga de
// trabajo real; solo esta lista cambio.
// Ronda 15 (01/09) — tope de meses individuales listados en el selector
// (evita que crezca sin limite con clientes de varios anos: sin esto,
// el dropdown terminaria con un mes por cada mes que alguna vez tuvo
// una cita, potencialmente decenas). Cualquier mes mas viejo que estos
// 12 solo se alcanza con "Ver historial completo". Factorizado en su
// propia funcion para que tanto el selector (renderSelectorRangoAgendaHTML)
// como la logica de "aterrizar en una cita" (repintarPanelAgenda) usen
// exactamente el mismo criterio sin duplicarlo.
const MESES_SELECTOR_AGENDA_MAX = 12;
function mesesDisponiblesSelectorAgenda(){
  const cutoff = fechaHaceNDias(30);
  const mesesConDatosAntes = new Set();
  DATA.citas.forEach(c=>{ if(c.Fecha < cutoff) mesesConDatosAntes.add(c.Fecha.slice(0,7)); });
  return [...mesesConDatosAntes].sort().reverse().slice(0, MESES_SELECTOR_AGENDA_MAX);
}
// Ronda 13 (01/09) — construye el selector "Mostrando" que vive ARRIBA
// de la lista (fuera de #agendaCitasList, para que no se pierda al hacer
// scroll dentro de la lista larga). Las opciones de mes solo incluyen
// meses que de verdad tienen alguna cita ANTES de la ventana de
// "Recientes" (nunca se listan meses vacios), acotadas al tope de
// MESES_SELECTOR_AGENDA_MAX y agrupadas por año (Ronda 15) — "Ver
// historial completo" sigue disponible como valvula de escape para
// cualquier cosa mas vieja que ese tope, igual que desde la Ronda 13.
function renderSelectorRangoAgendaHTML(){
  const mesesLimitados = mesesDisponiblesSelectorAgenda();
  const porAnio = {};
  const aniosOrden = [];
  mesesLimitados.forEach(m=>{
    const anio = m.split('-')[0];
    if(!porAnio[anio]){ porAnio[anio] = []; aniosOrden.push(anio); }
    porAnio[anio].push(m);
  });
  const opcionesMeses = aniosOrden.map(anio=>{
    const opts = porAnio[anio].map(m=>{
      const mesNum = Number(m.split('-')[1]);
      return `<option value="${m}" ${AGENDA_LISTA_RANGO===m?'selected':''}>${MESES_LARGOS[mesNum-1]} ${anio}</option>`;
    }).join('');
    return `<optgroup label="${anio}">${opts}</optgroup>`;
  }).join('');
  return `<select id="agendaRangoSelect" style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12.5px;">
    <option value="reciente" ${AGENDA_LISTA_RANGO==='reciente'?'selected':''}>Recientes (últimos 30 días) y futuras</option>
    ${opcionesMeses}
    <option value="todo" ${AGENDA_LISTA_RANGO==='todo'?'selected':''}>Ver historial completo</option>
  </select>`;
}
// Ronda 13 (01/09) — antes se mostraban TODAS las citas de toda la vida
// del consultorio sin ningun filtro, a diferencia del Calendario
// (Dia/Semana/Mes) que siempre filtra DATA.citas por la fecha que le
// toca mostrar. Con meses/anos de uso eso se vuelve un scroll
// interminable (reportado por Sergio). Ahora, por default
// (AGENDA_LISTA_RANGO==='reciente') solo se muestran los ultimos 30 dias
// (ventana rodante, ver fechaHaceNDias) MAS todas las citas futuras sin
// limite (nunca se oculta nada agendado a futuro). El selector de arriba
// permite ver un mes especifico anterior, o el historial completo
// (AGENDA_LISTA_RANGO==='todo', identico al comportamiento de antes).
// El servidor NO cambia: Code.gs sigue mandando el historial completo de
// Citas en cada carga — este filtro es solo de presentacion en esta
// vista.
function renderCitasListHTML(){
  const hoy = todayStr();
  const cutoff = fechaHaceNDias(30);
  let citasFiltradas;
  if(AGENDA_LISTA_RANGO === 'todo') citasFiltradas = DATA.citas;
  else if(AGENDA_LISTA_RANGO === 'reciente') citasFiltradas = DATA.citas.filter(c=>c.Fecha >= cutoff);
  else citasFiltradas = DATA.citas.filter(c=>c.Fecha.slice(0,7) === AGENDA_LISTA_RANGO);
  const citasOrdenadas = [...citasFiltradas].sort((a,b)=>(a.Fecha+a.Hora).localeCompare(b.Fecha+b.Hora));
  return citasOrdenadas.map(c=>{
    // Duracion_Min congelada al agendar (Ciclo 2); si una cita vieja no
    // la tiene todavia (antes de que existiera esta columna), se calcula
    // en vivo como respaldo — nunca deberia pasar tras el relleno inicial.
    const dur = c.Duracion_Min || duracionCitaMin(c.Tratamientos||c.Tratamiento);
    const finCita = new Date(c.Fecha+'T'+c.Hora+':00').getTime() + dur*60000;
    const esHoy = c.Fecha===hoy;
    const yaConcluida = finCita <= Date.now();
    const esCancelada = c.Estado==='Cancelada';
    const esPasada = !esCancelada && ((c.Fecha < hoy) || (esHoy && yaConcluida));
    const etiqueta = esCancelada ? '<br><span class="subtle" style="color:var(--red);">· Cancelada</span><br>' : ((esHoy && yaConcluida) ? '<br><span class="subtle">· Concluida hoy</span><br>' : '');
    const color = esCancelada ? 'var(--red)' : (esPasada ? 'var(--text-mute)' : (esHoy ? 'var(--amber)' : 'var(--teal)'));
    // Ronda 7 (31/08) — boton "Reintentar Calendar", visible en CUALQUIER
    // estado (incluida Cancelada) mientras Calendar_Sync_Pendiente siga
    // en TRUE: cubre los 3 escenarios (creacion, reagendo o cancelacion
    // que no se reflejaron en Google Calendar) con un solo boton — el
    // backend decide cual de los 3 reintentar (ver reintentarCalendarCita
    // en Code.gs). No aplica en modo DEMO (sin backend no hay Calendar).
    const pendienteCalendar = !!c.Calendar_Sync_Pendiente && !!CONFIG.API_URL;
    const btnReintentoCalendar = pendienteCalendar ? `<div class="btn sm" data-reintentar-calendar="${c.ID}">↻ Reintentar Calendar</div>` : '';
    // Ronda 8 (31/08) — flex-wrap:wrap agregado: en movil vertical, con
    // los 3 botones (Reagendar/Cancelar + Reintentar Calendar) juntos no
    // cabian en una sola fila y el ultimo se salia de la tarjeta. Ahora
    // el que no quepa baja a una segunda linea en vez de desbordarse.
    const acciones = esCancelada
      ? (btnReintentoCalendar ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">${btnReintentoCalendar}</div>` : '')
      : esPasada
      ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;"><div class="btn sm" data-reagendar="${c.ID}">Reagendar</div>${btnReintentoCalendar}</div>`
      : `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;"><div class="btn sm" data-reagendar="${c.ID}">Reagendar</div><div class="btn sm danger" data-cancelar="${c.ID}">Cancelar</div>${btnReintentoCalendar}</div>`;
    return `<div class="appt" data-appt-id="${c.ID}" style="${esCancelada?'opacity:.6;':''}"><div class="appt-time">${formatearFechaCorta(c.Fecha)}<br>${formatearHora(c.Hora)}</div><div class="appt-info" style="border-left-color:${color}"><b>${c.Paciente}</b>${etiqueta}<span>${tratArr(c.Tratamientos||c.Tratamiento).join(' + ')} · ${dur} min</span><br><span class="subtle">Registrado por: ${c.Usuario||'—'}</span>${acciones}</div></div>`;
  }).join('') || `<div class="empty">${AGENDA_LISTA_RANGO==='reciente' ? 'Sin citas en los últimos 30 días ni futuras — usa el selector "Mostrando" de arriba para ver un mes anterior o el historial completo.' : 'Sin citas'}</div>`;
}
/* Vuelve a conectar los botones Reagendar/Cancelar de la lista de Citas —
   hay que llamarla de nuevo cada vez que se repinta esa lista sola. */
function attachCitasListHandlers(){
  // Ronda 13 (01/09) — selector "Mostrando" (filtro de rango de la
  // Lista). Vive fuera de #agendaCitasList, pero su listener se conecta
  // aqui porque esta funcion ya se re-ejecuta cada vez que la Lista
  // vuelve a estar activa (ver attachContenidoAgenda), que es exactamente
  // cuando este selector es visible.
  const selRango = document.getElementById('agendaRangoSelect');
  if(selRango){
    selRango.addEventListener('change', ()=>{
      AGENDA_LISTA_RANGO = selRango.value;
      repintarPanelAgenda();
    });
  }
  document.querySelectorAll('[data-reagendar]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const citaId = btn.dataset.reagendar;
      const cita = DATA.citas.find(c=>c.ID===citaId); if(!cita) return;
      const hoy = todayStr();
      openModal(`
        <h3>Reagendar cita</h3>
        <p class="subtle" style="margin-bottom:14px;">${cita.Paciente} · ${tratArr(cita.Tratamientos||cita.Tratamiento).join(' + ')}</p>
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="field"><label>Nueva fecha</label><input type="date" id="reagFecha" value="${cita.Fecha < hoy ? hoy : cita.Fecha}" min="${hoy}"></div>
          <div class="field"><label>Nueva hora</label><input type="time" id="reagHora" value="${cita.Hora}"></div>
        </div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Cancelar</div><div class="btn primary block" id="btnConfirmarReagendar">Reagendar</div></div>`);
      document.getElementById('btnConfirmarReagendar').addEventListener('click', async ()=>{
        await intentarReagendar(citaId, document.getElementById('reagFecha').value, document.getElementById('reagHora').value, false);
      });
    });
  });
  document.querySelectorAll('[data-cancelar]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const citaId = btn.dataset.cancelar;
      const cita = DATA.citas.find(c=>c.ID===citaId); if(!cita) return;
      // Ronda 2 (#17) — antes usaba confirm() nativo del navegador; se
      // reemplaza por el mismo sistema de ventana emergente que ya usa el
      // resto de la app, para estandarizar.
      openModal(`
        <h3>Cancelar cita</h3>
        <p class="subtle" style="margin-bottom:16px;">¿Cancelar la cita de ${cita.Paciente} el ${formatearFecha(cita.Fecha)} a las ${formatearHora(cita.Hora)}?</p>
        <div class="field" style="margin-bottom:16px;"><label>Motivo (opcional)</label><input id="motivoCancelacion" type="text" placeholder="Ej. el paciente avisó que no podía asistir"></div>
        <div class="modal-actions"><div class="btn block" onclick="closeModal()">Volver</div><div class="btn danger block" id="btnConfirmarCancelar">Sí, cancelar</div></div>`);
      document.getElementById('btnConfirmarCancelar').addEventListener('click', async ()=>{
        const motivo = document.getElementById('motivoCancelacion').value.trim();
        closeModal();
        if(CONFIG.API_URL){
          const res = await apiCall('cancelar_cita', { citaId, motivo }, ['citas']);
          if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo cancelar la cita');
        } else { cita.Estado = 'Cancelada'; }
        showToast('Cita cancelada'); render();
        ubicarCitaEnListaSiAplica(citaId); // #22
      });
    });
  });
  // Ronda 7 (31/08) — boton "Reintentar Calendar", un solo handler para
  // los 3 escenarios (creacion/reagendo/cancelacion sin sincronizar); el
  // backend (reintentarCalendarCita) decide cual aplica segun el Estado
  // actual de la cita.
  document.querySelectorAll('[data-reintentar-calendar]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const citaId = btn.dataset.reintentarCalendar;
      const res = await apiCall('reintentar_calendar_cita', { citaId }, ['citas']);
      if(res && res.ok) showToast('Sincronizado con Google Calendar');
      else if(res && res.error) showToast(res.error);
      // Ronda 8 (31/08) — antes faltaba esto: los datos ya se
      // actualizaban (syncData via apiCall), pero la tarjeta no se
      // volvia a dibujar hasta cambiar de pestaña y regresar, asi que el
      // boton parecia no desaparecer de inmediato tras un reintento
      // exitoso.
      render();
      ubicarCitaEnListaSiAplica(citaId); // #22
    });
  });
}
/* #51 — refresca solo el panel de Citas (datos + esa lista), sin tocar el
   formulario de "Nueva cita" que pueda estar a medio llenar al lado. */
async function actualizarAgenda(){
  showMask('Actualizando agenda...');
  if(CONFIG.API_URL) await syncData(['citas']);
  const list = document.getElementById('agendaCitasList');
  // Grupo 6 — unico cambio en esta funcion: la vista activa decide que se
  // pinta (Lista de siempre, o Calendario nuevo); el resto del flujo

  if(list){ list.innerHTML = AGENDA_VISTA==='calendario' ? renderCalendarioHTML() : renderCitasListHTML(); attachContenidoAgenda(); }

  showToast('Agenda actualizada');
}

        <div class="field" style="margin:0 0 20px;padding:2px 0;"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;"><input type="checkbox" id="mHistorialPrevio"> Ya era mi paciente antes de usar el sistema</label>
          <p class="subtle" style="margin:8px 0 0;">Márcalo aunque no sepas la fecha exacta de su última visita — evita que este paciente cuente como "nuevo" en las gráficas del dashboard.</p>
        </div>
        <div class="field" style="margin-bottom:12px;"><label>Tratamientos</label>

      document.getElementById('mTratBtn').addEventListener('click', ()=>{

      });
      // #74 — filtra en vivo cualquier caracter que no sea digito (letras,
      // espacios, simbolos) mientras el usuario escribe. maxlength por si
      // solo no bastaba: limitaba la CANTIDAD de caracteres, no el TIPO.
      document.getElementById('mTelefono').addEventListener('input', e=>{
        e.target.value = e.target.value.replace(/\D/g,'').slice(0, telefonoInfo().longitud);
      });
      document.getElementById('mGuardarPaciente').addEventListener('click', async ()=>{
        const nombre = document.getElementById('mNombre').value.trim();
        const tel = document.getElementById('mTelefono').value.trim();
        const ultimaVisitaAnterior = document.getElementById('mUltimaVisitaAnterior').value || '';
        const historialPrevio = document.getElementById('mHistorialPrevio').checked;
        // #71 — telefono ahora obligatorio: exactamente N digitos (N segun el
        // pais configurado), sin prefijo — evita capturas basura ahora que
        // todavia no hay forma de editar el registro despues de creado.
        // #73 — mismo patron que Tratamiento y Citas: junta TODOS los campos
        // faltantes en un solo mensaje, en vez de mostrarlos uno por uno en
        // envios separados.
        const infoTel = telefonoInfo();
        const faltanPac = []; if(!nombre) faltanPac.push('Nombre completo'); if(!tel) faltanPac.push('Teléfono');

          const res = await apiCall('add_paciente', { nombre, telefono:tel, tratamientos: selectedTrats.join(', '), ultimaVisitaAnterior, historialPrevio }, ['pacientes']);
          if(!res || res.error) return showToast(res && res.error ? res.error : 'No se pudo agregar el paciente');

          DATA.pacientes.push({ID:id, Nombre:nombre, Telefono:tel, Ultima_Visita: ultimaVisitaAnterior || '—', Tratamientos: selectedTrats.join(', '), Estado:'Activo', HistorialPrevio: historialPrevio?'Si':''});

        closeModal(); showToast('Paciente agregado'); render();
      });
